<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ERP • Punto de Venta (POS), Cobros y Caja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .card-clean { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); }
  </style>
  <script>
    window.onerror = function (msg, url, line) {
      var box = document.getElementById("error-fallback");
      if (box) {
        box.style.display = "block";
        box.innerText = "Error detectado (Línea " + line + "): " + msg;
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-amber-400 selection:text-slate-950">
  <div id="error-fallback" style="display:none; background:#fee2e2; color:#991b1b; padding:14px; font-size:12px; font-weight:700; border-bottom:2px solid #ef4444;"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      return `${c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".")}-${c.slice(-1)}`;
    };

    const DENOMINACIONES_CLP = [20000, 10000, 5000, 2000, 1000, 500, 100, 50, 10];
    const MEDIOS_PAGO = ["Efectivo", "Transferencia", "Tarjeta Débito/Crédito", "Crédito / Fiado"];

    function AppVentasPOS() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut")) || "775280425");
      const [empresa, setEmpresa] = useState(null);
      const [catalogo, setCatalogo] = useState([]);
      const [ventas, setVentas] = useState([]);
      const [arqueos, setArqueos] = useState([]);

      const [tab, setTab] = useState("pos"); // pos | historial | cobros | caja

      // Estado POS
      const [busquedaProd, setBusquedaProd] = useState("");
      const [carrito, setCarrito] = useState([]);
      const [clienteNombre, setClienteNombre] = useState("");
      const [clienteRut, setClienteRut] = useState("");
      const [vendedorSeleccionado, setVendedorSeleccionado] = useState("");
      const [medioPago, setMedioPago] = useState("Efectivo");
      const [tipoDocumento, setTipoDocumento] = useState("venta"); // venta | cotizacion
      const [procesandoVenta, setProcesandoVenta] = useState(false);

      // Estado Arqueo Caja
      const [conteoBilletes, setConteoBilletes] = useState({});
      const [montoInicialCaja, setMontoInicialCaja] = useState(50000);
      const [notaArqueo, setNotaArqueo] = useState("");

      useEffect(() => {
        let unsubs = [];
        const conectar = () => {
          const empRef = db.collection("saas_empresas").doc(rutActivo);

          const u1 = empRef.onSnapshot((doc) => {
            if (doc.exists) {
              const data = { id: doc.id, ...doc.data() };
              setEmpresa(data);
              if (!vendedorSeleccionado && Array.isArray(data.equipo) && data.equipo.length > 0) {
                setVendedorSeleccionado(data.equipo[0].nombre);
              }
            } else {
              setEmpresa({ id: rutActivo, rut: formatearRut(rutActivo), nombre: `Empresa ${formatearRut(rutActivo)}`, equipo: [] });
            }
          });

          const colCat = rutActivo === "769497226"
            ? db.collection("catalogo_productos")
            : empRef.collection("catalogo");

          const u2 = colCat.onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, precioVenta: 5990, stockOnline: 20, ...d.data() }));
            lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
            setCatalogo(lista);
          });

          const u3 = empRef.collection("ventas_pos").onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setVentas(lista);
          });

          const u4 = empRef.collection("arqueos_caja").onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setArqueos(lista);
          });

          unsubs = [u1, u2, u3, u4];
        };

        auth.signInAnonymously().then(conectar).catch(conectar);
        return () => unsubs.forEach((fn) => typeof fn === "function" && fn());
      }, [rutActivo]);

      const empRef = () => db.collection("saas_empresas").doc(rutActivo);
      const catRef = () =>
        rutActivo === "769497226"
          ? db.collection("catalogo_productos")
          : empRef().collection("catalogo");

      // Carrito POS
      const agregarAlCarrito = (prod) => {
        setCarrito((prev) => {
          const existe = prev.find((i) => i.id === prod.id);
          if (existe) {
            return prev.map((i) => (i.id === prod.id ? { ...i, cantidad: i.cantidad + 1 } : i));
          }
          return [
            ...prev,
            {
              id: prod.id,
              codigo: prod.codigo || "S/C",
              nombre: prod.nombre,
              cantidad: 1,
              precio: Number(prod.precioVenta || 5990),
              stockActual: Number(prod.stockOnline ?? 20)
            }
          ];
        });
      };

      const actualizarItemCarrito = (id, campo, valor) => {
        setCarrito((prev) =>
          prev
            .map((i) => (i.id === id ? { ...i, [campo]: Math.max(0, Number(valor)) } : i))
            .filter((i) => i.cantidad > 0)
        );
      };

      const totalCarrito = useMemo(
        () => carrito.reduce((acc, item) => acc + item.cantidad * item.precio, 0),
        [carrito]
      );

      const procesarOperacionPOS = async (e) => {
        e.preventDefault();
        if (carrito.length === 0) return alert("Agrega al menos un producto al carrito.");
        if (medioPago === "Crédito / Fiado" && !clienteNombre.trim()) {
          return alert("Para ventas a Crédito / Fiado debes ingresar el nombre del cliente.");
        }

        setProcesandoVenta(true);
        const esCotizacion = tipoDocumento === "cotizacion";
        const esFiado = !esCotizacion && medioPago === "Crédito / Fiado";

        const registro = {
          tipo: esCotizacion ? "cotizacion" : "venta",
          folio: `${esCotizacion ? "COT" : "VTA"}-${Math.floor(10000 + Math.random() * 90000)}`,
          cliente: clienteNombre.trim() || "Cliente Mesón",
          rutCliente: clienteRut.trim() ? formatearRut(clienteRut) : "",
          vendedor: vendedorSeleccionado || "Caja Principal",
          medioPago: esCotizacion ? "Pendiente (Cotización)" : medioPago,
          items: carrito,
          total: totalCarrito,
          saldoPendiente: esFiado ? totalCarrito : 0,
          abonos: [],
          fecha: new Date().toLocaleString("es-CL"),
          fechaSoloDia: new Date().toISOString().split("T")[0],
          timestamp: Date.now()
        };

        try {
          const batch = db.batch();
          batch.set(empRef().collection("ventas_pos").doc(), registro);

          if (!esCotizacion) {
            carrito.forEach((it) => {
              const nuevoStock = Math.max(0, it.stockActual - it.cantidad);
              batch.update(catRef().doc(it.id), { stockOnline: nuevoStock });
            });
          }

          await batch.commit();
          setCarrito([]);
          setClienteNombre("");
          setClienteRut("");
          alert(
            esCotizacion
              ? `📄 Cotización ${registro.folio} guardada sin descontar stock.`
              : `✅ Venta ${registro.folio} registrada${esFiado ? " en Cuentas por Cobrar" : " y stock descontado"}.`
          );
        } catch (err) {
          alert("Error al procesar: " + err.message);
        }
        setProcesandoVenta(false);
      };

      const convertirCotizacionAVenta = async (cot) => {
        const pago = prompt("¿Medio de pago para cerrar esta venta?\n1. Efectivo\n2. Transferencia\n3. Tarjeta Débito/Crédito\n4. Crédito / Fiado", "Efectivo");
        if (!pago) return;
        const esFiado = pago.toLowerCase().includes("fiado") || pago.toLowerCase().includes("crédito");

        try {
          const batch = db.batch();
          batch.update(empRef().collection("ventas_pos").doc(cot.id), {
            tipo: "venta",
            medioPago: pago.trim(),
            saldoPendiente: esFiado ? cot.total : 0,
            fecha: new Date().toLocaleString("es-CL")
          });

          (cot.items || []).forEach((it) => {
            const prodCat = catalogo.find((p) => p.id === it.id);
            if (prodCat) {
              const nuevoStock = Math.max(0, Number(prodCat.stockOnline ?? 20) - Number(it.cantidad));
              batch.update(catRef().doc(it.id), { stockOnline: nuevoStock });
            }
          });

          await batch.commit();
          alert("✅ Cotización convertida en Venta y stock descontado.");
        } catch (err) {
          alert(err.message);
        }
      };

      // Módulo 16: Abonos a Cuentas por Cobrar
      const registrarAbonoCliente = async (venta) => {
        const montoStr = prompt(`Saldo pendiente de ${venta.cliente}: $${Number(venta.saldoPendiente).toLocaleString("es-CL")}\nIngresa monto del abono (CLP):`, venta.saldoPendiente);
        const monto = Number(montoStr);
        if (!monto || monto <= 0) return;

        const nuevoSaldo = Math.max(0, Number(venta.saldoPendiente) - monto);
        const nuevoAbono = {
          monto,
          fecha: new Date().toLocaleString("es-CL"),
          recibidoPor: vendedorSeleccionado || "Caja"
        };

        try {
          await empRef().collection("ventas_pos").doc(venta.id).update({
            saldoPendiente: nuevoSaldo,
            abonos: [...(venta.abonos || []), nuevoAbono]
          });
          alert(nuevoSaldo === 0 ? "🎉 ¡Deuda saldada al 100%!" : `✅ Abono registrado. Nuevo saldo: $${nuevoSaldo.toLocaleString("es-CL")}`);
        } catch (err) {
          alert(err.message);
        }
      };

      // Módulo 16: Arqueo de Caja
      const totalContadoFisico = useMemo(() => {
        return DENOMINACIONES_CLP.reduce((sum, den) => sum + den * (Number(conteoBilletes[den]) || 0), 0);
      }, [conteoBilletes]);

      const hoyStr = new Date().toISOString().split("T")[0];
      const ventasEfectivoHoy = useMemo(() => {
        return ventas
          .filter((v) => v.tipo === "venta" && v.medioPago === "Efectivo" && v.fechaSoloDia === hoyStr)
          .reduce((s, v) => s + Number(v.total || 0), 0);
      }, [ventas, hoyStr]);

      const esperadoEnCaja = Number(montoInicialCaja || 0) + ventasEfectivoHoy;
      const diferenciaCaja = totalContadoFisico - esperadoEnCaja;

      const guardarCierreCaja = async (e) => {
        e.preventDefault();
        try {
          await empRef().collection("arqueos_caja").add({
            fecha: new Date().toLocaleString("es-CL"),
            responsable: vendedorSeleccionado || "Cajero",
            montoInicial: Number(montoInicialCaja),
            ventasEfectivoDia: ventasEfectivoHoy,
            esperado: esperadoEnCaja,
            contadoFisico: totalContadoFisico,
            diferencia: diferenciaCaja,
            nota: notaArqueo.trim(),
            timestamp: Date.now()
          });
          setConteoBilletes({});
          setNotaArqueo("");
          alert("✅ Arqueo de caja cerrado y archivado.");
        } catch (err) {
          alert(err.message);
        }
      };

      const catalogoFiltrado = useMemo(() => {
        const q = busquedaProd.trim().toLowerCase();
        if (!q) return catalogo.slice(0, 40);
        return catalogo
          .filter((p) => (p.nombre || "").toLowerCase().includes(q) || (p.codigo || "").toLowerCase().includes(q))
          .slice(0, 40);
      }, [catalogo, busquedaProd]);

      const cuentasPorCobrar = useMemo(
        () => ventas.filter((v) => v.tipo === "venta" && Number(v.saldoPendiente) > 0),
        [ventas]
      );

      const totalPorCobrar = useMemo(
        () => cuentasPorCobrar.reduce((s, v) => s + Number(v.saldoPendiente || 0), 0),
        [cuentasPorCobrar]
      );

      const equipoLista = Array.isArray(empresa?.equipo) ? empresa.equipo : [];

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-5 pb-24 space-y-6">
          {/* CABECERA */}
          <div className="card-clean rounded-3xl p-5 sm:p-7 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <div className="flex flex-wrap items-center gap-2 mb-2">
                <a href="index.html" className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl">
                  ← Volver al Núcleo
                </a>
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-extrabold px-3 py-1 rounded-full">
                  ● {empresa?.nombre || "Cargando..."} ({empresa?.rut || formatearRut(rutActivo)})
                </span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-black text-slate-900">
                💳 PUNTO DE VENTA (POS), <span className="text-emerald-600">COBROS Y CAJA</span>
              </h1>
              <p className="text-xs text-slate-500 mt-0.5">
                Ventas rápidas de mesón, cotizaciones, control de cuentas por cobrar y arqueo de efectivo por denominación.
              </p>
            </div>

            <div className="grid grid-cols-2 gap-2.5 shrink-0">
              <div className="bg-emerald-50 border border-emerald-200 rounded-2xl px-4 py-2.5 text-center">
                <span className="text-[10px] font-bold text-emerald-800 uppercase block">Efectivo Hoy</span>
                <span className="text-base sm:text-lg font-black text-emerald-700">${ventasEfectivoHoy.toLocaleString("es-CL")}</span>
              </div>
              <div className="bg-amber-50 border border-amber-200 rounded-2xl px-4 py-2.5 text-center">
                <span className="text-[10px] font-bold text-amber-800 uppercase block">Por Cobrar</span>
                <span className="text-base sm:text-lg font-black text-amber-700">${totalPorCobrar.toLocaleString("es-CL")}</span>
              </div>
            </div>
          </div>

          {/* PESTAÑAS */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
            <button onClick={() => setTab("pos")} className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tab === "pos" ? "bg-emerald-600 text-white" : "text-slate-600 hover:bg-slate-100"}`}>
              💳 Caja POS & Cotizar
            </button>
            <button onClick={() => setTab("cobros")} className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tab === "cobros" ? "bg-emerald-600 text-white" : "text-slate-600 hover:bg-slate-100"}`}>
              🧾 Por Cobrar ({cuentasPorCobrar.length})
            </button>
            <button onClick={() => setTab("caja")} className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tab === "caja" ? "bg-emerald-600 text-white" : "text-slate-600 hover:bg-slate-100"}`}>
              💵 Arqueo de Caja
            </button>
            <button onClick={() => setTab("historial")} className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tab === "historial" ? "bg-emerald-600 text-white" : "text-slate-600 hover:bg-slate-100"}`}>
              📋 Ventas & Cotiz. ({ventas.length})
            </button>
          </div>

          {/* MÓDULO 15: POS RÁPIDO Y COTIZACIONES */}
          {tab === "pos" && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
              {/* Buscador de Productos */}
              <div className="lg:col-span-2 card-clean rounded-3xl p-5 space-y-4">
                <input
                  type="text"
                  value={busquedaProd}
                  onChange={(e) => setBusquedaProd(e.target.value)}
                  placeholder="🔍 Buscar producto por código o nombre para agregar al carrito..."
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-emerald-500"
                />

                {catalogoFiltrado.length === 0 ? (
                  <p className="text-xs text-slate-500 text-center py-10">
                    No hay productos cargados. Súbelos en <strong>index.html $\rightarrow$ Catálogo Inteligente</strong>.
                  </p>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-[500px] overflow-y-auto pr-1">
                    {catalogoFiltrado.map((p) => (
                      <button
                        type="button"
                        key={p.id}
                        onClick={() => agregarAlCarrito(p)}
                        className="bg-slate-50 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-400 rounded-2xl p-3.5 text-left transition cursor-pointer flex items-center justify-between gap-2"
                      >
                        <div className="min-w-0">
                          <span className="text-xs font-black text-slate-900 block truncate">
                            {p.codigo ? `[${p.codigo}] ` : ""}{p.nombre}
                          </span>
                          <span className="text-[11px] font-bold text-slate-500">
                            Stock: {p.stockOnline ?? 20} • ${Number(p.precioVenta || 5990).toLocaleString("es-CL")}
                          </span>
                        </div>
                        <span className="bg-emerald-600 text-white font-black text-xs px-2.5 py-1.5 rounded-xl shrink-0">+</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>

              {/* Ticket / Carrito */}
              <form onSubmit={procesarOperacionPOS} className="card-clean rounded-3xl p-5 space-y-4 border-2 border-emerald-200 flex flex-col justify-between">
                <div className="space-y-3">
                  <div className="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-xl">
                    <button
                      type="button"
                      onClick={() => setTipoDocumento("venta")}
                      className={`py-2 rounded-lg text-xs font-black cursor-pointer ${tipoDocumento === "venta" ? "bg-emerald-600 text-white" : "text-slate-600"}`}
                    >
                      💰 Venta Directa
                    </button>
                    <button
                      type="button"
                      onClick={() => setTipoDocumento("cotizacion")}
                      className={`py-2 rounded-lg text-xs font-black cursor-pointer ${tipoDocumento === "cotizacion" ? "bg-amber-500 text-slate-950" : "text-slate-600"}`}
                    >
                      📄 Cotización
                    </button>
                  </div>

                  <div className="space-y-2">
                    <input
                      type="text"
                      value={clienteNombre}
                      onChange={(e) => setClienteNombre(e.target.value)}
                      placeholder="Nombre Cliente (Obligatorio si es fiado)"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none"
                    />
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="text"
                        value={clienteRut}
                        onChange={(e) => setClienteRut(e.target.value)}
                        placeholder="RUT Cliente (Opcional)"
                        className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none"
                      />
                      <select
                        value={vendedorSeleccionado}
                        onChange={(e) => setVendedorSeleccionado(e.target.value)}
                        className="bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2 text-xs font-bold outline-none"
                      >
                        <option value="">Vendedor / Caja</option>
                        {equipoLista.map((m) => (
                          <option key={m.id} value={m.nombre}>{m.nombre}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* Ítems del carrito */}
                  <div className="max-h-56 overflow-y-auto divide-y divide-slate-200 border border-slate-200 rounded-2xl bg-slate-50 p-2 space-y-2">
                    {carrito.length === 0 ? (
                      <p className="text-xs text-slate-400 text-center py-6">Carrito vacío</p>
                    ) : (
                      carrito.map((item) => (
                        <div key={item.id} className="pt-2 first:pt-0 text-xs space-y-1">
                          <p className="font-black text-slate-900 truncate">{item.nombre}</p>
                          <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center gap-1">
                              <span className="text-[10px] text-slate-500">Cant:</span>
                              <input
                                type="number"
                                min="0"
                                value={item.cantidad}
                                onChange={(e) => actualizarItemCarrito(item.id, "cantidad", e.target.value)}
                                className="w-12 bg-white border border-slate-300 rounded px-1.5 py-1 text-center font-black"
                              />
                            </div>
                            <div className="flex items-center gap-1">
                              <span className="text-[10px] text-slate-500">$</span>
                              <input
                                type="number"
                                min="0"
                                value={item.precio}
                                onChange={(e) => actualizarItemCarrito(item.id, "precio", e.target.value)}
                                className="w-20 bg-white border border-slate-300 rounded px-1.5 py-1 text-right font-black"
                              />
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {tipoDocumento === "venta" && (
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Medio de Pago</label>
                      <select
                        value={medioPago}
                        onChange={(e) => setMedioPago(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-black outline-none"
                      >
                        {MEDIOS_PAGO.map((mp) => (
                          <option key={mp} value={mp}>{mp}</option>
                        ))}
                      </select>
                    </div>
                  )}
                </div>

                <div className="pt-3 border-t border-slate-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-extrabold uppercase text-slate-500">Total CLP</span>
                    <span className="text-2xl font-black text-slate-900">${totalCarrito.toLocaleString("es-CL")}</span>
                  </div>
                  <button
                    type="submit"
                    disabled={procesandoVenta || carrito.length === 0}
                    className={`w-full font-black py-3.5 rounded-2xl text-sm shadow-md transition cursor-pointer disabled:opacity-40 ${
                      tipoDocumento === "cotizacion" ? "bg-amber-500 text-slate-950" : "bg-emerald-600 text-white hover:bg-emerald-700"
                    }`}
                  >
                    {tipoDocumento === "cotizacion" ? "📄 Guardar Cotización" : "✅ Confirmar Venta"}
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MÓDULO 16A: CUENTAS POR COBRAR Y ABONOS */}
          {tab === "cobros" && (
            <div className="card-clean rounded-3xl p-6 space-y-4">
              <div>
                <h2 className="text-lg font-black text-slate-900">🧾 Cuentas por Cobrar y Abonos Parciales</h2>
                <p className="text-xs text-slate-500">Ventas entregadas a crédito. Registra abonos hasta saldar la deuda.</p>
              </div>

              {cuentasPorCobrar.length === 0 ? (
                <p className="text-xs text-slate-500 bg-slate-50 p-8 rounded-2xl text-center">No hay saldos pendientes por cobrar.</p>
              ) : (
                <div className="space-y-3">
                  {cuentasPorCobrar.map((v) => (
                    <div key={v.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-xs">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="font-black text-slate-900 text-sm">{v.cliente}</span>
                          <span className="bg-amber-100 text-amber-900 px-2 py-0.5 rounded font-bold">{v.folio}</span>
                        </div>
                        <p className="text-slate-600">
                          Total Venta: <strong>${Number(v.total).toLocaleString("es-CL")}</strong> • Saldo Pendiente:{" "}
                          <strong className="text-rose-600 text-sm">${Number(v.saldoPendiente).toLocaleString("es-CL")}</strong>
                        </p>
                        {Array.isArray(v.abonos) && v.abonos.length > 0 && (
                          <p className="text-[11px] text-emerald-700 font-semibold">
                            Último abono: ${Number(v.abonos[v.abonos.length - 1].monto).toLocaleString("es-CL")} ({v.abonos[v.abonos.length - 1].fecha})
                          </p>
                        )}
                      </div>
                      <button
                        onClick={() => registrarAbonoCliente(v)}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-4 py-2.5 rounded-xl cursor-pointer shrink-0"
                      >
                        💵 Registrar Abono
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* MÓDULO 16B: ARQUEO DE CAJA POR DENOMINACIÓN */}
          {tab === "caja" && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <form onSubmit={guardarCierreCaja} className="card-clean rounded-3xl p-6 space-y-4">
                <h2 className="text-lg font-black text-slate-900">💵 Arqueo Físico de Billetes y Monedas</h2>
                <div className="grid grid-cols-3 gap-2.5">
                  {DENOMINACIONES_CLP.map((den) => (
                    <div key={den} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5">
                      <span className="text-xs font-black text-slate-700 block mb-1">${den.toLocaleString("es-CL")}</span>
                      <input
                        type="number"
                        min="0"
                        placeholder="0"
                        value={conteoBilletes[den] || ""}
                        onChange={(e) => setConteoBilletes({ ...conteoBilletes, [den]: e.target.value })}
                        className="w-full bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-sm font-black text-center outline-none"
                      />
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <div>
                    <label className="text-xs font-bold text-slate-600 block mb-1">Fondo Inicial Caja ($)</label>
                    <input
                      type="number"
                      value={montoInicialCaja}
                      onChange={(e) => setMontoInicialCaja(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-black"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600 block mb-1">Observación</label>
                    <input
                      type="text"
                      value={notaArqueo}
                      onChange={(e) => setNotaArqueo(e.target.value)}
                      placeholder="Ej: Turno tarde sin novedad"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold"
                    />
                  </div>
                </div>

                <div className="bg-slate-900 text-white rounded-2xl p-4 space-y-1 text-xs">
                  <div className="flex justify-between">
                    <span>Esperado (Fondo + Ventas Efectivo):</span>
                    <strong>${esperadoEnCaja.toLocaleString("es-CL")}</strong>
                  </div>
                  <div className="flex justify-between">
                    <span>Contado Físico en Gaveta:</span>
                    <strong className="text-amber-400">${totalContadoFisico.toLocaleString("es-CL")}</strong>
                  </div>
                  <div className="flex justify-between pt-1 border-t border-slate-700 text-sm font-black">
                    <span>Diferencia:</span>
                    <span className={diferenciaCaja === 0 ? "text-emerald-400" : "text-rose-400"}>
                      {diferenciaCaja >= 0 ? `+$${diferenciaCaja.toLocaleString("es-CL")}` : `-$${Math.abs(diferenciaCaja).toLocaleString("es-CL")}`}
                    </span>
                  </div>
                </div>

                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl text-sm cursor-pointer">
                  🔒 Cerrar y Guardar Arqueo de Caja
                </button>
              </form>

              <div className="card-clean rounded-3xl p-6 space-y-3">
                <h3 className="text-base font-black text-slate-900">📜 Historial de Arqueos</h3>
                {arqueos.length === 0 ? (
                  <p className="text-xs text-slate-500 text-center py-8">Sin cierres de caja registrados.</p>
                ) : (
                  arqueos.map((a) => (
                    <div key={a.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 text-xs space-y-1">
                      <div className="flex justify-between font-black">
                        <span>{a.fecha}</span>
                        <span className={a.diferencia === 0 ? "text-emerald-700" : "text-rose-600"}>
                          Dif: ${Number(a.diferencia).toLocaleString("es-CL")}
                        </span>
                      </div>
                      <p className="text-slate-600">
                        Responsable: <strong>{a.responsable}</strong> • Contado: <strong>${Number(a.contadoFisico).toLocaleString("es-CL")}</strong>
                      </p>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* HISTORIAL DE VENTAS Y COTIZACIONES */}
          {tab === "historial" && (
            <div className="card-clean rounded-3xl p-6 space-y-3">
              <h2 className="text-lg font-black text-slate-900">📋 Registro de Ventas y Cotizaciones</h2>
              {ventas.length === 0 ? (
                <p className="text-xs text-slate-500 text-center py-8">Sin operaciones aún.</p>
              ) : (
                ventas.map((v) => (
                  <div key={v.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-xs">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className={`px-2.5 py-0.5 rounded font-black ${v.tipo === "cotizacion" ? "bg-amber-100 text-amber-900" : "bg-emerald-100 text-emerald-900"}`}>
                          {v.folio}
                        </span>
                        <span className="font-black text-slate-900">{v.cliente}</span>
                        <span className="text-slate-500">({v.medioPago})</span>
                      </div>
                      <p className="text-slate-600 mt-1">
                        Vendedor: <strong>{v.vendedor}</strong> • {v.fecha} • Total: <strong>${Number(v.total).toLocaleString("es-CL")}</strong>
                      </p>
                    </div>

                    {v.tipo === "cotizacion" && (
                      <button
                        onClick={() => convertirCotizacionAVenta(v)}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-3.5 py-2 rounded-xl cursor-pointer shrink-0"
                      >
                        ⚡ Convertir en Venta
                      </button>
                    )}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AppVentasPOS />);
  </script>
</body>
</html>
