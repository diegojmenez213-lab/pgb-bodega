<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>NEXUS ERP • Punto de Venta (POS) y Caja</title>
  <script>
    (function () {
      var limpiar = function (r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); };
      var rutInicial = limpiar(localStorage.getItem("nexus_empresa_rut"));
      if (!rutInicial) window.location.replace("index.html");
      window.addEventListener("pageshow", function (ev) {
        var rutActual = limpiar(localStorage.getItem("nexus_empresa_rut"));
        if (!rutActual) window.location.replace("index.html");
        else if (ev.persisted && rutActual !== rutInicial) window.location.reload();
      });
      window.addEventListener("storage", function (ev) {
        if (ev.key === "nexus_empresa_rut") {
          var rutNuevo = limpiar(ev.newValue);
          if (!rutNuevo) window.location.replace("index.html");
          else if (rutNuevo !== rutInicial) window.location.reload();
        }
      });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const TEMAS = {
      claro_retail: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-blue-700 hover:bg-blue-800 text-white", sec: "bg-slate-100 text-slate-800", tag: "bg-blue-50 text-blue-800", top: "border-blue-700" },
      claro_ejecutivo: { page: "bg-slate-100 text-slate-900", card: "bg-white border border-slate-300 shadow-sm", main: "text-slate-900", sub: "text-slate-600", input: "bg-white border border-slate-300 text-slate-900", btn: "bg-slate-900 hover:bg-slate-800 text-white", sec: "bg-slate-200 text-slate-800", tag: "bg-slate-200 text-slate-800", top: "border-slate-900" },
      oscuro_obsidian: { page: "bg-slate-950 text-slate-100", card: "bg-slate-900 border border-slate-800 shadow-lg", main: "text-white", sub: "text-slate-400", input: "bg-slate-950 border border-slate-700 text-white", btn: "bg-indigo-600 hover:bg-indigo-500 text-white", sec: "bg-slate-800 text-slate-200", tag: "bg-indigo-950 text-indigo-300", top: "border-indigo-500" },
      claro_esmeralda: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-emerald-700 hover:bg-emerald-800 text-white", sec: "bg-slate-100 text-slate-800", tag: "bg-emerald-50 text-emerald-800", top: "border-emerald-700" }
    };

    function VentasPosApp() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut") || ""));
      const [empresa, setEmpresa] = useState(null);
      const [catalogo, setCatalogo] = useState([]);
      const [ventasPos, setVentasPos] = useState([]);

      const [cliente, setCliente] = useState("Cliente Mesón");
      const [prodId, setProdId] = useState("");
      const [cantidad, setCantidad] = useState(1);
      const [monto, setMonto] = useState(10000);
      const [medioPago, setMedioPago] = useState("Transferencia / Tarjeta");
      const [estadoCobro, setEstadoCobro] = useState("Pagado");

      useEffect(() => {
        if (!rutActivo) {
          window.location.replace("index.html");
          return;
        }
        auth.signInAnonymously().catch(() => {});
        const empRef = db.collection("saas_empresas").doc(rutActivo);

        const u1 = empRef.onSnapshot((doc) => {
          if (!doc.exists) {
            window.location.replace("index.html");
            return;
          }
          const data = { id: doc.id, ...doc.data() };
          const m = data.modulosActivos || {};
          if (!m.m15_pos_ventas && !m.m16_caja_cobros) {
            window.location.replace("empresa-panel.html");
            return;
          }
          setEmpresa(data);
        });

        const u2 = empRef.collection("catalogo").onSnapshot((snap) => {
          setCatalogo(snap.docs.map((d) => ({ id: d.id, stockOnline: 0, ...d.data() })));
        });

        const u3 = empRef.collection("ventas_pos").onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setVentasPos(lista);
        });

        return () => { u1(); u2(); u3(); };
      }, [rutActivo]);

      const registrarVentaPos = async (e) => {
        e.preventDefault();
        const prod = catalogo.find((p) => p.id === prodId) || { id: "", nombre: prodId || "Venta Sala", stockOnline: 0 };
        const batch = db.batch();
        const empRef = db.collection("saas_empresas").doc(rutActivo);

        batch.set(empRef.collection("ventas_pos").doc(), {
          cliente: cliente.trim() || "Cliente Mesón",
          producto: prod.nombre,
          cantidad: Number(cantidad),
          monto: Number(monto),
          medioPago,
          estadoCobro,
          fecha: new Date().toLocaleString("es-CL"),
          timestamp: Date.now()
        });

        if (prod.id) {
          batch.update(empRef.collection("catalogo").doc(prod.id), {
            stockOnline: Math.max(0, (Number(prod.stockOnline) || 0) - Number(cantidad))
          });
        }

        await batch.commit();
        setCantidad(1);
      };

      if (!empresa) return <div className="min-h-screen flex items-center justify-center text-xs font-bold">Verificando permisos POS...</div>;
      const T = TEMAS[empresa.temaVisual || "claro_retail"] || TEMAS.claro_retail;

      return (
        <div className={`min-h-screen pb-20 ${T.page}`}>
          <div className="max-w-4xl mx-auto px-4 pt-5 space-y-4">
            <div className={`${T.card} rounded-2xl p-5 border-t-4 ${T.top}`}>
              <div className="flex items-center gap-2 mb-1">
                <button onClick={() => window.location.replace("empresa-panel.html")} className={`text-xs font-bold px-3 py-1 rounded-lg cursor-pointer ${T.btn}`}>
                  Volver
                </button>
                <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${T.tag}`}>{empresa.nombre} • {empresa.rut}</span>
              </div>
              <h1 className={`text-xl font-extrabold ${T.main}`}>Punto de Venta (POS) y Caja</h1>
            </div>

            <form onSubmit={registrarVentaPos} className={`${T.card} rounded-2xl p-5 space-y-3`}>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="text" value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="Cliente *" className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`} required />
                {catalogo.length > 0 ? (
                  <select value={prodId} onChange={(e) => setProdId(e.target.value)} className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`} required>
                    <option value="">-- Producto del catálogo --</option>
                    {catalogo.map((p) => <option key={p.id} value={p.id}>{p.nombre} (Stock: {Number(p.stockOnline ?? 0)})</option>)}
                  </select>
                ) : (
                  <input type="text" value={prodId} onChange={(e) => setProdId(e.target.value)} placeholder="Producto *" className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`} required />
                )}
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <input type="number" min="1" value={cantidad} onChange={(e) => setCantidad(e.target.value)} className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`} required />
                <input type="number" min="1" value={monto} onChange={(e) => setMonto(e.target.value)} className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`} required />
                <select value={medioPago} onChange={(e) => setMedioPago(e.target.value)} className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`}>
                  <option>Transferencia / Tarjeta</option>
                  <option>Efectivo</option>
                </select>
                <select value={estadoCobro} onChange={(e) => setEstadoCobro(e.target.value)} className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`}>
                  <option>Pagado</option>
                  <option>Por Cobrar</option>
                </select>
              </div>
              <button type="submit" className={`w-full font-extrabold py-3.5 rounded-xl text-xs cursor-pointer ${T.btn}`}>
                Registrar Venta en Caja
              </button>
            </form>

            <div className={`${T.card} rounded-2xl p-5 space-y-2.5`}>
              <h2 className={`text-sm font-extrabold ${T.main}`}>Ventas en Sala ({ventasPos.length})</h2>
              {ventasPos.map((v) => (
                <div key={v.id} className="py-2.5 border-b border-slate-200/30 flex items-center justify-between text-xs">
                  <div>
                    <span className={`font-extrabold ${T.main}`}>{v.cliente} • {v.cantidad}x {v.producto}</span>
                    <span className={`block text-[11px] ${T.sub}`}>{v.medioPago} • {v.fecha}</span>
                  </div>
                  <span className={`font-extrabold ${T.main}`}>${Number(v.monto || 0).toLocaleString("es-CL")} ({v.estadoCobro})</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<VentasPosApp />);
  </script>
</body>
</html>
