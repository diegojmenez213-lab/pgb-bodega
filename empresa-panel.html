    (function () {
      var RUT_PGB = "769497226";
      var limpiar = function (r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); };
      var rutInicial = limpiar(localStorage.getItem("nexus_empresa_rut"));
      if (!rutInicial) {
        window.location.replace("index.html");
      } else if (rutInicial === RUT_PGB) {
        window.location.replace("pgb-operacion.html");
      }

      window.addEventListener("pageshow", function (ev) {
        var rutActual = limpiar(localStorage.getItem("nexus_empresa_rut"));
        if (!rutActual) {
          window.location.replace("index.html");
        } else if (rutActual === RUT_PGB) {
          window.location.replace("pgb-operacion.html");
        } else if (ev.persisted && rutActual !== rutInicial) {
          window.location.reload();
        }
      });

      window.addEventListener("storage", function (ev) {
        if (ev.key === "nexus_empresa_rut") {
          var rutNuevo = limpiar(ev.newValue);
          if (!rutNuevo) window.location.replace("index.html");
          else if (rutNuevo !== rutInicial) window.location.reload();
        }
      });
    })();
  </script>

    // CIFRADO SHA-256 PARA CLAVE DE SUPERVISOR
    const sha256Hex = async (texto) => {
      const str = String(texto || "").trim();
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(str);
        const hashBuf = await window.crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuf)).map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      return str;
    };

    const verificarClaveSupervisor = async (pinIngresado, empObj) => {
      const limpio = String(pinIngresado || "").trim();
      if (!limpio) return false;
      if (empObj?.pinSupervisorHash) {
        const h = await sha256Hex(limpio);
        return h === empObj.pinSupervisorHash;
      }
      const fallback = String(empObj?.pinSupervisor || "1234").trim();
      return limpio === fallback;

    // VALIDADOR OFICIAL DE RUT CHILENO (MÓDULO 11)
    const validarRutChileno = (rut) => {
      const limpio = limpiarRut(rut);
      if (limpio.length < 7 || limpio.length > 9) return false;
      const cuerpo = limpio.slice(0, -1);
      const dv = limpio.slice(-1);
      if (!/^\d+$/.test(cuerpo)) return false;
      let suma = 0;
      let multiplo = 2;
      for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo.charAt(i), 10) * multiplo;
        multiplo = multiplo < 7 ? multiplo + 1 : 2;
      }
      const dvEsperado = 11 - (suma % 11);
      const dvCalc = dvEsperado === 11 ? "0" : dvEsperado === 10 ? "K" : String(dvEsperado);
      return dv === dvCalc;
    };

        salida: esManana ? `Mañana ${elegido}` : elegido,

              comprador: compradorNuevo.trim() || "Cliente Marketplace",
              rutComprador: pidioFactura ? (rutValido ? formatearRut(rutIngresado) : rutIngresado) : "",
              estadoRut: esRutInvalido ? "invalido_esperando" : "ok",
              mensajeRutEnviado: esRutInvalido
                ? `Hola ${compradorNuevo.trim() || "cliente"}, el RUT ingresado (${rutIngresado}) no es válido en el SII. Por favor envíanos tu RUT correcto antes de las ${corteActual.limite} hrs (1h antes del despacho de las ${corteActual.salida} hrs) para emitir tu Factura; de lo contrario emitiremos Boleta para no retrasar tu envío.`
                : "",
              limiteDespachoHora: esRutInvalido ? corteActual.limite : "",
              limiteDespachoTs: esRutInvalido ? corteActual.limiteTs : 0,
              salidaDespachoHora: esRutInvalido ? corteActual.salida : "",
              direccionCliente: "Santiago",
              productoId: prodLocal.id,
              codigoSku: prodData?.codigo || prodLocal.codigo || "S/C",
              productoNombre: prodData?.nombre || prodLocal.nombre,
              costoUnitarioNeto: costoSnapshotNeto,
              cantidad: cantFinal,
              totalClp: totalFinal,
              vendedor: vendedorSeleccionado || "Canal Automático",
              tipoDte,
              folioSii: folioAsignado,
              timbradoSii: !esRutInvalido,
              enviadoMarketplace: !esRutInvalido && !esLider && canalNuevo !== "Venta Directa",
              esSimulacion: !esRealSii,
              colaImpresion: esLider ? "lider" : "general",
              etiquetaImpresa: false,
              fechaImpresion: "",
              fechaImpresionTs: 0,
              diaCerrado: false,
              anuladaPorNc61: false,
              devolucionInfo: null,
              fechaIso: fechaIsoChile(ahora),
              horaCorta: horaCortaChile(ahora),
              fecha: fechaLegibleChile(ahora),
              timestamp: ahora
            };

            tx.set(nuevaOrdenRef, nuevaOrden);

            if (prodDocRef && prodSnap && prodSnap.exists) {
              tx.update(prodDocRef, {
                stockOnline: FieldValue.increment(-cantFinal)
              });
            }

            if (!esRutInvalido) {
              tx.set(
                empDocRef,
                {
                  cafConfig: {
                    ...cafActual,
                    factura33Actual: esFactura33 ? Number(cafActual.factura33Actual) + 1 : Number(cafActual.factura33Actual),
                    boleta39Actual: !esFactura33 ? Number(cafActual.boleta39Actual) + 1 : Number(cafActual.boleta39Actual)
                  }
                },
                { merge: true }
              );
            }
          });

          cerrarYLimpiarModalVenta();

          if (esRutInvalido) {
            alert(
              `RUT INVÁLIDO DETECTADO (${rutIngresado}).\n\n` +
              `La orden quedó retenida esperando respuesta del cliente hasta las ${corteActual.limite} hrs (1h antes del despacho de las ${corteActual.salida} hrs).`
            );
          }
        });
      };

      // ================= FLUJO 1: VENCE PLAZO (1H ANTES DESPACHO) -> BOLETA 39 ATÓMICA =================
      const emitirBoletaPorPlazoVencido = async (orden) => {
        await ejecutarConBloqueo(async () => {
          const empDocRef = empRef();
          const ordDocRef = empDocRef.collection("ecommerce_ordenes").doc(orden.id);

          const folioEmitido = await db.runTransaction(async (tx) => {
            const empSnap = await tx.get(empDocRef);
            const ordSnap = await tx.get(ordDocRef);
            if (!ordSnap.exists) throw new Error("La orden ya no existe.");
            const ordData = ordSnap.data();
            if (ordData.timbradoSii || ordData.estadoRut !== "invalido_esperando") {
              throw new Error("Esta orden ya fue emitida o procesada desde otro dispositivo.");
            }

            const cafActual = { ...CAF_DEFAULT, ...(empSnap.data()?.cafConfig || {}) };
            const folioBoleta = Number(cafActual.boleta39Actual);

            tx.update(ordDocRef, {
              estadoRut: "boleta_por_plazo",
              tipoDte: 39,
              folioSii: folioBoleta,
              timbradoSii: true,
              enviadoMarketplace: ordData.canal !== "Lider" && ordData.canal !== "Venta Directa"
            });
            tx.set(empDocRef, { cafConfig: { ...cafActual, boleta39Actual: folioBoleta + 1 } }, { merge: true });
            return folioBoleta;
          });

          alert(`Boleta 39 N° ${folioEmitido} emitida para despachar a tiempo. Si el cliente responde después con su RUT, podrás anular con NC 61 y emitir Factura 33 en 1 clic.`);
        });
      };

      // ================= FLUJO 2: CLIENTE CORRIGE RUT -> NC 61 + FACTURA 33 ATÓMICA =================
      const ejecutarCorreccionRutYRefactura = async (e) => {
        e.preventDefault();
        if (!ordenRefacturarModal) return;
        if (!validarRutChileno(nuevoRutCorregido)) {
          return alert("El RUT ingresado sigue siendo inválido según el algoritmo del SII (Módulo 11).");
        }

        const yaTeniaBoletaEsperado = ordenRefacturarModal.tipoDte === 39 && ordenRefacturarModal.timbradoSii;
        if (yaTeniaBoletaEsperado) {
          const okPin = await verificarClaveSupervisor(pinRefactura, empresa);
          if (!okPin) {
            return alert("Clave de Supervisor incorrecta. Anular con Nota de Crédito 61 requiere autorización.");
          }
        }

        await ejecutarConBloqueo(async () => {
          const rutFormateado = formatearRut(nuevoRutCorregido);
          const empDocRef = empRef();
          const ordDocRef = empDocRef.collection("ecommerce_ordenes").doc(ordenRefacturarModal.id);
          const ahora = Date.now();
          const fechaLegible = fechaLegibleChile(ahora);

          const resultado = await db.runTransaction(async (tx) => {
            const empSnap = await tx.get(empDocRef);
            const ordSnap = await tx.get(ordDocRef);
            if (!ordSnap.exists) throw new Error("La orden original ya no existe.");

            const ordData = ordSnap.data();
            if (ordData.anuladaPorNc61 || ordData.devolucionInfo) {
              throw new Error("Esta orden ya fue anulada o devuelta previamente.");
            }

            const cafActual = { ...CAF_DEFAULT, ...(empSnap.data()?.cafConfig || {}) };
            const yaTeniaBoleta = ordData.tipoDte === 39 && Boolean(ordData.timbradoSii);
            const folioFactura = Number(cafActual.factura33Actual);
            const folioNc61 = Number(cafActual.nc61Actual || 1);

            if (yaTeniaBoleta) {
              tx.update(ordDocRef, {
                anuladaPorNc61: true,
                folioNc61Anulacion: folioNc61,
                estadoRut: "anulada_y_refacturada"
              });

              const nuevaFacturaObj = {
                ...ordData,
                rutComprador: rutFormateado,
                estadoRut: "corregido_ok",
                tipoDte: 33,
                folioSii: folioFactura,
                timbradoSii: true,
                anuladaPorNc61: false,
                folioNc61Anulacion: null,
                devolucionInfo: null,
                refBoletaAnulada: ordData.folioSii || 0,
                refOrdenOrigenId: ordSnap.id,
                refNc61: folioNc61,
                etiquetaImpresa: false,
                fechaImpresion: "",
                fechaImpresionTs: 0,
                diaCerrado: false,
                fechaCierreDia: "",
                cierreId: "",
                enviadoMarketplace: ordData.canal !== "Lider" && ordData.canal !== "Venta Directa",
                fechaIso: fechaIsoChile(ahora),
                horaCorta: horaCortaChile(ahora),
                fecha: fechaLegible,
                timestamp: ahora
              };

              tx.set(empDocRef.collection("ecommerce_ordenes").doc(), nuevaFacturaObj);
              tx.set(empDocRef, {
                cafConfig: {
                  ...cafActual,
                  factura33Actual: folioFactura + 1,
                  nc61Actual: folioNc61 + 1
                }
              }, { merge: true });

              tx.set(empDocRef.collection("auditoria_inventario").doc(), {
                producto: `REFACTURACIÓN NC 61 #${folioNc61} → FACTURA #${folioFactura}`,
                detalle: `Boleta #${ordData.folioSii} anulada y refacturada a ${ordData.comprador} (${rutFormateado})`,
                fecha: fechaLegible,
                timestamp: ahora
              });

              return { yaTeniaBoleta: true, folioFactura, folioNc61, folioBoletaAnt: ordData.folioSii };
            } else {
              if (ordData.estadoRut !== "invalido_esperando") {
                throw new Error("Esta orden ya fue emitida desde otro dispositivo.");
              }
              tx.update(ordDocRef, {
                rutComprador: rutFormateado,
                estadoRut: "corregido_ok",
                tipoDte: 33,
                folioSii: folioFactura,
                timbradoSii: true,
                enviadoMarketplace: ordData.canal !== "Lider" && ordData.canal !== "Venta Directa"
              });
              tx.set(empDocRef, {
                cafConfig: { ...cafActual, factura33Actual: folioFactura + 1 }
              }, { merge: true });

              return { yaTeniaBoleta: false, folioFactura };
            }
          });

          setOrdenRefacturarModal(null);
          setNuevoRutCorregido("");
          setPinRefactura("");
          alert(
            resultado.yaTeniaBoleta
              ? `Cadena tributaria completada:\n1. Nota de Crédito 61 N° ${resultado.folioNc61} emitida anulando Boleta #${resultado.folioBoletaAnt}.\n2. Factura 33 N° ${resultado.folioFactura} emitida al RUT ${rutFormateado}.`
              : `RUT validado (${rutFormateado}). Factura 33 N° ${resultado.folioFactura} emitida y lista para despacho.`
          );
        });
      };

      // ================= FLUJO DEVOLUCIONES Y CUARENTENA ATÓMICO (RUNTRANSACTION + PIN SUPERVISOR) =================
      const procesarDevolucionOrden = async (e) => {
        e.preventDefault();
        if (!ordenDevolucionModal) return;

        const okPin = await verificarClaveSupervisor(pinDevolucion, empresa);
        if (!okPin) {
          return alert("Clave de Supervisor incorrecta. Registrar devoluciones y Notas de Crédito exige autorización.");
        }

        await ejecutarConBloqueo(async () => {
          const orden = ordenDevolucionModal;
          const empDocRef = empRef();
          const ordDocRef = empDocRef.collection("ecommerce_ordenes").doc(orden.id);
          const prodMatch = catalogo.find((p) => p.id === orden.productoId) || catalogo.find((p) => p.nombre === orden.productoNombre);
          const prodDocRef = prodMatch ? empDocRef.collection("catalogo").doc(prodMatch.id) : null;
          const ahora = Date.now();
          const fechaLegible = fechaLegibleChile(ahora);

          await db.runTransaction(async (tx) => {
            const empSnap = await tx.get(empDocRef);
            const ordSnap = await tx.get(ordDocRef);
            const prodSnap = (estadoFisicoDevolucion === "intacto" && prodDocRef) ? await tx.get(prodDocRef) : null;

            if (!ordSnap.exists) throw new Error("La orden ya no existe.");
            const ordData = ordSnap.data();
            if (ordData.devolucionInfo || ordData.anuladaPorNc61) {
              throw new Error("Esta orden ya registró una devolución o anulación previa.");
            }

            const cafActual = { ...CAF_DEFAULT, ...(empSnap.data()?.cafConfig || {}) };
            const folioNc61 = Number(cafActual.nc61Actual || 1);
            const cantDev = Math.max(1, Number(ordData.cantidad || 1));

            tx.update(ordDocRef, {
              anuladaPorNc61: Boolean(emitirNc61Devolucion),
              folioNc61Anulacion: emitirNc61Devolucion ? folioNc61 : null,
              devolucionInfo: {
                estadoFisico: estadoFisicoDevolucion,
                nc61Emitida: Boolean(emitirNc61Devolucion),
                folioNc61: emitirNc61Devolucion ? folioNc61 : null,
                nota: notaDevolucion.trim(),
                fecha: fechaLegible
              }
            });

            if (emitirNc61Devolucion) {
              tx.set(empDocRef, { cafConfig: { ...cafActual, nc61Actual: folioNc61 + 1 } }, { merge: true });
            }

            if (estadoFisicoDevolucion === "intacto") {
              if (prodDocRef && prodSnap && prodSnap.exists) {
                tx.update(prodDocRef, {
                  stockOnline: FieldValue.increment(cantDev)
                });
              }
            } else {
              tx.set(empDocRef.collection("cuarentena_productos").doc(), {
                ordenOrigenId: ordSnap.id,
                productoId: ordData.productoId || "",
                codigo: ordData.codigoSku || "",
                nombre: ordData.productoNombre,
                cantidad: cantDev,
                canalOrigen: ordData.canal,
                folioOrigen: ordData.folioSii || "S/N",
                nota: notaDevolucion.trim() || "Devuelto abierto / requiere revisión",
                fecha: fechaLegible,
                timestamp: ahora
              });
            }

            tx.set(empDocRef.collection("auditoria_inventario").doc(), {
              producto: ordData.productoNombre,
              detalle: `Devolución autorizada (${cantDev}x • ${estadoFisicoDevolucion === "intacto" ? "Reingreso a stock" : "A Cuarentena"})${emitirNc61Devolucion ? ` • NC 61 #${folioNc61}` : ""} • Orden ${ordData.canal}`,
              fecha: fechaLegible,
              timestamp: ahora
            });
          });

          setOrdenDevolucionModal(null);
          setNotaDevolucion("");
          setPinDevolucion("");
          alert(
            estadoFisicoDevolucion === "intacto"
              ? `Devolución procesada: ${orden.cantidad}x ${orden.productoNombre} reingresado al stock vendible.`
              : `Devolución apartada en Cuarentena: ${orden.cantidad}x ${orden.productoNombre} quedó en Revisión Técnica.`
          );
        });
      };

      const resolverItemCuarentena = (item, accion) => {
        pedirAutorizacionSupervisor(
          accion === "rehabilitar" ? "Rehabilitar desde Cuarentena" : "Descartar Producto de Cuarentena",
          `${item.cantidad}x ${item.nombre} — Requiere Clave de Supervisor.`,
          async () => {
            const empDocRef = empRef();
            const cuarDocRef = empDocRef.collection("cuarentena_productos").doc(item.id);
            const prodMatch = catalogo.find((p) => p.id === item.productoId) || catalogo.find((p) => p.nombre === item.nombre);
            const prodDocRef = prodMatch ? empDocRef.collection("catalogo").doc(prodMatch.id) : null;

            await db.runTransaction(async (tx) => {
              const cuarSnap = await tx.get(cuarDocRef);
              const prodSnap = (accion === "rehabilitar" && prodDocRef) ? await tx.get(prodDocRef) : null;
              if (!cuarSnap.exists) throw new Error("Este ítem de cuarentena ya fue resuelto.");

              tx.delete(cuarDocRef);

              if (accion === "rehabilitar" && prodDocRef && prodSnap && prodSnap.exists) {
                tx.update(prodDocRef, {
                  stockOnline: FieldValue.increment(Math.max(1, Number(item.cantidad || 1)))
                });
              }

              tx.set(empDocRef.collection("auditoria_inventario").doc(), {
                producto: item.nombre,
                detalle: accion === "rehabilitar"
                  ? `Rehabilitado desde Cuarentena (+${item.cantidad} unds al stock vendible)`
                  : `Dado de baja desde Cuarentena (${item.cantidad} unds como merma/descarte)`,
                fecha: fechaLegibleChile(),
                timestamp: Date.now()
              });
            });
          }
        );
      };

      // ================= EDICIÓN PROTEGIDA DE PRODUCTOS CON CLAVE DE SUPERVISOR =================
      const abrirEditorProducto = (prod) => {
        setProductoEditando(prod);
        setEditProdForm({
          codigo: prod.codigo || "",
          nombre: prod.nombre || "",
          proveedor: prod.proveedor || "",
          stockOnline: Number(prod.stockOnline ?? 0),
          ultimoCostoNeto: Number(prod.ultimoCostoNeto ?? 0),
          motivo: ""
        });
        setPinAutorizacionEdit("");
      };

      const guardarEdicionProductoAutorizada = async (e) => {
        e.preventDefault();
        if (!productoEditando) return;
        const ok = await verificarClaveSupervisor(pinAutorizacionEdit, empresa);
        if (!ok) {
          return alert("Clave de Supervisor incorrecta. Modificación rechazada.");
        }

        const codNorm = editProdForm.codigo.trim().toUpperCase();
        const nomNorm = editProdForm.nombre.trim().toUpperCase();
        if (!nomNorm) return alert("El nombre del producto no puede quedar vacío.");

        const dup = catalogo.find(
          (p) =>
            p.id !== productoEditando.id &&
            (String(p.nombre || "").trim().toUpperCase() === nomNorm ||
              (codNorm && String(p.codigo || "").trim().toUpperCase() === codNorm))
        );
        if (dup) {
          return alert(`Ya existe otro producto con ese mismo nombre o código SKU: "${dup.nombre}" (${dup.codigo || "sin SKU"}).`);
        }

        await ejecutarConBloqueo(async () => {
          const stockAntes = Number(productoEditando.stockOnline ?? 0);
          const stockDespues = Math.max(0, Number(editProdForm.stockOnline));
          const batch = db.batch();

          batch.update(empRef().collection("catalogo").doc(productoEditando.id), {
            codigo: codNorm,
            nombre: nomNorm,
            proveedor: editProdForm.proveedor.trim().toUpperCase(),
            stockOnline: stockDespues,
            ultimoCostoNeto: Math.max(0, Number(editProdForm.ultimoCostoNeto || 0))
          });

          batch.set(empRef().collection("auditoria_inventario").doc(), {
            producto: nomNorm,
            detalle: `Edición autorizada • Stock: ${stockAntes} → ${stockDespues} unds • SKU: ${codNorm || "-"} ${editProdForm.motivo ? `• Motivo: ${editProdForm.motivo}` : ""}`,
            fecha: fechaLegibleChile(),
            timestamp: Date.now()
          });

          await batch.commit();
          setProductoEditando(null);
          setPinAutorizacionEdit("");
        });
      };

      const eliminarProductoCatalogo = (prod) => {
        pedirAutorizacionSupervisor(
          "Eliminar Producto del Catálogo",
          `Vas a eliminar "${prod.nombre}" (Stock actual: ${Number(prod.stockOnline ?? 0)} unds).`,
          async () => {
            const batch = db.batch();
            batch.delete(empRef().collection("catalogo").doc(prod.id));
            batch.set(empRef().collection("auditoria_inventario").doc(), {
              producto: prod.nombre,
              detalle: `Producto eliminado del catálogo (tenía ${Number(prod.stockOnline ?? 0)} unds)`,
              fecha: fechaLegibleChile(),
              timestamp: Date.now()
            });
            await batch.commit();
          }
        );
      };

      // ELIMINAR SIMULACIÓN ATÓMICO: PROTEGE CADENAS DE REFACTURA, LIMPIA CUARENTENA, RESTAURA STOCK Y FOLIO SEGURO
      const eliminarSimulacion = (orden) => {
        if (orden.esSimulacion === false) {
          return alert("Documento real emitido al SII: no se puede eliminar por normativa tributaria.");
        }
        if (orden.estadoRut === "anulada_y_refacturada") {
          const hijaActiva = ordenes.some(
            (o) => o.id !== orden.id && (o.refOrdenOrigenId === orden.id || (o.refBoletaAnulada && o.refBoletaAnulada === orden.folioSii))
          );
          if (hijaActiva) {
            return alert("Esta boleta fue reemplazada por una Factura 33. Elimina primero la Factura 33 de reemplazo antes de eliminar esta simulación.");
          }
        }

        pedirAutorizacionSupervisor(
          "Eliminar Simulación",
          `Eliminar ${orden.tipoDte === 33 ? "Factura 33" : orden.tipoDte === 39 ? "Boleta 39" : "Orden"} #${orden.folioSii || "S/N"} de ${orden.comprador} y restaurar stock.`,
          async () => {
            const empDocRef = empRef();
            const ordDocRef = empDocRef.collection("ecommerce_ordenes").doc(orden.id);
            const prodDocRef = orden.productoId && orden.productoId !== "manual"
              ? empDocRef.collection("catalogo").doc(orden.productoId)
              : null;

            const cuarRelacionados = cuarentena.filter(
              (q) =>
                q.ordenOrigenId === orden.id ||
                (!q.ordenOrigenId && String(q.folioOrigen || "") === String(orden.folioSii || "") && q.nombre === orden.productoNombre)
            );

            await db.runTransaction(async (tx) => {
              const empSnap = await tx.get(empDocRef);
              const ordSnap = await tx.get(ordDocRef);
              const prodSnap = prodDocRef ? await tx.get(prodDocRef) : null;

              if (!ordSnap.exists) return;
              const ordData = ordSnap.data();
              if (ordData.esSimulacion === false || ordData.diaCerrado) {
                throw new Error("Este documento ya no se puede eliminar.");
              }

              tx.delete(ordDocRef);

              cuarRelacionados.forEach((q) => {
                tx.delete(empDocRef.collection("cuarentena_productos").doc(q.id));
              });

              const debeRestaurarStock =
                !ordData.refBoletaAnulada &&
                ordData.devolucionInfo?.estadoFisico !== "intacto" &&
                prodDocRef &&
                prodSnap &&
                prodSnap.exists;

              if (debeRestaurarStock) {
                tx.update(prodDocRef, {
                  stockOnline: FieldValue.increment(Math.max(1, Number(ordData.cantidad || 1)))
                });
              }

              if (ordData.timbradoSii) {
                const cafActual = { ...CAF_DEFAULT, ...(empSnap.data()?.cafConfig || {}) };
                const folioElim = Number(ordData.folioSii || 0);
                const esFactura33 = ordData.tipoDte === 33;
                const esUltimoFactura = esFactura33 && folioElim > 0 && folioElim === Number(cafActual.factura33Actual) - 1;
                const esUltimoBoleta = !esFactura33 && folioElim > 0 && folioElim === Number(cafActual.boleta39Actual) - 1;

                if (esUltimoFactura || esUltimoBoleta) {
                  tx.set(
                    empDocRef,
                    {
                      cafConfig: {
                        ...cafActual,
                        factura33Actual: esUltimoFactura ? Math.max(1, Number(cafActual.factura33Actual) - 1) : Number(cafActual.factura33Actual),
                        boleta39Actual: esUltimoBoleta ? Math.max(1, Number(cafActual.boleta39Actual) - 1) : Number(cafActual.boleta39Actual)
                      }
                    },
                    { merge: true }
                  );
                }
              }
            });
          }
        );
      };

      // ================= CONSEJERO ECONÓMICO & PEDIDO SUGERIDO GENERAL =================
      const analisisEconomicoInventario = useMemo(() => {
        const ventasPorId = {};
        const ventasPorNombre = {};
        let minTs = Date.now();

        ordenes.filter((o) => o.timbradoSii && !o.anuladaPorNc61 && !o.devolucionInfo).forEach((o) => {
          const ts = Number(o.timestamp || Date.now());
          if (ts < minTs) minTs = ts;
          const cant = Number(o.cantidad || 1);
          const monto = Number(o.totalClp || 0);
          if (o.productoId && o.productoId !== "manual") {
            if (!ventasPorId[o.productoId]) ventasPorId[o.productoId] = { unds: 0, clp: 0 };
            ventasPorId[o.productoId].unds += cant;
            ventasPorId[o.productoId].clp += monto;
          }
          const nomKey = String(o.productoNombre || "").trim().toUpperCase();
          if (nomKey) {
            if (!ventasPorNombre[nomKey]) ventasPorNombre[nomKey] = { unds: 0, clp: 0 };
            ventasPorNombre[nomKey].unds += cant;
            ventasPorNombre[nomKey].clp += monto;
          }
        });

        const diasTranscurridos = Math.max(1, Math.min(30, Math.ceil((Date.now() - minTs) / (1000 * 60 * 60 * 24))));
        const urgentes = [];
        const preventivos = [];
        const sobrestock = [];

        catalogo.forEach((p) => {
          if (filtroProvPedido !== "TODOS" && (p.proveedor || "SIN PROVEEDOR") !== filtroProvPedido) return;
          const stockActual = Number(p.stockOnline ?? 0);
          const nomKey = String(p.nombre || "").trim().toUpperCase();
          const stats = ventasPorId[p.id] || ventasPorNombre[nomKey] || { unds: 0, clp: 0 };
          const vendidos = stats.unds;
          const ingresos = stats.clp;

          const ritmoSemanal = vendidos > 0 ? Math.max(vendidos, Math.ceil((vendidos / diasTranscurridos) * 7)) : 0;
          const coberturaObjetivo = ritmoSemanal * 2;

          if (vendidos > 0 && (stockActual <= 0 || stockActual < ritmoSemanal)) {
            const baseSugerida = Math.max(4, coberturaObjetivo - Math.max(0, stockActual));
            const pedirFinal = cantidadesEditadasPedido[p.id] !== undefined ? Math.max(0, Number(cantidadesEditadasPedido[p.id])) : baseSugerida;
            urgentes.push({
              id: p.id,
              codigo: p.codigo || "",
              nombre: p.nombre,
              proveedor: p.proveedor || "General",
              stockActual,
              vendidos,
              ingresos,
              pedir: pedirFinal,
              diagnostico: stockActual <= 0
                ? `Quiebre total con ${vendidos} unds vendidas. Reposición inmediata para no frenar ingresos.`
                : `Alta rotación (${vendidos} vendidas) y solo quedan ${stockActual} unds. Cubrir 14 días.`
            });
          } else if (vendidos > 0 && stockActual < coberturaObjetivo + 3) {
            const baseSugerida = Math.max(2, coberturaObjetivo + 3 - stockActual);
            const pedirFinal = cantidadesEditadasPedido[p.id] !== undefined ? Math.max(0, Number(cantidadesEditadasPedido[p.id])) : baseSugerida;
            preventivos.push({
              id: p.id,
              codigo: p.codigo || "",
              nombre: p.nombre,
              proveedor: p.proveedor || "General",
              stockActual,
              vendidos,
              ingresos,
              pedir: pedirFinal,
              diagnostico: `Rotación saludable (${vendidos} vendidas). Refuerzo preventivo para margen de seguridad.`
            });
          } else if (vendidos === 0 && stockActual >= 5) {
            sobrestock.push({
              id: p.id,
              codigo: p.codigo || "",
              nombre: p.nombre,
              proveedor: p.proveedor || "General",
              stockActual,
              vendidos: 0,
              ingresos: 0,
              pedir: 0,
              diagnostico: `Capital inmovilizado (${stockActual} unds sin rotación). No comprar; liquidar o armar combo promocional.`
            });
          }
        });

        urgentes.sort((a, b) => b.vendidos - a.vendidos);
        preventivos.sort((a, b) => b.vendidos - a.vendidos);
        sobrestock.sort((a, b) => b.stockActual - a.stockActual);

        const listaCompraConsolidada = [...urgentes, ...preventivos].filter((it) => !excluidosPedido[it.id] && it.pedir > 0);

              const wb = XLSX.read(buf, { type: "array" });

              const normKey = (k) => String(k || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

                keys.forEach((k) => {
                  const kn = normKey(k);

                  nom = normVal(row[keys[1]]);

                      <h2 className={`text-base font-extrabold ${T.textMain}`}>Seguridad de Supervisor (SHA-256) y Horarios de Despacho</h2>
                      <p className={`text-xs ${T.textSub}`}>
                        Define cuántos despachos diarios salen (1, 2 o 3). Si un cliente ingresa mal su RUT, el sistema espera hasta 1 hora antes del próximo corte disponible y luego emite Boleta 39.
                      </p>
                    </div>

                    <div className={`${T.cardMuted} p-4 rounded-xl space-y-3`}>
                      <label className={`text-xs font-extrabold block ${T.textMain}`}>Cantidad de Horarios de Despacho al Día</label>
                      <div className="grid grid-cols-3 gap-2">
                        {[1, 2, 3].map((n) => (
                          <button
                            key={n}
                            type="button"
                            onClick={() => setDespachosConfig({ ...despachosConfig, cantidadHorarios: n })}
                            className={`py-2.5 rounded-xl text-xs font-extrabold cursor-pointer ${Number(despachosConfig.cantidadHorarios) === n ? T.btn : T.btnSec}`}
                          >
                            {n} {n === 1 ? "Horario" : "Horarios"}
                          </button>
                        ))}
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                        {Array.from({ length: Number(despachosConfig.cantidadHorarios || 2) }).map((_, idx) => (
                          <div key={idx}>
                            <label className={`text-[11px] font-bold block mb-1 ${T.textSub}`}>Salida Despacho #{idx + 1}</label>
                            <input
                              type="time"
                              value={(despachosConfig.horarios || [])[idx] || "14:00"}
                              onChange={(e) => {
                                const copia = [...(despachosConfig.horarios || ["12:00", "16:30", "18:30"])];
                                copia[idx] = e.target.value;
                                setDespachosConfig({ ...despachosConfig, horarios: copia });
                              }}
                              className={`w-full rounded-xl px-3 py-2 text-xs font-extrabold ${T.input}`}
                            />
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className={`${T.cardMuted} p-4 rounded-xl space-y-3`}>
                      <h3 className={`text-xs font-extrabold uppercase ${T.textMain}`}>Clave Privada de Supervisor</h3>
                      <p className={`text-[11px] ${T.textSub}`}>
                        Se guarda cifrada (SHA-256) y se exige en el área de Supervisor y en toda modificación crítica. {!tienePinPersonalizado && <strong>(Clave inicial actual: 1234)</strong>}
                      </p>
                      <div className="space-y-2.5">
                        <input
                          type="password"
                          value={pinSupervisorActualInput}
                          onChange={(e) => setPinSupervisorActualInput(e.target.value)}
                          placeholder="Clave actual (requerida para guardar) *"
                          className={`w-full rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`}
                          required
                        />
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          <input
                            type="password"
                            value={pinSupervisorNuevoInput}
                            onChange={(e) => setPinSupervisorNuevoInput(e.target.value)}
                            placeholder="Nueva clave (opcional, mín 4 caracteres)"
                            className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`}
                          />
                          <input
                            type="password"
                            value={pinSupervisorConfirmInput}
                            onChange={(e) => setPinSupervisorConfirmInput(e.target.value)}
                            placeholder="Confirmar nueva clave"
                            className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`}
                          />
                        </div>
                        {pinSupervisorNuevoInput.trim().length > 0 && pinSupervisorConfirmInput.trim().length > 0 && pinSupervisorNuevoInput.trim() !== pinSupervisorConfirmInput.trim() && (
                          <p className="text-[11px] font-bold text-rose-500">Las nuevas claves no coinciden.</p>
                        )}
                      </div>
                    </div>

                    <button type="submit" disabled={guardandoConfig} className={`w-full font-extrabold py-3.5 rounded-xl text-xs cursor-pointer disabled:opacity-40 ${T.btn}`}>
                      {guardandoConfig ? "Guardando..." : "Guardar Horarios de Despacho y Seguridad"}
                    </button>
                  </form>
                )}

                {subTabConfig === "personal" && (
                  <div className={`${T.card} rounded-2xl p-6 space-y-4`}>
                    <div>
                      <h2 className={`text-base font-extrabold ${T.textMain}`}>Gestión de Personal y Roles</h2>
                      <p className={`text-xs ${T.textSub}`}>Agregar o quitar trabajadores exige Clave de Supervisor.</p>
                    </div>
                    <form onSubmit={agregarColaborador} className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                      <input type="text" value={nuevoColabNombre} onChange={(e) => setNuevoColabNombre(e.target.value)} placeholder="Nombre del trabajador *" className={`rounded-xl px-3.5 py-2.5 text-xs font-semibold ${T.input}`} required />
                      <select value={nuevoColabRol} onChange={(e) => setNuevoColabRol(e.target.value)} className={`rounded-xl px-3.5 py-2.5 text-xs font-semibold ${T.input}`}>
                        {ROLES.map((r) => <option key={r} value={r}>{r}</option>)}
                      </select>
                      <button type="submit" className={`font-extrabold py-2.5 px-4 rounded-xl text-xs cursor-pointer ${T.btn}`}>+ Agregar Trabajador</button>
                    </form>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      {equipo.map((m) => (
                        <div key={m.id} className={`${T.cardMuted} rounded-xl p-4 flex items-center justify-between`}>
                          <div>
                            <p className={`text-sm font-extrabold ${T.textMain}`}>{m.nombre}</p>
                            <span className={`text-[11px] ${T.textSub}`}>{m.rol}</span>
                          </div>
                          <button onClick={() => quitarColaborador(m)} className="text-xs font-bold text-rose-500 cursor-pointer">
                            Quitar
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {subTabConfig === "apariencia" && (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div className={`${T.card} rounded-2xl p-6 space-y-4`}>
                      <div>
                        <h2 className={`text-base font-extrabold ${T.textMain}`}>Tema Visual de tu Plataforma</h2>
                        <p className={`text-xs ${T.textSub}`}>Elige entre modo claro, ejecutivo, operaciones o modo oscuro.</p>
                      </div>
                      <div className="space-y-2.5">
                        {Object.entries(TEMAS_DISPONIBLES).map(([id, info]) => {
                          const activo = temaId === id;
                          return (
                            <div
                              key={id}
                              onClick={() => cambiarTemaCliente(id)}
                              className={`p-4 rounded-xl border-2 cursor-pointer flex items-center justify-between transition ${
                                activo ? "border-blue-600 bg-blue-50/10" : "border-slate-200/40"
                              }`}
                            >
                              <div>
                                <p className={`text-xs font-extrabold ${T.textMain}`}>{info.nombre}</p>
                                <p className={`text-[11px] mt-0.5 ${T.textSub}`}>{info.desc}</p>
                              </div>
                              <span className={`text-[11px] font-extrabold px-3 py-1 rounded-full ${activo ? T.btn : T.btnSec}`}>
                                {activo ? "Activo" : "Aplicar"}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className={`${T.card} rounded-2xl p-6 space-y-4`}>
                      <div>
                        <h2 className={`text-base font-extrabold ${T.textMain}`}>Orden de tus Botones Principales</h2>
                        <p className={`text-xs ${T.textSub}`}>Ordena la barra de navegación según lo que más uses en tu día a día.</p>
                      </div>
                      <div className="space-y-2">
                        {menuOrdenado.map((item, idx) => (
                          <div key={item.id} className={`${T.cardMuted} p-3.5 rounded-xl flex items-center justify-between`}>
                            <span className={`text-xs font-extrabold ${T.textMain}`}>{idx + 1}. {item.label}</span>
                            <div className="flex gap-1.5">
                              <button type="button" disabled={idx === 0} onClick={() => moverOrdenMenu(idx, -1)} className={`px-2.5 py-1 rounded-lg text-xs font-extrabold cursor-pointer disabled:opacity-30 ${T.btnSec}`}>↑</button>
                              <button type="button" disabled={idx === menuOrdenado.length - 1} onClick={() => moverOrdenMenu(idx, 1)} className={`px-2.5 py-1 rounded-lg text-xs font-extrabold cursor-pointer disabled:opacity-30 ${T.btnSec}`}>↓</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* BARRA INFERIOR MÓVIL LIMPIA */}
          <nav className={`lg:hidden fixed bottom-0 inset-x-0 z-40 border-t px-1.5 py-2 grid grid-cols-5 gap-1 no-print ${T.navBar}`}>
            {menuOrdenado.map((item) => {
              const activo = vista === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setVista(item.id)}
                  className={`py-2 px-1 rounded-xl text-[11px] font-extrabold flex flex-col items-center justify-center relative transition cursor-pointer ${
                    activo ? T.navActive : T.navIdle
                  }`}
                >
                  <span className="truncate max-w-full">{item.shortLabel || item.label}</span>
                  {item.id === "facturas" && facturasPorImprimirHoy.length > 0 && (
                    <span className="absolute -top-1 right-1 px-1.5 py-0.2 rounded-full text-[9px] font-extrabold bg-amber-400 text-slate-950">
                      {facturasPorImprimirHoy.length}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<EmpresaPanelApp />);
  </script>
</body>
</html>
