      // Tema visual seleccionado por el cliente (predeterminado: claro_retail)

      // Orden personalizado de menú del cliente
      const menuOrdenado = useMemo(() => {

        if (!ordenGuardado || ordenGuardado.length !== VISTAS_DEFAULT.length) return VISTAS_DEFAULT;
        const mapa = Object.fromEntries(VISTAS_DEFAULT.map((v) => [v.id, v]));
        const res = ordenGuardado.map((id) => mapa[id]).filter(Boolean);
        return res.length === VISTAS_DEFAULT.length ? res : VISTAS_DEFAULT;

      const cambiarTemaCliente = async (nuevoTemaId) => {

      const moverOrdenMenu = async (index, direccion) => {
        const nuevo = menuOrdenado.map((v) => v.id);
        const target = index + direccion;
        if (target < 0 || target >= nuevo.length) return;
        const temp = nuevo[index];
        nuevo[index] = nuevo[target];

        await empRef().update({ ordenMenu: nuevo });

      const pilotoAutomaticoActivo = Boolean(apisForm.siiModoAutomatico);

      const estadoConexiones = useMemo(() => {

        };

      const faltanApis = !estadoConexiones.sii || (!estadoConexiones.meli && !estadoConexiones.falabella && !estadoConexiones.lider);

      // Registrar venta / simulación omnicanal
      const registrarOrdenOmnicanal = async (e) => {
        e.preventDefault();
        const prodObj = catalogo.find((p) => p.id === skuSeleccionado) || {
          id: "manual",
          codigo: "SKU-001",
          nombre: skuSeleccionado || "Venta",

        };

        const rutLim = limpiarRut(rutCompradorNuevo);
        const esFactura33 = rutLim.length >= 7;
        const tipoDte = esFactura33 ? 33 : 39;
        const folioAsignado = esFactura33 ? cafConfig.factura33Actual : cafConfig.boleta39Actual;
        const esLider = canalNuevo === "Lider";
        const esRealSii = Boolean(estadoConexiones.sii);
        const ahora = Date.now();

        const nuevaOrden = {
          canal: canalNuevo,
          ordenExterna: `${Math.floor(1000000 + Math.random() * 9000000)}-1`,
          comprador: compradorNuevo.trim() || "Cliente Marketplace",
          rutComprador: esFactura33 ? formatearRut(rutLim) : "",
          direccionCliente: "Santiago",
          productoId: prodObj.id,
          codigoSku: prodObj.codigo || "S/C",
          productoNombre: prodObj.nombre,
          cantidad: Number(cantidadNueva),
          totalClp: Number(totalNuevo),
          vendedor: vendedorSeleccionado || "Canal Automático",
          tipoDte,
          folioSii: folioAsignado,
          timbradoSii: true,
          enviadoMarketplace: !esLider,
          esSimulacion: !esRealSii,
          colaImpresion: esLider ? "lider" : "general",
          etiquetaImpresa: false,
          despachado: false,
          fechaIso: new Date(ahora).toISOString().slice(0, 10),
          horaCorta: new Date(ahora).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }),
          fecha: new Date(ahora).toLocaleString("es-CL"),
          timestamp: ahora
        };

        const batch = db.batch();
        batch.set(empRef().collection("ecommerce_ordenes").doc(), nuevaOrden);

        if (prodObj.id && prodObj.id !== "manual") {
          const nuevoStock = Math.max(0, (Number(prodObj.stockOnline) || 0) - Number(cantidadNueva));
          batch.update(empRef().collection("catalogo").doc(prodObj.id), { stockOnline: nuevoStock });
        }

        batch.set(
          empRef(),
          {
            cafConfig: {
              ...cafConfig,
              factura33Actual: esFactura33 ? cafConfig.factura33Actual + 1 : cafConfig.factura33Actual,
              boleta39Actual: !esFactura33 ? cafConfig.boleta39Actual + 1 : cafConfig.boleta39Actual
            }
          },
          { merge: true }
        );

        await batch.commit();
        setModalNuevaVenta(false);
        setCompradorNuevo("");
        setRutCompradorNuevo("");
      };

      const eliminarSimulacion = async (orden) => {
        if (orden.esSimulacion === false) {
          return alert("Documento real emitido al SII: no se puede eliminar por normativa tributaria.");
        }
        if (!confirm(`¿Eliminar simulación ${orden.tipoDte === 33 ? "Factura 33" : "Boleta 39"} #${orden.folioSii}?`)) return;
        await empRef().collection("ecommerce_ordenes").doc(orden.id).delete();
      };

      // Sugerido inteligente de catálogo basado en ítems detectados en facturas de compra/venta que aún no están en catálogo
      const sugeridosCatalogo = useMemo(() => {
        const nombresEnCatalogo = new Set(catalogo.map((p) => String(p.nombre || "").trim().toUpperCase()));
        const skusEnCatalogo = new Set(catalogo.filter((p) => p.codigo).map((p) => String(p.codigo || "").trim().toUpperCase()));
        const mapaSugeridos = new Map();

        compras.forEach((c) => {
          (c.items || []).forEach((it) => {
            const nom = String(it.nombre || "").trim().toUpperCase();
            const sku = String(it.codigo || "").trim().toUpperCase();
            if (!nom) return;
            if (!nombresEnCatalogo.has(nom) && (!sku || !skusEnCatalogo.has(sku))) {
              mapaSugeridos.set(nom, { codigo: sku, nombre: nom, proveedor: c.proveedor || "" });
            }
          });
        });

        ordenes.forEach((o) => {
          const nom = String(o.productoNombre || "").trim().toUpperCase();
          const sku = String(o.codigoSku || "").trim().toUpperCase();
          if (!nom) return;
          if (!nombresEnCatalogo.has(nom) && (!sku || !skusEnCatalogo.has(sku))) {
            mapaSugeridos.set(nom, { codigo: sku === "S/C" ? "" : sku, nombre: nom, proveedor: o.canal || "" });
          }
        });

        return Array.from(mapaSugeridos.values());
      }, [catalogo, compras, ordenes]);

      const incorporarSugeridoAlCatalogo = async (item) => {
        await empRef().collection("catalogo").add({
          codigo: item.codigo || "",
          nombre: item.nombre,
          proveedor: item.proveedor || "",
          stockOnline: 0
        });

      // Ranking de productos más vendidos
      const rankingProductosVendidos = useMemo(() => {
        const mapa = {};
        ordenes.forEach((o) => {
          const key = o.productoNombre || "Producto";
          if (!mapa[key]) mapa[key] = { nombre: key, unidades: 0, totalClp: 0 };
          mapa[key].unidades += Number(o.cantidad || 1);
          mapa[key].totalClp += Number(o.totalClp || 0);
        });
        return Object.values(mapa).sort((a, b) => b.unidades - a.unidades);
      }, [ordenes]);

      // Listas separadas de Facturas: Por Imprimir (orden llegada), Ya Impresas, y Cola Física Lider
      const facturasPorImprimir = useMemo(() => {
        return ordenes

      const facturasYaImpresas = useMemo(() => {

      const generarEImprimirLotePdf = () => {

          seleccionados.forEach((o) => {

              etiquetaImpresa: true,
              fechaImpresion: ahoraStr,
              fechaImpresionTs: ahoraTs

          await batch.commit();
          setLoteParaImprimir([]);
          setSeleccionLoteIds([]);

      // Catálogo acciones

          nombre: manualNombre.trim().toUpperCase(),
          proveedor: manualProveedor.trim().toUpperCase(),

        });

        setManualNombre("");
        setManualProveedor("");
      };

      const subirExcelCatalogo = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setImportandoExcel(true);
        try {
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, { type: "array" });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          const normKey = (k) => String(k || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
          const normVal = (v) => String(v || "").trim().replace(/\s+/g, " ").toUpperCase();
          const existentes = new Set(catalogo.map((p) => normVal(p.nombre)));
          const nuevos = [];

          rows.forEach((row) => {
            const keys = Object.keys(row);
            let cod = "", nom = "", prov = "";
            keys.forEach((k) => {
              const kn = normKey(k);
              if (!cod && (kn.includes("cod") || kn.includes("sku") || kn === "id")) cod = normVal(row[k]);
              else if (!nom && (kn.includes("desc") || kn.includes("prod") || kn.includes("nomb") || kn.includes("art"))) nom = normVal(row[k]);
              else if (!prov && (kn.includes("prov") || kn.includes("marc"))) prov = normVal(row[k]);
            });
            if (!nom && keys.length >= 2) {
              cod = normVal(row[keys[0]]);
              nom = normVal(row[keys[1]]);
              if (keys.length >= 3) prov = normVal(row[keys[2]]);
            } else if (!nom && keys.length === 1) {
              nom = normVal(row[keys[0]]);
            }
            if (nom && !existentes.has(nom)) {
              existentes.add(nom);
              nuevos.push({ codigo: cod, nombre: nom, proveedor: prov, stockOnline: 0 });
            }
          });

          const col = empRef().collection("catalogo");
          for (let i = 0; i < nuevos.length; i += 400) {
            const batch = db.batch();
            nuevos.slice(i, i + 400).forEach((item) => batch.set(col.doc(), item));
            await batch.commit();
          }
          alert(`Catálogo actualizado: ${nuevos.length} productos agregados con stock 0.`);
        } catch (err) {
          alert("Error al leer Excel: " + err.message);
        }
        setImportandoExcel(false);
        e.target.value = "";

      const agregarColaborador = async (e) => {

      const totalVendidoClp = ordenes.reduce((acc, o) => acc + Number(o.totalClp || 0), 0);
      const productoEstrella = rankingProductosVendidos[0]?.nombre || "Sin ventas aún";

      const ordenesFiltradas = ordenes.filter((o) => {

        const q = busquedaVenta.trim().toLowerCase();
        if (!q) return true;
        return (
          (o.comprador || "").toLowerCase().includes(q) ||
          (o.productoNombre || "").toLowerCase().includes(q) ||
          String(o.folioSii || "").includes(q) ||
          (o.ordenExterna || "").toLowerCase().includes(q)
        );

      const catalogoFiltrado = catalogo.filter((p) => {
        const q = busquedaCat.trim().toLowerCase();
        if (!q) return true;
        return (
          (p.nombre || "").toLowerCase().includes(q) ||
          (p.codigo || "").toLowerCase().includes(q) ||

      return (
        <div className={`min-h-screen pb-24 lg:pb-10 transition-colors ${T.pageBg}`}>
          {/* CONTENEDORES DE IMPRESIÓN OFICIAL SII */}
          {dteVisualizando && (

          {!dteVisualizando && loteParaImprimir.length > 0 && (
            <div className="print-only bg-white">
              {loteParaImprimir.map((docItem) => (
                <HojaDocumentoOficialSii key={docItem.id} orden={docItem} empresa={empresa} datosEmisor={datosEmisor} />

          {/* MODAL VISTA PREVIA DTE INDIVIDUAL */}
          {dteVisualizando && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-4 overflow-y-auto no-print">
              <div className="bg-slate-100 text-slate-900 rounded-3xl max-w-3xl w-full p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-extrabold uppercase text-slate-700">
                    Documento Oficial SII • {dteVisualizando.tipoDte === 33 ? `Factura 33 N° ${dteVisualizando.folioSii}` : `Boleta 39 N° ${dteVisualizando.folioSii}`}
                  </span>
                  <button onClick={() => setDteVisualizando(null)} className="bg-white border border-slate-300 text-xs font-bold px-3.5 py-1.5 rounded-xl cursor-pointer">

                      await empRef().collection("ecommerce_ordenes").doc(dteVisualizando.id).update({

                    className={`flex-1 font-bold py-3 rounded-xl text-xs cursor-pointer ${T.btn}`}
                  >

                  {dteVisualizando.esSimulacion !== false && (

                        await eliminarSimulacion(dteVisualizando);

          {/* MODAL AYUDA API KEY */}
          {ayudaApiModal && AYUDA_APIS[ayudaApiModal] && (

                <div className="flex items-center justify-between border-b border-slate-200/40 pb-3">
                  <h3 className={`text-sm font-extrabold ${T.textMain}`}>{AYUDA_APIS[ayudaApiModal].titulo}</h3>
                  <button onClick={() => setAyudaApiModal(null)} className={`text-xs font-bold px-2 py-1 cursor-pointer ${T.textSub}`}>✕</button>

          {modalNuevaVenta && (

                    <select value={canalNuevo} onChange={(e) => setCanalNuevo(e.target.value)} className={`w-full rounded-xl px-3 py-2.5 text-xs font-bold ${T.input}`}>
                      <option value="Mercado Libre">Mercado Libre</option>

                  <div>

                    <select value={vendedorSeleccionado} onChange={(e) => setVendedorSeleccionado(e.target.value)} className={`w-full rounded-xl px-3 py-2.5 text-xs font-bold ${T.input}`}>

                            <div>
                              <span className={`font-extrabold ${T.textMain}`}>
                                {o.tipoDte === 33 ? `Factura 33 N° ${o.folioSii}` : `Boleta 39 N° ${o.folioSii}`}
                              </span>
                              <span className={`ml-2 ${T.textSub}`}>• {o.canal} • {o.comprador}</span>
                              <span className={`block text-[11px] mt-0.5 ${T.textSub}`}>Impresa: {o.fechaImpresion || o.fecha}</span>
                            </div>
                            <button onClick={() => setDteVisualizando(o)} className={`px-3.5 py-2 rounded-xl text-xs font-bold cursor-pointer ${T.btnSec}`}>
                              Reimprimir
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* ================= VISTA 4: CATÁLOGO (STOCK + SUGERIDO INTELIGENTE + MÁS VENDIDOS) ================= */}
            {vista === "catalogo" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                <div className="lg:col-span-8 space-y-4">
                  {/* SUGERIDO INTELIGENTE DE CATÁLOGO */}
                  {sugeridosCatalogo.length > 0 && (
                    <div className={`${T.card} rounded-2xl p-5 border-2 border-amber-400/80 space-y-3`}>
                      <div>
                        <span className="text-[10px] font-extrabold uppercase bg-amber-400 text-slate-950 px-2.5 py-0.5 rounded">
                          Sugerido Inteligente desde Facturas
                        </span>
                        <h3 className={`text-sm font-extrabold mt-1 ${T.textMain}`}>
                          Productos detectados en tus facturas que aún no están en el catálogo ({sugeridosCatalogo.length})
                        </h3>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {sugeridosCatalogo.map((sug, idx) => (
                          <div key={idx} className={`${T.cardMuted} p-3 rounded-xl flex items-center justify-between gap-2 text-xs`}>
                            <span className={`font-bold truncate ${T.textMain}`}>{sug.codigo ? `[${sug.codigo}] ` : ""}{sug.nombre}</span>
                            <button onClick={() => incorporarSugeridoAlCatalogo(sug)} className={`px-3 py-1.5 rounded-lg text-[11px] font-extrabold shrink-0 cursor-pointer ${T.btn}`}>
                              + Incorporar
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className={`${T.card} rounded-2xl p-5 space-y-4`}>
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <h2 className={`text-base font-extrabold ${T.textMain}`}>Catálogo Maestro ({catalogo.length})</h2>
                        <p className={`text-xs ${T.textSub}`}>Carga productos por Excel o manualmente (inician con stock 0 hasta importar inventario o factura SII).</p>
                      </div>
                      <label className={`text-xs font-extrabold px-4 py-2.5 rounded-xl cursor-pointer text-center shrink-0 ${T.btn}`}>
                        {importandoExcel ? "Importando..." : "Subir Excel (.xlsx)"}
                        <input type="file" accept=".xlsx,.xls,.csv" onChange={subirExcelCatalogo} disabled={importandoExcel} className="hidden" />
                      </label>
                    </div>

                    <form onSubmit={agregarProductoManual} className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                      <input type="text" value={manualSku} onChange={(e) => setManualSku(e.target.value)} placeholder="Código / SKU" className={`rounded-xl px-3 py-2 text-xs font-semibold outline-none ${T.input}`} />
                      <input type="text" value={manualNombre} onChange={(e) => setManualNombre(e.target.value)} placeholder="Nombre producto *" className={`rounded-xl px-3 py-2 text-xs font-semibold outline-none ${T.input}`} required />
                      <input type="text" value={manualProveedor} onChange={(e) => setManualProveedor(e.target.value)} placeholder="Proveedor" className={`rounded-xl px-3 py-2 text-xs font-semibold outline-none ${T.input}`} />
                      <button type="submit" className={`font-extrabold py-2 px-3 rounded-xl text-xs cursor-pointer ${T.btn}`}>+ Agregar</button>
                    </form>

                    <input
                      type="text"
                      value={busquedaCat}
                      onChange={(e) => setBusquedaCat(e.target.value)}
                      placeholder="Buscar por SKU, nombre o proveedor..."
                      className={`w-full rounded-xl px-4 py-2.5 text-xs font-semibold outline-none ${T.input}`}
                    />

                    <div className="max-h-96 overflow-y-auto divide-y divide-slate-200/40">
                      {catalogoFiltrado.length === 0 ? (
                        <p className={`text-xs text-center py-8 ${T.textSub}`}>Aún no hay productos en el catálogo.</p>
                      ) : (
                        catalogoFiltrado.map((p) => {
                          const st = Number(p.stockOnline ?? 0);
                          return (
                            <div key={p.id} className="py-3 flex items-center justify-between gap-2 text-xs">
                              <div className="min-w-0">
                                <span className={`font-bold block truncate ${T.textMain}`}>{p.codigo ? `[${p.codigo}] ` : ""}{p.nombre}</span>
                                {p.proveedor && <span className={`text-[11px] ${T.textSub}`}>{p.proveedor}</span>}
                              </div>
                              <div className="flex items-center gap-1.5 shrink-0">
                                <span className={`font-extrabold px-2.5 py-1 rounded-lg ${T.tag}`}>{st} unds</span>
                                <button onClick={() => empRef().collection("catalogo").doc(p.id).update({ stockOnline: Math.max(0, st - 1) })} className={`px-2 py-1 rounded-lg font-bold cursor-pointer ${T.btnSec}`}>-1</button>
                                <button onClick={() => empRef().collection("catalogo").doc(p.id).update({ stockOnline: st + 1 })} className={`px-2 py-1 rounded-lg font-bold cursor-pointer ${T.btn}`}>+1</button>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                </div>

                {/* COLUMNA DERECHA PC: RANKING MÁS VENDIDOS Y ACCESO A XML */}
                <div className="lg:col-span-4 space-y-4">
                  <div className={`${T.card} rounded-2xl p-5 space-y-3`}>
                    <h3 className={`text-xs font-extrabold uppercase tracking-wider ${T.textSub}`}>Ranking Más Vendidos</h3>
                    {rankingProductosVendidos.length === 0 ? (
                      <p className={`text-xs ${T.textSub}`}>Aún no hay ventas registradas.</p>
                    ) : (
                      <div className="space-y-2">
                        {rankingProductosVendidos.slice(0, 8).map((r, i) => (
                          <div key={i} className={`${T.cardMuted} p-3 rounded-xl flex items-center justify-between text-xs`}>
                            <span className={`font-bold truncate pr-2 ${T.textMain}`}>{i + 1}. {r.nombre}</span>
                            <span className={`font-extrabold shrink-0 ${T.textMain}`}>{r.unidades} unds</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className={`${T.card} rounded-2xl p-5 space-y-2.5`}>
                    <h3 className={`text-xs font-extrabold uppercase ${T.textMain}`}>Cargar Stock desde Factura XML</h3>
                    <p className={`text-xs ${T.textSub}`}>Sube el archivo XML del proveedor para sumar stock al catálogo automáticamente.</p>
                    <button onClick={() => navegarAislado("compras-finanzas.html")} className={`w-full font-bold py-2.5 rounded-xl text-xs cursor-pointer ${T.btn}`}>
                      Abrir Lector XML SII →
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ================= VISTA 5: CONFIGURACIÓN (CENTRO APIs + PERSONAL + APARIENCIA ESTILO FACEBOOK) ================= */}
            {vista === "config" && (
              <div className="space-y-4">
                <div className={`${T.card} rounded-2xl p-3 flex flex-wrap gap-2`}>
                  <button onClick={() => setSubTabConfig("apis")} className={`px-4 py-2 rounded-xl text-xs font-extrabold cursor-pointer ${subTabConfig === "apis" ? T.btn : T.btnSec}`}>
                    Centro de Conexiones API & SII
                  </button>
                  <button onClick={() => setSubTabConfig("personal")} className={`px-4 py-2 rounded-xl text-xs font-extrabold cursor-pointer ${subTabConfig === "personal" ? T.btn : T.btnSec}`}>
                    Equipo y Personal ({equipo.length})
                  </button>
                  <button onClick={() => setSubTabConfig("apariencia")} className={`px-4 py-2 rounded-xl text-xs font-extrabold cursor-pointer ${subTabConfig === "apariencia" ? T.btn : T.btnSec}`}>
                    Apariencia y Orden de Botones
                  </button>
                </div>

                {/* SUB-TAB 1: CENTRO DE CONEXIONES API */}
                {subTabConfig === "apis" && (
                  <form onSubmit={guardarApisYEmisor} className={`${T.card} rounded-2xl p-6 space-y-5`}>
                    <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200/30 pb-3">
                      <div>
                        <h2 className={`text-base font-extrabold ${T.textMain}`}>Centro de Conexiones API y Facturación SII</h2>
                        <p className={`text-xs ${T.textSub}`}>Toca el botón <strong>?</strong> en cada plataforma para ver cómo obtener su clave.</p>
                      </div>
                      <div className={`${T.cardMuted} px-3.5 py-2 rounded-xl flex items-center gap-2.5`}>
                        <span className={`text-xs font-bold ${T.textMain}`}>Piloto Automático</span>
                        <SwitchToggle checked={pilotoAutomaticoActivo} onChange={togglePilotoAutomatico} colorClass={T.sw} />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className={`${T.cardMuted} rounded-xl p-4 space-y-2.5`}>
                        <div className="flex items-center justify-between">
                          <h3 className={`text-xs font-extrabold uppercase ${T.textMain}`}>1. SII / OpenFactura</h3>
                          <button type="button" onClick={() => setAyudaApiModal("sii")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                        </div>
                        <select value={apisForm.siiProveedor} onChange={(e) => setApisForm({ ...apisForm, siiProveedor: e.target.value })} className={`w-full rounded-xl px-3 py-2 text-xs font-semibold ${T.input}`}>
                          <option>OpenFactura (Haulmer)</option>
                          <option>SimpleFactura</option>
                          <option>SII Directo (Certificado .PFX + CAF)</option>
                        </select>
                        <input type="password" value={apisForm.siiApiKey} onChange={(e) => setApisForm({ ...apisForm, siiApiKey: e.target.value })} placeholder="API Key OpenFactura / SII" className={`w-full rounded-xl px-3 py-2 text-xs font-semibold ${T.input}`} />
                      </div>

                      <div className={`${T.cardMuted} rounded-xl p-4 space-y-2.5`}>
                        <div className="flex items-center justify-between">
                          <h3 className={`text-xs font-extrabold uppercase ${T.textMain}`}>2. Mercado Libre Chile</h3>
                          <button type="button" onClick={() => setAyudaApiModal("meli")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                        </div>
                        <input type="text" value={apisForm.meliClientId} onChange={(e) => setApisForm({ ...apisForm, meliClientId: e.target.value })} placeholder="Client ID / App ID" className={`w-full rounded-xl px-3 py-2 text-xs font-semibold ${T.input}`} />
                        <input type="password" value={apisForm.meliSecret} onChange={(e) => setApisForm({ ...apisForm, meliSecret: e.target.value })} placeholder="Client Secret" className={`w-full rounded-xl px-3 py-2 text-xs font-semibold ${T.input}`} />
                      </div>

                      <div className={`${T.cardMuted} rounded-xl p-4 space-y-2.5`}>
                        <div className="flex items-center justify-between">
                          <h3 className={`text-xs font-extrabold uppercase ${T.textMain}`}>3. Falabella Seller Center</h3>
                          <button type="button" onClick={() => setAyudaApiModal("falabella")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                        </div>
                        <input type="text" value={apisForm.falabellaUser} onChange={(e) => setApisForm({ ...apisForm, falabellaUser: e.target.value })} placeholder="Correo Seller Center" className={`w-full rounded-xl px-3 py-2 text-xs font-semibold ${T.input}`} />
                        <input type="password" value={apisForm.falabellaApiKey} onChange={(e) => setApisForm({ ...apisForm, falabellaApiKey: e.target.value })} placeholder="API Key Falabella" className={`w-full rounded-xl px-3 py-2 text-xs font-semibold ${T.input}`} />
                      </div>

                      <div className={`${T.cardMuted} rounded-xl p-4 space-y-2.5`}>
                        <div className="flex items-center justify-between">
                          <h3 className={`text-xs font-extrabold uppercase ${T.textMain}`}>4. Lider / Walmart Marketplace</h3>
                          <button type="button" onClick={() => setAyudaApiModal("lider")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                        </div>
                        <input type="password" value={apisForm.liderApiKey} onChange={(e) => setApisForm({ ...apisForm, liderApiKey: e.target.value })} placeholder="Token / Client Secret Lider" className={`w-full rounded-xl px-3 py-2 text-xs font-semibold ${T.input}`} />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-200/30">
                      <div>
                        <label className={`text-[11px] font-bold block mb-1 ${T.textSub}`}>Giro Comercial SII</label>
                        <input type="text" value={datosEmisor.giro} onChange={(e) => setDatosEmisor({ ...datosEmisor, giro: e.target.value })} className={`w-full rounded-xl px-3 py-2 text-xs font-bold ${T.input}`} />
                      </div>
                      <div>
                        <label className={`text-[11px] font-bold block mb-1 ${T.textSub}`}>Dirección Casa Matriz</label>
                        <input type="text" value={datosEmisor.direccion} onChange={(e) => setDatosEmisor({ ...datosEmisor, direccion: e.target.value })} className={`w-full rounded-xl px-3 py-2 text-xs font-bold ${T.input}`} />
                      </div>
                    </div>

                    <button type="submit" disabled={guardandoConfig} className={`w-full font-extrabold py-3.5 rounded-xl text-xs cursor-pointer ${T.btn}`}>
                      {guardandoConfig ? "Guardando..." : "Guardar Conexiones API y Datos del Emisor"}
                    </button>
                  </form>
                )}

                {/* SUB-TAB 2: GESTIÓN DE PERSONAL */}
                {subTabConfig === "personal" && (
                  <div className={`${T.card} rounded-2xl p-6 space-y-4`}>
                    <div>
                      <h2 className={`text-base font-extrabold ${T.textMain}`}>Gestión de Personal y Roles</h2>
                      <p className={`text-xs ${T.textSub}`}>Registra a tu equipo para asignar ventas, conteos físicos y despachos.</p>
                    </div>
                    <form onSubmit={agregarColaborador} className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                      <input type="text" value={nuevoColabNombre} onChange={(e) => setNuevoColabNombre(e.target.value)} placeholder="Nombre del trabajador *" className={`rounded-xl px-3.5 py-2.5 text-xs font-semibold ${T.input}`} required />
                      <select value={nuevoColabRol} onChange={(e) => setNuevoColabRol(e.target.value)} className={`rounded-xl px-3.5 py-2.5 text-xs font-semibold ${T.input}`}>
                        {ROLES.map((r) => <option key={r} value={r}>{r}</option>)}
                      </select>
                      <button type="submit" className={`font-extrabold py-2.5 px-4 rounded-xl text-xs cursor-pointer ${T.btn}`}>+ Agregar Trabajador</button>
                    </form>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      {equipo.map((m) => (
                        <div key={m.id} className={`${T.cardMuted} rounded-xl p-4 flex items-center justify-between`}>
                          <div>
                            <p className={`text-sm font-extrabold ${T.textMain}`}>{m.nombre}</p>
                            <span className={`text-[11px] ${T.textSub}`}>{m.rol}</span>
                          </div>
                          <button
                            onClick={async () => {
                              await empRef().update({ equipo: equipo.filter((x) => x.id !== m.id) });
                            }}
                            className="text-xs font-bold text-rose-500 cursor-pointer"
                          >
                            Quitar
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SUB-TAB 3: APARIENCIA Y ORDEN DE BOTONES ESTILO FACEBOOK (SOLO AFECTA A ESTA EMPRESA) */}
                {subTabConfig === "apariencia" && (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div className={`${T.card} rounded-2xl p-6 space-y-4`}>
                      <div>
                        <h2 className={`text-base font-extrabold ${T.textMain}`}>Tema Visual de tu Plataforma</h2>
                        <p className={`text-xs ${T.textSub}`}>Elige entre modo claro, ejecutivo, operaciones o modo oscuro. Se guarda exclusivamente para tu empresa.</p>
                      </div>
                      <div className="space-y-2.5">
                        {Object.entries(TEMAS_DISPONIBLES).map(([id, info]) => {
                          const activo = temaId === id;
                          return (
                            <div
                              key={id}
                              onClick={() => cambiarTemaCliente(id)}
                              className={`p-4 rounded-xl border-2 cursor-pointer flex items-center justify-between transition ${
                                activo ? "border-blue-600 bg-blue-50/10" : "border-slate-200/40"
                              }`}
                            >
                              <div>
                                <p className={`text-xs font-extrabold ${T.textMain}`}>{info.nombre}</p>
                                <p className={`text-[11px] mt-0.5 ${T.textSub}`}>{info.desc}</p>
                              </div>
                              <span className={`text-[11px] font-extrabold px-3 py-1 rounded-full ${activo ? T.btn : T.btnSec}`}>
                                {activo ? "Activo" : "Aplicar"}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className={`${T.card} rounded-2xl p-6 space-y-4`}>
                      <div>
                        <h2 className={`text-base font-extrabold ${T.textMain}`}>Orden de tus Botones Principales</h2>
                        <p className={`text-xs ${T.textSub}`}>Ordena la barra de navegación según lo que más uses en tu día a día.</p>
                      </div>
                      <div className="space-y-2">
                        {menuOrdenado.map((item, idx) => (
                          <div key={item.id} className={`${T.cardMuted} p-3.5 rounded-xl flex items-center justify-between`}>
                            <span className={`text-xs font-extrabold ${T.textMain}`}>{idx + 1}. {item.label}</span>
                            <div className="flex gap-1.5">
                              <button
                                type="button"
                                disabled={idx === 0}
                                onClick={() => moverOrdenMenu(idx, -1)}
                                className={`px-2.5 py-1 rounded-lg text-xs font-extrabold cursor-pointer disabled:opacity-30 ${T.btnSec}`}
                              >
                                ↑
                              </button>
                              <button
                                type="button"
                                disabled={idx === menuOrdenado.length - 1}
                                onClick={() => moverOrdenMenu(idx, 1)}
                                className={`px-2.5 py-1 rounded-lg text-xs font-extrabold cursor-pointer disabled:opacity-30 ${T.btnSec}`}
                              >
                                ↓
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* BARRA INFERIOR FIJA EN TELÉFONO MÓVIL (5 BOTONES UNIVERSALES ESTILO ODOO + SHOPIFY POS) */}
          <nav className={`lg:hidden fixed bottom-0 inset-x-0 z-40 border-t px-2 py-2 grid grid-cols-5 gap-1 no-print ${T.navBar}`}>
            {menuOrdenado.map((item) => {
              const activo = vista === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setVista(item.id)}
                  className={`py-2 px-1 rounded-xl text-[11px] font-extrabold flex flex-col items-center justify-center relative transition cursor-pointer ${
                    activo ? T.navActive : T.navIdle
                  }`}
                >
                  <span>{item.label}</span>
                  {item.id === "facturas" && facturasPorImprimir.length > 0 && (
                    <span className="absolute -top-1 right-1.5 px-1.5 py-0.2 rounded-full text-[9px] font-extrabold bg-amber-400 text-slate-950">
                      {facturasPorImprimir.length}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<EmpresaPanelApp />);
  </script>
</body>
</html>
