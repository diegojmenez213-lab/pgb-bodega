<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ERP • Plataforma Empresarial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .corp-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 2px 14px -2px rgba(15, 23, 42, 0.04); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-slate-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();

    const PALETAS = {
      ejecutivo: { btn: "bg-slate-900 hover:bg-slate-800 text-white", tag: "bg-slate-100 text-slate-800", border: "border-slate-900" },
      ecommerce: { btn: "bg-blue-700 hover:bg-blue-800 text-white", tag: "bg-blue-50 text-blue-800", border: "border-blue-700" },
      logistica: { btn: "bg-emerald-700 hover:bg-emerald-800 text-white", tag: "bg-emerald-50 text-emerald-800", border: "border-emerald-700" },
      industrial: { btn: "bg-amber-700 hover:bg-amber-800 text-white", tag: "bg-amber-50 text-amber-800", border: "border-amber-700" }
    };

    const AYUDA_APIS = {
      sii: "En OpenFactura (Haulmer) o tu proveedor DTE, entra a Configuración → API Keys y copia tu llave de producción.",
      meli: "En developers.mercadolibre.cl → Mis Aplicaciones, copia el App ID (Client ID) y el Client Secret.",
      falabella: "En Falabella Seller Center → Configuración → Administrar Usuarios, copia tu correo y tu API Key.",
      lider: "En Walmart/Lider Seller Center → Configuración → Credenciales API, copia tu Token / Client Secret."
    };

    const ROLES = ["Jefatura / Admin", "Vendedor / Comercial", "Bodega / Armador", "Chofer / Despacho"];

    function EmpresaPanelApp() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut") || ""));
      const [empresa, setEmpresa] = useState(null);
      const [tab, setTab] = useState("inicio");

      const [nuevoNombre, setNuevoNombre] = useState("");
      const [nuevoRol, setNuevoRol] = useState(ROLES[1]);

      const [catalogo, setCatalogo] = useState([]);
      const [busquedaCat, setBusquedaCat] = useState("");
      const [importando, setImportando] = useState(false);

      const [manualSku, setManualSku] = useState("");
      const [manualNombre, setManualNombre] = useState("");
      const [manualProveedor, setManualProveedor] = useState("");

      const [apisForm, setApisForm] = useState({
        meliClientId: "",
        meliSecret: "",
        falabellaUser: "",
        falabellaApiKey: "",
        liderApiKey: "",
        siiProveedor: "OpenFactura (Haulmer)",
        siiApiKey: "",
        siiModoAutomatico: true
      });
      const [ayudaTip, setAyudaTip] = useState(null);
      const [guardandoApis, setGuardandoApis] = useState(false);

      useEffect(() => {
        if (!rutActivo) {
          window.location.href = "index.html";
          return;
        }
        if (rutActivo === RUT_PGB) {
          window.location.href = "pgb-operacion.html";
          return;
        }
        auth.signInAnonymously().catch(() => {});
        const u1 = db.collection("saas_empresas").doc(rutActivo).onSnapshot((doc) => {
          if (doc.exists) {
            const data = { id: doc.id, ...doc.data() };
            setEmpresa(data);
            if (data.apis) setApisForm((prev) => ({ ...prev, ...data.apis }));
          }
        });
        const u2 = db.collection("saas_empresas").doc(rutActivo).collection("catalogo").onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
          setCatalogo(lista);
        });
        return () => { u1(); u2(); };
      }, [rutActivo]);

      const cerrarSesion = () => {
        localStorage.removeItem("nexus_empresa_rut");
        window.location.href = "index.html";
      };

      const agregarMiembro = async (e) => {
        e.preventDefault();
        if (!nuevoNombre.trim() || !empresa) return;
        const actual = Array.isArray(empresa.equipo) ? empresa.equipo : [];
        await db.collection("saas_empresas").doc(empresa.id).update({
          equipo: [...actual, { id: Date.now().toString(), nombre: nuevoNombre.trim(), rol: nuevoRol }]
        });
        setNuevoNombre("");
      };

      const agregarProductoManual = async (e) => {
        e.preventDefault();
        if (!manualNombre.trim()) return;
        await db.collection("saas_empresas").doc(rutActivo).collection("catalogo").add({
          codigo: manualSku.trim().toUpperCase(),
          nombre: manualNombre.trim().toUpperCase(),
          proveedor: manualProveedor.trim().toUpperCase(),
          stockOnline: 25
        });
        setManualSku("");
        setManualNombre("");
        setManualProveedor("");
      };

      const eliminarProducto = async (id) => {
        await db.collection("saas_empresas").doc(rutActivo).collection("catalogo").doc(id).delete();
      };

      const subirExcel = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setImportando(true);
        try {
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, { type: "array" });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          const normKey = (k) => String(k || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
          const normVal = (v) => String(v || "").trim().replace(/\s+/g, " ").toUpperCase();
          const existentes = new Set(catalogo.map((p) => normVal(p.nombre)));
          const nuevos = [];

          rows.forEach((row) => {
            const keys = Object.keys(row);
            let cod = "", nom = "", prov = "";
            keys.forEach((k) => {
              const kn = normKey(k);
              if (!cod && (kn.includes("cod") || kn.includes("sku") || kn === "id")) cod = normVal(row[k]);
              else if (!nom && (kn.includes("desc") || kn.includes("prod") || kn.includes("nomb") || kn.includes("art"))) nom = normVal(row[k]);
              else if (!prov && (kn.includes("prov") || kn.includes("marc"))) prov = normVal(row[k]);
            });
            if (!nom && keys.length >= 2) {
              cod = normVal(row[keys[0]]);
              nom = normVal(row[keys[1]]);
              if (keys.length >= 3) prov = normVal(row[keys[2]]);
            } else if (!nom && keys.length === 1) {
              nom = normVal(row[keys[0]]);
            }
            if (nom && !existentes.has(nom)) {
              existentes.add(nom);
              nuevos.push({ codigo: cod, nombre: nom, proveedor: prov, stockOnline: 25 });
            }
          });

          const col = db.collection("saas_empresas").doc(rutActivo).collection("catalogo");
          for (let i = 0; i < nuevos.length; i += 400) {
            const batch = db.batch();
            nuevos.slice(i, i + 400).forEach((item) => batch.set(col.doc(), item));
            await batch.commit();
          }
          alert(`Catálogo actualizado: ${nuevos.length} productos agregados.`);
        } catch (err) {
          alert("Error al leer Excel: " + err.message);
        }
        setImportando(false);
        e.target.value = "";
      };

      const guardarApis = async (e) => {
        e.preventDefault();
        setGuardandoApis(true);
        try {
          await db.collection("saas_empresas").doc(rutActivo).update({ apis: apisForm });
          alert("Conexiones API y SII sincronizadas correctamente.");
        } catch (err) {
          alert("Error: " + err.message);
        }
        setGuardandoApis(false);
      };

      // Construye solo los espacios operativos naturales según lo habilitado (sin mostrar switches ni terminología interna)
      const espaciosOperativos = useMemo(() => {
        if (!empresa) return [];
        const m = empresa.modulosActivos || {};
        const espacios = [];

        if (m.m8_omnicanal || m.m9_stock_sync || m.m10_sii_dte || m.m11_colas_print) {
          espacios.push({
            id: "ecommerce",
            area: "Canales Digitales y SII",
            titulo: "Ventas Omnicanal & Facturación SII",
            desc: "Gestión de pedidos de Mercado Libre, Falabella y Lider, stock sincronizado y emisión automática de Boletas y Facturas.",
            url: "ecommerce-sii.html"
          });
        }

        if (m.m5_inv_general || m.m6_conteo_ciclico) {
          espacios.push({
            id: "inventario",
            area: "Bodega y Existencias",
            titulo: "Control de Inventario y Toma Física",
            desc: "Revisión de stock por proveedor, conteos cíclicos y generación de planillas de verificación.",
            url: "pgb-inventario.html"
          });
        }

        if (m.m12_ruta_inc || m.m13_retornos_merma || m.m14_analitica_err || m.m7_auditoria_inv) {
          espacios.push({
            id: "logistica",
            area: "Despacho y Operaciones",
            titulo: "Operación Logística y Trazabilidad",
            desc: "Control de rutas, armado de pedidos, devoluciones y auditoría de movimientos.",
            url: "pgb-operacion.html"
          });
        }

        if (m.m15_pos_ventas || m.m16_caja_cobros) {
          espacios.push({
            id: "pos",
            area: "Sala de Ventas",
            titulo: "Punto de Venta (POS) y Caja",
            desc: "Emisión rápida en mesón, cotizaciones, cuentas por cobrar y cierre diario.",
            url: "ventas-pos.html"
          });
        }

        if (m.m17_compras_prov || m.m18_finanzas_bi) {
          espacios.push({
            id: "compras",
            area: "Abastecimiento y Finanzas",
            titulo: "Recepción de Facturas SII y Balance",
            desc: "Importación automática de facturas de proveedores vía SII/XML, reposición de stock y flujo financiero.",
            url: "compras-finanzas.html"
          });
        }

        return espacios;
      }, [empresa]);

      const usaCanalesOIntegracion = useMemo(() => {
        if (!empresa) return false;
        const m = empresa.modulosActivos || {};
        return Boolean(m.m4_apis || m.m8_omnicanal || m.m9_stock_sync || m.m10_sii_dte || m.m11_colas_print || m.m17_compras_prov);
      }, [empresa]);

      const alertasPendientes = useMemo(() => {
        if (!empresa) return [];
        const lista = [];
        if (catalogo.length === 0) {
          lista.push({
            texto: "Carga tu catálogo de productos (por Excel o manual) para sincronizar tu inventario.",
            accion: "Ir a Catálogo",
            tabDestino: "catalogo"
          });
        }
        if (usaCanalesOIntegracion && !apisForm.siiApiKey) {
          lista.push({
            texto: "Conecta tu API Key de SII / OpenFactura para habilitar la emisión y lectura automática de documentos.",
            accion: "Configurar APIs",
            tabDestino: "apis"
          });
        }
        if (usaCanalesOIntegracion && !apisForm.meliClientId && !apisForm.falabellaApiKey && !apisForm.liderApiKey) {
          lista.push({
            texto: "Ingresa las credenciales de tus canales de venta (Mercado Libre, Falabella o Lider) para sincronizar pedidos.",
            accion: "Conectar Canales",
            tabDestino: "apis"
          });
        }
        return lista;
      }, [empresa, catalogo.length, usaCanalesOIntegracion, apisForm]);

      const catalogoFiltrado = useMemo(() => {
        const q = busquedaCat.trim().toLowerCase();
        if (!q) return catalogo;
        return catalogo.filter((p) =>
          (p.nombre || "").toLowerCase().includes(q) ||
          (p.codigo || "").toLowerCase().includes(q) ||
          (p.proveedor || "").toLowerCase().includes(q)
        );
      }, [catalogo, busquedaCat]);

      if (!empresa) {
        return (
          <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
            <p className="text-xs font-bold text-slate-500">Iniciando espacio de trabajo...</p>
          </div>
        );
      }

      const tema = PALETAS[empresa.paleta || "ejecutivo"] || PALETAS.ejecutivo;
      const equipo = Array.isArray(empresa.equipo) ? empresa.equipo : [];

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-6 pb-20 space-y-5">
          {/* CABECERA LIMPIA DE LA EMPRESA (SIN REFERENCIA A SWITCHES NI MÓDULOS INTERNOS) */}
          <div className={`corp-card rounded-2xl p-6 sm:p-7 border-t-4 ${tema.border} flex flex-col md:flex-row md:items-center justify-between gap-4`}>
            <div className="flex items-center gap-4">
              {empresa.logoBase64 && (
                <div className="w-24 h-16 rounded-xl border border-slate-200 bg-white flex items-center justify-center p-1.5 shrink-0">
                  <img src={empresa.logoBase64} alt={empresa.nombre} className="max-h-full max-w-full object-contain" />
                </div>
              )}
              <div>
                <div className="flex flex-wrap items-center gap-2 mb-1">
                  <span className={`text-[11px] font-bold px-3 py-0.5 rounded-full ${tema.tag}`}>
                    RUT {empresa.rut}
                  </span>
                  <span className="bg-emerald-50 text-emerald-700 text-[11px] font-bold px-3 py-0.5 rounded-full">
                    En Línea
                  </span>
                </div>
                <h1 className="text-2xl font-extrabold text-slate-900">{empresa.nombre}</h1>
                <p className="text-xs text-slate-500 mt-0.5">{empresa.rubro || "Gestión Empresarial Centralizada"}</p>
              </div>
            </div>

            <button onClick={cerrarSesion} className={`text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer shrink-0 ${tema.btn}`}>
              Cerrar Sesión
            </button>
          </div>

          {/* AVISOS GUIADOS PARA CONFIGURAR APIS Y CATÁLOGO */}
          {alertasPendientes.length > 0 && (
            <div className="corp-card rounded-2xl p-5 border-amber-300 bg-amber-50/30 space-y-2.5">
              <span className="text-xs font-extrabold uppercase tracking-wider text-amber-900 block">
                Pasos recomendados para completar tu sincronización
              </span>
              <div className="space-y-2">
                {alertasPendientes.map((al, idx) => (
                  <div key={idx} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-white/80 p-3 rounded-xl border border-amber-200/70">
                    <span className="text-xs font-semibold text-slate-700">{al.texto}</span>
                    <button
                      onClick={() => setTab(al.tabDestino)}
                      className={`text-xs font-bold px-3.5 py-1.5 rounded-lg cursor-pointer shrink-0 ${tema.btn}`}
                    >
                      {al.accion}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* NAVEGACIÓN NATURAL DEL CLIENTE */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 bg-white p-1.5 rounded-2xl border border-slate-200">
            <button onClick={() => setTab("inicio")} className={`py-2.5 px-3 rounded-xl text-xs font-bold cursor-pointer ${tab === "inicio" ? tema.btn : "text-slate-600 hover:bg-slate-100"}`}>
              Operación Principal
            </button>
            <button onClick={() => setTab("catalogo")} className={`py-2.5 px-3 rounded-xl text-xs font-bold cursor-pointer ${tab === "catalogo" ? tema.btn : "text-slate-600 hover:bg-slate-100"}`}>
              Catálogo ({catalogo.length})
            </button>
            <button onClick={() => setTab("apis")} className={`py-2.5 px-3 rounded-xl text-xs font-bold cursor-pointer ${tab === "apis" ? tema.btn : "text-slate-600 hover:bg-slate-100"}`}>
              Conexiones API & SII
            </button>
            <button onClick={() => setTab("equipo")} className={`py-2.5 px-3 rounded-xl text-xs font-bold cursor-pointer ${tab === "equipo" ? tema.btn : "text-slate-600 hover:bg-slate-100"}`}>
              Equipo ({equipo.length})
            </button>
          </div>

          {/* VISTA 1: OPERACIÓN PRINCIPAL */}
          {tab === "inicio" && (
            <div className="space-y-4">
              {espaciosOperativos.length === 0 ? (
                <div className="corp-card rounded-2xl p-10 text-center space-y-2">
                  <h2 className="text-base font-extrabold text-slate-900">Tu entorno está siendo preparado</h2>
                  <p className="text-xs text-slate-500">Mientras tanto, puedes cargar tu catálogo de productos o configurar tus llaves API en las pestañas superiores.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {espaciosOperativos.map((esp) => (
                    <div
                      key={esp.id}
                      onClick={() => (window.location.href = esp.url)}
                      className="corp-card rounded-2xl p-6 hover:border-slate-400 transition cursor-pointer flex flex-col justify-between gap-5"
                    >
                      <div>
                        <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-md inline-block mb-2 ${tema.tag}`}>
                          {esp.area}
                        </span>
                        <h2 className="text-lg font-extrabold text-slate-900">{esp.titulo}</h2>
                        <p className="text-xs text-slate-500 mt-1.5 leading-relaxed">{esp.desc}</p>
                      </div>
                      <div className="text-xs font-bold text-slate-900 pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span>Ingresar</span>
                        <span>→</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* VISTA 2: CATÁLOGO MAESTRO (EXCEL Y MANUAL) */}
          {tab === "catalogo" && (
            <div className="corp-card rounded-2xl p-6 space-y-5">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h2 className="text-lg font-extrabold text-slate-900">Catálogo de Productos</h2>
                  <p className="text-xs text-slate-500">Agrega productos uno a uno manualmente o importa un archivo Excel (.xlsx) completo.</p>
                </div>
                <label className={`text-xs font-bold px-5 py-3 rounded-xl cursor-pointer text-center shrink-0 ${tema.btn}`}>
                  {importando ? "Importando..." : "Importar Excel (.xlsx)"}
                  <input type="file" accept=".xlsx,.xls,.csv" onChange={subirExcel} disabled={importando} className="hidden" />
                </label>
              </div>

              <form onSubmit={agregarProductoManual} className="grid grid-cols-1 sm:grid-cols-4 gap-2.5 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <input
                  type="text"
                  value={manualSku}
                  onChange={(e) => setManualSku(e.target.value)}
                  placeholder="Código / SKU"
                  className="bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none"
                />
                <input
                  type="text"
                  value={manualNombre}
                  onChange={(e) => setManualNombre(e.target.value)}
                  placeholder="Nombre del producto *"
                  className="bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none"
                  required
                />
                <input
                  type="text"
                  value={manualProveedor}
                  onChange={(e) => setManualProveedor(e.target.value)}
                  placeholder="Proveedor / Marca"
                  className="bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none"
                />
                <button type="submit" className={`font-bold py-2.5 px-4 rounded-xl text-xs cursor-pointer ${tema.btn}`}>
                  + Agregar Manual
                </button>
              </form>

              <input
                type="text"
                value={busquedaCat}
                onChange={(e) => setBusquedaCat(e.target.value)}
                placeholder="Buscar producto por SKU, nombre o proveedor..."
                className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold outline-none"
              />

              <div className="max-h-80 overflow-y-auto divide-y divide-slate-200 border border-slate-200 rounded-xl">
                {catalogoFiltrado.length === 0 ? (
                  <p className="p-8 text-center text-xs text-slate-500">Aún no hay productos cargados.</p>
                ) : (
                  catalogoFiltrado.slice(0, 150).map((p) => (
                    <div key={p.id} className="px-4 py-2.5 text-xs flex items-center justify-between gap-2">
                      <div>
                        <span className="font-bold text-slate-900">{p.codigo ? `[${p.codigo}] ` : ""}{p.nombre}</span>
                        {p.proveedor && <span className="text-slate-500 text-[11px] ml-2">({p.proveedor})</span>}
                      </div>
                      <button onClick={() => eliminarProducto(p.id)} className="text-slate-400 hover:text-rose-600 font-bold text-[11px] cursor-pointer">
                        Eliminar
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* VISTA 3: CONEXIONES API Y SII */}
          {tab === "apis" && (
            <form onSubmit={guardarApis} className="corp-card rounded-2xl p-6 space-y-5">
              <div>
                <h2 className="text-lg font-extrabold text-slate-900">Sincronización de Canales y Facturación SII</h2>
                <p className="text-xs text-slate-500">Ingresa las llaves API de las plataformas que utilizas. Toca <strong>?</strong> si necesitas ver dónde obtener cada clave.</p>
              </div>

              {ayudaTip && (
                <div className="bg-slate-900 text-white p-3.5 rounded-xl text-xs flex items-center justify-between gap-3">
                  <span>{AYUDA_APIS[ayudaTip]}</span>
                  <button type="button" onClick={() => setAyudaTip(null)} className="font-bold underline shrink-0 cursor-pointer">Cerrar</button>
                </div>
              )}

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-extrabold uppercase text-slate-800">SII / OpenFactura</h3>
                    <button type="button" onClick={() => setAyudaTip("sii")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                  </div>
                  <select value={apisForm.siiProveedor} onChange={(e) => setApisForm({ ...apisForm, siiProveedor: e.target.value })} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold">
                    <option>OpenFactura (Haulmer)</option>
                    <option>SimpleFactura</option>
                    <option>SII Directo (Certificado .PFX + CAF)</option>
                  </select>
                  <input type="password" value={apisForm.siiApiKey} onChange={(e) => setApisForm({ ...apisForm, siiApiKey: e.target.value })} placeholder="API Key OpenFactura / SII" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-extrabold uppercase text-slate-800">Mercado Libre Chile</h3>
                    <button type="button" onClick={() => setAyudaTip("meli")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                  </div>
                  <input type="text" value={apisForm.meliClientId} onChange={(e) => setApisForm({ ...apisForm, meliClientId: e.target.value })} placeholder="Client ID / App ID" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  <input type="password" value={apisForm.meliSecret} onChange={(e) => setApisForm({ ...apisForm, meliSecret: e.target.value })} placeholder="Client Secret" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-extrabold uppercase text-slate-800">Falabella Seller Center</h3>
                    <button type="button" onClick={() => setAyudaTip("falabella")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                  </div>
                  <input type="text" value={apisForm.falabellaUser} onChange={(e) => setApisForm({ ...apisForm, falabellaUser: e.target.value })} placeholder="Correo Seller Center" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  <input type="password" value={apisForm.falabellaApiKey} onChange={(e) => setApisForm({ ...apisForm, falabellaApiKey: e.target.value })} placeholder="API Key Falabella" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-extrabold uppercase text-slate-800">Lider / Walmart Marketplace</h3>
                    <button type="button" onClick={() => setAyudaTip("lider")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                  </div>
                  <input type="password" value={apisForm.liderApiKey} onChange={(e) => setApisForm({ ...apisForm, liderApiKey: e.target.value })} placeholder="Token / Secret Lider" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                </div>
              </div>

              <button type="submit" disabled={guardandoApis} className={`w-full font-bold py-3.5 rounded-xl text-xs cursor-pointer ${tema.btn}`}>
                {guardandoApis ? "Sincronizando..." : "Guardar y Sincronizar Conexiones"}
              </button>
            </form>
          )}

          {/* VISTA 4: EQUIPO */}
          {tab === "equipo" && (
            <div className="corp-card rounded-2xl p-6 space-y-5">
              <div>
                <h2 className="text-lg font-extrabold text-slate-900">Equipo y Responsables</h2>
                <p className="text-xs text-slate-500">Colaboradores registrados en tu organización.</p>
              </div>
              <form onSubmit={agregarMiembro} className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <input type="text" value={nuevoNombre} onChange={(e) => setNuevoNombre(e.target.value)} placeholder="Nombre del colaborador..." className="bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold outline-none" required />
                <select value={nuevoRol} onChange={(e) => setNuevoRol(e.target.value)} className="bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold outline-none">
                  {ROLES.map((r) => <option key={r} value={r}>{r}</option>)}
                </select>
                <button type="submit" className={`font-bold py-2.5 px-4 rounded-xl text-xs cursor-pointer ${tema.btn}`}>
                  Agregar Colaborador
                </button>
              </form>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {equipo.map((m) => (
                  <div key={m.id} className="bg-white border border-slate-200 rounded-xl p-4">
                    <p className="text-sm font-bold text-slate-900">{m.nombre}</p>
                    <span className="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded mt-1 inline-block">{m.rol}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<EmpresaPanelApp />);
  </script>
</body>
</html>
