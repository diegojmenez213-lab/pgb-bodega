    (function () {
      var RUT_PGB = "769497226";
      var limpiar = function (r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); };
      var rutInicial = limpiar(localStorage.getItem("nexus_empresa_rut"));
      if (!rutInicial) {
        window.location.replace("index.html");
      } else if (rutInicial === RUT_PGB) {
        window.location.replace("pgb-operacion.html");
      }

      window.addEventListener("pageshow", function (ev) {
        var rutActual = limpiar(localStorage.getItem("nexus_empresa_rut"));
        if (!rutActual) {
          window.location.replace("index.html");
        } else if (rutActual === RUT_PGB) {
          window.location.replace("pgb-operacion.html");
        } else if (ev.persisted && rutActual !== rutInicial) {
          window.location.reload();
        }
      });

      window.addEventListener("storage", function (ev) {
        if (ev.key === "nexus_empresa_rut") {
          var rutNuevo = limpiar(ev.newValue);
          if (!rutNuevo) window.location.replace("index.html");
          else if (rutNuevo !== rutInicial) window.location.reload();
        }
      });
    })();
  </script>

    // CIFRADO SHA-256 PARA CLAVE DE SUPERVISOR
    const sha256Hex = async (texto) => {
      const str = String(texto || "").trim();
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(str);
        const hashBuf = await window.crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuf)).map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      return str;
    };

    const verificarClaveSupervisor = async (pinIngresado, empObj) => {
      const limpio = String(pinIngresado || "").trim();
      if (!limpio) return false;
      if (empObj?.pinSupervisorHash) {
        const h = await sha256Hex(limpio);
        return h === empObj.pinSupervisorHash;

    // VALIDADOR OFICIAL DE RUT CHILENO (MÓDULO 11)
    const validarRutChileno = (rut) => {
      const limpio = limpiarRut(rut);
      if (limpio.length < 7 || limpio.length > 9) return false;
      const cuerpo = limpio.slice(0, -1);
      const dv = limpio.slice(-1);
      if (!/^\d+$/.test(cuerpo)) return false;
      let suma = 0;
      let multiplo = 2;
      for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo.charAt(i), 10) * multiplo;
        multiplo = multiplo < 7 ? multiplo + 1 : 2;
      }
      const dvEsperado = 11 - (suma % 11);
      const dvCalc = dvEsperado === 11 ? "0" : dvEsperado === 10 ? "K" : String(dvEsperado);
      return dv === dvCalc;
    };

      const lista = (Array.isArray(horariosArr) ? horariosArr : ["14:00"]).filter(Boolean).sort();

      for (let i = 0; i < lista.length; i++) {
        const [h, m] = lista[i].split(":").map(Number);
        const minsLimite = h * 60 + m - 60;
        if (minsLimite > minsAhora) {
          elegido = lista[i];
          break;
        }
      }

      if (!elegido) {
        elegido = lista[0];
        esManana = true;
      }

      const [eh, em] = elegido.split(":").map(Number);
      const totalMinsLimite = Math.max(0, eh * 60 + em - 60);
      const lh = String(Math.floor(totalMinsLimite / 60)).padStart(2, "0");
      const lm = String(totalMinsLimite % 60).padStart(2, "0");

      const minsHastaLimite = esManana ? (24 * 60 - minsAhora) + totalMinsLimite : (totalMinsLimite - minsAhora);
      const limiteTs = ahoraTs + Math.max(1, minsHastaLimite) * 60000;

      return {
        salida: esManana ? `Mañana ${elegido}` : elegido,
        limite: esManana ? `Mañana ${lh}:${lm}` : `${lh}:${lm}`,

Qué queda resuelto en este reemplazo:
* **Escudo anti-doble clic en todas las transacciones (`txLockRef` + `procesandoTx`):** Bloquea de forma síncrona e inmediata los botones de **Emitir Venta**, **Emitir Boleta 39**, **Refacturación NC 61 → Factura 33**, **Confirmar Devolución**, **Marcar Lote Impreso**, **Edición de Producto**, **Cierre de Día** y **Autorización por PIN** mientras Firestore escribe, evitando folios repetidos y descuentos dobles en celular o con red lenta.
* **Retroceso seguro de folios CAF:** Al eliminar una simulación, solo descuenta `1` al contador (`boleta39Actual` / `factura33Actual`) si el documento borrado corresponde exactamente al **último folio emitido** de ese tipo; borrar una venta intermedia ya nunca genera folios duplicados.
* **Clave de Supervisor obligatoria en NC 61 y Devoluciones:** Anular una Boleta 39 para pasarla a Factura 33 (NC 61) y procesar cualquier Devolución ahora exigen **Clave de Supervisor (SHA-256)** dentro del mismo modal y dejan registro automático en **Auditoría**.
* **Validación estricta de PIN mínimo 4 caracteres:** Si intentas cambiar la clave a menos de 4 caracteres, detiene el guardado y muestra una alerta clara en vez de ignorarlo en silencio.
* **Escrituras masivas en bloques de 450:** Tanto **Cerrar Día / Caja** como **Marcar Lote como Impreso** dividen las operaciones en lotes de 450 documentos para soportar jornadas de alto volumen (ej. CyberDay) sin topar con el límite de 500 escrituras de Firestore.
* **Filtro anti-duplicados por SKU y Nombre en Excel:** `subirExcelCatalogo` verifica coincidencias tanto por **código SKU** como por **nombre** antes de importar e informa cuántos duplicados se omitieron.

    const sha256Hex = async (texto) => {
      const str = String(texto || "").trim();
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(str);
        const hashBuf = await window.crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuf)).map((b) => b.toString(16).padStart(2, "0")).join("");

      return str;
    };

      const cuerpo = limpio.slice(0, -1);
      const dv = limpio.slice(-1);
      if (!/^\d+$/.test(cuerpo)) return false;
      let suma = 0;
      let multiplo = 2;
      for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo.charAt(i), 10) * multiplo;
        multiplo = multiplo < 7 ? multiplo + 1 : 2;
      }
      const dvEsperado = 11 - (suma % 11);

      // ================= FLUJO 1: VENCE PLAZO (1H ANTES DESPACHO) -> EMITE BOLETA 39 =================

      // ================= FLUJO 2: CLIENTE CORRIGE RUT -> NC 61 (CON CLAVE SUPERVISOR) + FACTURA 33 =================
      const ejecutarCorreccionRutYRefactura = async (e) => {

      // ================= FLUJO DEVOLUCIONES Y CUARENTENA (CLAVE SUPERVISOR + ANTI-DOBLE CLIC + STOCK ATÓMICO) =================
      const procesarDevolucionOrden = async (e) => {

        await ejecutarConBloqueo(async () => {
          const ok = await verificarClaveSupervisor(pinDevolucion, empresa);

          if (estadoFisicoDevolucion === "intacto") {

          setNotaDevolucion("");
          setPinDevolucion("");
          alert(
            estadoFisicoDevolucion === "intacto"
              ? `Devolución procesada: ${orden.cantidad}x ${orden.productoNombre} reingresado al stock vendible.`
              : `Devolución apartada en Cuarentena: ${orden.cantidad}x ${orden.productoNombre} quedó en Revisión Técnica.`

      // ================= EDICIÓN PROTEGIDA DE PRODUCTOS CON CLAVE DE SUPERVISOR =================
      const abrirEditorProducto = (prod) => {

      const guardarEdicionProductoAutorizada = async (e) => {

      const eliminarProductoCatalogo = (prod) => {
        pedirAutorizacionSupervisor(
          "Eliminar Producto del Catálogo",
          `Vas a eliminar "${prod.nombre}" (Stock actual: ${Number(prod.stockOnline ?? 0)} unds).`,

      // ELIMINAR SIMULACIÓN: RESTAURA STOCK ATÓMICAMENTE Y RETROCEDE FOLIO CAF SOLO SI ERA EL ÚLTIMO EMITIDO
      const eliminarSimulacion = (orden) => {
        if (orden.esSimulacion === false) {
          return alert("Documento real emitido al SII: no se puede eliminar por normativa tributaria.");
        }
        pedirAutorizacionSupervisor(
          "Eliminar Simulación",
          `Eliminar ${orden.tipoDte === 33 ? "Factura 33" : orden.tipoDte === 39 ? "Boleta 39" : "Orden"} #${orden.folioSii || "S/N"} de ${orden.comprador} y restaurar stock.`,
          async () => {
            const batch = db.batch();
            batch.delete(empRef().collection("ecommerce_ordenes").doc(orden.id));

            const debeRestaurarStock =
              !orden.refBoletaAnulada &&
              orden.devolucionInfo?.estadoFisico !== "intacto" &&
              orden.productoId &&
              orden.productoId !== "manual" &&
              catalogo.some((p) => p.id === orden.productoId);

            if (debeRestaurarStock) {
              batch.update(empRef().collection("catalogo").doc(orden.productoId), {
                stockOnline: FieldValue.increment(Math.max(1, Number(orden.cantidad || 1)))
              });
            }

            if (orden.timbradoSii) {
              const esFactura33 = orden.tipoDte === 33;
              const folioOrden = Number(orden.folioSii || 0);
              const esUltimoFolioFactura = esFactura33 && folioOrden > 0 && folioOrden === Number(cafConfig.factura33Actual || 1) - 1;
              const esUltimoFolioBoleta = !esFactura33 && folioOrden > 0 && folioOrden === Number(cafConfig.boleta39Actual || 1) - 1;

              if (esUltimoFolioFactura || esUltimoFolioBoleta) {
                batch.set(
                  empRef(),
                  {
                    cafConfig: {
                      ...cafConfig,
                      factura33Actual: esUltimoFolioFactura ? Math.max(1, cafConfig.factura33Actual - 1) : cafConfig.factura33Actual,
                      boleta39Actual: esUltimoFolioBoleta ? Math.max(1, cafConfig.boleta39Actual - 1) : cafConfig.boleta39Actual
                    }
                  },
                  { merge: true }
                );
              }
            }
            await batch.commit();
          }
        );
      };

      // ================= CONSEJERO ECONÓMICO & PEDIDO SUGERIDO GENERAL =================
      const analisisEconomicoInventario = useMemo(() => {
        const ventasPorId = {};
        const ventasPorNombre = {};
        let minTs = Date.now();

        ordenes.filter((o) => o.timbradoSii && !o.anuladaPorNc61 && !o.devolucionInfo).forEach((o) => {
          const ts = Number(o.timestamp || Date.now());
          if (ts < minTs) minTs = ts;
          const cant = Number(o.cantidad || 1);
          const monto = Number(o.totalClp || 0);
          if (o.productoId && o.productoId !== "manual") {
            if (!ventasPorId[o.productoId]) ventasPorId[o.productoId] = { unds: 0, clp: 0 };
            ventasPorId[o.productoId].unds += cant;
            ventasPorId[o.productoId].clp += monto;
          }
          const nomKey = String(o.productoNombre || "").trim().toUpperCase();
          if (nomKey) {
            if (!ventasPorNombre[nomKey]) ventasPorNombre[nomKey] = { unds: 0, clp: 0 };
            ventasPorNombre[nomKey].unds += cant;
            ventasPorNombre[nomKey].clp += monto;
          }
        });

        const diasTranscurridos = Math.max(1, Math.min(30, Math.ceil((Date.now() - minTs) / (1000 * 60 * 60 * 24))));
        const urgentes = [];
        const preventivos = [];
        const sobrestock = [];

        catalogo.forEach((p) => {
          if (filtroProvPedido !== "TODOS" && (p.proveedor || "SIN PROVEEDOR") !== filtroProvPedido) return;
          const stockActual = Number(p.stockOnline ?? 0);
          const nomKey = String(p.nombre || "").trim().toUpperCase();
          const stats = ventasPorId[p.id] || ventasPorNombre[nomKey] || { unds: 0, clp: 0 };
          const vendidos = stats.unds;
          const ingresos = stats.clp;

          const ritmoSemanal = vendidos > 0 ? Math.max(vendidos, Math.ceil((vendidos / diasTranscurridos) * 7)) : 0;
          const coberturaObjetivo = ritmoSemanal * 2;

          if (vendidos > 0 && (stockActual <= 0 || stockActual < ritmoSemanal)) {
            const baseSugerida = Math.max(4, coberturaObjetivo - Math.max(0, stockActual));
            const pedirFinal = cantidadesEditadasPedido[p.id] !== undefined ? Math.max(0, Number(cantidadesEditadasPedido[p.id])) : baseSugerida;
            urgentes.push({
              id: p.id,
              codigo: p.codigo || "",
              nombre: p.nombre,
              proveedor: p.proveedor || "General",
              stockActual,
              vendidos,
              ingresos,
              pedir: pedirFinal,
              diagnostico: stockActual <= 0
                ? `Quiebre total con ${vendidos} unds vendidas. Reposición inmediata para no frenar ingresos.`
                : `Alta rotación (${vendidos} vendidas) y solo quedan ${stockActual} unds. Cubrir 14 días.`
            });
          } else if (vendidos > 0 && stockActual < coberturaObjetivo + 3) {
            const baseSugerida = Math.max(2, coberturaObjetivo + 3 - stockActual);
            const pedirFinal = cantidadesEditadasPedido[p.id] !== undefined ? Math.max(0, Number(cantidadesEditadasPedido[p.id])) : baseSugerida;
            preventivos.push({
              id: p.id,
              codigo: p.codigo || "",
              nombre: p.nombre,
              proveedor: p.proveedor || "General",
              stockActual,
              vendidos,
              ingresos,
              pedir: pedirFinal,
              diagnostico: `Rotación saludable (${vendidos} vendidas). Refuerzo preventivo para margen de seguridad.`
            });
          } else if (vendidos === 0 && stockActual >= 5) {
            sobrestock.push({
              id: p.id,
              codigo: p.codigo || "",
              nombre: p.nombre,
              proveedor: p.proveedor || "General",
              stockActual,
              vendidos: 0,
              ingresos: 0,
              pedir: 0,
              diagnostico: `Capital inmovilizado (${stockActual} unds sin rotación). No comprar; liquidar o armar combo promocional.`
            });
          }
        });

        urgentes.sort((a, b) => b.vendidos - a.vendidos);
        preventivos.sort((a, b) => b.vendidos - a.vendidos);
        sobrestock.sort((a, b) => b.stockActual - a.stockActual);

        const listaCompraConsolidada = [...urgentes, ...preventivos].filter((it) => !excluidosPedido[it.id] && it.pedir > 0);
        return { urgentes, preventivos, sobrestock, listaCompraConsolidada };
      }, [catalogo, ordenes, filtroProvPedido, cantidadesEditadasPedido, excluidosPedido]);

      const proveedoresCatalogo = useMemo(() => {

      const imprimirPedidoSugeridoPdf = () => {

      const copiarPedidoWhatsApp = () => {

        if (items.length === 0) return alert("No hay líneas seleccionadas para copiar.");
        const lineas = items.map((it, idx) => `${idx + 1}. ${it.codigo ? `[${it.codigo}] ` : ""}${it.nombre} — *${it.pedir} unds*`);
        const texto =
          `*PEDIDO DE REPOSICIÓN — ${empresa?.nombre || "EMPRESA"}*\n` +

      // ================= JORNADA ACTIVA, RUT INVÁLIDOS Y ARCHIVO HISTÓRICO INFINITO =================
      const ordenesRutInvalidoPendientes = useMemo(() => {
        return ordenes.filter((o) => o.estadoRut === "invalido_esperando");
      }, [ordenes]);

      const ordenesJornadaActiva = useMemo(() => {

      const ordenesParaArchivarAlCierre = useMemo(() => {
        return ordenes.filter((o) => !o.diaCerrado && o.timbradoSii).sort(ordenarPorFolioAsc);
      }, [ordenes]);

      const facturasPorImprimirHoy = useMemo(() => {

      }, [facturasPorImprimirHoy]);

      const resumenCierreActual = useMemo(() => {
        const total = ordenesJornadaActiva.reduce((acc, o) => acc + Number(o.totalClp || 0), 0);
        const boletas = ordenesJornadaActiva.filter((o) => o.tipoDte !== 33).length;
        const facturas = ordenesJornadaActiva.filter((o) => o.tipoDte === 33).length;
        const anuladas = ordenesParaArchivarAlCierre.filter((o) => o.anuladaPorNc61).length;
        const folioDesde = ordenesParaArchivarAlCierre[0]?.folioSii || "-";
        const folioHasta = ordenesParaArchivarAlCierre[ordenesParaArchivarAlCierre.length - 1]?.folioSii || "-";
        return { total, boletas, facturas, anuladas, folioDesde, folioHasta, docs: ordenesParaArchivarAlCierre.length };
      }, [ordenesJornadaActiva, ordenesParaArchivarAlCierre]);

      const archivoHistoricoFiltrado = useMemo(() => {
        const q = busquedaArchivo.trim().toLowerCase();
        return ordenes

      const subirExcelCatalogo = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.value = "";
        let buf;
        try {
          buf = await file.arrayBuffer();
        } catch (err) {
          return alert("No se pudo leer el archivo seleccionado: " + err.message);
        }

        pedirAutorizacionSupervisor(
          "Importar Catálogo Masivo desde Excel",
          `Archivo: ${file.name}. Se agregarán productos nuevos (filtrando SKU y nombres duplicados) con stock inicial 0.`,
          async () => {
            setImportandoExcel(true);
            try {
              const wb = XLSX.read(buf, { type: "array" });
              const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
              const normKey = (k) => String(k || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
              const normVal = (v) => String(v || "").trim().replace(/\s+/g, " ").toUpperCase();
              const existentesNombre = new Set(catalogo.map((p) => normVal(p.nombre)));
              const existentesSku = new Set(catalogo.filter((p) => p.codigo).map((p) => normVal(p.codigo)));
              const nuevos = [];
              let omitidos = 0;

              rows.forEach((row) => {
                const keys = Object.keys(row);
                let cod = "", nom = "", prov = "";
                keys.forEach((k) => {
                  const kn = normKey(k);
                  if (!cod && (kn.includes("cod") || kn.includes("sku") || kn === "id")) cod = normVal(row[k]);
                  else if (!nom && (kn.includes("desc") || kn.includes("prod") || kn.includes("nomb") || kn.includes("art"))) nom = normVal(row[k]);
                  else if (!prov && (kn.includes("prov") || kn.includes("marc"))) prov = normVal(row[k]);
                });
                if (!nom && keys.length >= 2) {
                  cod = normVal(row[keys[0]]);
                  nom = normVal(row[keys[1]]);
                  if (keys.length >= 3) prov = normVal(row[keys[2]]);
                } else if (!nom && keys.length === 1) {
                  nom = normVal(row[keys[0]]);
                }

                if (nom) {
                  const dupNombre = existentesNombre.has(nom);
                  const dupSku = Boolean(cod) && existentesSku.has(cod);
                  if (!dupNombre && !dupSku) {
                    existentesNombre.add(nom);
                    if (cod) existentesSku.add(cod);
                    nuevos.push({ codigo: cod, nombre: nom, proveedor: prov, stockOnline: 0 });
                  } else {
                    omitidos++;
                  }
                }
              });

              const col = empRef().collection("catalogo");
              for (let i = 0; i < nuevos.length; i += 450) {
                const batch = db.batch();
                nuevos.slice(i, i + 450).forEach((item) => batch.set(col.doc(), item));
                await batch.commit();
              }
              alert(
                `Catálogo actualizado: ${nuevos.length} producto(s) nuevos agregados con stock 0.` +
                (omitidos > 0 ? `\n(${omitidos} fila(s) omitidas por SKU o nombre repetido).` : "")
              );
            } catch (err) {
              alert("Error al leer Excel: " + err.message);
            }
            setImportandoExcel(false);
          }
        );
      };
