<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>NEXUS ERP • Control de Inventario y Toma Física</title>
  <script>
    (function () {
      var limpiar = function (r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); };
      var rutInicial = limpiar(localStorage.getItem("nexus_empresa_rut"));
      if (!rutInicial) window.location.replace("index.html");
      window.addEventListener("pageshow", function (ev) {
        var rutActual = limpiar(localStorage.getItem("nexus_empresa_rut"));
        if (!rutActual) window.location.replace("index.html");
        else if (ev.persisted && rutActual !== rutInicial) window.location.reload();
      });
      window.addEventListener("storage", function (ev) {
        if (ev.key === "nexus_empresa_rut") {
          var rutNuevo = limpiar(ev.newValue);
          if (!rutNuevo) window.location.replace("index.html");
          else if (rutNuevo !== rutInicial) window.location.reload();
        }
      });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @media print { .no-print { display: none !important; } body { background: white !important; color: black !important; } }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();

    const TEMAS = {
      claro_retail: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-blue-700 hover:bg-blue-800 text-white", sec: "bg-slate-100 text-slate-800", tag: "bg-blue-50 text-blue-800", top: "border-blue-700" },
      claro_ejecutivo: { page: "bg-slate-100 text-slate-900", card: "bg-white border border-slate-300 shadow-sm", main: "text-slate-900", sub: "text-slate-600", input: "bg-white border border-slate-300 text-slate-900", btn: "bg-slate-900 hover:bg-slate-800 text-white", sec: "bg-slate-200 text-slate-800", tag: "bg-slate-200 text-slate-800", top: "border-slate-900" },
      oscuro_obsidian: { page: "bg-slate-950 text-slate-100", card: "bg-slate-900 border border-slate-800 shadow-lg", main: "text-white", sub: "text-slate-400", input: "bg-slate-950 border border-slate-700 text-white", btn: "bg-indigo-600 hover:bg-indigo-500 text-white", sec: "bg-slate-800 text-slate-200", tag: "bg-indigo-950 text-indigo-300", top: "border-indigo-500" },
      claro_esmeralda: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-emerald-700 hover:bg-emerald-800 text-white", sec: "bg-slate-100 text-slate-800", tag: "bg-emerald-50 text-emerald-800", top: "border-emerald-700" }
    };

    function ControlInventarioApp() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut") || ""));
      const [empresa, setEmpresa] = useState(null);
      const [productos, setProductos] = useState([]);
      const [conteos, setConteos] = useState({});
      const [filtroProveedor, setFiltroProveedor] = useState("TODOS");
      const [busqueda, setBusqueda] = useState("");
      const [guardando, setGuardando] = useState(false);

      const esPgb = rutActivo === RUT_PGB;

      useEffect(() => {
        if (!rutActivo) {
          window.location.replace("index.html");
          return;
        }
        auth.signInAnonymously().catch(() => {});
        const empRef = db.collection("saas_empresas").doc(rutActivo);

        const u1 = empRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = { id: doc.id, ...doc.data() };
            const m = data.modulosActivos || {};
            if (!esPgb && !m.m5_inv_general && !m.m6_conteo_ciclico) {
              window.location.replace("empresa-panel.html");
              return;
            }
            setEmpresa(data);
          } else if (esPgb) {
            setEmpresa({ nombre: "PGB DISTRIBUTION CHILE SPA", rut: "76.949.722-6", temaVisual: "claro_ejecutivo" });
          } else {
            window.location.replace("index.html");
          }
        });

        const colCat = esPgb ? db.collection("catalogo_productos") : empRef.collection("catalogo");
        const u2 = colCat.onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, stockOnline: 0, ...d.data() }));
          lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
          setProductos(lista);
        });

        return () => { u1(); u2(); };
      }, [rutActivo, esPgb]);

      const proveedores = useMemo(() => {
        const set = new Set(productos.map((p) => p.proveedor).filter(Boolean));
        return ["TODOS", ...Array.from(set).sort()];
      }, [productos]);

      const filtrados = useMemo(() => {
        const q = busqueda.trim().toLowerCase();
        return productos.filter((p) => {
          if (filtroProveedor !== "TODOS" && p.proveedor !== filtroProveedor) return false;
          if (!q) return true;
          return (p.nombre || "").toLowerCase().includes(q) || (p.codigo || "").toLowerCase().includes(q);
        });
      }, [productos, filtroProveedor, busqueda]);

      const aplicarConteoAlStock = async () => {
        const ids = Object.keys(conteos).filter((k) => conteos[k] !== "" && conteos[k] !== undefined);
        if (ids.length === 0) return alert("Ingresa al menos una cantidad contada.");
        setGuardando(true);
        try {
          const colCat = esPgb ? db.collection("catalogo_productos") : db.collection("saas_empresas").doc(rutActivo).collection("catalogo");
          const batch = db.batch();
          ids.forEach((id) => {
            batch.update(colCat.doc(id), { stockOnline: Math.max(0, Number(conteos[id])) });
          });
          await batch.commit();
          setConteos({});
          alert(`Inventario actualizado para ${ids.length} producto(s).`);
        } catch (err) {
          alert(err.message);
        }
        setGuardando(false);
      };

      if (!empresa) return <div className="min-h-screen flex items-center justify-center text-xs font-bold">Cargando inventario...</div>;
      const T = TEMAS[empresa.temaVisual || "claro_retail"] || TEMAS.claro_retail;
      const urlVolver = esPgb ? "pgb-operacion.html" : "empresa-panel.html";

      return (
        <div className={`min-h-screen pb-24 ${T.page}`}>
          <div className="max-w-5xl mx-auto px-4 pt-5 space-y-4">
            <div className={`${T.card} rounded-2xl p-5 border-t-4 ${T.top} flex flex-col sm:flex-row sm:items-center justify-between gap-3 no-print`}>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <button onClick={() => window.location.replace(urlVolver)} className={`text-xs font-bold px-3 py-1 rounded-lg cursor-pointer ${T.btn}`}>
                    Volver
                  </button>
                  <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${T.tag}`}>{empresa.nombre}</span>
                </div>
                <h1 className={`text-xl font-extrabold ${T.main}`}>Control de Inventario y Toma Física</h1>
              </div>

              <div className="flex gap-2">
                <button onClick={() => window.print()} className={`text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer ${T.sec}`}>
                  Imprimir Planilla PDF
                </button>
                <button onClick={aplicarConteoAlStock} disabled={guardando} className={`text-xs font-extrabold px-4 py-2.5 rounded-xl cursor-pointer ${T.btn}`}>
                  {guardando ? "Aplicando..." : "Guardar Conteo Físico"}
                </button>
              </div>
            </div>

            <div className={`${T.card} rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-3 gap-3 no-print`}>
              <input
                type="text"
                value={busqueda}
                onChange={(e) => setBusqueda(e.target.value)}
                placeholder="Buscar SKU o producto..."
                className={`sm:col-span-2 rounded-xl px-4 py-2 text-xs font-semibold outline-none ${T.input}`}
              />
              <select value={filtroProveedor} onChange={(e) => setFiltroProveedor(e.target.value)} className={`rounded-xl px-3 py-2 text-xs font-bold ${T.input}`}>
                {proveedores.map((pr) => <option key={pr} value={pr}>{pr === "TODOS" ? "Todos los proveedores" : pr}</option>)}
              </select>
            </div>

            <div className={`${T.card} rounded-2xl p-5`}>
              <div className="divide-y divide-slate-200/40">
                {filtrados.length === 0 ? (
                  <p className={`text-xs text-center py-8 ${T.sub}`}>No hay productos registrados en el catálogo.</p>
                ) : (
                  filtrados.map((p) => (
                    <div key={p.id} className="py-3 flex items-center justify-between gap-3 text-xs">
                      <div className="min-w-0">
                        <span className={`font-extrabold block truncate ${T.main}`}>{p.codigo ? `[${p.codigo}] ` : ""}{p.nombre}</span>
                        <span className={`text-[11px] ${T.sub}`}>{p.proveedor || "General"} • Stock Sistema: <strong>{Number(p.stockOnline ?? 0)}</strong></span>
                      </div>
                      <div className="flex items-center gap-2 shrink-0">
                        <input
                          type="number"
                          min="0"
                          placeholder="Físico"
                          value={conteos[p.id] ?? ""}
                          onChange={(e) => setConteos({ ...conteos, [p.id]: e.target.value })}
                          className={`w-24 rounded-xl px-3 py-2 text-xs font-extrabold text-center ${T.input}`}
                        />
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ControlInventarioApp />);
  </script>
</body>
</html>
