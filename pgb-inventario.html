<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NEXUS ERP • Control de Inventario y Toma Física</title>
  <script>
    // GUARDIA DE SEGURIDAD INMEDIATO (BLOQUEA RETROCESO / BFCACHE ENTRE EMPRESAS)
    (function () {
      var limpiar = function (r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); };
      var rutInicial = limpiar(localStorage.getItem("nexus_empresa_rut"));
      if (!rutInicial) window.location.replace("index.html");
      window.addEventListener("pageshow", function (ev) {
        var rutActual = limpiar(localStorage.getItem("nexus_empresa_rut"));
        if (!rutActual) window.location.replace("index.html");
        else if (ev.persisted && rutActual !== rutInicial) window.location.reload();
      });
      window.addEventListener("storage", function (ev) {
        if (ev.key === "nexus_empresa_rut") {
          var rutNuevo = limpiar(ev.newValue);
          if (!rutNuevo) window.location.replace("index.html");
          else if (rutNuevo !== rutInicial) window.location.reload();
        }
      });
    })();
  </script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body class="min-h-screen">
  <div id="error-fallback" style="display:none; background:#fee2e2; color:#991b1b; padding:14px; font-size:12px; font-weight:700; border-bottom:2px solid #ef4444;"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const EQUIPO_PGB_CONTEO = ["Diego", "Edwin", "Nico", "Pedro", "Bedanli"];

    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();

    // FECHA Y HORA LOCAL OFICIAL DE CHILE (AMERICA/SANTIAGO)
    const fechaIsoChile = (ts = Date.now()) => {
      try {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Santiago",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(new Date(ts));
      } catch (e) {
        const d = new Date(ts);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
    };

    const fechaLegibleChile = (ts = Date.now()) => {
      try {
        return new Intl.DateTimeFormat("es-CL", {
          timeZone: "America/Santiago",
          dateStyle: "short",
          timeStyle: "short"
        }).format(new Date(ts));
      } catch (e) {
        return new Date(ts).toLocaleString("es-CL");
      }
    };

    // CIFRADO SHA-256 SINCRONIZADO CON EMPRESA-PANEL, COMPRAS-FINANZAS Y SUPERVISOR-BI
    const sha256Hex = async (texto) => {
      const str = String(texto || "").trim();
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(str);
        const hashBuf = await window.crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuf)).map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      return str;
    };

    const verificarClaveSupervisor = async (pinIngresado, empObj) => {
      const limpio = String(pinIngresado || "").trim();
      if (!limpio) return false;
      if (empObj?.pinSupervisorHash) {
        const h = await sha256Hex(limpio);
        return h === empObj.pinSupervisorHash;
      }
      const fallback = String(empObj?.pinSupervisor || "1234").trim();
      return limpio === fallback;
    };

    const TEMAS = {
      claro_retail: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", muted: "bg-slate-50 border border-slate-200", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-blue-700 hover:bg-blue-800 text-white", sec: "bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200", tag: "bg-blue-50 text-blue-800", top: "border-blue-700" },
      claro_ejecutivo: { page: "bg-slate-100 text-slate-900", card: "bg-white border border-slate-300 shadow-sm", muted: "bg-slate-100 border border-slate-200", main: "text-slate-900", sub: "text-slate-600", input: "bg-white border border-slate-300 text-slate-900", btn: "bg-slate-900 hover:bg-slate-800 text-white", sec: "bg-slate-200 text-slate-800", tag: "bg-slate-200 text-slate-800", top: "border-slate-900" },
      oscuro_obsidian: { page: "bg-slate-950 text-slate-100", card: "bg-slate-900 border border-slate-800 shadow-lg", muted: "bg-slate-950 border border-slate-800", main: "text-white", sub: "text-slate-400", input: "bg-slate-950 border border-slate-700 text-white", btn: "bg-indigo-600 hover:bg-indigo-500 text-white", sec: "bg-slate-800 text-slate-200 border border-slate-700", tag: "bg-indigo-950 text-indigo-300", top: "border-indigo-500" },
      claro_esmeralda: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", muted: "bg-emerald-50/40 border border-emerald-200", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-emerald-700 hover:bg-emerald-800 text-white", sec: "bg-slate-100 text-slate-800", tag: "bg-emerald-50 text-emerald-800", top: "border-emerald-700" }
    };

    function ControlInventarioApp() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut") || ""));
      const [empresa, setEmpresa] = useState(null);
      const [productos, setProductos] = useState([]);
      const [conteos, setConteos] = useState({});
      const [filtroProveedor, setFiltroProveedor] = useState("TODOS");
      const [busqueda, setBusqueda] = useState("");
      const [guardando, setGuardando] = useState(false);

      // Modal de autorización Supervisor (SHA-256) antes de sobrescribir stock
      const [modalPinAbierto, setModalPinAbierto] = useState(false);
      const [pinInput, setPinInput] = useState("");
      const [pinError, setPinError] = useState("");
      const [responsableConteo, setResponsableConteo] = useState("Diego");
      const [notaConteo, setNotaConteo] = useState("");

      const guardandoLockRef = useRef(false);
      const esPgb = rutActivo === RUT_PGB;

      useEffect(() => {
        if (!rutActivo) {
          window.location.replace("index.html");
          return;
        }
        auth.signInAnonymously().catch(() => {});
        const empRef = db.collection("saas_empresas").doc(rutActivo);

        const u1 = empRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = { id: doc.id, ...doc.data() };
            if (data.activa === false) {
              localStorage.removeItem("nexus_empresa_rut");
              window.location.replace("index.html");
              return;
            }
            const m = data.modulosActivos || {};
            if (!esPgb && !m.m5_inv_general && !m.m6_conteo_ciclico && !m.m7_auditoria_inv) {
              window.location.replace("empresa-panel.html");
              return;
            }
            setEmpresa(data);
          } else if (esPgb) {
            setEmpresa({ nombre: "PGB DISTRIBUTION CHILE SPA", rut: "76.949.722-6", temaVisual: "claro_ejecutivo" });
          } else {
            localStorage.removeItem("nexus_empresa_rut");
            window.location.replace("index.html");
          }
        });

        const colCat = esPgb ? db.collection("catalogo_productos") : empRef.collection("catalogo");
        const u2 = colCat.onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, stockOnline: 0, ...d.data() }));
          lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
          setProductos(lista);
        });

        return () => { u1(); u2(); };
      }, [rutActivo, esPgb]);

      const proveedores = useMemo(() => {
        const set = new Set(productos.map((p) => p.proveedor).filter(Boolean));
        return ["TODOS", ...Array.from(set).sort()];
      }, [productos]);

      const filtrados = useMemo(() => {
        const q = busqueda.trim().toLowerCase();
        return productos.filter((p) => {
          if (filtroProveedor !== "TODOS" && p.proveedor !== filtroProveedor) return false;
          if (!q) return true;
          return (p.nombre || "").toLowerCase().includes(q) || (p.codigo || "").toLowerCase().includes(q);
        });
      }, [productos, filtroProveedor, busqueda]);

      // Resumen en vivo de productos con conteo ingresado (solo productos vigentes en catálogo)
      const resumenContados = useMemo(() => {
        const mapaProd = new Map(productos.map((p) => [p.id, p]));
        const lista = [];
        let conDiferencia = 0;

        Object.entries(conteos).forEach(([id, valStr]) => {
          if (valStr === "" || valStr === undefined || valStr === null) return;
          const prod = mapaProd.get(id);
          if (!prod) return;
          const fisico = Math.max(0, parseInt(String(valStr), 10) || 0);
          const sistema = Number(prod.stockOnline ?? 0);
          const diff = fisico - sistema;
          if (diff !== 0) conDiferencia++;
          lista.push({ id, prod, sistema, fisico, diff });
        });

        return { lista, total: lista.length, conDiferencia };
      }, [conteos, productos]);

      const actualizarConteoInput = (id, rawVal) => {
        const soloDigitos = String(rawVal || "").replace(/[^0-9]/g, "");
        setConteos((prev) => {
          if (soloDigitos === "") {
            const copia = { ...prev };
            delete copia[id];
            return copia;
          }
          return { ...prev, [id]: soloDigitos };
        });
      };

      const abrirConfirmacionGuardar = () => {
        if (guardandoLockRef.current) return;
        if (resumenContados.total === 0) {
          return alert("Ingresa al menos una cantidad física contada antes de guardar.");
        }
        setPinInput("");
        setPinError("");
        setModalPinAbierto(true);
      };

      // GUARDADO ATÓMICO EN BLOQUES DE 450 + TRAZABILIDAD EN AUDITORÍA / HISTORIAL PGB
      const ejecutarGuardadoConPin = async (e) => {
        e.preventDefault();
        if (guardandoLockRef.current) return;

        const ok = await verificarClaveSupervisor(pinInput, empresa);
        if (!ok) {
          setPinError("Clave de Supervisor incorrecta.");
          return;
        }

        guardandoLockRef.current = true;
        setModalPinAbierto(false);
        setPinInput("");
        setPinError("");
        setGuardando(true);

        try {
          const ahora = Date.now();
          const fechaLegible = fechaLegibleChile(ahora);
          const empDocRef = db.collection("saas_empresas").doc(rutActivo);
          const colCat = esPgb ? db.collection("catalogo_productos") : empDocRef.collection("catalogo");

          const ops = [];
          resumenContados.lista.forEach((item) => {
            ops.push({
              type: "update",
              ref: colCat.doc(item.id),
              data: { stockOnline: item.fisico }
            });

            if (esPgb) {
              ops.push({
                type: "set",
                ref: db.collection("historial_inventario").doc(),
                data: {
                  producto: item.prod.codigo ? `[${item.prod.codigo}] ${item.prod.nombre}` : item.prod.nombre,
                  unidad: "Unidad",
                  factura: "TOMA-FISICA",
                  corregidoPor: responsableConteo || "Supervisor",
                  fechaHoraAjuste: fechaLegible,
                  contadoPor: responsableConteo || "Bodega",
                  fechaHoraConteo: fechaLegible,
                  detalle: `Toma Física: Sistema ${item.sistema} → Físico ${item.fisico} (Dif: ${item.diff >= 0 ? "+" : ""}${item.diff})${notaConteo.trim() ? ` • ${notaConteo.trim()}` : ""}`,
                  fechaHora: fechaLegible,
                  timestamp: ahora
                }
              });
            } else {
              ops.push({
                type: "set",
                ref: empDocRef.collection("auditoria_inventario").doc(),
                data: {
                  producto: item.prod.nombre,
                  detalle: `Toma Física autorizada • Stock: ${item.sistema} → ${item.fisico} unds (Dif: ${item.diff >= 0 ? "+" : ""}${item.diff})${notaConteo.trim() ? ` • Nota: ${notaConteo.trim()}` : ""}`,
                  fecha: fechaLegible,
                  timestamp: ahora
                }
              });
            }
          });

          const CHUNK = 450;
          for (let i = 0; i < ops.length; i += CHUNK) {
            const batch = db.batch();
            ops.slice(i, i + CHUNK).forEach((op) => {
              if (op.type === "update") batch.update(op.ref, op.data);
              else batch.set(op.ref, op.data);
            });
            await batch.commit();
          }

          setConteos({});
          setNotaConteo("");
          alert(`Inventario actualizado y auditado para ${resumenContados.total} producto(s) (${resumenContados.conDiferencia} con ajuste de diferencia).`);
        } catch (err) {
          alert("Error al guardar conteo físico: " + err.message);
        } finally {
          setGuardando(false);
          guardandoLockRef.current = false;
        }
      };

      if (!empresa) return <div className="min-h-screen flex items-center justify-center text-xs font-bold">Cargando inventario...</div>;
      const T = TEMAS[empresa.temaVisual || "claro_retail"] || TEMAS.claro_retail;
      const urlVolver = esPgb ? "pgb-operacion.html" : "empresa-panel.html";
      const tienePinPersonalizado = Boolean(empresa.pinSupervisorHash || empresa.pinSupervisor);

      return (
        <div className={`min-h-screen pb-24 ${T.page}`}>
          {/* PLANILLA EJECUTIVA PDF (SIEMPRE BLANCO Y NEGRO, SIN CORTAR NOMBRES NI INPUTS) */}
          <div className="print-only bg-white text-black p-6 text-xs">
            <div className="flex justify-between items-start gap-4 pb-4 border-b-2 border-slate-900">
              <div>
                {empresa.logoBase64 && (
                  <img src={empresa.logoBase64} alt={empresa.nombre} className="h-11 object-contain mb-2" />
                )}
                <p className="text-base font-extrabold uppercase">{(empresa.nombre || "EMPRESA").toUpperCase()}</p>
                <p className="text-[11px]">R.U.T.: {empresa.rut || ""}</p>
              </div>
              <div className="text-right">
                <p className="text-sm font-extrabold uppercase">PLANILLA DE TOMA DE INVENTARIO FÍSICO</p>
                <p className="text-[11px]">Fecha Emisión: {fechaIsoChile()}</p>
                <p className="text-[11px]">Filtro Proveedor: {filtroProveedor === "TODOS" ? "Todos los proveedores" : filtroProveedor}</p>
                <p className="text-[11px]">Total SKUs en Planilla: {filtrados.length}</p>
              </div>
            </div>

            <table className="w-full border-collapse border border-slate-400 text-[11px] mt-4">
              <thead>
                <tr className="bg-slate-100 border-b border-slate-400">
                  <th className="border-r border-slate-400 p-2 text-left w-24">SKU</th>
                  <th className="border-r border-slate-400 p-2 text-left">Producto / Descripción</th>
                  <th className="border-r border-slate-400 p-2 text-left w-32">Proveedor</th>
                  <th className="border-r border-slate-400 p-2 text-center w-20">Stock Sist.</th>
                  <th className="border-r border-slate-400 p-2 text-center w-24">Conteo Físico</th>
                  <th className="p-2 text-center w-20">Dif.</th>
                </tr>
              </thead>
              <tbody>
                {filtrados.map((p) => {
                  const sist = Number(p.stockOnline ?? 0);
                  const tieneVal = conteos[p.id] !== undefined && conteos[p.id] !== "";
                  const fis = tieneVal ? parseInt(conteos[p.id], 10) : null;
                  const diff = tieneVal ? fis - sist : null;
                  return (
                    <tr key={p.id} className="border-b border-slate-300">
                      <td className="border-r border-slate-400 p-2 font-mono">{p.codigo || "-"}</td>
                      <td className="border-r border-slate-400 p-2 font-semibold uppercase">{p.nombre}</td>
                      <td className="border-r border-slate-400 p-2">{p.proveedor || "General"}</td>
                      <td className="border-r border-slate-400 p-2 text-center">{sist}</td>
                      <td className="border-r border-slate-400 p-2 text-center font-bold">{tieneVal ? fis : ""}</td>
                      <td className="p-2 text-center font-bold">
                        {tieneVal ? `${diff > 0 ? "+" : ""}${diff}` : ""}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>

            <div className="mt-10 pt-4 border-t border-slate-400 flex justify-between text-[11px]">
              <span>Contado por: ___________________________</span>
              <span>Aprobado Supervisor: ___________________________</span>
              <span>Fecha: _____________</span>
            </div>
          </div>

          {/* MODAL AUTORIZACIÓN SUPERVISOR (SHA-256) */}
          {modalPinAbierto && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 flex items-center justify-center p-4 no-print">
              <form onSubmit={ejecutarGuardadoConPin} className={`${T.card} rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl`}>
                <div className="flex items-start justify-between border-b border-slate-200/30 pb-3">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase bg-amber-400 text-slate-950 px-2.5 py-0.5 rounded">
                      Autorización Supervisor
                    </span>
                    <h2 className={`text-base font-extrabold mt-1 ${T.main}`}>Aplicar Toma Física al Stock</h2>
                  </div>
                  <button type="button" onClick={() => setModalPinAbierto(false)} className={`text-xs font-bold px-2.5 py-1 rounded-xl cursor-pointer ${T.sec}`}>✕</button>
                </div>

                <p className={`text-xs ${T.sub}`}>
                  Se actualizarán <strong>{resumenContados.total} producto(s)</strong> ({resumenContados.conDiferencia} con diferencia respecto al sistema) y quedará respaldo en Auditoría.
                </p>

                {esPgb && (
                  <div>
                    <label className={`text-[11px] font-bold block mb-1 ${T.sub}`}>Responsable del conteo / ajuste:</label>
                    <select
                      value={responsableConteo}
                      onChange={(e) => setResponsableConteo(e.target.value)}
                      className={`w-full rounded-xl px-3 py-2 text-xs font-bold ${T.input}`}
                    >
                      {EQUIPO_PGB_CONTEO.map((n) => <option key={n} value={n}>{n}</option>)}
                    </select>
                  </div>
                )}

                <input
                  type="text"
                  value={notaConteo}
                  onChange={(e) => setNotaConteo(e.target.value)}
                  placeholder="Observación del conteo (Opcional)"
                  className={`w-full rounded-xl px-3.5 py-2 text-xs font-semibold outline-none ${T.input}`}
                />

                {pinError && (
                  <p className="text-xs font-bold text-rose-500 bg-rose-500/10 border border-rose-500/30 p-2.5 rounded-xl text-center">
                    {pinError}
                  </p>
                )}

                <div>
                  <input
                    type="password"
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    placeholder="Ingresa Clave de Supervisor"
                    className={`w-full rounded-xl px-4 py-3 text-center text-sm font-extrabold tracking-widest outline-none ${T.input}`}
                    autoFocus
                    required
                  />
                  {!tienePinPersonalizado && (
                    <p className={`text-[11px] text-center mt-1.5 ${T.sub}`}>Clave inicial por defecto: <strong>1234</strong></p>
                  )}
                </div>

                <button type="submit" disabled={guardando} className={`w-full font-extrabold py-3.5 rounded-xl text-xs cursor-pointer disabled:opacity-40 ${T.btn}`}>
                  {guardando ? "Aplicando..." : "Autorizar y Actualizar Stock"}
                </button>
              </form>
            </div>
          )}

          {/* INTERFAZ PRINCIPAL */}
          <div className="max-w-5xl mx-auto px-4 pt-5 space-y-4 no-print">
            <div className={`${T.card} rounded-2xl p-5 border-t-4 ${T.top} flex flex-col sm:flex-row sm:items-center justify-between gap-3`}>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <button onClick={() => window.location.replace(urlVolver)} className={`text-xs font-bold px-3 py-1 rounded-lg cursor-pointer ${T.btn}`}>
                    Volver
                  </button>
                  <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${T.tag}`}>{empresa.nombre}</span>
                </div>
                <h1 className={`text-xl font-extrabold ${T.main}`}>Control de Inventario y Toma Física</h1>
                <p className={`text-xs mt-0.5 ${T.sub}`}>
                  Ingresa las cantidades reales contadas en estantería. Guardar requiere Clave de Supervisor y deja registro en Auditoría.
                </p>
              </div>

              <div className="flex flex-wrap gap-2">
                <button onClick={() => window.print()} className={`text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer ${T.sec}`}>
                  Imprimir Planilla PDF
                </button>
                <button
                  onClick={abrirConfirmacionGuardar}
                  disabled={guardando || resumenContados.total === 0}
                  className={`text-xs font-extrabold px-4 py-2.5 rounded-xl cursor-pointer disabled:opacity-40 ${T.btn}`}
                >
                  {guardando ? "Aplicando..." : `Guardar Conteo (${resumenContados.total})`}
                </button>
              </div>
            </div>

            {resumenContados.total > 0 && (
              <div className={`${T.card} rounded-2xl p-3.5 border-2 border-amber-400/80 flex flex-wrap items-center justify-between gap-2 text-xs`}>
                <span className={`font-bold ${T.main}`}>
                  Contados en borrador: <strong>{resumenContados.total} producto(s)</strong> ({resumenContados.conDiferencia} con diferencia vs. sistema)
                </span>
                <button
                  type="button"
                  onClick={() => { if (confirm("¿Limpiar todos los valores escritos sin guardar?")) setConteos({}); }}
                  className="text-xs font-bold text-rose-500 underline cursor-pointer"
                >
                  Limpiar borrador
                </button>
              </div>
            )}

            <div className={`${T.card} rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-3 gap-3`}>
              <input
                type="text"
                value={busqueda}
                onChange={(e) => setBusqueda(e.target.value)}
                placeholder="Buscar SKU o producto..."
                className={`sm:col-span-2 rounded-xl px-4 py-2 text-xs font-semibold outline-none ${T.input}`}
              />
              <select value={filtroProveedor} onChange={(e) => setFiltroProveedor(e.target.value)} className={`rounded-xl px-3 py-2 text-xs font-bold ${T.input}`}>
                {proveedores.map((pr) => <option key={pr} value={pr}>{pr === "TODOS" ? "Todos los proveedores" : pr}</option>)}
              </select>
            </div>

            <div className={`${T.card} rounded-2xl p-5`}>
              <div className="divide-y divide-slate-200/40">
                {filtrados.length === 0 ? (
                  <p className={`text-xs text-center py-8 ${T.sub}`}>No hay productos registrados en el catálogo.</p>
                ) : (
                  filtrados.map((p) => {
                    const sist = Number(p.stockOnline ?? 0);
                    const valStr = conteos[p.id] ?? "";
                    const tieneVal = valStr !== "";
                    const diff = tieneVal ? parseInt(valStr, 10) - sist : null;
                    return (
                      <div key={p.id} className="py-3 flex items-center justify-between gap-3 text-xs">
                        <div className="min-w-0">
                          <span className={`font-extrabold block truncate ${T.main}`}>{p.codigo ? `[${p.codigo}] ` : ""}{p.nombre}</span>
                          <span className={`text-[11px] ${T.sub}`}>
                            {p.proveedor || "General"} • Stock Sistema: <strong>{sist}</strong>
                            {tieneVal && (
                              <span className={`ml-2 font-extrabold ${diff === 0 ? "text-emerald-600" : diff > 0 ? "text-sky-600" : "text-rose-500"}`}>
                                • {diff === 0 ? "Cuadrado ✓" : `Dif: ${diff > 0 ? "+" : ""}${diff}`}
                              </span>
                            )}
                          </span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <input
                            type="text"
                            inputMode="numeric"
                            placeholder="Físico"
                            value={valStr}
                            onChange={(e) => actualizarConteoInput(p.id, e.target.value)}
                            className={`w-24 rounded-xl px-3 py-2 text-xs font-extrabold text-center outline-none ${T.input} ${tieneVal ? "border-amber-500" : ""}`}
                          />
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ControlInventarioApp />);
  </script>
</body>
</html>
