<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <title>NEXUS ERP • Venezuela</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/ve-theme.css" />
</head>
<body>
  <div class="ve-shell">
    <!-- Barra lateral (PC) -->
    <aside class="ve-sidebar">
      <div class="ve-brand">
        <div id="brandLogoWrap" class="ve-brand-badge">VE</div>
        <div class="min-w-0">
          <div id="brandName" class="text-sm font-extrabold text-slate-900 truncate">Cargando...</div>
          <div id="brandRif" class="text-[11px] font-mono-ve text-slate-500 truncate">---</div>
        </div>
      </div>

      <nav class="ve-nav" id="pcNav">
        <div class="ve-nav-group">Operación</div>
        <button class="ve-nav-btn active" data-route="caja-pos"><span>🧾</span> Caja / Nota de Entrega</button>
        <button class="ve-nav-btn" data-route="cotizaciones"><span>📄</span> Cotizaciones (PDF)</button>
        <button class="ve-nav-btn" data-route="deudores">
          <span>💳</span>
          <span class="flex-1 text-left">Deudores Activos</span>
          <span id="badgeDeudaVencida" class="hidden px-1.5 py-0.5 text-[10px] font-extrabold rounded-full bg-rose-600 text-white">0</span>
        </button>
        <button class="ve-nav-btn" data-route="clientes"><span>👥</span> Clientes</button>

        <div class="ve-nav-group">Inventario</div>
        <button class="ve-nav-btn" data-route="catalogo"><span>📦</span> Almacén / Planta</button>
        <button class="ve-nav-btn" data-route="conteo-bodega"><span>✅</span> Conteo Almacén</button>
        <button class="ve-nav-btn" data-route="inventario-planta"><span>📥</span> Historial Novedades</button>

        <div class="ve-nav-group">Gerencia</div>
        <button class="ve-nav-btn" data-route="analitica"><span>📈</span> Analítica & Cierre</button>
        <button class="ve-nav-btn" data-route="pedido-sugerido"><span>🧠</span> Pedido Sugerido</button>
      </nav>

      <div class="p-3 border-t border-slate-200 flex items-center justify-between gap-2">
        <div class="min-w-0">
          <div id="userLabel" class="text-xs font-bold text-slate-800 truncate">Administrador</div>
          <div class="text-[10px] font-semibold text-emerald-600">Entorno Aislado VE</div>
        </div>
        <button id="btnLogoutPC" class="text-xs font-bold text-rose-600 hover:bg-rose-50 px-2.5 py-1.5 rounded-lg cursor-pointer">
          Salir
        </button>
      </div>
    </aside>

    <!-- Contenedor principal -->
    <div class="ve-main-wrap">
      <header class="ve-topbar">
        <div class="ve-rates-strip" id="ratesStrip">
          <button type="button" id="pillBcvHoy" class="ve-rate-pill active-bcv">
            <span class="ve-rate-label">BCV Hoy</span>
            <span id="valBcvHoy" class="font-mono-ve">--.--</span>
          </button>

          <button type="button" id="pillBcvNext" class="ve-rate-pill next-bcv hidden">
            <span class="ve-rate-label">BCV Mañana</span>
            <span id="valBcvNext" class="font-mono-ve">--.--</span>
          </button>

          <div class="ve-rate-pill">
            <span class="ve-rate-label">EUR</span>
            <span id="valEur" class="font-mono-ve">--.--</span>
          </div>

          <div class="ve-rate-pill">
            <span class="ve-rate-label">USDT</span>
            <span id="valUsdt" class="font-mono-ve">--.--</span>
          </div>
        </div>

        <div class="flex items-center gap-2 ml-auto">
          <button type="button" id="btnAlertaVencidos" class="hidden items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-[11px] font-extrabold cursor-pointer">
            <span>⚠️</span>
            <span id="txtAlertaVencidos">+30d sin pagar</span>
          </button>
          <span id="relojCaracas" class="text-[11px] font-mono-ve font-bold text-slate-500 hidden sm:inline">--:-- VE</span>
          <button type="button" id="btnRefrescarTasas" class="text-xs font-bold px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer">
            ↻ Tasas
          </button>
        </div>
      </header>

      <main id="veModuleRoot" class="ve-content">
        <div class="ve-card text-center py-12 text-slate-500 text-sm font-semibold">
          Inicializando entorno seguro de Venezuela...
        </div>
      </main>
    </div>
  </div>

  <!-- Barra inferior fija (Móvil) -->
  <nav class="ve-bottom-nav" id="mobNav">
    <button class="ve-mob-btn active" data-route="caja-pos"><span class="text-base">🧾</span>Caja</button>
    <button class="ve-mob-btn" data-route="catalogo"><span class="text-base">📦</span>Inventario</button>
    <button class="ve-mob-btn relative" data-route="deudores">
      <span class="text-base">💳</span>Deudores
      <span id="mobDotVencidos" class="hidden absolute top-1 right-3 w-2 h-2 rounded-full bg-rose-600"></span>
    </button>
    <button class="ve-mob-btn" data-route="cotizaciones"><span class="text-base">📄</span>Cotizar</button>
    <button class="ve-mob-btn" id="btnMobMore"><span class="text-base">☰</span>Más</button>
  </nav>

  <!-- Menú desplegable "Más" en móvil -->
  <div class="ve-drawer-backdrop" id="mobDrawer">
    <div class="ve-drawer-sheet space-y-2">
      <div class="flex items-center justify-between pb-2 border-b border-slate-200">
        <div>
          <div id="mobBrandName" class="text-sm font-extrabold text-slate-900">Empresa</div>
          <div id="mobBrandRif" class="text-[11px] font-mono-ve text-slate-500">---</div>
        </div>
        <button id="btnCloseDrawer" class="text-xs font-bold text-slate-500 px-2 py-1">Cerrar ✕</button>
      </div>
      <button class="ve-nav-btn" data-route="conteo-bodega"><span>✅</span> Conteo Digital Almacén</button>
      <button class="ve-nav-btn" data-route="clientes"><span>👥</span> Clientes</button>
      <button class="ve-nav-btn" data-route="inventario-planta"><span>📥</span> Historial de Novedades</button>
      <button class="ve-nav-btn" data-route="analitica"><span>📈</span> Analítica & Cierre</button>
      <button class="ve-nav-btn" data-route="pedido-sugerido"><span>🧠</span> Pedido Sugerido</button>
      <div class="pt-2 border-t border-slate-200">
        <button id="btnLogoutMob" class="w-full py-2.5 rounded-xl bg-rose-50 text-rose-700 font-bold text-xs">
          Cerrar Sesión
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { verificarAccesoVE, cerrarSesionVE } from "./core/auth-tenant.js";
    import { getTenantRefs, getDocs } from "./core/db.js";

    const state = {
      sesion: null,
      empresa: null,
      rutaActual: "caja-pos",
      modoTasaBCV: "hoy",
      tasas: { bcvHoy: 0, bcvManana: 0, eur: 0, usdt: 0, actualizado: "" },
      vencidos30Count: 0
    };

    window.NEXUS_VE_STATE = state;

    const NOMBRES_RUTAS = {
      "caja-pos": "Caja / Nota de Entrega",
      "cotizaciones": "Cotizaciones (PDF)",
      "deudores": "Deudores Activos",
      "clientes": "Clientes",
      "catalogo": "Inventario (Almacén / Planta)",
      "conteo-bodega": "Conteo Digital de Almacén",
      "inventario-planta": "Historial de Novedades",
      "analitica": "Analítica Financiera & Cierre",
      "pedido-sugerido": "Pedido Sugerido"
    };

    async function revisarAlertasDeudores() {
      if (!state.sesion?.tenantId) return;
      try {
        const refs = getTenantRefs(state.sesion.tenantId);
        const snap = await getDocs(refs.notasEntrega());
        const ahora = Date.now();
        let vencidos = 0;

        snap.forEach((d) => {
          const n = d.data();
          const saldo = Number(n.saldoPendienteUsd ?? (n.esCredito ? n.totalUsd : 0) ?? 0);
          if (saldo > 0.01) {
            const baseTs = Number(n.creadoTs || 0);
            const dias = baseTs ? (ahora - baseTs) / 86400000 : 0;
            if (dias >= 30 || (n.venceTs && ahora > n.venceTs && dias >= 30)) {
              vencidos++;
            }
          }
        });

        state.vencidos30Count = vencidos;
        const badge = document.getElementById("badgeDeudaVencida");
        const topBtn = document.getElementById("btnAlertaVencidos");
        const topTxt = document.getElementById("txtAlertaVencidos");
        const mobDot = document.getElementById("mobDotVencidos");

        if (vencidos > 0) {
          badge.textContent = String(vencidos);
          badge.classList.remove("hidden");
          topBtn.classList.remove("hidden");
          topBtn.classList.add("inline-flex");
          topTxt.textContent = `${vencidos} deuda(s) +30d`;
          mobDot.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
          topBtn.classList.add("hidden");
          topBtn.classList.remove("inline-flex");
          mobDot.classList.add("hidden");
        }
      } catch (e) {
        console.warn("Revisión de deudores:", e);
      }
    }

    window.NEXUS_VE_REFRESH_ALERTAS = revisarAlertasDeudores;

    function actualizarRelojCaracas() {
      const el = document.getElementById("relojCaracas");
      if (!el) return;
      try {
        el.textContent = `${new Intl.DateTimeFormat("es-VE", {
          timeZone: "America/Caracas", hour: "2-digit", minute: "2-digit", hour12: true
        }).format(new Date())} VE`;
      } catch { el.textContent = ""; }
    }

    function pintarTasas() {
      const t = state.tasas;
      document.getElementById("valBcvHoy").textContent = t.bcvHoy ? `${Number(t.bcvHoy).toFixed(2)} Bs` : "--.--";
      document.getElementById("valEur").textContent = t.eur ? `${Number(t.eur).toFixed(2)} Bs` : "--.--";
      document.getElementById("valUsdt").textContent = t.usdt ? `${Number(t.usdt).toFixed(2)} Bs` : "--.--";

      const pillNext = document.getElementById("pillBcvNext");
      if (t.bcvManana && Number(t.bcvManana) !== Number(t.bcvHoy)) {
        pillNext.classList.remove("hidden");
        document.getElementById("valBcvNext").textContent = `${Number(t.bcvManana).toFixed(2)} Bs`;
      } else {
        pillNext.classList.add("hidden");
      }
      document.getElementById("pillBcvHoy").classList.toggle("active-bcv", state.modoTasaBCV === "hoy");
      pillNext.classList.toggle("active-bcv", state.modoTasaBCV === "manana");
    }

    async function cargarTasas() {
      try {
        const resp = await fetch("/api/ve-tasas");
        if (!resp.ok) return;
        const data = await resp.json();
        state.tasas = {
          bcvHoy: Number(data.bcvHoy ?? data.bcv ?? data.usd ?? 0),
          bcvManana: Number(data.bcvManana ?? data.bcvProximo ?? 0),
          eur: Number(data.eur ?? data.euro ?? 0),
          usdt: Number(data.usdt ?? data.paralelo ?? 0),
          actualizado: data.actualizado || ""
        };
        pintarTasas();
        window.dispatchEvent(new CustomEvent("nexus-ve-tasas-updated", { detail: state.tasas }));
      } catch (err) {
        console.warn("Error tasas:", err);
      }
    }

    function marcarBotonActivo(route) {
      document.querySelectorAll("[data-route]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.route === route);
      });
    }

    async function abrirModulo(route, { pushHistory = true } = {}) {
      const drawer = document.getElementById("mobDrawer");
      if (drawer.classList.contains("open")) {
        drawer.classList.remove("open");
      }

      state.rutaActual = route;
      marcarBotonActivo(route);

      if (pushHistory) {
        try {
          history.pushState({ veRoute: route }, "", `#${route}`);
        } catch {}
      }

      const root = document.getElementById("veModuleRoot");
      root.innerHTML = `<div class="ve-card text-center py-10 text-slate-500 text-xs font-bold">Cargando ${NOMBRES_RUTAS[route] || route}...</div>`;

      try {
        const mod = await import(`./modules/${route}.js`);
        if (typeof mod.mount === "function") await mod.mount(root, state);
        else if (typeof mod.default === "function") await mod.default(root, state);
      } catch (err) {
        root.innerHTML = `
          <div class="ve-card max-w-xl mx-auto text-center space-y-2 py-10">
            <div class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Módulo pendiente</div>
            <h2 class="text-lg font-extrabold text-slate-900">${NOMBRES_RUTAS[route] || route}</h2>
            <p class="text-xs text-slate-500">Falta crear <span class="font-mono-ve">venezuela/modules/${route}.js</span>.</p>
          </div>
        `;
      }
    }

    window.NEXUS_VE_NAV = (route) => abrirModulo(route, { pushHistory: true });

    // Intercepta el botón Atrás del navegador/móvil para navegar dentro de Venezuela
    window.addEventListener("popstate", (e) => {
      const drawer = document.getElementById("mobDrawer");
      if (drawer.classList.contains("open")) {
        drawer.classList.remove("open");
        try { history.pushState({ veRoute: state.rutaActual }, "", `#${state.rutaActual}`); } catch {}
        return;
      }

      const rutaDestino = e.state?.veRoute;
      if (rutaDestino && NOMBRES_RUTAS[rutaDestino]) {
        abrirModulo(rutaDestino, { pushHistory: false });
      } else if (state.rutaActual !== "caja-pos") {
        abrirModulo("caja-pos", { pushHistory: false });
      } else {
        // Mantiene al usuario dentro del panel en vez de retroceder a index.html
        try { history.pushState({ veRoute: "caja-pos" }, "", "#caja-pos"); } catch {}
      }
    });

    async function iniciar() {
      const acceso = await verificarAccesoVE();
      if (!acceso) return;

      state.sesion = acceso.sesion;
      state.empresa = acceso.empresa;

      const nombre = acceso.empresa.nombre || acceso.sesion.nombreEmpresa;
      const rif = acceso.empresa.rif || acceso.sesion.tenantId;
      const logo = acceso.empresa.logoBase64 || acceso.empresa.logoUrl || "";

      document.getElementById("brandName").textContent = nombre;
      document.getElementById("brandRif").textContent = rif;
      document.getElementById("mobBrandName").textContent = nombre;
      document.getElementById("mobBrandRif").textContent = rif;
      document.getElementById("userLabel").textContent = acceso.sesion.usuario || "Administrador";

      if (logo) {
        document.getElementById("brandLogoWrap").outerHTML = `<img src="${logo}" alt="Logo" class="ve-brand-logo" />`;
      }

      document.querySelectorAll("[data-route]").forEach((btn) => {
        btn.addEventListener("click", () => abrirModulo(btn.dataset.route, { pushHistory: true }));
      });

      document.getElementById("btnAlertaVencidos").addEventListener("click", () => abrirModulo("deudores", { pushHistory: true }));
      document.getElementById("pillBcvHoy").addEventListener("click", () => { state.modoTasaBCV = "hoy"; pintarTasas(); });
      document.getElementById("pillBcvNext").addEventListener("click", () => { state.modoTasaBCV = "manana"; pintarTasas(); });
      document.getElementById("btnRefrescarTasas").addEventListener("click", cargarTasas);
      document.getElementById("btnLogoutPC").addEventListener("click", cerrarSesionVE);
      document.getElementById("btnLogoutMob").addEventListener("click", cerrarSesionVE);

      document.getElementById("btnMobMore").addEventListener("click", () => {
        document.getElementById("mobDrawer").classList.add("open");
        try { history.pushState({ veRoute: state.rutaActual, drawer: true }, "", `#${state.rutaActual}`); } catch {}
      });
      document.getElementById("btnCloseDrawer").addEventListener("click", () => document.getElementById("mobDrawer").classList.remove("open"));
      document.getElementById("mobDrawer").addEventListener("click", (e) => { if (e.target.id === "mobDrawer") e.currentTarget.classList.remove("open"); });

      try {
        history.replaceState({ veRoute: "caja-pos" }, "", "#caja-pos");
      } catch {}

      actualizarRelojCaracas();
      setInterval(actualizarRelojCaracas, 30000);
      await Promise.all([cargarTasas(), revisarAlertasDeudores()]);
      setInterval(cargarTasas, 10 * 60 * 1000);
      await abrirModulo("caja-pos", { pushHistory: false });
    }

    iniciar();
  </script>
</body>
</html>
