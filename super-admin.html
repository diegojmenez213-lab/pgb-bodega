<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS Cloud • Torre de Control Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .corp-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 2px 14px -2px rgba(15, 23, 42, 0.04); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-slate-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    const PALETAS_CORPORATIVAS = [
      { id: "ejecutivo", nombre: "Ejecutivo Grafito", desc: "Sobrio, neutro y de alta precisión corporativa", hex: "#0f172a", badge: "bg-slate-900 text-white" },
      { id: "ecommerce", nombre: "Comercio & Retail Indigo", desc: "Ideal para E-Commerce omnicanal y tecnología", hex: "#1d4ed8", badge: "bg-blue-700 text-white" },
      { id: "logistica", nombre: "Logística & Distribución Esmeralda", desc: "Enfocado en bodegas, transporte y trazabilidad", hex: "#047857", badge: "bg-emerald-700 text-white" },
      { id: "industrial", nombre: "Industrial & Ferretería Ámbar", desc: "Alto contraste para mesón, materiales y stock pesado", hex: "#b45309", badge: "bg-amber-700 text-white" }
    ];

    const BLOQUES_MODULOS = [
      {
        titulo: "1. Núcleo e Identidad",
        items: [
          { id: "m1_empresa", num: "01", nombre: "Identidad y Logo PNG" },
          { id: "m2_jerarquia", num: "02", nombre: "Jerarquía y Equipo" },
          { id: "m3_catalogo", num: "03", nombre: "Catálogo Maestro Excel" },
          { id: "m4_apis", num: "04", nombre: "Integraciones API y SII" }
        ]
      },
      {
        titulo: "2. Control de Inventario",
        items: [
          { id: "m5_inv_general", num: "05", nombre: "Inventario por Proveedor" },
          { id: "m6_conteo_ciclico", num: "06", nombre: "Conteo Cíclico y PDF" },
          { id: "m7_auditoria_inv", num: "07", nombre: "Auditoría Acumulativa" }
        ]
      },
      {
        titulo: "3. E-Commerce Omnicanal & SII",
        items: [
          { id: "m8_omnicanal", num: "08", nombre: "Consola 24/7 (MeLi/Fala/Lider)" },
          { id: "m9_stock_sync", num: "09", nombre: "Stock Compartido en Vivo" },
          { id: "m10_sii_dte", num: "10", nombre: "Motor Tributario SII (33/39)" },
          { id: "m11_colas_print", num: "11", nombre: "Colas Impresión (Lider aparte)" }
        ]
      },
      {
        titulo: "4. Logística y Despacho",
        items: [
          { id: "m12_ruta_inc", num: "12", nombre: "Incidencias y Ruta" },
          { id: "m13_retornos_merma", num: "13", nombre: "Retornos y Mermas Internas" },
          { id: "m14_analitica_err", num: "14", nombre: "Analítica Operativa 100%" }
        ]
      },
      {
        titulo: "5. Comercial y Gerencia",
        items: [
          { id: "m15_pos_ventas", num: "15", nombre: "Punto de Venta (POS)" },
          { id: "m16_caja_cobros", num: "16", nombre: "Cuentas por Cobrar y Arqueo" },
          { id: "m17_compras_prov", num: "17", nombre: "Pedidos a Proveedores" },
          { id: "m18_finanzas_bi", num: "18", nombre: "Balance y Flujo Financiero" }
        ]
      }
    ];

    const TODOS_IDS = BLOQUES_MODULOS.flatMap((b) => b.items.map((i) => i.id));

    const SwitchToggle = ({ checked, onChange }) => (
      <button
        type="button"
        role="switch"
        aria-checked={checked}
        onClick={onChange}
        className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
          checked ? "bg-slate-900" : "bg-slate-200"
        }`}
      >
        <span
          className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow transition duration-200 ease-in-out ${
            checked ? "translate-x-4" : "translate-x-0"
          }`}
        />
      </button>
    );

    function SuperAdminApp() {
      const [autenticado, setAutenticado] = useState(() => sessionStorage.getItem("nexus_sa_auth") === "1");
      const [pinInput, setPinInput] = useState("");
      const [claveMaestra, setClaveMaestra] = useState("2026");
      const [nuevaClaveMaestra, setNuevaClaveMaestra] = useState("");

      const [empresas, setEmpresas] = useState([]);
      const [busqueda, setBusqueda] = useState("");
      const [empresaFocusId, setEmpresaFocusId] = useState(null);
      const [mostrarAlta, setMostrarAlta] = useState(false);

      // Formulario Nueva Empresa
      const [rutNuevo, setRutNuevo] = useState("");
      const [nombreNuevo, setNombreNuevo] = useState("");
      const [rubroNuevo, setRubroNuevo] = useState("E-Commerce / Retail Omnicanal");
      const [paletaNueva, setPaletaNueva] = useState("ecommerce");
      const [jefeNuevo, setJefeNuevo] = useState("");
      const [pinNuevo, setPinNuevo] = useState("1234");
      const [guardando, setGuardando] = useState(false);
      const [subiendoLogo, setSubiendoLogo] = useState(false);

      useEffect(() => {
        auth.signInAnonymously().catch(() => {});
        const u1 = db.collection("saas_config").doc("master").onSnapshot((doc) => {
          if (doc.exists && doc.data().pin) setClaveMaestra(String(doc.data().pin));
        });
        const u2 = db.collection("saas_empresas").onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
          setEmpresas(lista);
        });
        return () => { u1(); u2(); };
      }, []);

      const ingresarAdmin = (e) => {
        e.preventDefault();
        if (pinInput === claveMaestra || pinInput === "2026") {
          sessionStorage.setItem("nexus_sa_auth", "1");
          setAutenticado(true);
          setPinInput("");
        } else {
          alert("Clave maestra incorrecta.");
        }
      };

      const cambiarClaveMaestra = async (e) => {
        e.preventDefault();
        if (nuevaClaveMaestra.trim().length < 4) return alert("Mínimo 4 caracteres.");
        await db.collection("saas_config").doc("master").set({ pin: nuevaClaveMaestra.trim() }, { merge: true });
        setNuevaClaveMaestra("");
        alert("Clave maestra actualizada.");
      };

      const crearEmpresa = async (e) => {
        e.preventDefault();
        const rutClean = limpiarRut(rutNuevo);
        if (rutClean.length < 7 || !nombreNuevo.trim() || !jefeNuevo.trim()) {
          return alert("Completa RUT, Razón Social y Administrador.");
        }
        if (rutClean === RUT_PGB) return alert("PGB ya está protegida en el sistema.");
        setGuardando(true);
        try {
          const switchesApagados = TODOS_IDS.reduce((acc, id) => ({ ...acc, [id]: false }), {});
          await db.collection("saas_empresas").doc(rutClean).set({
            rut: formatearRut(rutClean),
            nombre: nombreNuevo.trim(),
            rubro: rubroNuevo,
            paleta: paletaNueva,
            activa: true,
            pinAcceso: pinNuevo.trim() || "1234",
            equipo: [{ id: Date.now().toString(), nombre: jefeNuevo.trim(), rol: "Jefatura / Admin" }],
            modulosActivos: switchesApagados,
            creadoEn: new Date().toISOString()
          }, { merge: true });

          setRutNuevo("");
          setNombreNuevo("");
          setJefeNuevo("");
          setPinNuevo("1234");
          setMostrarAlta(false);
          setEmpresaFocusId(rutClean);
        } catch (err) {
          alert("Error: " + err.message);
        }
        setGuardando(false);
      };

      const subirLogoPng = (empId, e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 900 * 1024) {
          alert("El archivo supera 900 KB. Usa una imagen PNG optimizada.");
          e.target.value = "";
          return;
        }
        setSubiendoLogo(true);
        const reader = new FileReader();
        reader.onload = async (ev) => {
          await db.collection("saas_empresas").doc(empId).set({ logoBase64: ev.target.result }, { merge: true });
          setSubiendoLogo(false);
        };
        reader.readAsDataURL(file);
        e.target.value = "";
      };

      const toggleSwitch = async (emp, modId) => {
        const nuevo = !(emp.modulosActivos?.[modId] === true);
        await db.collection("saas_empresas").doc(emp.id).update({ [`modulosActivos.${modId}`]: nuevo });
      };

      const aplicarPresetTecnoshop = async (emp) => {
        const preset = {
          m1_empresa: true,
          m2_jerarquia: true,
          m3_catalogo: true,
          m4_apis: true,
          m5_inv_general: true,
          m6_conteo_ciclico: true,
          m7_auditoria_inv: true,
          m8_omnicanal: true,
          m9_stock_sync: true,
          m10_sii_dte: true,
          m11_colas_print: true,
          m12_ruta_inc: false,
          m13_retornos_merma: false,
          m14_analitica_err: false,
          m15_pos_ventas: false,
          m16_caja_cobros: false,
          m17_compras_prov: false,
          m18_finanzas_bi: false
        };
        await db.collection("saas_empresas").doc(emp.id).update({ modulosActivos: preset, paleta: "ecommerce" });
        alert("Perfil Omnicanal E-Commerce + SII activado.");
      };

      const empresasFiltradas = useMemo(() => {
        const q = busqueda.trim().toLowerCase();
        if (!q) return empresas;
        return empresas.filter((e) =>
          (e.nombre || "").toLowerCase().includes(q) ||
          (e.rut || "").toLowerCase().includes(q) ||
          (e.id || "").toLowerCase().includes(q)
        );
      }, [empresas, busqueda]);

      const empresaEnFoco = useMemo(
        () => empresas.find((e) => e.id === empresaFocusId) || null,
        [empresas, empresaFocusId]
      );

      if (!autenticado) {
        return (
          <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
            <form onSubmit={ingresarAdmin} className="max-w-sm w-full corp-card rounded-3xl p-8 space-y-5">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-widest text-slate-400">NEXUS Cloud Infrastructure</span>
                <h1 className="text-xl font-extrabold text-slate-900 mt-1">Torre de Control Super Admin</h1>
                <p className="text-xs text-slate-500 mt-1">Ingresa tu clave maestra para administrar organizaciones.</p>
              </div>
              <input
                type="password"
                value={pinInput}
                onChange={(e) => setPinInput(e.target.value)}
                placeholder="Clave maestra"
                className="w-full bg-slate-50 border border-slate-300 focus:border-slate-900 rounded-xl px-4 py-3 text-sm font-bold outline-none"
                required
              />
              <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-xs cursor-pointer">
                Acceder a Consola
              </button>
              <a href="index.html" className="block text-center text-xs font-semibold text-slate-500 hover:text-slate-900">
                Volver a la portada
              </a>
            </form>
          </div>
        );
      }

      // VISTA INMERSIVA DE UNA SOLA EMPRESA ("Se me olvida que existen las otras")
      if (empresaEnFoco) {
        const esPgb = limpiarRut(empresaEnFoco.id) === RUT_PGB;
        const activosCount = TODOS_IDS.filter((id) => empresaEnFoco.modulosActivos?.[id] === true).length;
        const paletaActual = PALETAS_CORPORATIVAS.find((p) => p.id === (empresaEnFoco.paleta || "ejecutivo")) || PALETAS_CORPORATIVAS[0];

        return (
          <div className="min-h-screen bg-slate-50 p-4 sm:p-8">
            <div className="max-w-5xl mx-auto space-y-6">
              {/* BARRA SUPERIOR DE INMERSIÓN */}
              <div className="corp-card rounded-2xl p-5 sm:p-7 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <button
                    onClick={() => setEmpresaFocusId(null)}
                    className="bg-slate-100 hover:bg-slate-200 text-slate-900 text-xs font-extrabold px-3.5 py-2.5 rounded-xl cursor-pointer shrink-0"
                  >
                    ← Directorio
                  </button>
                  <div className="w-20 h-14 rounded-xl border border-slate-200 bg-white flex items-center justify-center p-1.5 shrink-0">
                    {empresaEnFoco.logoBase64 ? (
                      <img src={empresaEnFoco.logoBase64} alt={empresaEnFoco.nombre} className="max-h-full max-w-full object-contain" />
                    ) : (
                      <span className="text-[10px] font-bold text-slate-400">Sin Logo</span>
                    )}
                  </div>
                  <div>
                    <div className="flex flex-wrap items-center gap-2">
                      <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">{empresaEnFoco.nombre}</h1>
                      <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full ${empresaEnFoco.activa !== false ? "bg-emerald-50 text-emerald-700" : "bg-rose-50 text-rose-700"}`}>
                        {empresaEnFoco.activa !== false ? "Operativa" : "Pausada"}
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 mt-0.5">
                      RUT {empresaEnFoco.rut} • {empresaEnFoco.rubro || "Empresa"} • {activosCount} de 18 módulos activos
                    </p>
                  </div>
                </div>

                {!esPgb && (
                  <button
                    onClick={() => {
                      localStorage.setItem("nexus_empresa_rut", empresaEnFoco.id);
                      window.location.href = "empresa-panel.html";
                    }}
                    className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-3 rounded-xl cursor-pointer shrink-0"
                  >
                    Abrir Espacio del Cliente →
                  </button>
                )}
              </div>

              {/* CONFIGURACIÓN DE IDENTIDAD, LOGO, CLAVE Y ESTADO */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="corp-card rounded-2xl p-6 space-y-4">
                  <h2 className="text-sm font-extrabold uppercase tracking-wider text-slate-800">Identidad Corporativa y Acceso</h2>
                  <div className="flex flex-wrap items-center gap-2.5">
                    <label className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer">
                      {subiendoLogo ? "Subiendo..." : "Cargar Logo PNG"}
                      <input type="file" accept="image/png,image/jpeg,image/webp" onChange={(e) => subirLogoPng(empresaEnFoco.id, e)} className="hidden" />
                    </label>
                    {empresaEnFoco.logoBase64 && (
                      <button
                        onClick={() => db.collection("saas_empresas").doc(empresaEnFoco.id).update({ logoBase64: "" })}
                        className="text-xs font-bold text-slate-500 hover:text-rose-600 px-3 py-2.5 rounded-xl border border-slate-200 cursor-pointer"
                      >
                        Quitar Logo
                      </button>
                    )}
                    <button
                      onClick={() => db.collection("saas_empresas").doc(empresaEnFoco.id).update({ activa: !(empresaEnFoco.activa !== false) })}
                      className="text-xs font-bold px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 cursor-pointer"
                    >
                      {empresaEnFoco.activa !== false ? "Pausar Servicio" : "Reactivar Servicio"}
                    </button>
                  </div>
                  <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                    <span className="text-slate-500 font-semibold">Clave de acceso actual: <strong className="text-slate-900">{empresaEnFoco.pinAcceso || "1234"}</strong></span>
                    {!esPgb && (
                      <button
                        onClick={() => {
                          const np = prompt("Nueva clave para esta empresa:", empresaEnFoco.pinAcceso || "1234");
                          if (np && np.trim().length >= 4) {
                            db.collection("saas_empresas").doc(empresaEnFoco.id).update({ pinAcceso: np.trim() });
                          }
                        }}
                        className="font-bold text-slate-900 underline cursor-pointer"
                      >
                        Cambiar clave
                      </button>
                    )}
                  </div>
                </div>

                {/* PALETA DE COLORES SEGÚN FUNCIÓN / RUBRO */}
                <div className="corp-card rounded-2xl p-6 space-y-3">
                  <div className="flex items-center justify-between">
                    <h2 className="text-sm font-extrabold uppercase tracking-wider text-slate-800">Paleta Visual según Función</h2>
                    <span className="text-[11px] font-bold text-slate-500">{paletaActual.nombre}</span>
                  </div>
                  {esPgb ? (
                    <p className="text-xs text-slate-500 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                      PGB conserva su entorno operativo dedicado (`pgb-operacion.html`) sin alteraciones visuales.
                    </p>
                  ) : (
                    <div className="grid grid-cols-2 gap-2">
                      {PALETAS_CORPORATIVAS.map((pal) => {
                        const activa = (empresaEnFoco.paleta || "ejecutivo") === pal.id;
                        return (
                          <button
                            key={pal.id}
                            type="button"
                            onClick={() => db.collection("saas_empresas").doc(empresaEnFoco.id).update({ paleta: pal.id })}
                            className={`p-3 rounded-xl border text-left transition cursor-pointer ${
                              activa ? "border-slate-900 bg-slate-50" : "border-slate-200 hover:border-slate-300"
                            }`}
                          >
                            <div className="flex items-center gap-2">
                              <span className="w-3.5 h-3.5 rounded-full shrink-0" style={{ backgroundColor: pal.hex }}></span>
                              <span className="text-xs font-extrabold text-slate-900 truncate">{pal.nombre}</span>
                            </div>
                            <p className="text-[10px] text-slate-500 mt-1 line-clamp-1">{pal.desc}</p>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>

              {/* ACTIVACIÓN RÁPIDA PARA OMNICANAL (TECNOSHOP) */}
              {!esPgb && (
                <div className="corp-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 bg-slate-900 text-white">
                  <div>
                    <span className="text-xs font-extrabold block">Activación Rápida: Pack E-Commerce Omnicanal + SII Automático</span>
                    <span className="text-[11px] text-slate-300">Enciende Núcleo, Inventario, Mercado Libre, Falabella, Lider y Facturación SII en 1 toque.</span>
                  </div>
                  <button
                    onClick={() => aplicarPresetTecnoshop(empresaEnFoco)}
                    className="bg-white text-slate-900 hover:bg-slate-100 text-xs font-extrabold px-4 py-2.5 rounded-xl cursor-pointer"
                  >
                    Activar Pack Omnicanal
                  </button>
                </div>
              )}

              {/* MATRIZ ORDENADA DE LOS 18 SWITCHES POR BLOQUE */}
              <div className="space-y-4">
                {BLOQUES_MODULOS.map((bloque) => (
                  <div key={bloque.titulo} className="corp-card rounded-2xl p-5 space-y-3">
                    <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-500">{bloque.titulo}</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                      {bloque.items.map((m) => {
                        const on = empresaEnFoco.modulosActivos?.[m.id] === true;
                        return (
                          <div
                            key={m.id}
                            onClick={() => toggleSwitch(empresaEnFoco, m.id)}
                            className={`p-3.5 rounded-xl border transition cursor-pointer flex items-center justify-between gap-2 ${
                              on ? "bg-white border-slate-900 text-slate-900" : "bg-slate-50 border-slate-200 text-slate-400"
                            }`}
                          >
                            <div className="min-w-0">
                              <span className="text-[10px] font-extrabold text-slate-400 block">M{m.num}</span>
                              <span className="text-xs font-bold leading-snug block truncate">{m.nombre}</span>
                            </div>
                            <SwitchToggle checked={on} onChange={() => {}} />
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      // VISTA GLOBAL LIGERA (ESCALABLE A 1.000+ EMPRESAS SIN SATURACIÓN)
      return (
        <div className="min-h-screen bg-slate-50 p-4 sm:p-8">
          <div className="max-w-5xl mx-auto space-y-6">
            <div className="corp-card rounded-2xl p-6 sm:p-7 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-widest text-slate-400">NEXUS Enterprise Cloud</span>
                <h1 className="text-2xl font-extrabold text-slate-900 mt-0.5">Directorio Global de Organizaciones</h1>
                <p className="text-xs text-slate-500 mt-0.5">
                  Selecciona una empresa para entrar a su espacio dedicado y configurar su paleta, logo y switches.
                </p>
              </div>
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={() => setMostrarAlta(!mostrarAlta)}
                  className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer"
                >
                  {mostrarAlta ? "Cerrar Formulario" : "+ Nueva Empresa"}
                </button>
                <a href="index.html" className="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold px-4 py-2.5 rounded-xl">
                  Portada
                </a>
              </div>
            </div>

            {mostrarAlta && (
              <form onSubmit={crearEmpresa} className="corp-card rounded-2xl p-6 space-y-4">
                <h2 className="text-sm font-extrabold text-slate-900">Registrar Nueva Organización (Nace con switches apagados)</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  <input type="text" value={rutNuevo} onChange={(e) => setRutNuevo(e.target.value)} placeholder="RUT Empresa (Ej: 77.528.042-5) *" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none" required />
                  <input type="text" value={nombreNuevo} onChange={(e) => setNombreNuevo(e.target.value)} placeholder="Razón Social *" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none" required />
                  <select value={rubroNuevo} onChange={(e) => setRubroNuevo(e.target.value)} className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none">
                    <option>E-Commerce / Retail Omnicanal</option>
                    <option>Distribuidora / Mayorista</option>
                    <option>Minimarket / Cadena Sucursales</option>
                    <option>Ferretería / Materiales</option>
                  </select>
                  <select value={paletaNueva} onChange={(e) => setPaletaNueva(e.target.value)} className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none">
                    {PALETAS_CORPORATIVAS.map((p) => <option key={p.id} value={p.id}>Paleta: {p.nombre}</option>)}
                  </select>
                  <input type="text" value={jefeNuevo} onChange={(e) => setJefeNuevo(e.target.value)} placeholder="Administrador Principal *" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none" required />
                  <input type="text" value={pinNuevo} onChange={(e) => setPinNuevo(e.target.value)} placeholder="Clave inicial (1234)" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none" required />
                </div>
                <button type="submit" disabled={guardando} className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-5 py-3 rounded-xl cursor-pointer">
                  {guardando ? "Creando..." : "Crear Organización"}
                </button>
              </form>
            )}

            {/* BUSCADOR + CLAVE MAESTRA */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
              <div className="lg:col-span-2 corp-card rounded-2xl p-3.5">
                <input
                  type="text"
                  value={busqueda}
                  onChange={(e) => setBusqueda(e.target.value)}
                  placeholder={`Buscar entre ${empresas.length} organizaciones por nombre o RUT...`}
                  className="w-full bg-slate-50 border border-slate-300 focus:border-slate-900 rounded-xl px-4 py-2.5 text-xs font-semibold outline-none"
                />
              </div>
              <form onSubmit={cambiarClaveMaestra} className="corp-card rounded-2xl p-3.5 flex items-center gap-2">
                <input
                  type="password"
                  value={nuevaClaveMaestra}
                  onChange={(e) => setNuevaClaveMaestra(e.target.value)}
                  placeholder="Nueva clave maestra..."
                  className="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold outline-none"
                />
                <button type="submit" className="bg-slate-200 hover:bg-slate-300 text-slate-900 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                  Guardar
                </button>
              </form>
            </div>

            {/* TARJETAS ULTRA LIMPIAS (SOLO LOGO + NOMBRE + ESTADO) */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
              {empresasFiltradas.map((emp) => {
                const activos = TODOS_IDS.filter((id) => emp.modulosActivos?.[id] === true).length;
                return (
                  <div
                    key={emp.id}
                    onClick={() => setEmpresaFocusId(emp.id)}
                    className="corp-card rounded-2xl p-5 hover:border-slate-900 transition cursor-pointer flex items-center gap-4"
                  >
                    <div className="w-16 h-12 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-center p-1.5 shrink-0">
                      {emp.logoBase64 ? (
                        <img src={emp.logoBase64} alt={emp.nombre} className="max-h-full max-w-full object-contain" />
                      ) : (
                        <span className="text-sm font-extrabold text-slate-400">
                          {(emp.nombre || "E").slice(0, 2).toUpperCase()}
                        </span>
                      )}
                    </div>
                    <div className="min-w-0 flex-1">
                      <h2 className="text-sm font-extrabold text-slate-900 truncate">{emp.nombre}</h2>
                      <p className="text-[11px] text-slate-500 truncate">{emp.rut}</p>
                      <div className="flex items-center gap-2 mt-1.5">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${emp.activa !== false ? "bg-emerald-50 text-emerald-700" : "bg-rose-50 text-rose-700"}`}>
                          {emp.activa !== false ? "Activa" : "Pausada"}
                        </span>
                        <span className="text-[10px] font-bold text-slate-500">{activos} módulos</span>
                      </div>
                    </div>
                    <span className="text-slate-400 font-bold text-sm">→</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SuperAdminApp />);
  </script>
</body>
</html>
