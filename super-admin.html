    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    const normalizarIdVE = (raw = "") => {
      const limpio = String(raw).trim().toUpperCase().replace(/\s+/g, "");
      if (/^[VEJGP]-\d+/.test(limpio)) return limpio;
      if (/^[VEJGP]\d+/.test(limpio)) return `${limpio[0]}-${limpio.slice(1)}`;
      if (/^\d{6,9}$/.test(limpio)) return `V-${limpio}`;
      return limpio;
    };

    const formatearDocVE = (raw = "") => {
      const s = String(raw || "").toUpperCase().replace(/[^VEJGP0-9-]/g, "");
      if (!s) return "";
      const letra = s[0];
      if (!/[VEJGP]/.test(letra)) return s;
      const resto = s.slice(1).replace(/[^0-9]/g, "");
      if (!resto) return letra;
      if ((letra === "J" || letra === "G") && resto.length > 8) {
        return `${letra}-${resto.slice(0, 8)}-${resto.slice(8, 9)}`;
      }
      return `${letra}-${resto.slice(0, 9)}`;
    };

    const validarDocVE = (val = "") => /^[VEJGP]-\d{6,9}(-\d)?$/.test(String(val || "").trim().toUpperCase());

    const validarRutChileno = (rut) => {
      const limpio = limpiarRut(rut);
      if (limpio.length < 7 || limpio.length > 9) return false;
      const cuerpo = limpio.slice(0, -1);
      const dv = limpio.slice(-1);
      if (!/^\d+$/.test(cuerpo)) return false;
      let suma = 0;
      let multiplo = 2;
      for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo.charAt(i), 10) * multiplo;
        multiplo = multiplo < 7 ? multiplo + 1 : 2;
      }
      const dvEsperado = 11 - (suma % 11);
      const dvCalc = dvEsperado === 11 ? "0" : dvEsperado === 10 ? "K" : String(dvEsperado);
      return dv === dvCalc;
    };

    const sha256Hex = async (texto) => {
      const str = String(texto || "").trim();
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(str);
        const hashBuf = await window.crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuf)).map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      return str;
    };

    const obtenerHashBootstrapInicial = async () => {
      const semilla = String.fromCharCode(50, 48, 50, 54);
      return await sha256Hex(semilla);
    };

    const verificarPinMaestro = async (pinIngresado) => {
      const limpio = String(pinIngresado || "").trim();
      if (!limpio) return { ok: false };
      if (!auth.currentUser) await auth.signInAnonymously().catch(() => {});
      const hashIngresado = await sha256Hex(limpio);
      const cfgRef = db.collection("saas_config").doc("master_admin");
      try {
        const snap = await cfgRef.get();
        if (snap.exists && snap.data()?.pinMaestroHash) {
          return { ok: hashIngresado === snap.data().pinMaestroHash };
        }
      } catch (err) {}
      const hashBootstrap = await obtenerHashBootstrapInicial();
      if (hashIngresado === hashBootstrap) {
        cfgRef.set({ pinMaestroHash: hashBootstrap, actualizadoTs: Date.now() }, { merge: true }).catch(() => {});
        return { ok: true };
      }
      return { ok: false };
    };

    const comprimirLogoImagen = (file) => {
      return new Promise((resolve, reject) => {
        const urlObj = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const MAX_W = 520, MAX_H = 240;
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            const ratio = Math.min(1, MAX_W / w, MAX_H / h);
            w = Math.max(1, Math.round(w * ratio));
            h = Math.max(1, Math.round(h * ratio));
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            let dataUrl = canvas.toDataURL("image/webp", 0.85);
            if (!dataUrl.startsWith("data:image/webp")) dataUrl = canvas.toDataURL("image/png");
            if (dataUrl.length > 350000) {
              const c2 = document.createElement("canvas");
              c2.width = w; c2.height = h;
              const ctx2 = c2.getContext("2d");
              ctx2.fillStyle = "#ffffff";
              ctx2.fillRect(0, 0, w, h);
              ctx2.drawImage(img, 0, 0, w, h);
              dataUrl = c2.toDataURL("image/jpeg", 0.82);
            }
            URL.revokeObjectURL(urlObj);
            if (dataUrl.length > 480000) return reject(new Error("Imagen demasiado pesada incluso tras comprimir."));
            const kb = Math.max(1, Math.round((dataUrl.length * 0.75) / 1024));
            resolve({ dataUrl, kb, w, h });
          } catch (err) {
            URL.revokeObjectURL(urlObj);
            reject(err);
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(urlObj);
          reject(new Error("No se pudo leer la imagen seleccionada."));
        };
        img.src = urlObj;
      });
    };

    function SuperAdminApp() {

      const [seguridadAbierta, setSeguridadAbierta] = useState(false);

      const [crearAbierto, setCrearAbierto] = useState(false);

      }, [empresasCL, empresasVE]);

        });

        const unsubVE = db.collection("empresas").where("pais", "==", "VE").onSnapshot((snap) => {
          setEmpresasVE(snap.docs.map((d) => ({ id: d.id, _pais: "VE", _key: `VE::${d.id}`, ...d.data() })));
        });

        return () => { unsubCL(); unsubVE(); };
      }, [autorizado]);

      useEffect(() => {
        if (!empresas.length) return;
        setSeleccionadaKey((prev) => {
          if (prev && empresas.some((e) => e._key === prev)) return prev;
          const tecno = empresas.find((e) => e._key === "CL::775280425") || empresas[0];
          return tecno._key;
        });
      }, [empresas]);

      useEffect(() => {
        if (!seleccionadaKey || seleccionadaKey === ultimoKeyCargadoRef.current) return;
        const emp = empresas.find((e) => e._key === seleccionadaKey);
        if (!emp) return;
        ultimoKeyCargadoRef.current = seleccionadaKey;
        setLogoInfoTxt("");
        setHayCambiosSinGuardar(false);

        if (emp._pais === "VE") {
          setEditForm({
            id: emp.id,
            _pais: "VE",
            _key: emp._key,
            nombre: emp.nombre || "",
            rut: emp.rif || emp.id,
            rubro: emp.rubro || "Repuestos y Comercio",
            direccion: emp.direccion || "",
            telefonos: emp.telefonos || "",
            correo: emp.correo || "",
            claveAcceso: emp.claveAcceso || "",
            activo: emp.activo !== false,
            logoBase64: emp.logoBase64 || emp.logoUrl || "",

      };

      const cambiarPinMaestro = async (e) => {
        e.preventDefault();
        if (!pinActualMaster || !pinNuevoMaster || pinNuevoMaster !== pinConfirmMaster) {
          alert("Verifica el PIN actual y que el nuevo PIN coincida.");
          return;
        }
        const check = await verificarPinMaestro(pinActualMaster);
        if (!check.ok) {
          alert("El PIN actual es incorrecto.");
          return;
        }
        const nuevoHash = await sha256Hex(pinNuevoMaster);
        await db.collection("saas_config").doc("master_admin").set({
          pinMaestroHash: nuevoHash,
          actualizadoTs: Date.now()
        }, { merge: true });
        setPinActualMaster(""); setPinNuevoMaster(""); setPinConfirmMaster("");
        setSeguridadAbierta(false);
        alert("PIN Maestro actualizado.");
      };

      if (!autorizado) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <form onSubmit={ingresarAdmin} className="w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-7 shadow-xl space-y-5">
              <div className="text-center space-y-1">
                <div className="w-11 h-11 rounded-2xl bg-slate-950 text-white font-extrabold flex items-center justify-center mx-auto">N</div>
                <h1 className="text-xl font-extrabold text-slate-950 pt-1">Consola Maestra</h1>
                <p className="text-xs text-slate-500">Acceso restringido • Chile & Venezuela</p>
              </div>
              {pinError && <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold p-3 rounded-xl text-center">{pinError}</div>}
              <input
                type="password"
                value={pinInput}
                onChange={(e) => setPinInput(e.target.value)}
                placeholder="PIN Maestro"
                className="w-full bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3.5 text-sm font-bold outline-none focus:border-slate-950"
                required
              />
              <button type="submit" disabled={validandoLogin} className="w-full bg-slate-950 hover:bg-slate-800 text-white font-extrabold py-3.5 rounded-2xl text-xs uppercase tracking-wider cursor-pointer">
                {validandoLogin ? "Validando..." : "Desbloquear Consola"}
              </button>
              <a href="index.html" className="block text-center text-xs font-bold text-slate-500 hover:text-slate-900">← Volver al Portal</a>
            </form>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-white border-b border-slate-200 px-4 sm:px-6 h-16 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-xl bg-slate-950 text-white flex items-center justify-center font-extrabold text-sm">N</div>
              <div>
                <div className="font-extrabold text-sm text-slate-950 leading-none">NEXUS SUPER ADMIN</div>
                <div className="text-[10px] font-bold text-slate-500">CHILE ({empresasCL.length}) • VENEZUELA ({empresasVE.length})</div>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => setCrearAbierto(true)} className="bg-slate-950 hover:bg-slate-800 text-white text-xs font-bold px-3.5 py-2 rounded-xl cursor-pointer">
                + Nueva Empresa
              </button>
              <button onClick={() => setSeguridadAbierta(true)} className="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                PIN
              </button>
              <button onClick={() => { sessionStorage.removeItem("nexus_admin_ok"); window.location.href = "index.html"; }} className="text-xs font-bold text-rose-600 px-2.5 py-2 rounded-xl hover:bg-rose-50 cursor-pointer">
                Salir
              </button>
            </div>
          </header>

          <div className="max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-5 flex-1">
            {/* Lista de empresas */}
            <aside className="lg:col-span-4 bg-white border border-slate-200 rounded-2xl p-3 space-y-2 h-fit">
              <div className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 px-2 pt-1">Empresas Registradas</div>
              {empresas.length === 0 && <div className="text-xs text-slate-400 p-4 text-center">No hay empresas registradas.</div>}
              <div className="space-y-1.5 max-h-[70vh] overflow-y-auto">
                {empresas.map((emp) => {
                  const activa = emp._key === seleccionadaKey;
                  return (
                    <button
                      key={emp._key}
                      onClick={() => { ultimoKeyCargadoRef.current = ""; setSeleccionadaKey(emp._key); }}
                      className={`w-full text-left p-3 rounded-xl border transition cursor-pointer ${
                        activa ? "bg-slate-950 text-white border-slate-950" : "bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-900"
                      }`}
                    >
                      <div className="flex items-center justify-between gap-2">
                        <span className="font-extrabold text-xs truncate">{emp.nombre || emp.id}</span>
                        <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full ${
                          emp._pais === "VE"
                            ? (activa ? "bg-amber-400 text-slate-950" : "bg-amber-100 text-amber-800")
                            : (activa ? "bg-sky-400 text-slate-950" : "bg-sky-100 text-sky-800")
                        }`}>
                          {emp._pais}
                        </span>
                      </div>
                      <div className={`text-[11px] mt-0.5 ${activa ? "text-slate-300" : "text-slate-500"}`}>
                        {emp._pais === "VE" ? emp.id : formatearRut(emp.id)} • {emp.activo === false ? "Suspendida" : "Activa"}
                      </div>
                    </button>
                  );
                })}
              </div>
            </aside>

            {/* Editor empresa seleccionada */}
            <main className="lg:col-span-8">
              {!editForm ? (
                <div className="bg-white border border-slate-200 rounded-2xl p-10 text-center text-sm text-slate-500">
                  Selecciona una empresa o crea una nueva.
                </div>
              ) : (
                <div className="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-200">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className={`text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${editForm._pais === "VE" ? "bg-amber-100 text-amber-800" : "bg-sky-100 text-sky-800"}`}>
                          {editForm._pais === "VE" ? "ENTORNO VENEZUELA" : "ENTORNO CHILE"}
                        </span>
                        <span className="text-xs font-bold text-slate-500">{editForm._pais === "VE" ? editForm.id : formatearRut(editForm.id)}</span>
                      </div>
                      <h2 className="text-xl font-extrabold text-slate-950 mt-1">{editForm.nombre || editForm.id}</h2>
                    </div>
                    <div className="flex items-center gap-3">
                      <label className="flex items-center gap-2 text-xs font-bold text-slate-700">
                        Activa
                        <SwitchItem checked={editForm.activo} onChange={() => actualizarCampoEdit("activo", !editForm.activo)} />
                      </label>
                      <button
                        onClick={guardarCambiosEmpresa}
                        disabled={procesando}
                        className="bg-slate-950 hover:bg-slate-800 disabled:opacity-40 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl cursor-pointer"
                      >
                        {procesando ? "Guardando..." : hayCambiosSinGuardar ? "Guardar Cambios *" : "Guardar"}
                      </button>
                    </div>
                  </div>

                  {/* Datos generales */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Razón Social</label>
                      <input value={editForm.nombre} onChange={(e) => actualizarCampoEdit("nombre", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold" />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Rubro</label>
                      <input value={editForm.rubro} onChange={(e) => actualizarCampoEdit("rubro", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold" />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Clave de Acceso</label>
                      <input value={editForm.claveAcceso} onChange={(e) => actualizarCampoEdit("claveAcceso", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold" />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Logo Corporativo (PNG/JPG)</label>
                      <input type="file" accept="image/*" onChange={manejarSubidaLogo} className="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-1.5" />
                      {logoInfoTxt && <p className="text-[10px] font-bold text-emerald-600 mt-1">{logoInfoTxt}</p>}
                    </div>
                  </div>

                  {editForm.logoBase64 && (
                    <div className="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-xl p-3">
                      <img src={editForm.logoBase64} alt="Logo" className="h-12 object-contain bg-white rounded-lg p-1 border border-slate-200" />
                      <button type="button" onClick={() => actualizarCampoEdit("logoBase64", "")} className="text-xs font-bold text-rose-600 hover:underline cursor-pointer">
                        Quitar logo
                      </button>
                    </div>
                  )}

                  {/* Campos exclusivos de Venezuela */}
                  {editForm._pais === "VE" && (
                    <div className="space-y-4 pt-2 border-t border-slate-200">
                      <div className="text-xs font-extrabold uppercase tracking-wider text-slate-500">Configuración Comercial Venezuela</div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div className="sm:col-span-2">
                          <label className="text-[11px] font-bold text-slate-600 block mb-1">Dirección Comercial</label>
                          <input value={editForm.direccion} onChange={(e) => actualizarCampoEdit("direccion", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold" />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-600 block mb-1">Teléfonos</label>
                          <input value={editForm.telefonos} onChange={(e) => actualizarCampoEdit("telefonos", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold" />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-600 block mb-1">Correo</label>
                          <input value={editForm.correo} onChange={(e) => actualizarCampoEdit("correo", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold" />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-600 block mb-1">Factor Mayor (ej: 2.0)</label>
                          <input type="number" step="0.1" value={editForm.factorMayor} onChange={(e) => actualizarCampoEdit("factorMayor", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold" />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-600 block mb-1">Factor Detal (ej: 2.5)</label>
                          <input type="number" step="0.1" value={editForm.factorDetal} onChange={(e) => actualizarCampoEdit("factorDetal", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold" />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-600 block mb-1">Último Correlativo Nota de Entrega</label>
                          <input type="number" value={editForm.notaEntregaActual} onChange={(e) => actualizarCampoEdit("notaEntregaActual", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold" />
                        </div>
                      </div>

                      <div className="space-y-2 pt-2">
                        <div className="text-xs font-extrabold uppercase tracking-wider text-slate-500">Módulos Activos Venezuela</div>
                        {SWITCHES_VE.map((item) => (
                          <div key={item.key} onClick={() => toggleModuloEdit(item.key)} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200 cursor-pointer">
                            <div>
                              <span className="text-[10px] font-extrabold text-amber-700 mr-2">{item.code}</span>
                              <span className="text-xs font-bold text-slate-800">{item.label}</span>
                            </div>
                            <SwitchItem checked={!!editForm.modulos?.[item.key]} onChange={() => toggleModuloEdit(item.key)} />
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Módulos exclusivos de Chile */}
                  {editForm._pais === "CL" && (
                    <div className="space-y-4 pt-2 border-t border-slate-200">
                      {GRUPOS_SWITCHES.map((grupo) => (
                        <div key={grupo.titulo} className="space-y-2">
                          <div className="text-xs font-extrabold uppercase tracking-wider text-slate-500">{grupo.titulo}</div>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            {grupo.items.map((item) => (
                              <div key={item.key} onClick={() => toggleModuloEdit(item.key)} className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200 cursor-pointer">
                                <div className="min-w-0 pr-2">
                                  <span className="text-[10px] font-extrabold text-slate-400 mr-1.5">{item.code}</span>
                                  <span className="text-xs font-bold text-slate-800">{item.label}</span>
                                </div>
                                <SwitchItem checked={!!editForm.modulos?.[item.key]} onChange={() => toggleModuloEdit(item.key)} />
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>

          {/* Modal Crear Empresa */}
          {crearAbierto && (
            <div className="fixed inset-0 bg-slate-950/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={crearEmpresaNueva} className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-slate-950">Nueva Empresa</h3>
                  <button type="button" onClick={() => setCrearAbierto(false)} className="text-xs font-bold text-slate-500 cursor-pointer">Cerrar ✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={() => { setNuevoPais("CL"); setNuevoRut(""); }} className={`py-2.5 rounded-xl text-xs font-extrabold border cursor-pointer ${nuevoPais === "CL" ? "bg-slate-950 text-white border-slate-950" : "bg-slate-50 text-slate-700 border-slate-200"}`}>
                    Chile (RUT / SII)
                  </button>
                  <button type="button" onClick={() => { setNuevoPais("VE"); setNuevoRut(""); }} className={`py-2.5 rounded-xl text-xs font-extrabold border cursor-pointer ${nuevoPais === "VE" ? "bg-slate-950 text-white border-slate-950" : "bg-slate-50 text-slate-700 border-slate-200"}`}>
                    Venezuela (RIF / BCV)
                  </button>
                </div>

                <div className="space-y-3">
                  <input
                    value={nuevoRut}
                    onChange={(e) => setNuevoRut(nuevoPais === "VE" ? formatearDocVE(e.target.value) : formatearRut(e.target.value))}
                    placeholder={nuevoPais === "VE" ? "RIF o Cédula (Ej: J-50343856-8)" : "RUT Empresa (Ej: 77.528.042-5)"}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-bold"
                    required
                  />
                  <input value={nuevoNombre} onChange={(e) => setNuevoNombre(e.target.value)} placeholder="Razón Social (Ej: INVERSIONES V&D 2023, C.A)" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-semibold" required />
                  <input value={nuevoRubro} onChange={(e) => setNuevoRubro(e.target.value)} placeholder="Rubro" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-semibold" />
                  <input value={nuevaClave} onChange={(e) => setNuevaClave(e.target.value)} placeholder="Clave de acceso inicial" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-semibold" required />

                  {nuevoPais === "VE" && (
                    <div className="space-y-3 pt-2 border-t border-slate-200">
                      <input value={veDireccion} onChange={(e) => setVeDireccion(e.target.value)} placeholder="Dirección comercial" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />
                      <div className="grid grid-cols-2 gap-2">
                        <input value={veTelefonos} onChange={(e) => setVeTelefonos(e.target.value)} placeholder="Teléfonos" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />
                        <input value={veCorreo} onChange={(e) => setVeCorreo(e.target.value)} placeholder="Correo electrónico" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />
                      </div>
                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <label className="text-[10px] font-bold text-slate-500">Mayor (×)</label>
                          <input type="number" step="0.1" value={veFactorMayor} onChange={(e) => setVeFactorMayor(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold" />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-slate-500">Detal (×)</label>
                          <input type="number" step="0.1" value={veFactorDetal} onChange={(e) => setVeFactorDetal(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold" />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-slate-500">Folio Inicial</label>
                          <input type="number" value={veFolioInicial} onChange={(e) => setVeFolioInicial(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold" />
                        </div>
                      </div>
                      <label className="flex items-center gap-2 text-xs font-bold text-slate-700">
                        <input type="checkbox" checked={veDobleInv} onChange={(e) => setVeDobleInv(e.target.checked)} />
                        Activar doble inventario (Almacén + Planta)
                      </label>
                    </div>
                  )}
                </div>

                <button type="submit" disabled={procesando} className="w-full bg-slate-950 hover:bg-slate-800 text-white font-extrabold py-3.5 rounded-2xl text-xs uppercase tracking-wider cursor-pointer">
                  {procesando ? "Creando..." : `Crear Empresa (${nuevoPais})`}
                </button>
              </form>
            </div>
          )}

          {/* Modal Cambiar PIN */}
          {seguridadAbierta && (
            <div className="fixed inset-0 bg-slate-950/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={cambiarPinMaestro} className="bg-white rounded-3xl max-w-sm w-full p-6 space-y-3 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-extrabold text-slate-950">Cambiar PIN Maestro</h3>
                  <button type="button" onClick={() => setSeguridadAbierta(false)} className="text-xs font-bold text-slate-500 cursor-pointer">Cerrar ✕</button>
                </div>
                <input type="password" value={pinActualMaster} onChange={(e) => setPinActualMaster(e.target.value)} placeholder="PIN Actual" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" required />
                <input type="password" value={pinNuevoMaster} onChange={(e) => setPinNuevoMaster(e.target.value)} placeholder="Nuevo PIN" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" required />
                <input type="password" value={pinConfirmMaster} onChange={(e) => setPinConfirmMaster(e.target.value)} placeholder="Confirmar Nuevo PIN" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" required />
                <button type="submit" className="w-full bg-slate-950 text-white font-extrabold py-3 rounded-xl text-xs uppercase cursor-pointer">Actualizar PIN</button>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SuperAdminApp />);
  </script>
</body>
</html>
