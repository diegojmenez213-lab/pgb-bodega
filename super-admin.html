    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    // VALIDADOR OFICIAL DE RUT CHILENO (MÓDULO 11)
    const validarRutChileno = (rut) => {
      const limpio = limpiarRut(rut);
      if (limpio.length < 7 || limpio.length > 9) return false;
      const cuerpo = limpio.slice(0, -1);
      const dv = limpio.slice(-1);
      if (!/^\d+$/.test(cuerpo)) return false;
      let suma = 0;
      let multiplo = 2;
      for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo.charAt(i), 10) * multiplo;
        multiplo = multiplo < 7 ? multiplo + 1 : 2;
      }
      const dvEsperado = 11 - (suma % 11);
      const dvCalc = dvEsperado === 11 ? "0" : dvEsperado === 10 ? "K" : String(dvEsperado);
      return dv === dvCalc;
    };

    const fechaIsoChile = (ts = Date.now()) => {
      try {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Santiago",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(new Date(ts));
      } catch (e) {
        const d = new Date(ts);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
    };

    // COMPRESOR AUTOMÁTICO DE LOGOTIPOS PARA NUNCA SUPERAR EL LÍMITE DE 1 MB DE FIRESTORE
    const comprimirLogoImagen = (file) => {
      return new Promise((resolve, reject) => {
        const urlObj = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const MAX_W = 520;
            const MAX_H = 240;
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            const ratio = Math.min(1, MAX_W / w, MAX_H / h);
            w = Math.max(1, Math.round(w * ratio));
            h = Math.max(1, Math.round(h * ratio));

            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);

            let dataUrl = canvas.toDataURL("image/webp", 0.85);

            if (!dataUrl.startsWith("data:image/webp")) {
              dataUrl = canvas.toDataURL("image/png");
            }

            if (dataUrl.length > 350000) {
              const canvasJpg = document.createElement("canvas");
              canvasJpg.width = w;
              canvasJpg.height = h;
              const ctxJpg = canvasJpg.getContext("2d");
              ctxJpg.fillStyle = "#ffffff";
              ctxJpg.fillRect(0, 0, w, h);
              ctxJpg.drawImage(img, 0, 0, w, h);
              dataUrl = canvasJpg.toDataURL("image/jpeg", 0.82);
            }

            URL.revokeObjectURL(urlObj);

            if (dataUrl.length > 480000) {
              return reject(new Error("La imagen sigue siendo demasiado pesada incluso tras comprimir. Usa un archivo más simple."));
            }

            const kb = Math.max(1, Math.round((dataUrl.length * 0.75) / 1024));
            resolve({ dataUrl, kb, w, h });
          } catch (err) {
            URL.revokeObjectURL(urlObj);
            reject(err);
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(urlObj);
          reject(new Error("No se pudo leer la imagen seleccionada."));
        };
        img.src = urlObj;
      });
    };

    const MODULOS_DEFAULT = {

        ]

    ];

    const SwitchItem = ({ checked, onChange }) => (
      <button
        type="button"
        role="switch"
        aria-checked={checked}
        onClick={(e) => {
          if (onChange) {
            e.stopPropagation();
            onChange();
          }
        }}
        className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ${
          checked ? "bg-slate-900" : "bg-slate-200"
        }`}
      >
        <span
          className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow transition duration-200 ${
            checked ? "translate-x-5" : "translate-x-0"

        />

    function SuperAdminApp() {
      const [autorizado, setAutorizado] = useState(() => sessionStorage.getItem("nexus_admin_ok") === "1");
      const [pinInput, setPinInput] = useState("");
      const [pinError, setPinError] = useState("");

      const [empresas, setEmpresas] = useState([]);
      const [seleccionadaId, setSeleccionadaId] = useState("");
      const [guardando, setGuardando] = useState(false);
      const [creandoEmpresa, setCreandoEmpresa] = useState(false);
      const [logoInfoTxt, setLogoInfoTxt] = useState("");
      const [hayCambiosSinGuardar, setHayCambiosSinGuardar] = useState(false);

      // Formulario nueva empresa
      const [crearAbierto, setCrearAbierto] = useState(false);
      const [nuevoNombre, setNuevoNombre] = useState("");
      const [nuevoRut, setNuevoRut] = useState("");
      const [nuevoRubro, setNuevoRubro] = useState("Comercio y Retail");
      const [nuevaClave, setNuevaClave] = useState("");

      // Edición empresa seleccionada
      const [editForm, setEditForm] = useState(null);
      const ultimoIdCargadoRef = useRef("");

      useEffect(() => {
        if (!autorizado) return;
        auth.signInAnonymously().catch(() => {});
        const unsub = db.collection("saas_empresas").onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
          setEmpresas(lista);
          setSeleccionadaId((prev) => {
            if (prev && lista.some((e) => e.id === prev)) return prev;
            if (lista.length > 0) {
              const tecno = lista.find((e) => e.id === "775280425") || lista[0];
              return tecno.id;
            }
            return "";
          });
        });
        return () => unsub();
      }, [autorizado]);

      // Carga editForm SOLO al cambiar de empresa seleccionada (evita pisar cambios en curso por snapshots externos)
      useEffect(() => {
        if (!seleccionadaId || seleccionadaId === ultimoIdCargadoRef.current) return;
        const emp = empresas.find((e) => e.id === seleccionadaId);
        if (emp) {
          ultimoIdCargadoRef.current = seleccionadaId;
          setEditForm({
            id: emp.id,
            nombre: emp.nombre || "",
            rut: emp.rut || formatearRut(emp.id),
            rubro: emp.rubro || "",
            claveAcceso: emp.claveAcceso || emp.pin || "",
            activa: emp.activa !== false,
            temaVisual: emp.temaVisual || "claro_retail",
            logoBase64: emp.logoBase64 || "",
            tienePinSupervisor: Boolean(emp.pinSupervisorHash || emp.pinSupervisor),
            modulosActivos: { ...MODULOS_DEFAULT, ...(emp.modulosActivos || {}) }
          });
          setLogoInfoTxt(emp.logoBase64 ? `${Math.max(1, Math.round((emp.logoBase64.length * 0.75) / 1024))} KB` : "");
          setHayCambiosSinGuardar(false);
        }
      }, [seleccionadaId, empresas]);

      const validarPin = (e) => {
        e.preventDefault();
        if (pinInput.trim() === PIN_MAESTRO) {
          sessionStorage.setItem("nexus_admin_ok", "1");
          setAutorizado(true);
        } else {
          setPinError("PIN maestro incorrecto.");
        }
      };

      const cerrarAdmin = () => {
        sessionStorage.clear();
        localStorage.removeItem("nexus_empresa_rut");
        window.location.replace("index.html");
      };

      const entrarComoEmpresa = (rutId) => {
        if (hayCambiosSinGuardar) {
          const seguir = confirm("Tienes cambios sin guardar en esta empresa. ¿Deseas salir sin guardarlos?");
          if (!seguir) return;
        }
        const rutLimpio = limpiarRut(rutId);
        sessionStorage.removeItem("nexus_admin_ok");
        localStorage.setItem("nexus_empresa_rut", rutLimpio);
        localStorage.setItem("nexus_session_ts", String(Date.now()));
        if (rutLimpio === RUT_PGB) {
          window.location.replace("pgb-operacion.html");
        } else {
          window.location.replace("empresa-panel.html");
        }
      };

      // BLOQUEA SOBRESCRITURA ACCIDENTAL SI EL RUT YA EXISTE EN FIRESTORE
      const crearNuevaEmpresa = async (e) => {
        e.preventDefault();
        const rutLimpio = limpiarRut(nuevoRut);
        if (rutLimpio.length < 7 || !nuevoNombre.trim()) {
          return alert("Completa Razón Social y un RUT válido.");
        }

        if (!validarRutChileno(rutLimpio)) {
          const continuarInvalido = confirm(
            `El RUT ${formatearRut(rutLimpio)} no pasa la validación Módulo 11 del SII.\n\n¿Deseas crearlo de todas formas (solo recomendado para pruebas)?`
          );
          if (!continuarInvalido) return;
        }

        setCreandoEmpresa(true);
        try {
          const docRef = db.collection("saas_empresas").doc(rutLimpio);
          const snapExistente = await docRef.get();

          if (snapExistente.exists) {
            const datosExist = snapExistente.data() || {};
            alert(
              `RUT DUPLICADO BLOQUEADO: El RUT ${formatearRut(rutLimpio)} ya está registrado bajo "${datosExist.nombre || rutLimpio}".\n\n` +
              `No se modificaron sus datos ni sus 18 switches. Se abrirá su ficha existente para editar.`
            );
            ultimoIdCargadoRef.current = "";
            setSeleccionadaId(rutLimpio);
            setCrearAbierto(false);
            setCreandoEmpresa(false);
            return;
          }

          const ahora = Date.now();
          await docRef.set({
            nombre: nuevoNombre.trim().toUpperCase(),
            rut: formatearRut(rutLimpio),
            rubro: nuevoRubro.trim(),
            claveAcceso: nuevaClave.trim(),
            activa: true,
            temaVisual: "claro_retail",
            modulosActivos: { ...MODULOS_DEFAULT },
            fechaCreacion: fechaIsoChile(ahora),
            creadoTs: ahora
          });

          ultimoIdCargadoRef.current = "";
          setSeleccionadaId(rutLimpio);
          setCrearAbierto(false);
          setNuevoNombre("");
          setNuevoRut("");
          setNuevaClave("");
        } catch (err) {
          alert("Error al crear empresa: " + err.message);
        }
        setCreandoEmpresa(false);
      };

      const subirLogoEmpresa = async (e) => {
        const file = e.target.files[0];
        if (!file || !editForm) return;
        e.target.value = "";
        try {
          const res = await comprimirLogoImagen(file);
          setEditForm({ ...editForm, logoBase64: res.dataUrl });
          setLogoInfoTxt(`${res.w}×${res.h}px • ${res.kb} KB (Optimizado)`);
          setHayCambiosSinGuardar(true);
        } catch (err) {
          alert("Error al optimizar logo: " + err.message);
        }
      };

      const quitarLogoEmpresa = () => {
        if (!editForm) return;
        setEditForm({ ...editForm, logoBase64: "" });
        setLogoInfoTxt("");
        setHayCambiosSinGuardar(true);
      };

      const actualizarCampoEdit = (campo, valor) => {
        if (!editForm) return;
        setEditForm({ ...editForm, [campo]: valor });
        setHayCambiosSinGuardar(true);
      };

      const toggleSwitch = (key) => {
        if (!editForm) return;
        setEditForm({
          ...editForm,
          modulosActivos: {
            ...editForm.modulosActivos,
            [key]: !editForm.modulosActivos[key]
          }
        });
        setHayCambiosSinGuardar(true);
      };

      const restablecerPinSupervisorCliente = async () => {
        if (!editForm) return;
        if (!confirm(`¿Restablecer la Clave de Supervisor de ${editForm.nombre} a la clave por defecto (1234)?`)) return;
        try {
          await db.collection("saas_empresas").doc(editForm.id).update({
            pinSupervisorHash: FieldValue.delete(),
            pinSupervisor: FieldValue.delete()
          });
          setEditForm({ ...editForm, tienePinSupervisor: false });
          alert(`Clave de Supervisor de ${editForm.nombre} restablecida a 1234.`);
        } catch (err) {
          alert("Error al restablecer clave: " + err.message);
        }
      };

      const guardarCambiosEmpresa = async () => {
        if (!editForm) return;
        setGuardando(true);
        try {
          await db.collection("saas_empresas").doc(editForm.id).set({
            nombre: editForm.nombre.trim(),
            rut: editForm.rut.trim(),
            rubro: editForm.rubro.trim(),
            claveAcceso: editForm.claveAcceso.trim(),
            activa: editForm.activa,
            temaVisual: editForm.temaVisual,
            logoBase64: editForm.logoBase64,
            modulosActivos: editForm.modulosActivos
          }, { merge: true });
          setHayCambiosSinGuardar(false);
          alert(`Configuración y switches de ${editForm.nombre} guardados en tiempo real.`);
        } catch (err) {
          alert("Error al guardar: " + err.message);
        }
        setGuardando(false);
      };

      if (!autorizado) {
        return (
          <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
            <form onSubmit={validarPin} className="bg-slate-900 border border-slate-800 rounded-3xl p-7 max-w-sm w-full space-y-4 shadow-2xl">
              <div className="text-center space-y-1">
                <span className="text-[10px] font-extrabold uppercase tracking-widest text-indigo-400">Acceso Restringido</span>
                <h1 className="text-xl font-extrabold">Consola Maestra NEXUS</h1>
                <p className="text-xs text-slate-400">Ingresa el PIN de administración</p>
              </div>
              {pinError && <p className="text-xs text-rose-400 font-bold text-center">{pinError}</p>}
              <input
                type="password"
                value={pinInput}
                onChange={(e) => setPinInput(e.target.value)}
                placeholder="PIN Maestro"
                className="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-center text-sm font-extrabold tracking-widest outline-none"
                autoFocus
                required
              />
              <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 font-extrabold py-3.5 rounded-2xl text-xs uppercase cursor-pointer">
                Desbloquear Consola
              </button>
              <a href="index.html" className="block text-center text-xs text-slate-500 hover:text-slate-300 pt-1">
                Volver al Portal de Empresas
              </a>
            </form>
          </div>
        );
      }

      const rutNuevoLimpio = limpiarRut(nuevoRut);
      const rutNuevoYaExiste = rutNuevoLimpio.length >= 7 && empresas.some((emp) => emp.id === rutNuevoLimpio);

      return (
        <div className="max-w-4xl mx-auto px-4 pt-5 pb-24 space-y-4">

            <div>
              <span className="text-[10px] font-extrabold uppercase tracking-wider bg-slate-900 text-white px-2.5 py-0.5 rounded-full">
                NEXUS ERP • SUPER ADMIN
              </span>
              <h1 className="text-xl font-extrabold text-slate-900 mt-1">Control Multi-Empresa y Switches</h1>
            </div>
            <div className="flex flex-wrap gap-2">

              </button>

              </button>

                Salir
              </button>
            </div>
          </div>

          {/* CREAR NUEVA EMPRESA (CON ESCUDO ANTI-DUPLICADOS Y VALIDADOR MÓDULO 11) */}
          {crearAbierto && (
            <form onSubmit={crearNuevaEmpresa} className="bg-white border-2 border-blue-600 rounded-2xl p-5 space-y-3 shadow-md">
              <h2 className="text-sm font-extrabold text-slate-900">Registrar Nueva Empresa Cliente</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="text" value={nuevoNombre} onChange={(e) => setNuevoNombre(e.target.value)} placeholder="Razón Social *" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold" required />

                  <input type="text" value={nuevoRut} onChange={(e) => setNuevoRut(formatearRut(e.target.value))} placeholder="RUT Empresa (Ej: 77.528.042-5) *" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold" required />
                  {rutNuevoLimpio.length >= 7 && (
                    <p className={`text-[10px] font-bold mt-1 ${rutNuevoYaExiste ? "text-rose-600" : validarRutChileno(rutNuevoLimpio) ? "text-emerald-600" : "text-amber-600"}`}>
                      {rutNuevoYaExiste
                        ? "✕ Este RUT ya existe en el sistema (no se sobrescribirá)"
                        : validarRutChileno(rutNuevoLimpio)
                          ? "✓ RUT chileno válido (Módulo 11)"
                          : "⚠️ Dígito verificador no coincide con Módulo 11"}
                    </p>
                  )}
                </div>
                <input type="text" value={nuevoRubro} onChange={(e) => setNuevoRubro(e.target.value)} placeholder="Rubro" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold" />
                <input type="text" value={nuevaClave} onChange={(e) => setNuevaClave(e.target.value)} placeholder="Clave de Acceso (Opcional)" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold" />
              </div>
              <button
                type="submit"
                disabled={creandoEmpresa || rutNuevoYaExiste}
                className="w-full bg-blue-700 hover:bg-blue-800 disabled:opacity-40 text-white font-extrabold py-3 rounded-xl text-xs cursor-pointer"
              >
                {creandoEmpresa ? "Verificando y Creando..." : rutNuevoYaExiste ? "RUT ya registrado — Selecciónalo abajo" : "Crear Empresa en Firestore"}
              </button>
            </form>
          )}

          {/* SELECTOR DE EMPRESA */}
          <div className="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div className="flex-1">
              <label className="text-[10px] font-extrabold uppercase text-slate-500 block mb-1">Empresa Configurando</label>
              <select
                value={seleccionadaId}
                onChange={(e) => {
                  if (hayCambiosSinGuardar && !confirm("Tienes cambios sin guardar. ¿Cambiar de empresa de todos modos?")) return;
                  ultimoIdCargadoRef.current = "";
                  setSeleccionadaId(e.target.value);
                }}
                className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-extrabold text-slate-900"
              >
                {empresas.map((emp) => (
                  <option key={emp.id} value={emp.id}>
                    {emp.nombre} — RUT {emp.rut || formatearRut(emp.id)}
                  </option>
                ))}
              </select>
            </div>
            {editForm && (
              <button
                type="button"
                onClick={() => entrarComoEmpresa(editForm.id)}
                className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold px-4 py-3 rounded-xl cursor-pointer shrink-0 sm:mt-4"
              >
                Abrir Panel Cliente →
              </button>
            )}
          </div>

          {/* FICHA DE EDICIÓN Y 18 SWITCHES */}
          {editForm && (
            <div className="space-y-4">
              {hayCambiosSinGuardar && (
                <div className="bg-amber-50 border border-amber-300 text-amber-900 rounded-2xl px-4 py-3 flex items-center justify-between gap-3 text-xs">
                  <span className="font-bold">Tienes cambios pendientes por guardar en {editForm.nombre}.</span>
                  <button
                    type="button"
                    onClick={guardarCambiosEmpresa}
                    disabled={guardando}
                    className="bg-slate-900 text-white font-extrabold px-3.5 py-1.5 rounded-xl cursor-pointer shrink-0"
                  >
                    {guardando ? "Guardando..." : "Guardar Ahora"}
                  </button>
                </div>
              )}

              <div className="bg-white border border-slate-200 rounded-2xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                  <h2 className="text-sm font-extrabold text-slate-900">Identidad, Clave y Tema Predeterminado</h2>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-slate-600">{editForm.activa ? "Activa" : "Pausada"}</span>
                    <SwitchItem checked={editForm.activa} onChange={() => actualizarCampoEdit("activa", !editForm.activa)} />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="text-[11px] font-bold text-slate-500 block mb-1">Nombre / Razón Social</label>
                    <input type="text" value={editForm.nombre} onChange={(e) => actualizarCampoEdit("nombre", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-500 block mb-1">Clave de Acceso Portal</label>
                    <input type="text" value={editForm.claveAcceso} onChange={(e) => actualizarCampoEdit("claveAcceso", e.target.value)} placeholder="Sin clave = acceso por RUT" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-500 block mb-1">Tema Visual Inicial</label>
                    <select value={editForm.temaVisual} onChange={(e) => actualizarCampoEdit("temaVisual", e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold">
                      <option value="claro_retail">Claro Retail & E-Commerce (Predeterminado)</option>
                      <option value="claro_ejecutivo">Claro Ejecutivo (Softland Pro)</option>
                      <option value="oscuro_obsidian">Modo Oscuro Obsidian</option>
                      <option value="claro_esmeralda">Claro Operaciones & Bodega</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-500 block mb-1">
                      Logotipo Empresa (Compresión automática anti-límite)
                    </label>
                    <div className="flex items-center gap-2">
                      <label className="flex-1 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-center cursor-pointer">
                        Subir Logo
                        <input type="file" accept="image/*" onChange={subirLogoEmpresa} className="hidden" />
                      </label>
                      {editForm.logoBase64 && (
                        <>
                          <img src={editForm.logoBase64} alt="Logo" className="h-9 w-14 object-contain border border-slate-200 rounded-lg bg-white p-0.5 shrink-0" />
                          <button
                            type="button"
                            onClick={quitarLogoEmpresa}
                            className="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl px-2.5 py-2 text-xs font-bold cursor-pointer shrink-0"
                            title="Quitar logo"
                          >
                            Quitar
                          </button>
                        </>
                      )}
                    </div>
                    {logoInfoTxt && <p className="text-[10px] font-semibold text-emerald-700 mt-1">Peso optimizado: {logoInfoTxt}</p>}
                  </div>
                </div>

                {/* RESCATE DE CLAVE DE SUPERVISOR DEL CLIENTE */}
                <div className="pt-3 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                  <div>
                    <span className="font-extrabold text-slate-800 block">Soporte Clave de Supervisor del Cliente</span>
                    <span className="text-[11px] text-slate-500">
                      Estado actual: {editForm.tienePinSupervisor ? "Clave personalizada (SHA-256)" : "Clave inicial predeterminada (1234)"}
                    </span>
                  </div>
                  <button
                    type="button"
                    onClick={restablecerPinSupervisorCliente}
                    className="bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 font-extrabold px-3.5 py-2 rounded-xl text-xs cursor-pointer shrink-0"
                  >
                    Restablecer Clave Supervisor (1234)
                  </button>
                </div>
              </div>

              {/* LOS 5 BLOQUES DE SWITCHES */}
              {GRUPOS_SWITCHES.map((grupo) => (
                <div key={grupo.titulo} className="bg-white border border-slate-200 rounded-2xl p-5 space-y-2.5">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-500">{grupo.titulo}</h3>
                  <div className="space-y-2">
                    {grupo.items.map((sw) => {
                      const activo = Boolean(editForm.modulosActivos[sw.key]);
                      return (
                        <div
                          key={sw.key}
                          onClick={() => toggleSwitch(sw.key)}
                          className={`p-3.5 rounded-xl border flex items-center justify-between cursor-pointer transition ${
                            activo ? "border-slate-900 bg-slate-50/70" : "border-slate-200 opacity-75"
                          }`}
                        >
                          <div>
                            <span className="text-[10px] font-extrabold text-slate-400 block">{sw.code}</span>
                            <span className="text-xs font-extrabold text-slate-900">{sw.label}</span>
                          </div>
                          <SwitchItem checked={activo} onChange={() => toggleSwitch(sw.key)} />
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}

              <button
                type="button"
                onClick={guardarCambiosEmpresa}
                disabled={guardando}
                className="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-4 rounded-2xl text-xs uppercase tracking-wider shadow-lg cursor-pointer"
              >
                {guardando ? "Guardando en Firestore..." : `Guardar Switches y Configuración de ${editForm.nombre}`}
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SuperAdminApp />);
  </script>
</body>
</html>
