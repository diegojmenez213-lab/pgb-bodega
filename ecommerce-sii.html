    // GUARDIA DE SEGURIDAD INMEDIATO (BLOQUEA RETROCESO / BFCACHE ENTRE EMPRESAS)
    (function () {
      var limpiar = function (r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); };
      var rutInicial = limpiar(localStorage.getItem("nexus_empresa_rut"));
      if (!rutInicial) {
        window.location.replace("index.html");
      }
      window.addEventListener("pageshow", function (ev) {
        var rutActual = limpiar(localStorage.getItem("nexus_empresa_rut"));
        if (!rutActual) {
          window.location.replace("index.html");
        } else if (ev.persisted && rutActual !== rutInicial) {
          window.location.reload();
        }
      });
      window.addEventListener("storage", function (ev) {
        if (ev.key === "nexus_empresa_rut") {
          var rutNuevo = limpiar(ev.newValue);
          if (!rutNuevo) window.location.replace("index.html");
          else if (rutNuevo !== rutInicial) window.location.reload();
        }
      });
    })();
  </script>

      useEffect(() => {
        if (!rutActivo) {
          window.location.replace("index.html");
          return;
        }

        let unsubs = [];
        const conectar = () => {
          const empRef = db.collection("saas_empresas").doc(rutActivo);

          const u1 = empRef.onSnapshot((doc) => {
            if (doc.exists) {
              const data = { id: doc.id, ...doc.data() };
              if (data.activa === false) {
                localStorage.removeItem("nexus_empresa_rut");
                window.location.replace("index.html");
                return;
              }
              setEmpresa(data);
              if (data.apis) setApisForm((prev) => ({ ...prev, ...data.apis }));
              if (data.datosEmisor) setDatosEmisor((prev) => ({ ...prev, ...data.datosEmisor }));
              if (data.cafConfig) setCafConfig((prev) => ({ ...prev, ...data.cafConfig }));
            } else {
              localStorage.removeItem("nexus_empresa_rut");
              window.location.replace("index.html");
            }
          });

          const colCat = rutActivo === RUT_PGB
            ? db.collection("catalogo_productos")
            : empRef.collection("catalogo");

          const u2 = colCat.onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({
              id: d.id,
              stockOnline: 0,
              ...d.data()
            }));
            lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));

          });

          const u3 = empRef.collection("ecommerce_ordenes").onSnapshot((snap) => {

            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

          unsubs = [u1, u2, u3];
        };

        auth.signInAnonymously().then(conectar).catch(conectar);
        return () => unsubs.forEach((fn) => typeof fn === "function" && fn());

          productoNombre: prodObj.nombre,
          cantidad: Number(cantidadNueva),
          totalClp: Number(totalNuevo),
          tipoDte,
          folioSii: folioAsignado,
          timbradoSii: true,
          enviadoMarketplace: !esLider,
          esSimulacion: !esRealSii,
          colaImpresion: esLider ? "lider" : "general",
          etiquetaImpresa: false,
          despachado: false,
          fechaIso: new Date(ahora).toISOString().slice(0, 10),
          horaCorta: new Date(ahora).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }),
          fecha: new Date(ahora).toLocaleString("es-CL"),
          timestamp: ahora
        };

        try {
          const batch = db.batch();
          batch.set(empRef().collection("ecommerce_ordenes").doc(), nuevaOrden);

          if (prodObj.id && prodObj.id !== "manual") {
            const nuevoStock = Math.max(0, (Number(prodObj.stockOnline) || 0) - Number(cantidadNueva));
            batch.update(catRef().doc(prodObj.id), { stockOnline: nuevoStock });
          }

          const nuevoCaf = {
            ...cafConfig,
            factura33Actual: esFactura33 ? cafConfig.factura33Actual + 1 : cafConfig.factura33Actual,
            boleta39Actual: !esFactura33 ? cafConfig.boleta39Actual + 1 : cafConfig.boleta39Actual
          };
          batch.set(empRef(), { cafConfig: nuevoCaf }, { merge: true });

          await batch.commit();
          setMostrarNuevaOrden(false);
          setOrdenExtNuevo("");
          setCompradorNuevo("");
          setRutCompradorNuevo("");
        } catch (err) {
          alert("Error al procesar orden: " + err.message);
        }
      };

      const eliminarSimulacion = async (orden) => {
        if (orden.esSimulacion === false) {
          return alert("Este documento fue emitido en vivo por el SII y no puede eliminarse por normativa tributaria.");
        }
        if (!confirm(`¿Eliminar la simulación ${orden.tipoDte === 33 ? "Factura 33" : "Boleta 39"} #${orden.folioSii}?`)) return;
        const batch = db.batch();
        batch.delete(empRef().collection("ecommerce_ordenes").doc(orden.id));
        const esFactura33 = orden.tipoDte === 33;
        batch.set(
          empRef(),
          {
            cafConfig: {
              ...cafConfig,
              factura33Actual: esFactura33 ? Math.max(1, cafConfig.factura33Actual - 1) : cafConfig.factura33Actual,
              boleta39Actual: !esFactura33 ? Math.max(1, cafConfig.boleta39Actual - 1) : cafConfig.boleta39Actual
            }
          },
          { merge: true }
        );
        await batch.commit();
      };

      const actualizarStockProducto = async (prodId, nuevoStock) => {
        await catRef().doc(prodId).update({ stockOnline: Math.max(0, Number(nuevoStock)) });
      };

      const guardarNuevosFoliosCaf = async (e) => {
        e.preventDefault();
        await empRef().set({ cafConfig, datosEmisor }, { merge: true });

            return (
              String(o.folioSii || "").includes(q) ||
              (o.comprador || "").toLowerCase().includes(q) ||
              (o.ordenExterna || "").toLowerCase().includes(q) ||
              (o.productoNombre || "").toLowerCase().includes(q)
            );

          .sort((a, b) => (b.fechaImpresionTs || b.timestamp || 0) - (a.fechaImpresionTs || a.timestamp || 0));

                              {o.cantidad}x {o.productoNombre}
                            </p>
                            <p className="text-xs text-slate-600 mt-0.5">
                              {o.comprador} {o.rutComprador ? `• RUT: ${o.rutComprador}` : "• Boleta Consumidor Final"}
                            </p>
                            <p className="text-xs font-extrabold text-slate-900 mt-1">
                              Total: ${Number(o.totalClp || 0).toLocaleString("es-CL")} CLP • <span className="font-normal text-slate-500">{o.fecha}</span>
                            </p>
                          </div>

                          <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                            <div className="flex items-center gap-2">
                              <button
                                onClick={() => setDteVisualizando(o)}
                                className={`px-3.5 py-2 rounded-xl text-xs font-bold cursor-pointer ${tema.btn}`}
                              >
                                {o.etiquetaImpresa ? "Reimprimir" : `Imprimir ${o.tipoDte === 33 ? "Factura" : "Boleta"}`}
                              </button>

                              {esSimulada && (
                                <button
                                  onClick={() => eliminarSimulacion(o)}
                                  className="px-3 py-2 rounded-xl text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 cursor-pointer"
                                >
                                  Eliminar
                                </button>
                              )}
                            </div>

                            <button
                              onClick={() => marcarDespachado(o.id, o.despachado)}
                              className={`px-3 py-2 rounded-xl text-xs font-bold cursor-pointer ${
                                o.despachado ? "bg-emerald-700 text-white" : "bg-slate-200 text-slate-800"
                              }`}
                            >
                              {o.despachado ? "Despachado" : "Despachar"}
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {tab === "impresion" && (
              <div className="space-y-5">
                <div className="corp-card rounded-2xl p-6 space-y-5">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                    <div>
                      <h2 className="text-base font-extrabold text-slate-900">
                        Cola de Lote PDF — Documentos Nuevos ({ordenesSinImprimirCronologicas.length})
                      </h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Aquí solo aparecen las facturas y boletas timbradas que <strong>aún no se han impreso</strong>, ordenadas por hora de llegada (primero la más antigua). Al imprimirlas pasan automáticamente al historial de abajo para nunca repetir.
                      </p>
                    </div>
                    {ordenesSinImprimirCronologicas.length > 0 && (
                      <div className="flex flex-wrap gap-2 shrink-0">
                        <button
                          type="button"
                          onClick={seleccionarTodosPendientesLote}
                          className="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold px-3.5 py-2.5 rounded-xl cursor-pointer"
                        >
                          Seleccionar Todas ({ordenesSinImprimirCronologicas.length})
                        </button>
                        {seleccionLoteIds.length > 0 && (
                          <button
                            type="button"
                            onClick={() => setSeleccionLoteIds([])}
                            className="text-xs font-bold text-slate-500 hover:text-slate-900 px-2.5 py-2.5 cursor-pointer"
                          >
                            Limpiar
                          </button>
                        )}
                      </div>
                    )}
                  </div>

                  {ordenesSinImprimirCronologicas.length === 0 ? (
                    <div className="text-center py-8 bg-slate-50 rounded-2xl border border-slate-200 space-y-1">
                      <p className="text-xs font-extrabold text-slate-800">No hay facturas nuevas pendientes por imprimir</p>
                      <p className="text-[11px] text-slate-500">Todas las boletas y facturas emitidas ya fueron impresas y archivadas en el historial inferior.</p>
                    </div>
                  ) : (
                    <div className="divide-y divide-slate-200 border border-slate-200 rounded-2xl overflow-hidden">
                      {ordenesSinImprimirCronologicas.map((o, index) => {
                        const marcado = seleccionLoteIds.includes(o.id);
                        const horaTexto = o.horaCorta || (o.timestamp ? new Date(o.timestamp).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }) : "");
                        return (
                          <div
                            key={o.id}
                            onClick={() => toggleSeleccionLote(o.id)}
                            className={`p-4 flex items-center justify-between gap-3 cursor-pointer transition ${
                              marcado ? "bg-slate-100/90" : "bg-white hover:bg-slate-50"
                            }`}
                          >
                            <div className="flex items-center gap-3.5 min-w-0">
                              <input
                                type="checkbox"
                                checked={marcado}
                                onChange={() => {}}
                                className="w-4 h-4 rounded border-slate-400 cursor-pointer shrink-0"
                              />
                              <div className="min-w-0">
                                <div className="flex flex-wrap items-center gap-2">
                                  <span className="text-xs font-extrabold text-slate-900">
                                    {o.tipoDte === 33 ? `Factura Electrónica N° ${o.folioSii}` : `Boleta Electrónica N° ${o.folioSii}`}
                                  </span>
                                  <span className="text-[11px] font-bold text-slate-500">
                                    • Hora: {horaTexto}
                                  </span>
                                  {o.canal === "Lider" && (
                                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded bg-slate-900 text-white">Físico Lider</span>
                                  )}
                                </div>
                                <p className="text-xs text-slate-600 truncate mt-0.5">
                                  {o.comprador} {o.rutComprador ? `(${o.rutComprador})` : ""} — {o.cantidad}x {o.productoNombre}
                                </p>
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <span className="text-xs font-extrabold text-slate-900 block">
                                ${Number(o.totalClp || 0).toLocaleString("es-CL")}
                              </span>
                              <span className="text-[10px] font-bold text-slate-400">
                                Orden #{index + 1}
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {ordenesSinImprimirCronologicas.length > 0 && (
                    <button
                      type="button"
                      onClick={generarEImprimirLotePdf}
                      disabled={seleccionLoteIds.length === 0}
                      className={`w-full font-extrabold py-4 rounded-2xl text-xs transition cursor-pointer ${
                        seleccionLoteIds.length > 0 ? tema.btn : "bg-slate-200 text-slate-400 cursor-not-allowed"
                      }`}
                    >
                      Imprimir Lote PDF y Archivar como Impresas ({seleccionLoteIds.length} {seleccionLoteIds.length === 1 ? "hoja" : "hojas"})
                    </button>
                  )}
                </div>

                <div className="corp-card rounded-2xl p-6 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <h3 className="text-sm font-extrabold text-slate-900">
                        Historial de Documentos Ya Impresos ({ordenesYaImpresas.length})
                      </h3>
                      <p className="text-xs text-slate-500">
                        Ya salieron de la cola de lotes para evitar duplicados. Si necesitas reimprimir alguna, búscala aquí.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setMostrarHistorialImpresas(!mostrarHistorialImpresas)}
                      className="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold px-4 py-2 rounded-xl cursor-pointer shrink-0"
                    >
                      {mostrarHistorialImpresas ? "Ocultar Historial" : `Ver Historial (${ordenesYaImpresas.length})`}
                    </button>
                  </div>

                  {mostrarHistorialImpresas && (
                    <div className="space-y-3 pt-2 border-t border-slate-100">
                      <input
                        type="text"
                        value={busquedaImpresas}
                        onChange={(e) => setBusquedaImpresas(e.target.value)}
                        placeholder="Buscar en ya impresas por N° folio, cliente, orden o producto..."
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold outline-none"
                      />

                      {ordenesYaImpresas.length === 0 ? (
                        <p className="text-xs text-slate-500 text-center py-6">No hay documentos impresos que coincidan con la búsqueda.</p>
                      ) : (
                        <div className="divide-y divide-slate-200 border border-slate-200 rounded-xl max-h-80 overflow-y-auto">
                          {ordenesYaImpresas.map((o) => (
                            <div key={o.id} className="p-3.5 flex flex-wrap items-center justify-between gap-2 text-xs bg-slate-50/60">
                              <div>
                                <span className="font-extrabold text-slate-900">
                                  {o.tipoDte === 33 ? `Factura 33 N° ${o.folioSii}` : `Boleta 39 N° ${o.folioSii}`}
                                </span>
                                <span className="text-slate-500 ml-2">• {o.canal} • {o.comprador}</span>
                                <span className="block text-[11px] text-slate-500 mt-0.5">
                                  {o.cantidad}x {o.productoNombre} • Impresa: {o.fechaImpresion || o.fecha}
                                </span>
                              </div>
                              <button
                                type="button"
                                onClick={() => setDteVisualizando(o)}
                                className="bg-white hover:bg-slate-100 border border-slate-300 text-slate-800 font-bold px-3.5 py-2 rounded-xl text-xs cursor-pointer"
                              >
                                Reimprimir PDF
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

            {tab === "stock" && (
              <div className="space-y-5">
                <form onSubmit={guardarNuevosFoliosCaf} className="corp-card rounded-2xl p-6 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                    <div>
                      <h2 className="text-sm font-extrabold text-slate-900">Datos Tributarios del Emisor & Automatización SII</h2>
                      <p className="text-xs text-slate-500">
                        Al conectar tu API Key de OpenFactura/SII, los folios CAF (33 y 39) se asignan automáticamente desde tu proveedor DTE.
                      </p>
                    </div>
                    <div className="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
                      <span className="text-xs font-bold">Piloto Automático</span>
                      <SwitchToggle checked={pilotoAutomaticoActivo} onChange={toggleModoAutomaticoSii} colorClass={tema.sw} />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="sm:col-span-2">
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Giro Comercial SII</label>
                      <input type="text" value={datosEmisor.giro} onChange={(e) => setDatosEmisor({ ...datosEmisor, giro: e.target.value })} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Dirección Casa Matriz</label>
                      <input type="text" value={datosEmisor.direccion} onChange={(e) => setDatosEmisor({ ...datosEmisor, direccion: e.target.value })} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                    </div>
                  </div>

                  <button type="submit" className={`font-bold px-5 py-2.5 rounded-xl text-xs cursor-pointer ${tema.btn}`}>
                    Guardar Datos del Emisor
                  </button>
                </form>

                <div className="corp-card rounded-2xl p-6 space-y-3">
                  <h2 className="text-sm font-extrabold text-slate-900">Stock Compartido Multi-Canal ({catalogo.length} productos)</h2>
                  {catalogo.length === 0 ? (
                    <p className="text-xs text-slate-500 bg-slate-50 p-6 rounded-xl text-center">
                      Carga tus productos desde tu panel principal en la pestaña Catálogo y luego suma stock desde tus facturas XML/SII o aquí mismo.
                    </p>
                  ) : (
                    <div className="divide-y divide-slate-200 border border-slate-200 rounded-xl">
                      {catalogo.slice(0, 80).map((p) => {
                        const st = Number(p.stockOnline ?? 0);
                        return (
                          <div key={p.id} className="p-3 flex items-center justify-between gap-2 text-xs">
                            <span className="font-bold text-slate-900">{p.codigo ? `[${p.codigo}] ` : ""}{p.nombre}</span>
                            <div className="flex items-center gap-2">
                              <span className="font-extrabold px-2.5 py-1 rounded-full bg-slate-100">{st} unds</span>
                              <button onClick={() => actualizarStockProducto(p.id, st - 1)} className="bg-slate-200 px-2.5 py-1 rounded-lg font-bold cursor-pointer">-1</button>
                              <button onClick={() => actualizarStockProducto(p.id, st + 5)} className={`px-2.5 py-1 rounded-lg font-bold cursor-pointer ${tema.btn}`}>+5</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            )}

            {tab === "credenciales" && (
              <form onSubmit={guardarCredencialesEmpresa} className="corp-card rounded-2xl p-6 space-y-5">
                <div>
                  <h2 className="text-base font-extrabold text-slate-900">Credenciales API y Facturación SII</h2>
                  <p className="text-xs text-slate-500">Presiona el botón <strong>?</strong> en cada bloque si necesitas saber dónde obtener cada llave.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-extrabold uppercase text-slate-800">1. SII / OpenFactura</h3>
                      <button type="button" onClick={() => setAyudaAbierta("sii")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer" title="Cómo conseguir API Key">?</button>
                    </div>
                    <select value={apisForm.siiProveedor} onChange={(e) => setApisForm({ ...apisForm, siiProveedor: e.target.value })} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold">
                      <option>OpenFactura (Haulmer)</option>
                      <option>SimpleFactura</option>
                      <option>SII Directo (Certificado .PFX + CAF)</option>
                    </select>
                    <input type="password" value={apisForm.siiApiKey} onChange={(e) => setApisForm({ ...apisForm, siiApiKey: e.target.value })} placeholder="API Key OpenFactura / SII" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-extrabold uppercase text-slate-800">2. Mercado Libre Chile</h3>
                      <button type="button" onClick={() => setAyudaAbierta("meli")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer" title="Cómo conseguir API Key">?</button>
                    </div>
                    <input type="text" value={apisForm.meliClientId} onChange={(e) => setApisForm({ ...apisForm, meliClientId: e.target.value })} placeholder="App ID / Client ID" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                    <input type="password" value={apisForm.meliSecret} onChange={(e) => setApisForm({ ...apisForm, meliSecret: e.target.value })} placeholder="Client Secret" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-extrabold uppercase text-slate-800">3. Falabella Seller Center</h3>
                      <button type="button" onClick={() => setAyudaAbierta("falabella")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer" title="Cómo conseguir API Key">?</button>
                    </div>
                    <input type="text" value={apisForm.falabellaUser} onChange={(e) => setApisForm({ ...apisForm, falabellaUser: e.target.value })} placeholder="Correo Seller Center" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                    <input type="password" value={apisForm.falabellaApiKey} onChange={(e) => setApisForm({ ...apisForm, falabellaApiKey: e.target.value })} placeholder="API Key Falabella" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-extrabold uppercase text-slate-800">4. Lider / Walmart Marketplace</h3>
                      <button type="button" onClick={() => setAyudaAbierta("lider")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer" title="Cómo conseguir API Key">?</button>
                    </div>
                    <input type="password" value={apisForm.liderApiKey} onChange={(e) => setApisForm({ ...apisForm, liderApiKey: e.target.value })} placeholder="Token / Client Secret Lider" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>
                </div>

                <button type="submit" disabled={guardandoApis} className={`w-full font-bold py-3.5 rounded-xl text-xs cursor-pointer ${tema.btn}`}>
                  {guardandoApis ? "Guardando..." : "Guardar Credenciales y Activar Conexión"}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AppEcommerceSII />);
  </script>
</body>
</html>
