<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ERP • E-Commerce Omnicanal & Motor SII</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .corp-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 2px 14px -2px rgba(15, 23, 42, 0.04); }
    .print-only { display: none; }
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
  <script>
    window.onerror = function (msg, url, line) {
      var box = document.getElementById("error-fallback");
      if (box) {
        box.style.display = "block";
        box.innerText = "Error detectado (Línea " + line + "): " + msg;
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-slate-900 selection:text-white">
  <div id="error-fallback" style="display:none; background:#fee2e2; color:#991b1b; padding:14px; font-size:12px; font-weight:700; border-bottom:2px solid #ef4444;"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    const SwitchToggle = ({ checked, onChange }) => (
      <button
        type="button"
        role="switch"
        aria-checked={checked}
        onClick={onChange}
        className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
          checked ? "bg-slate-900" : "bg-slate-200"
        }`}
      >
        <span
          className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow transition duration-200 ease-in-out ${
            checked ? "translate-x-4" : "translate-x-0"
          }`}
        />
      </button>
    );

    function AppEcommerceSII() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut")) || "775280425");
      const [empresa, setEmpresa] = useState(null);
      const [catalogo, setCatalogo] = useState([]);
      const [ordenes, setOrdenes] = useState([]);

      const [apisForm, setApisForm] = useState({
        meliClientId: "",
        meliSecret: "",
        falabellaUser: "",
        falabellaApiKey: "",
        liderApiKey: "",
        siiProveedor: "OpenFactura (Haulmer)",
        siiApiKey: "",
        siiModoAutomatico: true
      });
      const [guardandoApis, setGuardandoApis] = useState(false);

      const [cafConfig, setCafConfig] = useState({
        boleta39Actual: 14820,
        boleta39Limite: 15000,
        factura33Actual: 3290,
        factura33Limite: 3500
      });

      const [tab, setTab] = useState("ordenes"); // ordenes | stock | sii_caf | impresion | credenciales
      const [filtroCanal, setFiltroCanal] = useState("TODOS");
      const [busqueda, setBusqueda] = useState("");
      const [colaImprimir, setColaImprimir] = useState(null);

      // Ingreso / Simulación de Orden
      const [mostrarNuevaOrden, setMostrarNuevaOrden] = useState(false);
      const [canalNuevo, setCanalNuevo] = useState("Mercado Libre");
      const [ordenExtNuevo, setOrdenExtNuevo] = useState("");
      const [compradorNuevo, setCompradorNuevo] = useState("");
      const [rutCompradorNuevo, setRutCompradorNuevo] = useState("");
      const [skuSeleccionado, setSkuSeleccionado] = useState("");
      const [cantidadNueva, setCantidadNueva] = useState(1);
      const [totalNuevo, setTotalNuevo] = useState(19990);

      useEffect(() => {
        let unsubs = [];
        const conectar = () => {
          const empRef = db.collection("saas_empresas").doc(rutActivo);

          const u1 = empRef.onSnapshot((doc) => {
            if (doc.exists) {
              const data = { id: doc.id, ...doc.data() };
              setEmpresa(data);
              if (data.apis) setApisForm((prev) => ({ ...prev, ...data.apis }));
              if (data.cafConfig) setCafConfig((prev) => ({ ...prev, ...data.cafConfig }));
            } else {
              setEmpresa({
                id: rutActivo,
                rut: formatearRut(rutActivo),
                nombre: `Empresa ${formatearRut(rutActivo)}`
              });
            }
          });

          const colCat = rutActivo === RUT_PGB
            ? db.collection("catalogo_productos")
            : empRef.collection("catalogo");

          const u2 = colCat.onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({
              id: d.id,
              stockOnline: 25,
              ...d.data()
            }));
            lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
            setCatalogo(lista);
          });

          const u3 = empRef.collection("ecommerce_ordenes").onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setOrdenes(lista);
          });

          unsubs = [u1, u2, u3];
        };

        auth.signInAnonymously().then(conectar).catch(conectar);
        return () => unsubs.forEach((fn) => typeof fn === "function" && fn());
      }, [rutActivo]);

      const empRef = () => db.collection("saas_empresas").doc(rutActivo);
      const catRef = () =>
        rutActivo === RUT_PGB
          ? db.collection("catalogo_productos")
          : empRef().collection("catalogo");

      // Detección inteligente de credenciales faltantes para esta empresa
      const estadoConexiones = useMemo(() => {
        const a = empresa?.apis || {};
        return {
          meli: Boolean(a.meliClientId && a.meliSecret),
          falabella: Boolean(a.falabellaUser && a.falabellaApiKey),
          lider: Boolean(a.liderApiKey),
          sii: Boolean(a.siiApiKey)
        };
      }, [empresa]);

      const faltanCredencialesCriticas = !estadoConexiones.sii || (!estadoConexiones.meli && !estadoConexiones.falabella && !estadoConexiones.lider);

      const guardarCredencialesEmpresa = async (e) => {
        e.preventDefault();
        setGuardandoApis(true);
        try {
          await empRef().set({ apis: apisForm }, { merge: true });
          alert("Credenciales API y configuración automática del SII vinculadas a " + (empresa?.nombre || rutActivo) + ".");
        } catch (err) {
          alert("Error al guardar credenciales: " + err.message);
        }
        setGuardandoApis(false);
      };

      const toggleModoAutomaticoSii = async () => {
        const nuevoEstado = !apisForm.siiModoAutomatico;
        const actualizado = { ...apisForm, siiModoAutomatico: nuevoEstado };
        setApisForm(actualizado);
        await empRef().set({ apis: actualizado }, { merge: true });
      };

      const registrarOrdenOmnicanal = async (e) => {
        e.preventDefault();
        const prodObj = catalogo.find((p) => p.id === skuSeleccionado) || {
          id: "manual",
          codigo: "SKU-001",
          nombre: skuSeleccionado || "PRODUCTO E-COMMERCE",
          stockOnline: 10
        };

        const rutLim = limpiarRut(rutCompradorNuevo);
        const esFactura33 = rutLim.length >= 7;
        const tipoDte = esFactura33 ? 33 : 39;
        const folioAsignado = esFactura33 ? cafConfig.factura33Actual : cafConfig.boleta39Actual;
        const colaDestino = canalNuevo === "Lider" ? "lider" : "general";
        const autoSii = apisForm.siiModoAutomatico !== false;

        const nuevaOrden = {
          canal: canalNuevo,
          ordenExterna: ordenExtNuevo.trim() || `${canalNuevo.slice(0, 3).toUpperCase()}-${Math.floor(100000 + Math.random() * 900000)}`,
          comprador: compradorNuevo.trim() || "Cliente Marketplace",
          rutComprador: esFactura33 ? formatearRut(rutLim) : "",
          productoId: prodObj.id,
          codigoSku: prodObj.codigo || "S/C",
          productoNombre: prodObj.nombre,
          cantidad: Number(cantidadNueva),
          totalClp: Number(totalNuevo),
          tipoDte,
          folioSii: autoSii ? folioAsignado : "PENDIENTE",
          estadoSii: autoSii
            ? `Emitido Automático (${apisForm.siiProveedor || "SII"})`
            : "En espera de emisión manual",
          colaImpresion: colaDestino,
          etiquetaImpresa: false,
          despachado: false,
          fecha: new Date().toLocaleString("es-CL"),
          timestamp: Date.now()
        };

        try {
          const batch = db.batch();
          batch.set(empRef().collection("ecommerce_ordenes").doc(), nuevaOrden);

          if (prodObj.id && prodObj.id !== "manual") {
            const nuevoStock = Math.max(0, (Number(prodObj.stockOnline) || 0) - Number(cantidadNueva));
            batch.update(catRef().doc(prodObj.id), { stockOnline: nuevoStock });
          }

          if (autoSii) {
            const nuevoCaf = {
              ...cafConfig,
              factura33Actual: esFactura33 ? cafConfig.factura33Actual + 1 : cafConfig.factura33Actual,
              boleta39Actual: !esFactura33 ? cafConfig.boleta39Actual + 1 : cafConfig.boleta39Actual
            };
            batch.set(empRef(), { cafConfig: nuevoCaf }, { merge: true });
          }

          await batch.commit();
          setMostrarNuevaOrden(false);
          setOrdenExtNuevo("");
          setCompradorNuevo("");
          setRutCompradorNuevo("");
          alert(
            autoSii
              ? `Orden procesada, stock descontado en todos los canales y ${esFactura33 ? "Factura 33" : "Boleta 39"} Folio #${folioAsignado} emitida automáticamente al SII.`
              : "Orden ingresada y stock descontado. Emisión DTE en cola manual."
          );
        } catch (err) {
          alert("Error al procesar orden: " + err.message);
        }
      };

      const emitirDteManual = async (orden) => {
        const esFactura33 = orden.tipoDte === 33;
        const folioAsignado = esFactura33 ? cafConfig.factura33Actual : cafConfig.boleta39Actual;
        const batch = db.batch();
        batch.update(empRef().collection("ecommerce_ordenes").doc(orden.id), {
          folioSii: folioAsignado,
          estadoSii: `Emitido (${apisForm.siiProveedor || "SII"})`
        });
        batch.set(
          empRef(),
          {
            cafConfig: {
              ...cafConfig,
              factura33Actual: esFactura33 ? cafConfig.factura33Actual + 1 : cafConfig.factura33Actual,
              boleta39Actual: !esFactura33 ? cafConfig.boleta39Actual + 1 : cafConfig.boleta39Actual
            }
          },
          { merge: true }
        );
        await batch.commit();
      };

      const actualizarStockProducto = async (prodId, nuevoStock) => {
        await catRef().doc(prodId).update({ stockOnline: Math.max(0, Number(nuevoStock)) });
      };

      const guardarNuevosFoliosCaf = async (e) => {
        e.preventDefault();
        await empRef().set({ cafConfig }, { merge: true });
        alert("Rangos de folios CAF actualizados.");
      };

      const imprimirLoteEtiquetas = async (tipoCola) => {
        const pendientesCola = ordenes.filter((o) => o.colaImpresion === tipoCola && !o.etiquetaImpresa);
        if (pendientesCola.length === 0) return alert("No hay etiquetas pendientes en esta bandeja.");
        setColaImprimir(tipoCola);
        setTimeout(async () => {
          window.print();
          const batch = db.batch();
          pendientesCola.forEach((o) => {
            batch.update(empRef().collection("ecommerce_ordenes").doc(o.id), { etiquetaImpresa: true });
          });
          await batch.commit();
          setColaImprimir(null);
        }, 250);
      };

      const marcarDespachado = async (id, actual) => {
        await empRef().collection("ecommerce_ordenes").doc(id).update({ despachado: !actual });
      };

      const disponibles39 = cafConfig.boleta39Limite - cafConfig.boleta39Actual;
      const disponibles33 = cafConfig.factura33Limite - cafConfig.factura33Actual;
      const alertaCafCritica = disponibles39 < 50 || disponibles33 < 30;

      const colaGeneralPendiente = useMemo(
        () => ordenes.filter((o) => o.colaImpresion === "general" && !o.etiquetaImpresa),
        [ordenes]
      );
      const colaLiderPendiente = useMemo(
        () => ordenes.filter((o) => o.colaImpresion === "lider" && !o.etiquetaImpresa),
        [ordenes]
      );

      const ordenesFiltradas = useMemo(() => {
        const q = busqueda.trim().toLowerCase();
        return ordenes.filter((o) => {
          if (filtroCanal !== "TODOS" && o.canal !== filtroCanal) return false;
          if (!q) return true;
          return (
            (o.ordenExterna || "").toLowerCase().includes(q) ||
            (o.comprador || "").toLowerCase().includes(q) ||
            (o.productoNombre || "").toLowerCase().includes(q) ||
            String(o.folioSii || "").includes(q)
          );
        });
      }, [ordenes, filtroCanal, busqueda]);

      const urlVolver = rutActivo === RUT_PGB ? "pgb-operacion.html" : "index.html";

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900">
          {/* PLANTILLA DE IMPRESIÓN DE ETIQUETAS */}
          {colaImprimir && (
            <div className="print-only bg-white text-black p-6">
              <div className="border-b-2 border-black pb-3 mb-4">
                <h2 className="text-base font-black uppercase">
                  {colaImprimir === "lider"
                    ? "COLA FÍSICA EXCLUSIVA LIDER / WALMART MARKETPLACE"
                    : "LOTE DESPACHO MERCADO LIBRE & FALABELLA"}
                </h2>
                <p className="text-xs">
                  Remitente: <strong>{empresa?.nombre}</strong> ({empresa?.rut}) • Fecha: {new Date().toLocaleString("es-CL")}
                </p>
              </div>
              <div className="grid grid-cols-1 gap-4">
                {(colaImprimir === "lider" ? colaLiderPendiente : colaGeneralPendiente).map((o) => (
                  <div key={o.id} className="border-2 border-black p-4 rounded-lg text-xs space-y-1">
                    <div className="flex justify-between font-black text-sm border-b border-gray-400 pb-1">
                      <span>CANAL: {o.canal.toUpperCase()}</span>
                      <span>ORDEN: #{o.ordenExterna}</span>
                    </div>
                    <p><strong>Destinatario:</strong> {o.comprador} {o.rutComprador ? `(${o.rutComprador})` : ""}</p>
                    <p><strong>SKU / Producto:</strong> [{o.codigoSku}] {o.productoNombre} — <strong>Cant: {o.cantidad}</strong></p>
                    <p><strong>Documento SII:</strong> {o.tipoDte === 33 ? "FACTURA ELECTRÓNICA (33)" : "BOLETA ELECTRÓNICA (39)"} • <strong>Folio #{o.folioSii}</strong></p>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-5 pb-24 space-y-6 no-print">
            {/* ALERTA PREVENTIVA CAF */}
            {alertaCafCritica && (
              <div className="bg-rose-600 text-white p-4 rounded-2xl shadow-sm flex flex-wrap items-center justify-between gap-3">
                <span className="text-xs font-extrabold">
                  ALERTA FOLIOS CAF SII: Quedan {disponibles39} folios Boleta (39) y {disponibles33} folios Factura (33).
                </span>
                <button
                  onClick={() => setTab("sii_caf")}
                  className="bg-white text-rose-700 text-xs font-extrabold px-3.5 py-1.5 rounded-xl cursor-pointer"
                >
                  Gestionar CAF
                </button>
              </div>
            )}

            {/* CABECERA CORPORATIVA BLANCA */}
            <div className="corp-card rounded-2xl p-6 sm:p-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div className="flex items-center gap-4">
                {empresa?.logoBase64 && (
                  <div className="w-24 h-16 rounded-xl border border-slate-200 bg-white flex items-center justify-center p-1.5 shrink-0">
                    <img src={empresa.logoBase64} alt={empresa.nombre} className="max-h-full max-w-full object-contain" />
                  </div>
                )}
                <div>
                  <div className="flex flex-wrap items-center gap-2 mb-1.5">
                    <a
                      href={urlVolver}
                      className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl transition"
                    >
                      Volver
                    </a>
                    <span className="bg-slate-100 text-slate-700 text-[11px] font-bold px-3 py-1 rounded-full">
                      {empresa?.nombre || "Cargando..."} • {empresa?.rut || formatearRut(rutActivo)}
                    </span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">
                    E-Commerce Omnicanal & Motor Tributario SII
                  </h1>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Sincronización 24/7 (Mercado Libre • Falabella • Lider), stock compartido y emisión automática Boleta 39 / Factura 33.
                  </p>
                </div>
              </div>

              <button
                onClick={() => setMostrarNuevaOrden(!mostrarNuevaOrden)}
                className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs px-5 py-3 rounded-xl transition cursor-pointer shrink-0"
              >
                {mostrarNuevaOrden ? "Cerrar Registro" : "Registrar / Simular Orden"}
              </button>
            </div>

            {/* SOLICITUD AUTOMÁTICA DE CREDENCIALES FALTANTES PARA LA EMPRESA ACTIVA */}
            {faltanCredencialesCriticas && (
              <div className="corp-card rounded-2xl p-6 border-slate-300 space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-widest text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-0.5 rounded">
                      Configuración Requerida para {empresa?.nombre}
                    </span>
                    <h2 className="text-base font-extrabold text-slate-900 mt-1">
                      Completa tus API Keys de Marketplaces y Servicio de Impuestos Internos (SII)
                    </h2>
                    <p className="text-xs text-slate-500">
                      Este módulo detectó credenciales pendientes. Ingresa las llaves que utilice tu empresa para activar la conexión automática.
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setTab("credenciales")}
                    className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer shrink-0"
                  >
                    Configurar API Keys Ahora
                  </button>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs">
                  <div className={`p-3 rounded-xl border ${estadoConexiones.sii ? "bg-emerald-50/50 border-emerald-200 text-emerald-900" : "bg-slate-50 border-slate-200 text-slate-600"}`}>
                    <span className="font-extrabold block">SII / OpenFactura</span>
                    <span className="text-[11px]">{estadoConexiones.sii ? "Conectado" : "Falta API Key"}</span>
                  </div>
                  <div className={`p-3 rounded-xl border ${estadoConexiones.meli ? "bg-emerald-50/50 border-emerald-200 text-emerald-900" : "bg-slate-50 border-slate-200 text-slate-600"}`}>
                    <span className="font-extrabold block">Mercado Libre</span>
                    <span className="text-[11px]">{estadoConexiones.meli ? "Conectado" : "Pendiente"}</span>
                  </div>
                  <div className={`p-3 rounded-xl border ${estadoConexiones.falabella ? "bg-emerald-50/50 border-emerald-200 text-emerald-900" : "bg-slate-50 border-slate-200 text-slate-600"}`}>
                    <span className="font-extrabold block">Falabella</span>
                    <span className="text-[11px]">{estadoConexiones.falabella ? "Conectado" : "Pendiente"}</span>
                  </div>
                  <div className={`p-3 rounded-xl border ${estadoConexiones.lider ? "bg-emerald-50/50 border-emerald-200 text-emerald-900" : "bg-slate-50 border-slate-200 text-slate-600"}`}>
                    <span className="font-extrabold block">Lider Marketplace</span>
                    <span className="text-[11px]">{estadoConexiones.lider ? "Conectado" : "Pendiente"}</span>
                  </div>
                </div>
              </div>
            )}

            {/* FORMULARIO DE ORDEN OMNICANAL */}
            {mostrarNuevaOrden && (
              <form onSubmit={registrarOrdenOmnicanal} className="corp-card rounded-2xl p-6 border-slate-400 space-y-4">
                <div className="border-b border-slate-100 pb-3">
                  <h2 className="text-base font-extrabold text-slate-900">Ingreso de Orden Omnicanal</h2>
                  <p className="text-xs text-slate-500">
                    Descuenta stock compartido al instante, emite Boleta 39 (sin RUT) o Factura 33 (con RUT) y enruta la etiqueta a su bandeja.
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Canal de Venta *</label>
                    <select
                      value={canalNuevo}
                      onChange={(e) => setCanalNuevo(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold outline-none"
                    >
                      <option value="Mercado Libre">Mercado Libre</option>
                      <option value="Falabella">Falabella</option>
                      <option value="Lider">Lider (Cola Física Exclusiva)</option>

                      value={apisForm.falabellaApiKey}
                      onChange={(e) => setApisForm({ ...apisForm, falabellaApiKey: e.target.value })}
                      placeholder="API Key Falabella"
                      className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-semibold outline-none"
                    />
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                    <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-800">
                      4. Lider / Walmart Marketplace API
                    </h3>
                    <input
                      type="password"
                      value={apisForm.liderApiKey}
                      onChange={(e) => setApisForm({ ...apisForm, liderApiKey: e.target.value })}
                      placeholder="Client Secret / Token Lider"
                      className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-semibold outline-none"
                    />
                    <p className="text-[11px] text-slate-500">
                      Al activarse, habilita automáticamente la bandeja física exclusiva de etiquetas Lider.
                    </p>
                  </div>
                </div>

                <button
                  type="submit"
                  disabled={guardandoApis}
                  className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-xs transition cursor-pointer"
                >
                  {guardandoApis ? "Guardando y vinculando..." : "Guardar Credenciales y Activar Sincronización"}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
