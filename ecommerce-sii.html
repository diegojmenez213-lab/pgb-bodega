  <script>
    // GUARDIA DE SEGURIDAD INMEDIATO (BLOQUEA RETROCESO / BFCACHE ENTRE EMPRESAS)
    (function () {
      var limpiar = function (r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); };
      var rutInicial = limpiar(localStorage.getItem("nexus_empresa_rut"));
      if (!rutInicial) {
        window.location.replace("index.html");
      }
      window.addEventListener("pageshow", function (ev) {
        var rutActual = limpiar(localStorage.getItem("nexus_empresa_rut"));
        if (!rutActual) {
          window.location.replace("index.html");
        } else if (ev.persisted && rutActual !== rutInicial) {
          window.location.reload();
        }
      });
      window.addEventListener("storage", function (ev) {
        if (ev.key === "nexus_empresa_rut") {
          var rutNuevo = limpiar(ev.newValue);
          if (!rutNuevo) window.location.replace("index.html");
          else if (rutNuevo !== rutInicial) window.location.reload();
        }
      });
    })();
  </script>

      const [datosEmisor, setDatosEmisor] = useState({

      });

      const [ayudaAbierta, setAyudaAbierta] = useState(null);

      const [tab, setTab] = useState("ordenes");

      const [filtroCanal, setFiltroCanal] = useState("TODOS");
      const [busqueda, setBusqueda] = useState("");
      const [busquedaImpresas, setBusquedaImpresas] = useState("");

      const [mostrarNuevaOrden, setMostrarNuevaOrden] = useState(false);

      const [ordenExtNuevo, setOrdenExtNuevo] = useState("");

      const [emitirViaBackendManual, setEmitirViaBackendManual] = useState(false);

      // Helper seguro de llamadas autenticadas al backend en Vercel
      const nexusFetch = useCallback(async (path, options = {}) => {
        const user = auth.currentUser;
        if (!user || user.isAnonymous) {
          throw new Error("Activa primero tu Sesión Segura del Servidor para operar con la bóveda y APIs reales.");
        }
        const idToken = await user.getIdToken();
        const headers = {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${idToken}`,
          "x-tenant-rut": rutActivo,
          ...(options.headers || {})
        };
        const resp = await fetch(`${NEXUS_API_BASE}${path}`, { ...options, headers });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || data.ok === false) {
          throw new Error(data.error || `Error del servidor (${resp.status})`);
        }
        return data;
      }, [rutActivo]);

      const refrescarEstadoYOrdenesBackend = useCallback(async () => {
        const user = auth.currentUser;
        if (!user || user.isAnonymous) return;
        setCargandoMkt(true);
        try {
          const [siiData, mktData, ordData] = await Promise.all([
            nexusFetch("/sii/estado", { method: "GET" }).catch(() => null),
            nexusFetch("/marketplaces/estado", { method: "GET" }).catch(() => null),
            nexusFetch("/marketplaces/ordenes?limite=60", { method: "GET" }).catch(() => null)

              ...prev,
              siiProveedor: siiData.proveedor || prev.siiProveedor,
              siiAmbiente: siiData.ambiente || prev.siiAmbiente

      useEffect(() => {
        if (!rutActivo) {

        let unsubs = [];
        let cancelado = false;

        const conectarFirestore = () => {
          const empRef = db.collection("saas_empresas").doc(rutActivo);

          const u1 = empRef.onSnapshot((doc) => {
            if (doc.exists) {
              const data = { id: doc.id, ...doc.data() };
              if (data.activa === false) {

              setEmpresa(data);
              if (data.datosEmisor) setDatosEmisor((prev) => ({ ...prev, ...data.datosEmisor }));

              if (typeof data.siiModoAutomatico === "boolean") {
                setVaultForm((prev) => ({ ...prev, siiModoAutomatico: data.siiModoAutomatico }));

            } else {

              window.location.replace("index.html");

          const colCat = rutActivo === RUT_PGB
            ? db.collection("catalogo_productos")
            : empRef.collection("catalogo");

          const u2 = colCat.onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({
              id: d.id,
              stockOnline: 0,
              ...d.data()
            }));
            lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
            setCatalogo(lista);
          });

          const u3 = empRef.collection("ecommerce_ordenes").onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setOrdenes(lista);
          });

          unsubs = [u1, u2, u3];
        };

        const iniciarAuth = async () => {
          try {
            const pendingToken = sessionStorage.getItem("nexus_custom_token");
            if (pendingToken) {
              await auth.signInWithCustomToken(pendingToken);
              sessionStorage.removeItem("nexus_custom_token");
            }
          } catch (err) {
            console.warn("No se pudo aplicar customToken guardado:", err.message);
          }

          const unsubAuth = auth.onAuthStateChanged(async (user) => {
            if (cancelado) return;
            if (!user) {
              try {
                await auth.signInAnonymously();
              } catch (_) {}
              return;
            }
            const tieneTokenReal = !user.isAnonymous;
            setSesionBackendLista(tieneTokenReal);
            setVerificandoSesion(false);
            if (!unsubs.length) conectarFirestore();
            if (tieneTokenReal) {
              refrescarEstadoYOrdenesBackend();
            }
          });

          unsubs.push(unsubAuth);
        };

        iniciarAuth();
        return () => {
          cancelado = true;
          unsubs.forEach((fn) => typeof fn === "function" && fn());
        };
      }, [rutActivo, refrescarEstadoYOrdenesBackend]);

      const empRef = () => db.collection("saas_empresas").doc(rutActivo);
      const catRef = () =>
        rutActivo === RUT_PGB
          ? db.collection("catalogo_productos")
          : empRef().collection("catalogo");

      const estadoConexiones = useMemo(() => {
        return {
          meli: Boolean(estadoBackendMkt?.meli?.conectado),
          falabella: Boolean(estadoBackendMkt?.falabella?.conectado),
          lider: Boolean(estadoBackendMkt?.lider?.conectado),
          sii: Boolean(estadoBackendSii?.conectado)
        };
      }, [estadoBackendMkt, estadoBackendSii]);

      const pilotoAutomaticoActivo = Boolean(vaultForm.siiModoAutomatico);
      const faltanCredencialesCriticas = !estadoConexiones.sii || (!estadoConexiones.meli && !estadoConexiones.falabella && !estadoConexiones.lider);

      const activarSesionBackend = async (e) => {
        e.preventDefault();
        setAutenticandoBackend(true);
        setErrorAuthBackend("");
        try {
          const endpoint = modoAuthBackend === "superAdmin"
            ? `${NEXUS_API_BASE}/auth/login-super-admin`
            : `${NEXUS_API_BASE}/auth/login-empresa`;
          const body = modoAuthBackend === "superAdmin"
            ? { pin: claveAuthBackend.trim(), clave: claveAuthBackend.trim() }
            : { rut: rutActivo, clave: claveAuthBackend };

          const resp = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.ok || !data.customToken) {
            throw new Error(data.error || "Credencial rechazada por el servidor.");
          }

          await auth.signInWithCustomToken(data.customToken);
          setClaveAuthBackend("");
          setMostrarModalAuthBackend(false);
          setSesionBackendLista(true);
          setAvisoOperacion({ tipo: "ok", texto: "Sesión segura activada. Conectado a la bóveda AES-256 y APIs en Vercel." });
          await refrescarEstadoYOrdenesBackend();
        } catch (err) {
          setErrorAuthBackend(err.message || "Error conectando con el servidor.");
        } finally {
          setAutenticandoBackend(false);
        }
      };

      const guardarCredencialesEnBoveda = async (e) => {
        e.preventDefault();
        if (!sesionBackendLista) {
          setMostrarModalAuthBackend(true);
          return;
        }
        setGuardandoApis(true);
        setAvisoOperacion(null);
        try {
          const guardados = [];

          // 1. SII en bóveda cifrada
          if (vaultForm.siiApiKey.trim()) {
            await nexusFetch("/auth/guardar-credenciales", {
              method: "POST",
              body: JSON.stringify({
                servicio: "sii",
                proveedor: vaultForm.siiProveedor,
                ambiente: vaultForm.siiAmbiente,
                credenciales: { apiKey: vaultForm.siiApiKey.trim() },
                metadatos: {
                  razonSocial: empresa?.nombre || "",
                  giro: datosEmisor.giro,
                  direccion: datosEmisor.direccion,
                  comuna: datosEmisor.comuna
                }
              })
            });
            guardados.push(`SII (${vaultForm.siiProveedor} / ${vaultForm.siiAmbiente})`);
          }

          // 2. Mercado Libre en bóveda cifrada
          if (vaultForm.meliClientId.trim() || vaultForm.meliSecret.trim() || vaultForm.meliRefreshToken.trim()) {
            const credsMeli = {};
            if (vaultForm.meliClientId.trim()) credsMeli.clientId = vaultForm.meliClientId.trim();
            if (vaultForm.meliSecret.trim()) credsMeli.clientSecret = vaultForm.meliSecret.trim();
            if (vaultForm.meliRefreshToken.trim()) credsMeli.refreshToken = vaultForm.meliRefreshToken.trim();
            if (vaultForm.meliSellerId.trim()) credsMeli.sellerId = vaultForm.meliSellerId.trim();

            await nexusFetch("/auth/guardar-credenciales", {
              method: "POST",
              body: JSON.stringify({
                servicio: "meli",
                proveedor: "mercadolibre",
                ambiente: "produccion",
                credenciales: credsMeli,
                metadatos: {
                  sellerId: vaultForm.meliSellerId.trim() || "",
                  autoEmitir: false // Siempre arranca en Modo Borrador seguro
                }
              })
            });
            guardados.push("Mercado Libre");
          }

          // 3. Falabella en bóveda cifrada
          if (vaultForm.falabellaUser.trim() && vaultForm.falabellaApiKey.trim()) {
            await nexusFetch("/auth/guardar-credenciales", {
              method: "POST",
              body: JSON.stringify({
                servicio: "falabella",
                proveedor: "falabella",
                ambiente: "produccion",
                credenciales: {
                  userId: vaultForm.falabellaUser.trim(),
                  apiKey: vaultForm.falabellaApiKey.trim()
                },
                metadatos: { autoEmitir: false }
              })
            });
            guardados.push("Falabella");
          }

          // 4. Lider / Walmart en bóveda cifrada
          if (vaultForm.liderClientId.trim() && vaultForm.liderClientSecret.trim()) {
            await nexusFetch("/auth/guardar-credenciales", {
              method: "POST",
              body: JSON.stringify({
                servicio: "lider",
                proveedor: "walmart_chile",
                ambiente: "produccion",
                credenciales: {
                  clientId: vaultForm.liderClientId.trim(),
                  clientSecret: vaultForm.liderClientSecret.trim()
                },
                metadatos: { autoEmitir: false }
              })
            });
            guardados.push("Lider");
          }

          // Guardar datos públicos del emisor (sin secretos)
          await empRef().set({ datosEmisor }, { merge: true });

          // Limpiar inputs de secretos en memoria del navegador tras cifrar
          setVaultForm((prev) => ({
            ...prev,
            siiApiKey: "",
            meliSecret: "",
            meliRefreshToken: "",
            falabellaApiKey: "",
            liderClientSecret: ""
          }));

          await refrescarEstadoYOrdenesBackend();
          setAvisoOperacion({
            tipo: "ok",
            texto: guardados.length
              ? `Cifrado AES-256 guardado correctamente para: ${guardados.join(", ")}.`
              : "Datos del emisor guardados. Ingresa una API key en algún bloque para actualizar la bóveda cifrada."
          });
        } catch (err) {
          setAvisoOperacion({ tipo: "error", texto: "Error guardando en bóveda: " + err.message });
        } finally {
          setGuardandoApis(false);
        }
      };

      const sincronizarMarketplacesReales = async (canal = "todos") => {
        if (!sesionBackendLista) {
          setMostrarModalAuthBackend(true);
          return;
        }
        setSincronizandoCanal(canal);
        setAvisoOperacion(null);
        try {

          const res = await nexusFetch("/marketplaces/sincronizar", {
            method: "POST",
            body: JSON.stringify({ canal, limite: 25, autoEmitir: false })
          });

          const resumen = Object.entries(res.resultados || {})
            .map(([c, info]) => {
              const nombre = CANAL_LABEL[c] || c;
              if (info.estado === "SIN_CREDENCIALES") return `${nombre}: sin credenciales`;
              if (info.estado === "ERROR_CONEXION") return `${nombre}: ERROR (${info.ultimoError})`;
              return `${nombre}: ${info.totalLeidas || 0} leídas (${info.nuevas || 0} nuevas)`;
            })
            .join(" • ");

          await refrescarEstadoYOrdenesBackend();
          setTab("ordenes");
          setSubTabOrdenes("borradores");
          setAvisoOperacion({
            tipo: "ok",
            texto: `Sincronización en Modo Borrador completada → ${resumen}`
          });
        } catch (err) {
          setAvisoOperacion({ tipo: "error", texto: err.message });
        } finally {
          setSincronizandoCanal(null);
        }
      };

      const emitirOrdenRealControlada = async (ord) => {

        if (!confirm(`¿Emitir ${tipoTexto} para orden ${nombreCanal} #${ord.orderId} por $${Number(ord.mntTotal || 0).toLocaleString("es-CL")} CLP vía ${provInfo}?`)) {

        try {

            const descItems = (ord.items || []).map((it) => `${it.cantidad}x ${it.nombre}`).join(" + ").slice(0, 140) || primerItem.nombre || "Pedido Marketplace";

              tipoDte: Number(dte.tipoDte || tipoElegido),
              folioSii: Number(dte.folio || 0),
              trackIdSii: dte.trackId || null,
              estadoSii: dte.estadoSii || "EMITIDO",
              proveedorUsado: dte.proveedorUsado || "simulador",
              ambienteSii: dte.ambiente || "certificacion",
              timbradoSii: true,

              horaCorta: new Date(ahora).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }),
              fecha: new Date(ahora).toLocaleString("es-CL"),
              timestamp: ahora
            }, { merge: true });

            setAvisoOperacion({
              tipo: "ok",
              texto: `${tipoTexto} Folio #${dte.folio} registrada (${dte.estadoSii}). Ya está disponible en Lotes PDF${esLider ? " y en la Cola Física Lider" : ""}.`
            });
          }

          await refrescarEstadoYOrdenesBackend();
        } catch (err) {
          setAvisoOperacion({ tipo: "error", texto: `Error al emitir orden #${ord.orderId}: ${err.message}` });
        } finally {
          setEmitiendoDocId(null);
        }

      const toggleModoAutomaticoSii = async () => {

        };

          {

              boleta39Actual: !esFactura33 ? Math.max(1, cafConfig.boleta39Actual - 1) : cafConfig.boleta39Actual
            }

      const actualizarStockProducto = async (prodId, nuevoStock) => {

      };

      const guardarNuevosFoliosCaf = async (e) => {
        e.preventDefault();
        await empRef().set({ cafConfig, datosEmisor }, { merge: true });
        setAvisoOperacion({ tipo: "ok", texto: "Datos tributarios del emisor guardados." });
      };

      const ordenesSinImprimirCronologicas = useMemo(() => {
        return ordenes
          .filter((o) => !o.etiquetaImpresa)
          .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      }, [ordenes]);

      const ordenesYaImpresas = useMemo(() => {
        const q = busquedaImpresas.trim().toLowerCase();
        return ordenes
          .filter((o) => Boolean(o.etiquetaImpresa))
          .filter((o) => {
            if (!q) return true;
            return (
              String(o.folioSii || "").includes(q) ||
              (o.comprador || "").toLowerCase().includes(q) ||
              (o.ordenExterna || "").toLowerCase().includes(q) ||
              (o.productoNombre || "").toLowerCase().includes(q)
            );
          })
          .sort((a, b) => (b.fechaImpresionTs || b.timestamp || 0) - (a.fechaImpresionTs || a.timestamp || 0));
      }, [ordenes, busquedaImpresas]);

      const toggleSeleccionLote = (id) => {
        setSeleccionLoteIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const seleccionarTodosPendientesLote = () => {
        setSeleccionLoteIds(ordenesSinImprimirCronologicas.map((o) => o.id));
      };

      const generarEImprimirLotePdf = () => {
        if (seleccionLoteIds.length === 0) {
          return alert("Selecciona al menos una factura o boleta de la lista para generar el lote.");
        }
        const seleccionadosOrdenados = ordenesSinImprimirCronologicas.filter((o) => seleccionLoteIds.includes(o.id));
        if (seleccionadosOrdenados.length === 0) return;

        setLoteParaImprimir(seleccionadosOrdenados);
        setTimeout(async () => {
          window.print();
          const batch = db.batch();
          const ahoraStr = new Date().toLocaleString("es-CL");
          const ahoraTs = Date.now();
          seleccionadosOrdenados.forEach((o) => {
            batch.update(empRef().collection("ecommerce_ordenes").doc(o.id), {
              etiquetaImpresa: true,
              fechaImpresion: ahoraStr,
              fechaImpresionTs: ahoraTs
            });
          });
          await batch.commit();
          setLoteParaImprimir([]);
          setSeleccionLoteIds([]);
        }, 300);
      };

      const marcarDespachado = async (id, actual) => {
        await empRef().collection("ecommerce_ordenes").doc(id).update({ despachado: !actual });
      };

      const liderPendientesImpresion = useMemo(
        () => ordenesSinImprimirCronologicas.filter((o) => o.canal === "Lider"),
        [ordenesSinImprimirCronologicas]
      );

          if (!q) return true;
          return (
            (o.ordenExterna || "").toLowerCase().includes(q) ||
            (o.comprador || "").toLowerCase().includes(q) ||
            (o.productoNombre || "").toLowerCase().includes(q) ||
            String(o.folioSii || "").includes(q)
          );
        });
      }, [ordenes, filtroCanal, busqueda]);

      const ordenesRealesFiltradas = useMemo(() => {

        return ordenesRealesMkt.filter((o) => {
          const nombreCanal = CANAL_LABEL[o.canal] || o.canal;
          if (filtroCanal !== "TODOS" && nombreCanal !== filtroCanal) return false;
          if (!q) return true;
          return (
            String(o.orderId || "").toLowerCase().includes(q) ||
            String(o.receptor?.razonSocial || "").toLowerCase().includes(q) ||
            String(o.receptor?.rut || "").toLowerCase().includes(q) ||
            String(o.dteFolio || "").includes(q)
          );
        });

        [ordenesRealesMkt]
      );

        <div className="min-h-screen bg-slate-50 text-slate-900">

                        </span>
                      </div>
                      <button type="button" onClick={() => setAyudaAbierta("meli")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" value={vaultForm.meliClientId} onChange={(e) => setVaultForm({ ...vaultForm, meliClientId: e.target.value })} placeholder="App ID / Client ID" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                      <input type="text" value={vaultForm.meliSellerId} onChange={(e) => setVaultForm({ ...vaultForm, meliSellerId: e.target.value })} placeholder="Seller ID (opcional)" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                    </div>
                    <input type="password" value={vaultForm.meliSecret} onChange={(e) => setVaultForm({ ...vaultForm, meliSecret: e.target.value })} placeholder="Client Secret" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                    <input type="password" value={vaultForm.meliRefreshToken} onChange={(e) => setVaultForm({ ...vaultForm, meliRefreshToken: e.target.value })} placeholder="Refresh Token OAuth2" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>

                  {/* 3. FALABELLA */}
                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <h3 className="text-xs font-extrabold uppercase text-slate-800">3. Falabella Seller Center</h3>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${estadoConexiones.falabella ? "bg-emerald-100 text-emerald-800" : "bg-slate-200 text-slate-600"}`}>
                          {estadoConexiones.falabella ? "Conectado" : "Sin llave"}
                        </span>
                      </div>
                      <button type="button" onClick={() => setAyudaAbierta("falabella")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                    </div>
                    <input type="email" value={vaultForm.falabellaUser} onChange={(e) => setVaultForm({ ...vaultForm, falabellaUser: e.target.value })} placeholder="Correo Seller Center (User ID)" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                    <input type="password" value={vaultForm.falabellaApiKey} onChange={(e) => setVaultForm({ ...vaultForm, falabellaApiKey: e.target.value })} placeholder="API Key Falabella" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>

                  {/* 4. LIDER */}
                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <h3 className="text-xs font-extrabold uppercase text-slate-800">4. Lider / Walmart Marketplace</h3>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${estadoConexiones.lider ? "bg-emerald-100 text-emerald-800" : "bg-slate-200 text-slate-600"}`}>
                          {estadoConexiones.lider ? "Conectado" : "Sin llave"}
                        </span>
                      </div>
                      <button type="button" onClick={() => setAyudaAbierta("lider")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">?</button>
                    </div>
                    <input type="text" value={vaultForm.liderClientId} onChange={(e) => setVaultForm({ ...vaultForm, liderClientId: e.target.value })} placeholder="Client ID Lider / Walmart" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                    <input type="password" value={vaultForm.liderClientSecret} onChange={(e) => setVaultForm({ ...vaultForm, liderClientSecret: e.target.value })} placeholder="Client Secret Lider / Walmart" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>
                </div>

                <button type="submit" disabled={guardandoApis} className={`w-full font-bold py-3.5 rounded-xl text-xs cursor-pointer ${tema.btn}`}>
                  {guardandoApis ? "Cifrando y guardando en Vercel..." : "Guardar en Bóveda Cifrada AES-256"}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AppEcommerceSII />);
  </script>
</body>
</html>
