<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ERP • E-Commerce Omnicanal & Motor SII</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-ticket { font-family: 'JetBrains Mono', monospace; }
    .corp-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 2px 14px -2px rgba(15, 23, 42, 0.04); }
    .print-only { display: none; }
    @media print {
      body { background: white !important; color: black !important; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
  <script>
    window.onerror = function (msg, url, line) {
      var box = document.getElementById("error-fallback");
      if (box) {
        box.style.display = "block";
        box.innerText = "Error detectado (Línea " + line + "): " + msg;
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-slate-900 selection:text-white">
  <div id="error-fallback" style="display:none; background:#fee2e2; color:#991b1b; padding:14px; font-size:12px; font-weight:700; border-bottom:2px solid #ef4444;"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    const PALETAS = {
      ejecutivo: { btn: "bg-slate-900 hover:bg-slate-800 text-white", tag: "bg-slate-100 text-slate-800", border: "border-slate-900", sw: "bg-slate-900" },
      ecommerce: { btn: "bg-blue-700 hover:bg-blue-800 text-white", tag: "bg-blue-50 text-blue-800", border: "border-blue-700", sw: "bg-blue-700" },
      logistica: { btn: "bg-emerald-700 hover:bg-emerald-800 text-white", tag: "bg-emerald-50 text-emerald-800", border: "border-emerald-700", sw: "bg-emerald-700" },
      industrial: { btn: "bg-amber-700 hover:bg-amber-800 text-white", tag: "bg-amber-50 text-amber-800", border: "border-amber-700", sw: "bg-amber-700" }
    };

    const AYUDA_APIS = {
      sii: {
        titulo: "Cómo obtener tu API Key en OpenFactura / SII",
        pasos: [
          "1. Inicia sesión en tu portal de OpenFactura (Haulmer) o tu proveedor DTE autorizado por el SII.",
          "2. Ve al menú Configuración → Integraciones / API Keys.",
          "3. Copia tu API Key de Producción y verifica que tengas cargados tus folios CAF (33 y 39)."
        ]
      },
      meli: {
        titulo: "Cómo obtener Client ID y Secret en Mercado Libre",
        pasos: [
          "1. Entra a developers.mercadolibre.cl con la cuenta principal de la tienda.",
          "2. Abre 'Mis Aplicaciones' → 'Crear nueva aplicación' (permisos: Órdenes, Ítems y Facturación).",
          "3. Copia el App ID (Client ID) y el Client Secret generados en la ficha de la app."
        ]
      },
      falabella: {
        titulo: "Cómo obtener API Key en Falabella Seller Center",
        pasos: [
          "1. Ingresa a sellercenter.falabella.com con usuario administrador.",
          "2. Haz clic en Configuración (arriba a la derecha) → 'Administrar Usuarios'.",
          "3. Copia el Correo (User ID) y la columna 'API Key' de tu usuario."
        ]
      },
      lider: {
        titulo: "Cómo obtener el Token en Lider / Walmart Marketplace",
        pasos: [
          "1. Entra a marketplace.walmartchile.cl (Seller Center Lider).",
          "2. Dirígete a Configuración → Credenciales API / Integración.",
          "3. Genera o copia el Client Secret / Token de acceso."
        ]
      }
    };

    const SwitchToggle = ({ checked, onChange, colorClass = "bg-slate-900" }) => (
      <button
        type="button"
        role="switch"
        aria-checked={checked}
        onClick={onChange}
        className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
          checked ? colorClass : "bg-slate-200"
        }`}
      >
        <span
          className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow transition duration-200 ease-in-out ${
            checked ? "translate-x-4" : "translate-x-0"
          }`}
        />
      </button>
    );

    // Simulación visual fiel del Timbre Electrónico PDF417 del SII
    const TimbrePdf417Svg = () => (
      <svg viewBox="0 0 260 68" className="w-full max-w-[250px] h-16 mx-auto my-2" aria-label="Timbre Electrónico SII">
        <rect x="0" y="0" width="260" height="68" fill="#ffffff" />
        {Array.from({ length: 64 }).map((_, i) => {
          const x = 4 + i * 3.9;
          const h1 = ((i * 7 + 3) % 5) * 4 + 38;
          const w = (i % 3 === 0) ? 2.4 : 1.4;
          return <rect key={i} x={x} y={(68 - h1) / 2} width={w} height={h1} fill="#0f172a" />;
        })}
      </svg>
    );

    // Documento Térmico Oficial (Formato Boleta 39 y Factura 33)
    const DocumentoTermicoSii = ({ orden, empresa, datosEmisor }) => {
      if (!orden) return null;
      const esFactura = orden.tipoDte === 33;
      const total = Number(orden.totalClp || 0);
      const neto = Math.round(total / 1.19);
      const iva = total - neto;
      const fechaIso = orden.fechaIso || new Date(orden.timestamp || Date.now()).toISOString().slice(0, 10);

      return (
        <div className="bg-white text-black p-6 max-w-[360px] mx-auto border border-slate-300 shadow-sm font-ticket text-[12px] leading-relaxed">
          <div className="space-y-0.5 text-left">
            <p className="font-bold uppercase text-[13px]">{(empresa?.nombre || "TECNOSHOP COMPANY SPA").toUpperCase()}</p>
            <p>{empresa?.rut || "77.528.042-5"}</p>
            <p className="uppercase">Giro: {datosEmisor.giro || "VENTAS POR INTERNET DE ARTICULOS PARA EL HOGAR, DEPORTE Y OTROS"}</p>
            <p className="uppercase">{datosEmisor.direccion || "MERCED 838 A INT OF 117"}</p>
            <p>{datosEmisor.comuna || "Santiago"}</p>
            <p className="pt-1 font-bold">
              {esFactura ? "FACTURA ELECTRÓNICA" : "BOLETA ELECTRÓNICA"} NUMERO: {Number(orden.folioSii || 0).toLocaleString("es-CL")}
            </p>
            <p>REF. VENDEDOR: {orden.ordenExterna}</p>
            <p>Fecha: {fechaIso}</p>
          </div>

          <div className="mt-4 pt-2 border-t border-dashed border-slate-400 space-y-1">
            {esFactura ? (
              <>
                <p>Señor(es): <span className="uppercase">{orden.comprador}</span></p>
                <p>RUT Receptor: {orden.rutComprador}</p>
                <p>Dirección: {orden.direccionCliente || "Santiago"}</p>
              </>
            ) : (
              <p>Dirección: {orden.direccionCliente || "Santiago"}</p>
            )}
          </div>

          <div className="mt-4 space-y-1.5">
            <div className="flex justify-between items-start gap-2">
              <span className="uppercase">
                {orden.cantidad > 1 ? `${orden.cantidad}x ` : ""}{orden.productoNombre || "Venta"}
              </span>
              <span className="font-bold shrink-0">$ {total.toLocaleString("es-CL")}</span>
            </div>

            {esFactura ? (
              <div className="pt-3 border-t border-dashed border-slate-400 space-y-0.5 text-right">
                <p>Monto Neto: $ {neto.toLocaleString("es-CL")}</p>
                <p>IVA (19%): $ {iva.toLocaleString("es-CL")}</p>
                <p className="font-bold text-[13px]">Total Factura: $ {total.toLocaleString("es-CL")}</p>
              </div>
            ) : (
              <p className="pt-3">
                El IVA incluido en esta boleta es de: $ {iva.toLocaleString("es-CL")}
              </p>
            )}
          </div>

          <div className="mt-5 text-center">
            <TimbrePdf417Svg />
            <div className="text-left text-[11px] mt-1 space-y-0.5">
              <p>Timbre Electrónico SII</p>
              <p>Res. 99 de 2014</p>
              <p>Verifique documento en sii.cl</p>
            </div>
          </div>

          {orden.esSimulacion !== false && (
            <div className="mt-4 pt-2 border-t border-amber-300 text-center text-[10px] font-sans font-bold text-amber-800 bg-amber-50 py-1 rounded">
              VISTA DE SIMULACIÓN (Aún no timbrada en vivo por SII)
            </div>
          )}
        </div>
      );
    };

    function AppEcommerceSII() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut")) || "775280425");
      const [empresa, setEmpresa] = useState(null);
      const [catalogo, setCatalogo] = useState([]);
      const [ordenes, setOrdenes] = useState([]);

      const [apisForm, setApisForm] = useState({
        meliClientId: "",
        meliSecret: "",
        falabellaUser: "",
        falabellaApiKey: "",
        liderApiKey: "",
        siiProveedor: "OpenFactura (Haulmer)",
        siiApiKey: "",
        siiModoAutomatico: true
      });

      const [datosEmisor, setDatosEmisor] = useState({
        giro: "VENTAS POR INTERNET DE ARTICULOS PARA EL HOGAR, DEPORTE Y OTROS",
        direccion: "MERCED 838 A INT OF 117",
        comuna: "Santiago"
      });

      const [ayudaAbierta, setAyudaAbierta] = useState(null);
      const [guardandoApis, setGuardandoApis] = useState(false);

      const [cafConfig, setCafConfig] = useState({
        boleta39Actual: 22016,
        boleta39Limite: 25000,
        factura33Actual: 3290,
        factura33Limite: 3500
      });

      const [tab, setTab] = useState("ordenes");
      const [filtroCanal, setFiltroCanal] = useState("TODOS");
      const [busqueda, setBusqueda] = useState("");
      const [colaImprimir, setColaImprimir] = useState(null);
      const [dteVisualizando, setDteVisualizando] = useState(null);

      const [mostrarNuevaOrden, setMostrarNuevaOrden] = useState(false);
      const [canalNuevo, setCanalNuevo] = useState("Mercado Libre");
      const [ordenExtNuevo, setOrdenExtNuevo] = useState("");
      const [compradorNuevo, setCompradorNuevo] = useState("");
      const [rutCompradorNuevo, setRutCompradorNuevo] = useState("");
      const [skuSeleccionado, setSkuSeleccionado] = useState("");
      const [cantidadNueva, setCantidadNueva] = useState(1);
      const [totalNuevo, setTotalNuevo] = useState(19990);

      useEffect(() => {
        let unsubs = [];
        const conectar = () => {
          const empRef = db.collection("saas_empresas").doc(rutActivo);

          const u1 = empRef.onSnapshot((doc) => {
            if (doc.exists) {
              const data = { id: doc.id, ...doc.data() };
              setEmpresa(data);
              if (data.apis) setApisForm((prev) => ({ ...prev, ...data.apis }));
              if (data.datosEmisor) setDatosEmisor((prev) => ({ ...prev, ...data.datosEmisor }));
              if (data.cafConfig) setCafConfig((prev) => ({ ...prev, ...data.cafConfig }));
            } else {
              setEmpresa({
                id: rutActivo,
                rut: formatearRut(rutActivo),
                nombre: "TECNOSHOP COMPANY SPA",
                paleta: "ecommerce"
              });
            }
          });

          const colCat = rutActivo === RUT_PGB
            ? db.collection("catalogo_productos")
            : empRef.collection("catalogo");

          const u2 = colCat.onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({
              id: d.id,
              stockOnline: 25,
              ...d.data()
            }));
            lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
            setCatalogo(lista);
          });

          const u3 = empRef.collection("ecommerce_ordenes").onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setOrdenes(lista);
          });

          unsubs = [u1, u2, u3];
        };

        auth.signInAnonymously().then(conectar).catch(conectar);
        return () => unsubs.forEach((fn) => typeof fn === "function" && fn());
      }, [rutActivo]);

      const empRef = () => db.collection("saas_empresas").doc(rutActivo);
      const catRef = () =>
        rutActivo === RUT_PGB
          ? db.collection("catalogo_productos")
          : empRef().collection("catalogo");

      const estadoConexiones = useMemo(() => {
        const a = empresa?.apis || {};
        return {
          meli: Boolean(a.meliClientId && a.meliSecret),
          falabella: Boolean(a.falabellaUser && a.falabellaApiKey),
          lider: Boolean(a.liderApiKey),
          sii: Boolean(a.siiApiKey)
        };
      }, [empresa]);

      const faltanCredencialesCriticas = !estadoConexiones.sii || (!estadoConexiones.meli && !estadoConexiones.falabella && !estadoConexiones.lider);

      const guardarCredencialesEmpresa = async (e) => {
        e.preventDefault();
        setGuardandoApis(true);
        try {
          await empRef().set({ apis: apisForm, datosEmisor }, { merge: true });
          alert("Credenciales API y datos tributarios guardados.");
        } catch (err) {
          alert("Error al guardar: " + err.message);
        }
        setGuardandoApis(false);
      };

      const toggleModoAutomaticoSii = async () => {
        const nuevoEstado = !apisForm.siiModoAutomatico;
        const actualizado = { ...apisForm, siiModoAutomatico: nuevoEstado };
        setApisForm(actualizado);
        await empRef().set({ apis: actualizado }, { merge: true });
      };

      const registrarOrdenOmnicanal = async (e) => {
        e.preventDefault();
        const prodObj = catalogo.find((p) => p.id === skuSeleccionado) || {
          id: "manual",
          codigo: "SKU-001",
          nombre: skuSeleccionado || "Venta",
          stockOnline: 10
        };

        const rutLim = limpiarRut(rutCompradorNuevo);
        const esFactura33 = rutLim.length >= 7;
        const tipoDte = esFactura33 ? 33 : 39;
        const folioAsignado = esFactura33 ? cafConfig.factura33Actual : cafConfig.boleta39Actual;
        const colaDestino = canalNuevo === "Lider" ? "lider" : "general";
        const autoSii = apisForm.siiModoAutomatico !== false;
        const esRealSii = Boolean(estadoConexiones.sii);

        const nuevaOrden = {
          canal: canalNuevo,
          ordenExterna: ordenExtNuevo.trim() || `${Math.floor(1000000 + Math.random() * 9000000)}-1`,
          comprador: compradorNuevo.trim() || "Cliente Marketplace",
          rutComprador: esFactura33 ? formatearRut(rutLim) : "",
          direccionCliente: "Santiago",
          productoId: prodObj.id,
          codigoSku: prodObj.codigo || "S/C",
          productoNombre: prodObj.nombre,
          cantidad: Number(cantidadNueva),
          totalClp: Number(totalNuevo),
          tipoDte,
          folioSii: autoSii ? folioAsignado : "PENDIENTE",
          esSimulacion: !esRealSii,
          colaImpresion: colaDestino,
          etiquetaImpresa: false,
          despachado: false,
          fechaIso: new Date().toISOString().slice(0, 10),
          fecha: new Date().toLocaleString("es-CL"),
          timestamp: Date.now()
        };

        try {
          const batch = db.batch();
          batch.set(empRef().collection("ecommerce_ordenes").doc(), nuevaOrden);

          if (prodObj.id && prodObj.id !== "manual") {
            const nuevoStock = Math.max(0, (Number(prodObj.stockOnline) || 0) - Number(cantidadNueva));
            batch.update(catRef().doc(prodObj.id), { stockOnline: nuevoStock });
          }

          if (autoSii) {
            const nuevoCaf = {
              ...cafConfig,
              factura33Actual: esFactura33 ? cafConfig.factura33Actual + 1 : cafConfig.factura33Actual,
              boleta39Actual: !esFactura33 ? cafConfig.boleta39Actual + 1 : cafConfig.boleta39Actual
            };
            batch.set(empRef(), { cafConfig: nuevoCaf }, { merge: true });
          }

          await batch.commit();
          setMostrarNuevaOrden(false);
          setOrdenExtNuevo("");
          setCompradorNuevo("");
          setRutCompradorNuevo("");
        } catch (err) {
          alert("Error al procesar orden: " + err.message);
        }
      };

      const eliminarSimulacion = async (orden) => {
        if (orden.esSimulacion === false) {
          return alert("Este documento fue emitido en vivo por el SII y no puede eliminarse por normativa tributaria.");
        }
        if (!confirm(`¿Eliminar la simulación ${orden.tipoDte === 33 ? "Factura 33" : "Boleta 39"} #${orden.folioSii}?`)) return;
        await empRef().collection("ecommerce_ordenes").doc(orden.id).delete();
      };

      const actualizarStockProducto = async (prodId, nuevoStock) => {
        await catRef().doc(prodId).update({ stockOnline: Math.max(0, Number(nuevoStock)) });
      };

      const guardarNuevosFoliosCaf = async (e) => {
        e.preventDefault();
        await empRef().set({ cafConfig, datosEmisor }, { merge: true });
        alert("Datos tributarios y folios CAF guardados.");
      };

      const imprimirLoteEtiquetas = async (tipoCola) => {
        const pendientesCola = ordenes.filter((o) => o.colaImpresion === tipoCola && !o.etiquetaImpresa);
        if (pendientesCola.length === 0) return alert("No hay etiquetas pendientes en esta bandeja.");
        setColaImprimir(tipoCola);
        setTimeout(async () => {
          window.print();
          const batch = db.batch();
          pendientesCola.forEach((o) => {
            batch.update(empRef().collection("ecommerce_ordenes").doc(o.id), { etiquetaImpresa: true });
          });
          await batch.commit();
          setColaImprimir(null);
        }, 250);
      };

      const marcarDespachado = async (id, actual) => {
        await empRef().collection("ecommerce_ordenes").doc(id).update({ despachado: !actual });
      };

      const disponibles39 = cafConfig.boleta39Limite - cafConfig.boleta39Actual;
      const disponibles33 = cafConfig.factura33Limite - cafConfig.factura33Actual;

      const colaGeneralPendiente = useMemo(
        () => ordenes.filter((o) => o.colaImpresion === "general" && !o.etiquetaImpresa),
        [ordenes]
      );
      const colaLiderPendiente = useMemo(
        () => ordenes.filter((o) => o.colaImpresion === "lider" && !o.etiquetaImpresa),
        [ordenes]
      );

      const ordenesFiltradas = useMemo(() => {
        const q = busqueda.trim().toLowerCase();
        return ordenes.filter((o) => {
          if (filtroCanal !== "TODOS" && o.canal !== filtroCanal) return false;
          if (!q) return true;
          return (
            (o.ordenExterna || "").toLowerCase().includes(q) ||
            (o.comprador || "").toLowerCase().includes(q) ||
            (o.productoNombre || "").toLowerCase().includes(q) ||
            String(o.folioSii || "").includes(q)
          );
        });
      }, [ordenes, filtroCanal, busqueda]);

      const urlVolver = rutActivo === RUT_PGB ? "pgb-operacion.html" : "empresa-panel.html";
      const tema = PALETAS[empresa?.paleta || "ecommerce"] || PALETAS.ecommerce;

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900">
          {/* ZONA DE IMPRESIÓN: DTE INDIVIDUAL O LOTE DE ETIQUETAS */}
          {dteVisualizando && (
            <div className="print-only bg-white p-4">
              <DocumentoTermicoSii orden={dteVisualizando} empresa={empresa} datosEmisor={datosEmisor} />
            </div>
          )}

          {!dteVisualizando && colaImprimir && (
            <div className="print-only bg-white text-black p-6">
              <div className="border-b-2 border-black pb-3 mb-4">
                <h2 className="text-base font-black uppercase">
                  {colaImprimir === "lider"
                    ? "COLA FÍSICA EXCLUSIVA LIDER / WALMART"
                    : "LOTE DESPACHO MERCADO LIBRE & FALABELLA"}
                </h2>
                <p className="text-xs">{empresa?.nombre} ({empresa?.rut}) • {new Date().toLocaleString("es-CL")}</p>
              </div>
              <div className="space-y-4">
                {(colaImprimir === "lider" ? colaLiderPendiente : colaGeneralPendiente).map((o) => (
                  <div key={o.id} className="border-2 border-black p-4 rounded text-xs space-y-1">
                    <div className="flex justify-between font-black text-sm border-b border-gray-400 pb-1">
                      <span>{o.canal.toUpperCase()}</span>
                      <span>REF: {o.ordenExterna}</span>
                    </div>
                    <p><strong>Cliente:</strong> {o.comprador} {o.rutComprador ? `(${o.rutComprador})` : ""}</p>
                    <p><strong>Producto:</strong> {o.cantidad}x {o.productoNombre}</p>
                    <p><strong>SII:</strong> {o.tipoDte === 33 ? "FACTURA 33" : "BOLETA 39"} N° {o.folioSii}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* MODAL PARA VER E IMPRIMIR BOLETA / FACTURA */}
          {dteVisualizando && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4 overflow-y-auto no-print">
              <div className="bg-slate-100 rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl">

                    <select value={apisForm.siiProveedor} onChange={(e) => setApisForm({ ...apisForm, siiProveedor: e.target.value })} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold">
                      <option>OpenFactura (Haulmer)</option>
                      <option>SimpleFactura</option>
                      <option>SII Directo (Certificado .PFX + CAF)</option>
                    </select>
                    <input type="password" value={apisForm.siiApiKey} onChange={(e) => setApisForm({ ...apisForm, siiApiKey: e.target.value })} placeholder="API Key OpenFactura / SII" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-extrabold uppercase text-slate-800">2. Mercado Libre Chile</h3>
                      <button type="button" onClick={() => setAyudaAbierta("meli")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer" title="Cómo conseguir API Key">?</button>
                    </div>
                    <input type="text" value={apisForm.meliClientId} onChange={(e) => setApisForm({ ...apisForm, meliClientId: e.target.value })} placeholder="App ID / Client ID" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                    <input type="password" value={apisForm.meliSecret} onChange={(e) => setApisForm({ ...apisForm, meliSecret: e.target.value })} placeholder="Client Secret" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-extrabold uppercase text-slate-800">3. Falabella Seller Center</h3>
                      <button type="button" onClick={() => setAyudaAbierta("falabella")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer" title="Cómo conseguir API Key">?</button>
                    </div>
                    <input type="text" value={apisForm.falabellaUser} onChange={(e) => setApisForm({ ...apisForm, falabellaUser: e.target.value })} placeholder="Correo Seller Center" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                    <input type="password" value={apisForm.falabellaApiKey} onChange={(e) => setApisForm({ ...apisForm, falabellaApiKey: e.target.value })} placeholder="API Key Falabella" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-extrabold uppercase text-slate-800">4. Lider / Walmart Marketplace</h3>
                      <button type="button" onClick={() => setAyudaAbierta("lider")} className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer" title="Cómo conseguir API Key">?</button>
                    </div>
                    <input type="password" value={apisForm.liderApiKey} onChange={(e) => setApisForm({ ...apisForm, liderApiKey: e.target.value })} placeholder="Token / Client Secret Lider" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold" />
                  </div>
                </div>

                <button type="submit" disabled={guardandoApis} className={`w-full font-bold py-3.5 rounded-xl text-xs cursor-pointer ${tema.btn}`}>
                  {guardandoApis ? "Guardando..." : "Guardar Credenciales y Activar Conexión"}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AppEcommerceSII />);
  </script>
</body>
</html>
