<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGB Distribution Chile SpA - Control Bodega</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const UNIDADES = ["Unidad", "Caja", "Manga", "Fardo", "Unidad suelta", "Display", "Pack"];
    const MOTIVOS = ["Faltante", "Sobrante", "Cruce", "Rechazo", "Daño/Merma"];
    const ARMADORES = ["Diego", "Nico", "Edwin"];
    const RUTAS = ["Ruta 1 (Juan / Julio)", "Ruta 2 (Carlos / Horacio)", "Retiro Bodega / Otra"];

    function App() {
      const [incidencias, setIncidencias] = useState([]);
      const [cierres, setCierres] = useState([]);
      const [vista, setVista] = useState("activas");
      const [conectado, setConectado] = useState(false);
      const [editandoId, setEditandoId] = useState(null);

      const hoy = new Date().toISOString().split("T")[0];
      const [factura, setFactura] = useState("");
      const [fecha, setFecha] = useState(hoy);
      const [ruta, setRuta] = useState(RUTAS[0]);
      const [armador, setArmador] = useState(ARMADORES[0]);
      const [motivo, setMotivo] = useState(MOTIVOS[0]);
      
      const [producto, setProducto] = useState("");
      const [cantidad, setCantidad] = useState(1);
      const [unidad, setUnidad] = useState(UNIDADES[0]);

      const [productoCruce, setProductoCruce] = useState("");
      const [cantidadCruce, setCantidadCruce] = useState(1);
      const [unidadCruce, setUnidadCruce] = useState(UNIDADES[0]);

      const [accionResolucion, setAccionResolucion] = useState("Ajustar Inventario");
      const [notas, setNotas] = useState("");

      useEffect(() => {
        auth.signInAnonymously().catch(console.error);
        const unsubAuth = auth.onAuthStateChanged((user) => {
          if (user) setConectado(true);
        });

        const unsubInc = db.collection("incidencias")
          .orderBy("creadoEn", "desc")
          .onSnapshot((snap) => {
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setIncidencias(lista);
          });

        const unsubCierres = db.collection("cierres_semanales")
          .orderBy("fechaCierre", "desc")
          .onSnapshot((snap) => {
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setCierres(lista);
          });

        return () => {
          unsubAuth();
          unsubInc();
          unsubCierres();
        };
      }, []);

      const limpiarFormulario = () => {
        setFactura("");
        setProducto("");
        setCantidad(1);
        setUnidad(UNIDADES[0]);
        setProductoCruce("");
        setCantidadCruce(1);
        setUnidadCruce(UNIDADES[0]);
        setNotas("");
        setEditandoId(null);
      };

      const guardarIncidencia = async (e) => {
        e.preventDefault();
        if (!factura.trim() || !producto.trim()) return alert("Completa Nº de Factura y Producto");
        if (motivo === "Cruce" && !productoCruce.trim()) {
          return alert("En un Cruce debes indicar también el producto que se envió por error.");
        }

        const datos = {
          factura: factura.trim(),
          fecha,
          ruta,
          armador,
          motivo,
          producto: producto.trim().toUpperCase(),
          cantidad: Number(cantidad),
          unidad,
          productoCruce: motivo === "Cruce" ? productoCruce.trim().toUpperCase() : null,
          cantidadCruce: motivo === "Cruce" ? Number(cantidadCruce) : null,
          unidadCruce: motivo === "Cruce" ? unidadCruce : null,
          accionResolucion,
          resuelto: false,
          notas: notas.trim(),
          creadoEn: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
          if (editandoId) {
            delete datos.creadoEn;
            await db.collection("incidencias").doc(editandoId).update(datos);
          } else {
            await db.collection("incidencias").add(datos);
          }
          limpiarFormulario();
        } catch (err) {
          alert("Error al guardar: " + err.message);
        }
      };

      const cargarParaEditar = (item) => {
        setEditandoId(item.id);
        setFactura(item.factura);
        setFecha(item.fecha);
        setRuta(item.ruta);
        setArmador(item.armador);
        setMotivo(item.motivo);
        setProducto(item.producto);
        setCantidad(item.cantidad);
        setUnidad(item.unidad);
        if (item.motivo === "Cruce") {
          setProductoCruce(item.productoCruce || "");
          setCantidadCruce(item.cantidadCruce || 1);
          setUnidadCruce(item.unidadCruce || UNIDADES[0]);
        }
        setAccionResolucion(item.accionResolucion || "Ajustar Inventario");
        setNotas(item.notas || "");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const cambiarEstado = async (id, estadoActual) => {
        await db.collection("incidencias").doc(id).update({ resuelto: !estadoActual });
      };

      const eliminarIncidencia = async (id) => {
        if (confirm("¿Seguro que deseas eliminar este registro?")) {
          await db.collection("incidencias").doc(id).delete();
        }
      };

      const cerrarSemana = async () => {
        if (incidencias.length === 0) return alert("No hay incidencias activas para cerrar la semana.");
        const nombreSemana = prompt("Nombre o rango de la semana a cerrar (Ej: Semana 09 al 14 Nov):");
        if (!nombreSemana) return;

        try {
          await db.collection("cierres_semanales").add({
            nombreSemana,
            fechaCierre: new Date().toISOString(),
            totalRegistros: incidencias.length,
            registros: incidencias
          });

          const batch = db.batch();
          incidencias.forEach((inc) => {
            const ref = db.collection("incidencias").doc(inc.id);
            batch.delete(ref);
          });
          await batch.commit();
          alert("Semana cerrada y guardada en Historial correctamente.");
        } catch (err) {
          alert("Error al cerrar semana: " + err.message);
        }
      };

      const resumenInventario = useMemo(() => {
        const mapa = {};
        const sumar = (prod, uni, cant, tipo) => {
          const clave = `${prod} (${uni})`;
          if (!mapa[clave]) mapa[clave] = { producto: prod, unidad: uni, sobranteBodega: 0, faltanteBodega: 0 };
          if (tipo === "SOBRA_EN_BODEGA") mapa[clave].sobranteBodega += cant;
          if (tipo === "FALTA_EN_BODEGA") mapa[clave].faltanteBodega += cant;
        };

        incidencias.forEach(inc => {
          if (inc.motivo === "Faltante") {
            sumar(inc.producto, inc.unidad, inc.cantidad, "SOBRA_EN_BODEGA");
          } else if (inc.motivo === "Sobrante") {
            sumar(inc.producto, inc.unidad, inc.cantidad, "FALTA_EN_BODEGA");
          } else if (inc.motivo === "Cruce") {
            sumar(inc.producto, inc.unidad, inc.cantidad, "SOBRA_EN_BODEGA");
            if (inc.productoCruce) {
              sumar(inc.productoCruce, inc.unidadCruce, inc.cantidadCruce, "FALTA_EN_BODEGA");
            }
          }
        });
        return Object.values(mapa);
      }, [incidencias]);

      return (
        <div className="max-w-5xl mx-auto p-3 sm:p-6 pb-20">
          <header className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 mb-5 shadow-lg flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
              <div className="flex items-center gap-2">
                <span className={`h-3 w-3 rounded-full ${conectado ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                <h1 className="text-xl sm:text-2xl font-black text-amber-400 tracking-tight">PGB DISTRIBUTION CHILE SpA</h1>
              </div>
              <p className="text-xs sm:text-sm text-slate-400 mt-1">
                Control de Bodega y Rutas en Tiempo Real • Supervisión: Pedro y Bedanli
              </p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setVista("activas")} className={`px-3 py-2 rounded-xl text-xs font-bold transition ${vista === "activas" ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                Incidencias ({incidencias.length})
              </button>
              <button onClick={() => setVista("balance")} className={`px-3 py-2 rounded-xl text-xs font-bold transition ${vista === "balance" ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                Cuadratura Bodega
              </button>
              <button onClick={() => setVista("historial")} className={`px-3 py-2 rounded-xl text-xs font-bold transition ${vista === "historial" ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                Cierres ({cierres.length})
              </button>
            </div>
          </header>

          {vista === "activas" && (
            <>
              <form onSubmit={guardarIncidencia} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 mb-6 shadow-lg space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h2 className="text-base font-bold text-white">
                    {editandoId ? "✏️ Editando Incidencia de Factura" : "➕ Registrar Incidencia de Ruta / Bodega"}
                  </h2>
                  {editandoId && (
                    <button type="button" onClick={limpiarFormulario} className="text-xs text-rose-400 underline">
                      Cancelar edición
                    </button>
                  )}
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Nº Factura *</label>
                    <input type="text" value={factura} onChange={e => setFactura(e.target.value)} placeholder="Ej: 45892" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Fecha</label>
                    <input type="date" value={fecha} onChange={e => setFecha(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Ruta / Chofer</label>
                    <select value={ruta} onChange={e => setRuta(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                      {RUTAS.map(r => <option key={r} value={r}>{r}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Armador Bodega</label>
                    <select value={armador} onChange={e => setArmador(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                      {ARMADORES.map(a => <option key={a} value={a}>{a}</option>)}
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Motivo del Reporte</label>
                    <select value={motivo} onChange={e => setMotivo(e.target.value)} className="w-full bg-slate-950 border border-amber-500/60 rounded-xl px-3 py-2 text-sm font-bold text-amber-300">
                      {MOTIVOS.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Acción a Tomar</label>
                    <select value={accionResolucion} onChange={e => setAccionResolucion(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                      <option value="Ajustar Inventario">Ajustar Inventario en Bodega</option>
                      <option value="Reponer al Cliente">Enviar / Reponer Producto al Cliente</option>
                      <option value="Nota de Crédito">Nota de Crédito / Descuento Factura</option>
                      <option value="Retornar a Bodega">Chofer Retorna Producto a Bodega</option>
                    </select>
                  </div>
                </div>

                <div className="bg-slate-950/70 p-3 rounded-xl border border-slate-800">
                  <p className="text-xs font-bold text-emerald-400 mb-2">
                    {motivo === "Cruce" ? "1️⃣ Producto que decía la Factura (No se entregó / Quedó en bodega)" : "📦 Detalle del Producto"}
                  </p>
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <div className="sm:col-span-2">
                      <input type="text" value={producto} onChange={e => setProducto(e.target.value)} placeholder="Nombre del producto..." className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required />
                    </div>
                    <div>
                      <input type="number" min="1" value={cantidad} onChange={e => setCantidad(e.target.value)} placeholder="Cant." className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required />
                    </div>
                    <div>
                      <select value={unidad} onChange={e => setUnidad(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                        {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                {motivo === "Cruce" && (
                  <div className="bg-rose-950/30 p-3 rounded-xl border border-rose-800/60">
                    <p className="text-xs font-bold text-rose-300 mb-2">
                      2️⃣ Producto enviado físicamente por error (Salió de bodega sin facturar)
                    </p>
                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                      <div className="sm:col-span-2">
                        <input type="text" value={productoCruce} onChange={e => setProductoCruce(e.target.value)} placeholder="Producto que se fue cambiado..." className="w-full bg-slate-900 border border-rose-700/60 rounded-xl px-3 py-2 text-sm text-white" required />
                      </div>
                      <div>
                        <input type="number" min="1" value={cantidadCruce} onChange={e => setCantidadCruce(e.target.value)} placeholder="Cant." className="w-full bg-slate-900 border border-rose-700/60 rounded-xl px-3 py-2 text-sm text-white" required />
                      </div>
                      <div>
                        <select value={unidadCruce} onChange={e => setUnidadCruce(e.target.value)} className="w-full bg-slate-900 border border-rose-700/60 rounded-xl px-3 py-2 text-sm text-white">
                          {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>
                )}

                <div className="flex flex-col sm:flex-row gap-3">
                  <input type="text" value={notas} onChange={e => setNotas(e.target.value)} placeholder="Observación opcional (Ej: Cliente avisó por WhatsApp, caja rota...)" className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                  <button type="submit" className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-2.5 rounded-xl text-sm shadow-md transition">
                    {editandoId ? "Guardar Cambios" : "Guardar Registro"}
                  </button>
                </div>
              </form>

              <div className="flex items-center justify-between mb-3">
                <h3 className="text-sm font-bold text-slate-300 uppercase tracking-wider">Registros de la Semana Actual</h3>
                <button onClick={cerrarSemana} className="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-2 rounded-xl shadow">
                  🔒 Cerrar Semana
                </button>
              </div>

              {incidencias.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">
                  No hay incidencias registradas en esta semana. ¡Todo cuadrado!
                </div>
              ) : (
                <div className="space-y-3">
                  {incidencias.map(item => (
                    <div key={item.id} className={`p-4 rounded-2xl border transition ${item.resuelto ? "bg-slate-900/40 border-emerald-800/50 opacity-75" : "bg-slate-900 border-slate-800"}`}>
                      <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <div className="flex items-center gap-2">
                          <span className="bg-slate-800 text-amber-400 font-black text-xs px-2.5 py-1 rounded-lg border border-slate-700">
                            Fact #{item.factura}
                          </span>
                          <span className={`text-xs font-bold px-2.5 py-1 rounded-lg ${
                            item.motivo === "Faltante" ? "bg-rose-500/20 text-rose-300" :
                            item.motivo === "Sobrante" ? "bg-sky-500/20 text-sky-300" :
                            item.motivo === "Cruce" ? "bg-purple-500/20 text-purple-300" :
                            "bg-amber-500/20 text-amber-300"
                          }`}>
                            {item.motivo}
                          </span>
                          <span className="text-xs text-slate-400">{item.fecha}</span>
                        </div>
                        <div className="text-xs text-slate-300">
                          <span className="font-semibold text-white">{item.armador}</span> • {item.ruta}
                        </div>
                      </div>

                      <div className="text-sm font-bold text-white mb-1">
                        {item.cantidad} {item.unidad} — {item.producto}
                      </div>

                      {item.motivo === "Cruce" && item.productoCruce && (
                        <div className="text-xs font-semibold text-rose-300 bg-rose-950/40 px-3 py-1.5 rounded-lg inline-block mb-2">
                          🔄 Se envió por error: {item.cantidadCruce} {item.unidadCruce} de {item.productoCruce}
                        </div>
                      )}

                      {item.notas && <p className="text-xs text-slate-400 italic mb-2">"{item.notas}"</p>}

                      <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800/80 text-xs">
                        <span className="text-amber-300/90 font-medium">📌 Acción: {item.accionResolucion}</span>
                        <div className="flex items-center gap-2">
                          <button onClick={() => cambiarEstado(item.id, item.resuelto)} className={`px-2.5 py-1 rounded-lg font-bold ${item.resuelto ? "bg-emerald-600 text-white" : "bg-slate-800 text-slate-300"}`}>
                            {item.resuelto ? "✓ Resuelto" : "Marcar Resuelto"}
                          </button>
                          <button onClick={() => cargarParaEditar(item)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-sky-300 rounded-lg">
                            Editar
                          </button>
                          <button onClick={() => eliminarIncidencia(item.id)} className="px-2.5 py-1 bg-slate-800 hover:bg-rose-900/60 text-rose-400 rounded-lg">
                            Borrar
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}

          {vista === "balance" && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg">
              <h2 className="text-base font-bold text-amber-400 mb-1">📊 Cuadratura de Inventario en Bodega</h2>
              <p className="text-xs text-slate-400 mb-4">
                Cálculo automático según Faltantes en ruta (sobran en bodega), Sobrantes en ruta (faltan en bodega) y Cruces de productos.
              </p>
              {resumenInventario.length === 0 ? (
                <p className="text-sm text-slate-400">Sin desfases de inventario registrados esta semana.</p>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs sm:text-sm">
                    <thead className="bg-slate-950 text-slate-400 uppercase text-xs">
                      <tr>
                        <th className="p-3">Producto</th>
                        <th className="p-3">Unidad</th>
                        <th className="p-3 text-emerald-400">Debe Sobrar en Bodega (+)</th>
                        <th className="p-3 text-rose-400">Falta en Bodega (-)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {resumenInventario.map((item, idx) => (
                        <tr key={idx}>
                          <td className="p-3 font-bold text-white">{item.producto}</td>
                          <td className="p-3 text-slate-300">{item.unidad}</td>
                          <td className="p-3 font-bold text-emerald-400">{item.sobranteBodega > 0 ? `+${item.sobranteBodega}` : "0"}</td>
                          <td className="p-3 font-bold text-rose-400">{item.faltanteBodega > 0 ? `-${item.faltanteBodega}` : "0"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {vista === "historial" && (
            <div className="space-y-4">
              <h2 className="text-base font-bold text-amber-400">📁 Historial de Semanas Cerradas</h2>
              {cierres.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-sm text-slate-400">
                  Aún no se han archivado semanas cerradas.
                </div>
              ) : (
                cierres.map(c => (
                  <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <div className="flex justify-between items-center mb-2">
                      <h3 className="font-bold text-white">{c.nombreSemana}</h3>
                      <span className="text-xs bg-slate-800 px-2.5 py-1 rounded-lg text-amber-400">
                        {c.totalRegistros} registros
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 mb-2">
                      Cerrado el: {new Date(c.fechaCierre).toLocaleString("es-CL")}
                    </p>
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
