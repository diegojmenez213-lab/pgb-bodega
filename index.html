  <script type="text/babel">

    // 1. CONEXIÓN FIREBASE REAL

    // CLAVE MAESTRA SUPER ADMIN

    // NORMALIZADOR DE RUT (Acepta con o sin puntos/guion y guarda limpio)
    const limpiarRut = (val) => (val || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRutVisual = (rut) => {
      const clean = limpiarRut(rut);
      if (clean.length < 2) return clean;
      const cuerpo = clean.slice(0, -1);
      const dv = clean.slice(-1);
      return `${cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".")}-${dv}`;
    };

    // PLANTILLAS PRE-PROGRAMADAS POR RUBRO
    const PLANTILLAS_RUBRO = {

        tarifaUF: 1.5,
        modulos: {

          conteoCiclico: false,
          cuarentenaRuta: false,
          rendicionChoferes: false,
          comprasXML: false,
          sugeridoProveedor: false,
          puntoEquilibrio: true,
          ecommerce247: false,
          bandejasLotes: false,
          posRapido: true,
          agendaServicios: true,
          multiSucursal: false,
          autoCAF: false
        }
      }
    };

    const ETIQUETAS_MODULOS = {
      pickingBodega: "Control Picking y Armadores",
      incidenciasRetornos: "Incidencias y Retornos en Ruta",
      conteoCiclico: "Inventario y Conteo Cíclico",
      cuarentenaRuta: "Cuarentena Fuera de Ruta",
      rendicionChoferes: "Rendición de Choferes y Créditos",
      ecommerce247: "Facturación SII 24/7 + Marketplaces",
      bandejasLotes: "Bandejas Impresión (Líder / General)",
      posRapido: "Punto de Venta Rápido (POS)",
      agendaServicios: "Agenda Horas y Comisiones",
      comprasXML: "Carga Compras XML / Foto IA",
      sugeridoProveedor: "Sugerido Compras por Proveedor",
      puntoEquilibrio: "Punto de Equilibrio Neto Vivo",
      multiSucursal: "Modo Cadena Multi-Sucursal (18+)",
      autoCAF: "Add-on Auto-CAF Folios SII"
    };

    // EMPRESAS INICIALES (PGB Y TECNOSHOP)
    const EMPRESAS_SEMILLA = [
      {
        rut: "769497226",
        razonSocial: "PGB Distribution Chile SpA",
        clave: "1234",
        rubro: "distribuidora",
        estado: "activo", // activo | aviso | suspendido
        modoJerarquia: false, // false = acceso general 1234, true = por roles
        tarifaUF: 6,
        sucursales: ["Casa Matriz Macul (Av. Exequiel Fernández 3397)"],
        logoBase64: "",
        rutaLegacy: "pgb-operacion.html",
        modulos: PLANTILLAS_RUBRO.distribuidora.modulos
      },
      {
        rut: "775280425",
        razonSocial: "Tecnoshop Company SpA",
        clave: "1234",
        rubro: "ecommerce",
        estado: "activo",
        modoJerarquia: false,
        tarifaUF: 4,
        sucursales: ["Bodega Central Santiago"],
        logoBase64: "",
        rutaLegacy: "",
        modulos: PLANTILLAS_RUBRO.ecommerce.modulos
      }
    ];

    function App() {
      const [vista, setVista] = useState("cargando"); // cargando | login | superadmin_login | superadmin | cliente
      const [empresas, setEmpresas] = useState([]);
      const [empresaActiva, setEmpresaActiva] = useState(null);
      const [toquesSecretos, setToquesSecretos] = useState(0);

      // Estados Login Cliente
      const [rutInput, setRutInput] = useState("");
      const [claveInput, setClaveInput] = useState("");
      const [errorLogin, setErrorLogin] = useState("");
      const [ingresando, setIngresando] = useState(false);

      // Estados Super Admin
      const [masterInput, setMasterInput] = useState("");
      const [errorMaster, setErrorMaster] = useState("");
      const [busqueda, setBusqueda] = useState("");
      const [modalEmpresa, setModalEmpresa] = useState(null); // null o objeto empresa en edición/creación
      const [guardando, setGuardando] = useState(false);

      // Detectar ruta secreta #/comando
      useEffect(() => {
        const checkHash = () => {
          if (window.location.hash === "#/comando") {
            const saAuth = sessionStorage.getItem("nexus_sa_auth");
            setVista(saAuth === "OK" ? "superadmin" : "superadmin_login");
          }
        };
        checkHash();
        window.addEventListener("hashchange", checkHash);
        return () => window.removeEventListener("hashchange", checkHash);
      }, []);

      // Inicializar Auth anónima silenciosa + Sembrar PGB y TecnoShop si no existen
      useEffect(() => {
        let unsubscribe = null;

        const iniciarSistema = async () => {
          try {
            if (!auth.currentUser) {
              await auth.signInAnonymously().catch(() => {});
            }

            // Verificar y crear empresas semilla si es primera vez
            for (const emp of EMPRESAS_SEMILLA) {
              const ref = db.collection("saas_empresas").doc(emp.rut);
              const snap = await ref.get();
              if (!snap.exists) {
                await ref.set({
                  ...emp,
                  creadoEn: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
            }

            // Escuchar empresas en tiempo real
            unsubscribe = db.collection("saas_empresas").onSnapshot((snapshot) => {
              const lista = [];
              snapshot.forEach((doc) => lista.push({ id: doc.id, ...doc.data() }));
              setEmpresas(lista);

              // Revisar si hay ruta secreta o sesión guardada
              if (window.location.hash === "#/comando") {
                const saAuth = sessionStorage.getItem("nexus_sa_auth");
                setVista(saAuth === "OK" ? "superadmin" : "superadmin_login");
                return;
              }

              const sesionGuardada = localStorage.getItem("nexus_empresa_rut");
              if (sesionGuardada) {
                const encontrada = lista.find((e) => e.rut === sesionGuardada);
                if (encontrada && encontrada.estado !== "suspendido") {
                  if (encontrada.rutaLegacy) {
                    window.location.href = encontrada.rutaLegacy;
                    return;
                  }
                  setEmpresaActiva(encontrada);
                  setVista("cliente");
                  return;
                }
              }
              setVista("login");
            });
          } catch (err) {
            console.error("Error inicializando:", err);
            setVista("login");
          }
        };

        iniciarSistema();
        return () => { if (unsubscribe) unsubscribe(); };
      }, []);

      // Gesto secreto: 5 toques en el ícono de escudo abre #/comando
      const manejarToqueSecreto = () => {
        const nuevo = toquesSecretos + 1;
        if (nuevo >= 5) {
          setToquesSecretos(0);
          window.location.hash = "#/comando";
        } else {
          setToquesSecretos(nuevo);
        }
      };

      // Login Empresa Cliente
      const manejarLoginCliente = async (e) => {
        e.preventDefault();
        setErrorLogin("");
        setIngresando(true);

        const rutLimpio = limpiarRut(rutInput);
        if (!rutLimpio || !claveInput) {
          setErrorLogin("Ingresa el RUT de la empresa y tu clave.");
          setIngresando(false);
          return;
        }

        try {
          let emp = empresas.find((x) => x.rut === rutLimpio);
          if (!emp) {
            const docSnap = await db.collection("saas_empresas").doc(rutLimpio).get();
            if (docSnap.exists) emp = docSnap.data();
          }

          if (!emp) {
            setErrorLogin("RUT no registrado en la plataforma.");
            setIngresando(false);
            return;
          }

          if (emp.clave !== claveInput.trim()) {
            setErrorLogin("Clave incorrecta. Verifica e intenta nuevamente.");
            setIngresando(false);
            return;
          }

          if (emp.estado === "suspendido") {
            setErrorLogin("Cuenta suspendida temporalmente. Contacta a soporte.");
            setIngresando(false);
            return;
          }

          localStorage.setItem("nexus_empresa_rut", emp.rut);

          // Si es PGB (u otra empresa con operación legacy), redirige directo a su interfaz intacta
          if (emp.rutaLegacy) {
            window.location.href = emp.rutaLegacy;
            return;
          }

          setEmpresaActiva(emp);
          setVista("cliente");
        } catch (err) {
          setErrorLogin("Error de conexión. Revisa tu internet.");
        }
        setIngresando(false);
      };

      // Login Super Admin
      const manejarLoginMaster = (e) => {
        e.preventDefault();
        if (masterInput === MASTER_KEY) {
          sessionStorage.setItem("nexus_sa_auth", "OK");
          setErrorMaster("");
          setMasterInput("");
          setVista("superadmin");
        } else {
          setErrorMaster("Clave maestra incorrecta.");
        }
      };

      const cerrarSesionCliente = () => {
        localStorage.removeItem("nexus_empresa_rut");
        setEmpresaActiva(null);
        setRutInput("");
        setClaveInput("");
        setVista("login");
      };

      const salirSuperAdmin = () => {
        sessionStorage.removeItem("nexus_sa_auth");
        window.location.hash = "";
        setVista("login");
      };

      // Abrir Modal Nueva Empresa
      const abrirNuevaEmpresa = () => {
        setModalEmpresa({
          esNueva: true,
          rut: "",
          razonSocial: "",
          clave: "1234",
          rubro: "minimarket",
          estado: "activo",
          modoJerarquia: false,
          tarifaUF: 1.5,
          sucursales: ["Casa Matriz"],
          logoBase64: "",
          rutaLegacy: "",
          modulos: { ...PLANTILLAS_RUBRO.minimarket.modulos }
        });
      };

      // Aplicar plantilla de rubro al cambiar selector
      const cambiarRubroModal = (nuevoRubro) => {
        const plantilla = PLANTILLAS_RUBRO[nuevoRubro];
        setModalEmpresa({
          ...modalEmpresa,
          rubro: nuevoRubro,
          tarifaUF: plantilla.tarifaUF,
          modulos: { ...plantilla.modulos }
        });
      };

      // Subir Logo PNG exacto (conversión a Base64 sin pérdida)
      const manejarSubidaLogo = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 750000) {
          alert("El PNG pesa más de 750 KB. Comprímelo un poco antes de subirlo.");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          setModalEmpresa({ ...modalEmpresa, logoBase64: reader.result });
        };
        reader.readAsDataURL(file);
      };

      // Guardar Empresa en Firebase
      const guardarEmpresa = async (e) => {
        e.preventDefault();
        const rutClean = limpiarRut(modalEmpresa.rut);
        if (!rutClean || !modalEmpresa.razonSocial.trim()) {
          alert("RUT y Razón Social son obligatorios.");
          return;
        }
        setGuardando(true);
        try {
          const payload = {
            rut: rutClean,
            razonSocial: modalEmpresa.razonSocial.trim(),
            clave: modalEmpresa.clave.trim() || "1234",
            rubro: modalEmpresa.rubro,
            estado: modalEmpresa.estado,
            modoJerarquia: !!modalEmpresa.modoJerarquia,
            tarifaUF: Number(modalEmpresa.tarifaUF) || 0,
            sucursales: modalEmpresa.sucursales || ["Casa Matriz"],
            logoBase64: modalEmpresa.logoBase64 || "",
            rutaLegacy: modalEmpresa.rutaLegacy || "",
            modulos: modalEmpresa.modulos,
            actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection("saas_empresas").doc(rutClean).set(payload, { merge: true });
          setModalEmpresa(null);
        } catch (err) {
          alert("Error guardando empresa: " + err.message);
        }
        setGuardando(false);
      };

      // Entrar como Admin a una empresa desde Super Admin
      const entrarComoAdmin = (emp) => {
        localStorage.setItem("nexus_empresa_rut", emp.rut);
        window.location.hash = "";
        if (emp.rutaLegacy) {
          window.location.href = emp.rutaLegacy;
          return;
        }
        setEmpresaActiva(emp);
        setVista("cliente");
      };

      // PANTALLA DE CARGA
      if (vista === "cargando") {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-950">
            <div className="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-slate-400 text-sm font-medium">Iniciando plataforma segura...</p>
          </div>
        );
      }

      // 1. PORTAL DE ACCESO LIMPIO PARA EMPRESAS (PGB / CLIENTES)
      if (vista === "login") {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
            <div className="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl">
              <div className="flex flex-col items-center text-center mb-8">
                <div
                  onClick={manejarToqueSecreto}
                  className="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mb-4 cursor-pointer select-none active:scale-95 transition"
                >
                  <svg className="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                  </svg>
                </div>
                <h1 className="text-2xl font-extrabold tracking-tight text-white">Acceso Corporativo</h1>
                <p className="text-slate-400 text-sm mt-1">Ingresa el RUT de tu empresa para continuar</p>
              </div>

              <form onSubmit={manejarLoginCliente} className="space-y-5">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                    RUT Empresa
                  </label>
                  <input
                    type="text"
                    value={rutInput}
                    onChange={(e) => setRutInput(e.target.value)}
                    placeholder="Sin puntos ni guion"
                    className="w-full px-4 py-3.5 rounded-xl bg-slate-950 border border-slate-800 text-white font-semibold placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition"
                    autoComplete="username"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                    Clave de Acceso
                  </label>
                  <input
                    type="password"
                    value={claveInput}
                    onChange={(e) => setClaveInput(e.target.value)}
                    placeholder="••••"
                    className="w-full px-4 py-3.5 rounded-xl bg-slate-950 border border-slate-800 text-white font-semibold placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition"
                    autoComplete="current-password"
                  />
                </div>

                {errorLogin && (
                  <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-semibold text-center">
                    {errorLogin}
                  </div>
                )}

                <button
                  type="submit"
                  disabled={ingresando}
                  className="w-full py-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm tracking-wide shadow-lg shadow-emerald-500/20 transition disabled:opacity-50"
                >
                  {ingresando ? "Verificando..." : "INGRESAR AL SISTEMA"}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // 2. PUERTA SECRETA SUPER ADMIN (#/comando) - LOGIN
      if (vista === "superadmin_login") {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
            <div className="w-full max-w-sm bg-slate-900 border border-amber-500/30 rounded-3xl p-7 shadow-2xl">
              <div className="text-center mb-6">
                <span className="inline-block px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 text-xs font-extrabold tracking-widest uppercase mb-3">
                  Bóveda Maestra
                </span>
                <h2 className="text-xl font-extrabold text-white">Centro de Comando</h2>
                <p className="text-slate-400 text-xs mt-1">Acceso exclusivo del fundador</p>
              </div>

              <form onSubmit={manejarLoginMaster} className="space-y-4">
                <input
                  type="password"
                  value={masterInput}
                  onChange={(e) => setMasterInput(e.target.value)}
                  placeholder="Clave Maestra"
                  className="w-full px-4 py-3.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-center font-bold tracking-widest focus:outline-none focus:border-amber-500"
                  autoFocus
                />
                {errorMaster && (
                  <p className="text-rose-400 text-xs text-center font-semibold">{errorMaster}</p>
                )}
                <button
                  type="submit"
                  className="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm transition"
                >
                  DESBLOQUEAR PANEL
                </button>
                <button
                  type="button"
                  onClick={() => { window.location.hash = ""; setVista("login"); }}
                  className="w-full py-2 text-xs text-slate-500 hover:text-slate-300"
                >
                  Volver al acceso normal
                </button>
              </form>
            </div>
          </div>
        );
      }

      // 3. PANEL DE CONTROL GLOBAL SUPER ADMIN
      if (vista === "superadmin") {
        const activas = empresas.filter((e) => e.estado === "activo").length;
        const mrrUF = empresas
          .filter((e) => e.estado === "activo")
          .reduce((acc, e) => acc + (Number(e.tarifaUF) || 0), 0);

        const filtradas = empresas.filter(
          (e) =>
            e.razonSocial.toLowerCase().includes(busqueda.toLowerCase()) ||
            e.rut.includes(limpiarRut(busqueda))
        );

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 pb-20">
            {/* Barra Superior */}
            <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-4">
              <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-black">
                    ⚡
                  </div>
                  <div>
                    <h1 className="text-lg font-extrabold text-white leading-tight">Super Admin Maestro</h1>
                    <p className="text-xs text-slate-400">Control Multi-Empresa • Chile</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={abrirNuevaEmpresa}
                    className="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs shadow-lg shadow-emerald-500/20 transition"
                  >
                    + NUEVA EMPRESA
                  </button>
                  <button
                    onClick={salirSuperAdmin}
                    className="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
                  >
                    Salir
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-6xl mx-auto px-4 pt-6 space-y-6">
              {/* Tarjetas KPI */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <p className="text-xs text-slate-400 font-semibold">Empresas Activas</p>
                  <p className="text-2xl font-black text-emerald-400 mt-1">{activas}</p>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <p className="text-xs text-slate-400 font-semibold">Facturación Mensual</p>
                  <p className="text-2xl font-black text-amber-400 mt-1">{mrrUF} UF</p>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <p className="text-xs text-slate-400 font-semibold">Total Registradas</p>
                  <p className="text-2xl font-black text-white mt-1">{empresas.length}</p>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <p className="text-xs text-slate-400 font-semibold">Motor Cloud</p>
                  <p className="text-sm font-extrabold text-emerald-400 mt-2">● En Línea 24/7</p>
                </div>
              </div>

              {/* Buscador */}
              <div>
                <input
                  type="text"
                  value={busqueda}
                  onChange={(e) => setBusqueda(e.target.value)}
                  placeholder="Buscar por nombre de empresa o RUT..."
                  className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                />
              </div>

              {/* Lista de Empresas */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filtradas.map((emp) => {
                  const infoRubro = PLANTILLAS_RUBRO[emp.rubro] || PLANTILLAS_RUBRO.minimarket;
                  const modulosActivos = Object.values(emp.modulos || {}).filter(Boolean).length;

                  return (
                    <div
                      key={emp.rut}
                      className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between gap-4"
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex items-center gap-3">
                          {emp.logoBase64 ? (
                            <img
                              src={emp.logoBase64}
                              alt={emp.razonSocial}
                              className="w-12 h-12 object-contain rounded-xl bg-white p-1"
                            />
                          ) : (
                            <div className="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-2xl">
                              {infoRubro.icono}
                            </div>
                          )}
                          <div>
                            <h3 className="font-extrabold text-white text-base">{emp.razonSocial}</h3>
                            <p className="text-xs text-slate-400 font-mono">
                              RUT: {formatearRutVisual(emp.rut)} ({emp.rut})
                            </p>
                            <div className="flex flex-wrap items-center gap-2 mt-1.5">
                              <span className="text-[11px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 font-semibold">
                                {infoRubro.icono} {infoRubro.nombre}
                              </span>
                              <span className="text-[11px] px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 font-bold">
                                {modulosActivos} módulos
                              </span>
                            </div>
                          </div>
                        </div>

                        <span
                          className={`px-2.5 py-1 rounded-full text-[11px] font-extrabold uppercase ${
                            emp.estado === "activo"
                              ? "bg-emerald-500/15 text-emerald-400"
                              : emp.estado === "aviso"
                              ? "bg-amber-500/15 text-amber-400"
                              : "bg-rose-500/15 text-rose-400"
                          }`}
                        >
                          {emp.estado}
                        </span>
                      </div>

                      <div className="flex items-center justify-between pt-3 border-t border-slate-800/80 text-xs">
                        <span className="text-slate-400">
                          Clave: <strong className="text-slate-200">{emp.clave}</strong> •{" "}
                          {emp.modoJerarquia ? "Por Roles" : "Acceso General"}
                        </span>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => setModalEmpresa({ ...emp, esNueva: false })}
                            className="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold"
                          >
                            ⚙️ Switches
                          </button>
                          <button
                            onClick={() => entrarComoAdmin(emp)}
                            className="px-3 py-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-bold"
                          >
                            👁️ Entrar
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>

            {/* MODAL CONFIGURADOR DE EMPRESA Y SWITCHES */}
            {modalEmpresa && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 overflow-y-auto">
                <div className="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-2xl max-h-[92vh] overflow-y-auto p-6 space-y-5">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <h2 className="text-lg font-extrabold text-white">
                      {modalEmpresa.esNueva ? "Registrar Nueva Empresa" : `Configurar: ${modalEmpresa.razonSocial}`}
                    </h2>
                    <button
                      onClick={() => setModalEmpresa(null)}
                      className="text-slate-400 hover:text-white text-xl font-bold px-2"
                    >
                      ✕
                    </button>
                  </div>

                  <form onSubmit={guardarEmpresa} className="space-y-5">
                    {/* Datos Básicos */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">RUT Empresa (sin puntos/guion)</label>
                        <input
                          type="text"
                          disabled={!modalEmpresa.esNueva}
                          value={modalEmpresa.rut}
                          onChange={(e) => setModalEmpresa({ ...modalEmpresa, rut: e.target.value })}
                          placeholder="769497226"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white disabled:opacity-50"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Razón Social / Nombre</label>
                        <input
                          type="text"
                          value={modalEmpresa.razonSocial}
                          onChange={(e) => setModalEmpresa({ ...modalEmpresa, razonSocial: e.target.value })}
                          placeholder="Ej: Minimarket Don Pepe"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Clave Inicial</label>
                        <input
                          type="text"
                          value={modalEmpresa.clave}
                          onChange={(e) => setModalEmpresa({ ...modalEmpresa, clave: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Estado Cuenta</label>
                        <select
                          value={modalEmpresa.estado}
                          onChange={(e) => setModalEmpresa({ ...modalEmpresa, estado: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white"
                        >
                          <option value="activo">🟢 Activo</option>
                          <option value="aviso">🟡 Aviso de Pago</option>
                          <option value="suspendido">🔴 Suspendido (Bloqueado)</option>
                        </select>
                      </div>
                    </div>

                    {/* Logo PNG Exacto */}
                    <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center justify-between gap-4">
                      <div>
                        <p className="text-xs font-extrabold text-white">Logo Original Exacto (PNG sin fondo)</p>
                        <p className="text-[11px] text-slate-400 mt-0.5">
                          Sube el archivo .png real para mostrarlo calcado sin deformaciones.
                        </p>
                        <input
                          type="file"
                          accept="image/png,image/webp,image/jpeg"
                          onChange={manejarSubidaLogo}
                          className="mt-2 text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-500/20 file:text-emerald-400"
                        />
                      </div>
                      {modalEmpresa.logoBase64 && (
                        <div className="flex flex-col items-center gap-1">
                          <img
                            src={modalEmpresa.logoBase64}
                            alt="Preview"
                            className="w-16 h-16 object-contain bg-white rounded-xl p-1"
                          />
                          <button
                            type="button"
                            onClick={() => setModalEmpresa({ ...modalEmpresa, logoBase64: "" })}
                            className="text-[10px] text-rose-400 underline"
                          >
                            Quitar
                          </button>
                        </div>
                      )}
                    </div>

                    {/* Selector de Plantilla por Rubro */}
                    <div>
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-amber-400 mb-2">
                        1. Plantilla Inteligente por Rubro (Auto-configura Switches)
                      </label>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        {Object.entries(PLANTILLAS_RUBRO).map(([key, info]) => (
                          <button
                            type="button"
                            key={key}
                            onClick={() => cambiarRubroModal(key)}
                            className={`p-3 rounded-xl border text-left transition ${
                              modalEmpresa.rubro === key
                                ? "bg-amber-500/20 border-amber-500 text-white"
                                : "bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700"
                            }`}
                          >
                            <div className="text-xl mb-1">{info.icono}</div>
                            <div className="text-xs font-bold leading-tight">{info.nombre}</div>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Interruptor Jerarquía */}
                    <div className="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl p-3.5">
                      <div>
                        <p className="text-xs font-extrabold text-white">Control de Acceso Interno</p>
                        <p className="text-[11px] text-slate-400">
                          {modalEmpresa.modoJerarquia
                            ? "Activado: Separa claves por Jefe, Armador y Chofer"
                            : "General: Todos entran directo con la clave de empresa (1234)"}
                        </p>
                      </div>
                      <button
                        type="button"
                        onClick={() =>
                          setModalEmpresa({ ...modalEmpresa, modoJerarquia: !modalEmpresa.modoJerarquia })
                        }
                        className={`px-3 py-1.5 rounded-lg text-xs font-extrabold ${
                          modalEmpresa.modoJerarquia
                            ? "bg-emerald-500 text-slate-950"
                            : "bg-slate-800 text-slate-300"
                        }`}
                      >
                        {modalEmpresa.modoJerarquia ? "POR ROLES" : "GENERAL"}
                      </button>
                    </div>

                    {/* Switches Individuales de Módulos */}
                    <div>
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-emerald-400 mb-2">
                        2. Ajuste Fino de Módulos (Interruptores)
                      </label>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {Object.entries(ETIQUETAS_MODULOS).map(([modKey, label]) => {
                          const activo = !!modalEmpresa.modulos?.[modKey];
                          return (
                            <div
                              key={modKey}
                              onClick={() =>
                                setModalEmpresa({
                                  ...modalEmpresa,
                                  modulos: { ...modalEmpresa.modulos, [modKey]: !activo }
                                })
                              }
                              className={`flex items-center justify-between p-3 rounded-xl border cursor-pointer transition ${
                                activo
                                  ? "bg-emerald-500/10 border-emerald-500/40 text-white"
                                  : "bg-slate-950 border-slate-800 text-slate-500"
                              }`}
                            >
                              <span className="text-xs font-semibold pr-2">{label}</span>
                              <div
                                className={`w-9 h-5 rounded-full p-0.5 transition ${
                                  activo ? "bg-emerald-500" : "bg-slate-700"
                                }`}
                              >
                                <div
                                  className={`w-4 h-4 rounded-full bg-white transition-transform ${
                                    activo ? "translate-x-4" : "translate-x-0"
                                  }`}
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                      <button
                        type="button"
                        onClick={() => setModalEmpresa(null)}
                        className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={guardando}
                        className="px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold"
                      >
                        {guardando ? "Guardando..." : "GUARDAR CONFIGURACIÓN"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      // 4. ESPACIO DE TRABAJO MODULAR PARA NUEVOS CLIENTES (EJ. TECNOSHOP)
      if (vista === "cliente" && empresaActiva) {
        const infoRubro = PLANTILLAS_RUBRO[empresaActiva.rubro] || PLANTILLAS_RUBRO.minimarket;
        const activos = Object.entries(empresaActiva.modulos || {}).filter(([, val]) => val);

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100">
            {empresaActiva.estado === "aviso" && (
              <div className="bg-amber-500 text-slate-950 text-xs font-extrabold text-center py-2 px-4">
                ⚠️ Recordatorio: Tu suscripción mensual presenta un saldo pendiente. Regulariza para evitar suspensión.
              </div>
            )}

            <header className="bg-slate-900 border-b border-slate-800 px-4 py-4">
              <div className="max-w-5xl mx-auto flex items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  {empresaActiva.logoBase64 ? (
                    <img
                      src={empresaActiva.logoBase64}
                      alt={empresaActiva.razonSocial}
                      className="w-11 h-11 object-contain bg-white rounded-xl p-1"
                    />
                  ) : (
                    <div className="w-11 h-11 rounded-xl bg-emerald-500/20 flex items-center justify-center text-xl">
                      {infoRubro.icono}
                    </div>
                  )}
                  <div>
                    <h1 className="font-extrabold text-white text-base leading-tight">
                      {empresaActiva.razonSocial}
                    </h1>
                    <p className="text-xs text-slate-400">
                      RUT {formatearRutVisual(empresaActiva.rut)} • {infoRubro.nombre}
                    </p>
                  </div>
                </div>

                <button
                  onClick={cerrarSesionCliente}
                  className="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300"
                >
                  Cerrar Sesión
                </button>
              </div>
            </header>

            <main className="max-w-5xl mx-auto px-4 py-8 space-y-6">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                <span className="inline-block px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-400 text-xs font-extrabold mb-3">
                  ● Arquitectura Multi-Empresa Activa
                </span>
                <h2 className="text-xl font-extrabold text-white">
                  Módulos Habilitados para {empresaActiva.razonSocial}
                </h2>
                <p className="text-sm text-slate-400 mt-1">
                  Este entorno está aislado por RUT y gobernado en tiempo real por los interruptores del sistema.
                </p>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mt-6">
                  {activos.map(([key]) => (
                    <div
                      key={key}
                      className="p-4 rounded-2xl bg-slate-950 border border-emerald-500/30 flex items-center gap-3"
                    >
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
                      <span className="text-xs font-bold text-slate-200">
                        {ETIQUETAS_MODULOS[key] || key}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
