<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ERP Chile • Plataforma Empresarial Universal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .card-clean { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); }
  </style>
  <script>
    window.onerror = function (msg, url, line) {
      var box = document.getElementById("error-fallback");
      if (box) {
        box.style.display = "block";
        box.innerText = "Error detectado (Línea " + line + "): " + msg;
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-amber-400 selection:text-slate-950">
  <div id="error-fallback" style="display:none; background:#fee2e2; color:#991b1b; padding:14px; font-size:12px; font-weight:700; border-bottom:2px solid #ef4444;"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    const CATALOGO_18_MODULOS = [
      { id: "m1_empresa", num: 1, grupo: "Núcleo", nombre: "Multi-Empresa y Perfil", desc: "Identidad corporativa, logo y aislamiento por RUT.", archivo: "#config_empresa", icono: "🏢", listo: true },
      { id: "m2_jerarquia", num: 2, grupo: "Núcleo", nombre: "Jerarquía y Equipo", desc: "Crea jefes, vendedores, bodegueros y choferes.", archivo: "#config_equipo", icono: "👥", listo: true },
      { id: "m3_catalogo", num: 3, grupo: "Núcleo", nombre: "Catálogo Maestro Inteligente", desc: "Carga Excel (.xlsx) vinculado a inventario y ventas.", archivo: "#config_catalogo", icono: "📚", listo: true },
      { id: "m4_apis", num: 4, grupo: "Núcleo", nombre: "Conexiones API (MeLi / SII)", desc: "Llaves para Mercado Libre, Falabella, Lider y OpenFactura.", archivo: "#config_apis", icono: "🔌", listo: true },
      { id: "m5_inv_general", num: 5, grupo: "Inventario", nombre: "Inventario General y Proveedor", desc: "Selección masiva o por marca para toma de stock.", archivo: "pgb-inventario.html", icono: "📦", listo: true },
      { id: "m6_conteo_ciclico", num: 6, grupo: "Inventario", nombre: "Conteo Cíclico Digital y PDF", desc: "Hojas en columnas y conteo en estantería desde celular.", archivo: "pgb-inventario.html", icono: "📱", listo: true },
      { id: "m7_auditoria_inv", num: 7, grupo: "Inventario", nombre: "Auditoría Acumulativa Stock", desc: "Aprobación de Jefatura e historial de correcciones.", archivo: "pgb-operacion.html", icono: "⚖️", listo: true },
      { id: "m8_omnicanal", num: 8, grupo: "E-Commerce & SII", nombre: "Consola Omnicanal 24/7", desc: "Órdenes en vivo de Mercado Libre, Falabella y Lider.", archivo: "ecommerce-sii.html", icono: "🛒", listo: true },
      { id: "m9_stock_sync", num: 9, grupo: "E-Commerce & SII", nombre: "Stock Compartido en Vivo", desc: "Descuento automático multi-canal sin sobreventas.", archivo: "ecommerce-sii.html", icono: "🔄", listo: true },
      { id: "m10_sii_dte", num: 10, grupo: "E-Commerce & SII", nombre: "Motor Tributario SII (33/39)", desc: "Boleta o Factura automática + monitor de folios CAF.", archivo: "ecommerce-sii.html", icono: "🧾", listo: true },
      { id: "m11_colas_print", num: 11, grupo: "E-Commerce & SII", nombre: "Colas de Impresión Etiquetas", desc: "Lote general MeLi/Falabella + cola exclusiva Lider.", archivo: "ecommerce-sii.html", icono: "🖨️", listo: true },
      { id: "m12_ruta_inc", num: 12, grupo: "Logística", nombre: "Tablero Incidencias y Ruta", desc: "Faltantes, cruces, rechazos y errores de facturación.", archivo: "pgb-operacion.html", icono: "🚚", listo: true },
      { id: "m13_retornos_merma", num: 13, grupo: "Logística", nombre: "Retornos y Mermas Bodega", desc: "Recepción de devoluciones, roturas y compras personal.", archivo: "pgb-operacion.html", icono: "📥", listo: true },
      { id: "m14_analitica_err", num: 14, grupo: "Logística", nombre: "Analítica 100% Bodega/Ventas", desc: "Gráficos mensuales de desempeño por colaborador.", archivo: "pgb-operacion.html", icono: "📊", listo: true },
      { id: "m15_pos_ventas", num: 15, grupo: "Comercial", nombre: "Punto de Venta (POS) Rápido", desc: "Ventas presenciales, mesón y cotizaciones al instante.", archivo: "ventas-pos.html", icono: "💳", listo: false },
      { id: "m16_caja_cobros", num: 16, grupo: "Comercial", nombre: "Cuentas por Cobrar y Caja", desc: "Fiados, abonos parciales y arqueo de billetes.", archivo: "ventas-pos.html", icono: "💵", listo: false },
      { id: "m17_compras_prov", num: 17, grupo: "Gerencia", nombre: "Pedidos a Proveedores", desc: "Reposición inteligente según stock mínimo y marca.", archivo: "compras-finanzas.html", icono: "📋", listo: false },
      { id: "m18_finanzas_bi", num: 18, grupo: "Gerencia", nombre: "Balance y Flujo Financiero", desc: "Utilidad neta, gastos operativos y reportes ejecutivos.", archivo: "compras-finanzas.html", icono: "📈", listo: false }
    ];

    const ROLES_JERARQUIA = ["Jefatura / Admin", "Vendedor / Comercial", "Bodega / Armador", "Chofer / Despacho"];

    function App() {
      const [rutActivo, setRutActivo] = useState(() => localStorage.getItem("nexus_empresa_rut") || "");
      const [modoSuperAdmin, setModoSuperAdmin] = useState(() => window.location.hash === "#/comando");
      const [pinAdmin, setPinAdmin] = useState("");
      const [adminAutenticado, setAdminAutenticado] = useState(false);

      const [tabAuth, setTabAuth] = useState("ingresar");
      const [rutInput, setRutInput] = useState("");
      const [nombreReg, setNombreReg] = useState("");
      const [rubroReg, setRubroReg] = useState("Distribuidora / Comercio");
      const [jefeReg, setJefeReg] = useState("");
      const [cargandoAuth, setCargandoAuth] = useState(false);

      const [empresa, setEmpresa] = useState(null);
      const [todasEmpresas, setTodasEmpresas] = useState([]);
      const [tabPanel, setTabPanel] = useState("modulos");

      const [nuevoNombreMiembro, setNuevoNombreMiembro] = useState("");
      const [nuevoRolMiembro, setNuevoRolMiembro] = useState(ROLES_JERARQUIA[1]);

      const [catalogoLocal, setCatalogoLocal] = useState([]);
      const [busquedaCat, setBusquedaCat] = useState("");
      const [importandoXlsx, setImportandoXlsx] = useState(false);
      const [prodManualCod, setProdManualCod] = useState("");
      const [prodManualNom, setProdManualNom] = useState("");
      const [prodManualProv, setProdManualProv] = useState("");

      const [apisForm, setApisForm] = useState({
        meliClientId: "",
        meliSecret: "",
        falabellaUser: "",
        falabellaApiKey: "",
        liderApiKey: "",
        siiProveedor: "OpenFactura (Haulmer)",
        siiApiKey: "",
        siiAmbiente: "Producción"
      });
      const [guardandoApis, setGuardandoApis] = useState(false);

      useEffect(() => {
        const onHash = () => setModoSuperAdmin(window.location.hash === "#/comando");
        window.addEventListener("hashchange", onHash);
        auth.signInAnonymously().catch(() => {});
        return () => window.removeEventListener("hashchange", onHash);
      }, []);

      useEffect(() => {
        if (!modoSuperAdmin) return;
        const unsub = db.collection("saas_empresas").onSnapshot((snap) => {
          setTodasEmpresas(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        });
        return () => unsub();
      }, [modoSuperAdmin]);

      useEffect(() => {
        const rutClean = limpiarRut(rutActivo);
        if (!rutClean) {
          setEmpresa(null);
          return;
        }
        const unsub = db.collection("saas_empresas").doc(rutClean).onSnapshot((doc) => {
          if (doc.exists) {
            const data = { id: doc.id, ...doc.data() };
            setEmpresa(data);
            if (data.apis) {
              setApisForm((prev) => ({ ...prev, ...data.apis }));
            }
          } else {
            const base = {
              rut: formatearRut(rutClean),
              nombre: rutClean === "769497226" ? "PGB Distribution Chile SpA" : rutClean === "775280425" ? "Tecnoshop Company SpA" : `Empresa ${formatearRut(rutClean)}`,
              rubro: "Comercio y Distribución",
              activa: true,
              equipo: [],
              modulosActivos: CATALOGO_18_MODULOS.reduce((acc, m) => ({ ...acc, [m.id]: true }), {}),
              creadoEn: new Date().toISOString()
            };
            db.collection("saas_empresas").doc(rutClean).set(base, { merge: true });
          }
        });

        const colCat = rutClean === "769497226"
          ? db.collection("catalogo_productos")
          : db.collection("saas_empresas").doc(rutClean).collection("catalogo");

        const unsubCat = colCat.onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
          setCatalogoLocal(lista);
        });

        return () => {
          unsub();
          unsubCat();
        };
      }, [rutActivo]);

      const ingresarConRut = async (e) => {
        e.preventDefault();
        const rutClean = limpiarRut(rutInput);
        if (rutClean.length < 7) return alert("Ingresa un RUT válido (Ej: 77.528.042-5).");
        setCargandoAuth(true);
        try {
          const docRef = db.collection("saas_empresas").doc(rutClean);
          const snap = await docRef.get();
          if (!snap.exists) {
            alert("Este RUT aún no está registrado. Completa el registro rápido en la pestaña 'Crear Empresa Nueva'.");
            setTabAuth("registrar");
            setCargandoAuth(false);
            return;
          }
          if (snap.data().activa === false) {
            alert("Esta cuenta se encuentra pausada. Contacta a soporte NEXUS.");
            setCargandoAuth(false);
            return;
          }
          localStorage.setItem("nexus_empresa_rut", rutClean);
          setRutActivo(rutClean);
        } catch (err) {
          alert("Error de conexión: " + err.message);
        }
        setCargandoAuth(false);
      };

      const registrarNuevaEmpresa = async (e) => {
        e.preventDefault();
        const rutClean = limpiarRut(rutInput);
        if (rutClean.length < 7 || !nombreReg.trim() || !jefeReg.trim()) {
          return alert("Completa RUT, Razón Social y Nombre del Jefe Administrador.");
        }
        setCargandoAuth(true);
        try {
          const modulosTodos = CATALOGO_18_MODULOS.reduce((acc, m) => ({ ...acc, [m.id]: true }), {});
          await db.collection("saas_empresas").doc(rutClean).set({
            rut: formatearRut(rutClean),
            nombre: nombreReg.trim(),
            rubro: rubroReg,
            activa: true,
            equipo: [{ id: Date.now().toString(), nombre: jefeReg.trim(), rol: "Jefatura / Admin" }],
            modulosActivos: modulosTodos,
            creadoEn: new Date().toISOString()
          }, { merge: true });

          localStorage.setItem("nexus_empresa_rut", rutClean);
          setRutActivo(rutClean);
          setTabPanel("equipo");
        } catch (err) {
          alert("Error al crear empresa: " + err.message);
        }
        setCargandoAuth(false);
      };

      const cerrarSesion = () => {
        localStorage.removeItem("nexus_empresa_rut");
        setRutActivo("");
        setEmpresa(null);
      };

      const agregarMiembroEquipo = async (e) => {
        e.preventDefault();
        if (!nuevoNombreMiembro.trim() || !empresa) return;
        const actual = Array.isArray(empresa.equipo) ? empresa.equipo : [];
        const actualizado = [
          ...actual,
          { id: Date.now().toString(), nombre: nuevoNombreMiembro.trim(), rol: nuevoRolMiembro }
        ];
        await db.collection("saas_empresas").doc(empresa.id).update({ equipo: actualizado });
        setNuevoNombreMiembro("");
      };

      const eliminarMiembroEquipo = async (idMiembro) => {
        if (!empresa) return;
        const actualizado = (empresa.equipo || []).filter((m) => m.id !== idMiembro);
        await db.collection("saas_empresas").doc(empresa.id).update({ equipo: actualizado });
      };

      const getColeccionCatalogo = () => {
        const rutClean = limpiarRut(rutActivo);
        return rutClean === "769497226"
          ? db.collection("catalogo_productos")
          : db.collection("saas_empresas").doc(rutClean).collection("catalogo");
      };

      const subirExcelCatalogo = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setImportandoXlsx(true);
        try {
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, { type: "array" });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          const normKey = (k) => String(k || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
          const normVal = (v) => String(v || "").trim().replace(/\s+/g, " ").toUpperCase();

          const existentes = new Set(catalogoLocal.map((p) => normVal(p.nombre)));
          const nuevos = [];

          rows.forEach((row) => {
            const keys = Object.keys(row);
            let cod = "", nom = "", prov = "";
            keys.forEach((k) => {
              const kn = normKey(k);
              if (!cod && (kn.includes("cod") || kn.includes("sku") || kn === "id")) cod = normVal(row[k]);
              else if (!nom && (kn.includes("desc") || kn.includes("prod") || kn.includes("nomb") || kn.includes("art"))) nom = normVal(row[k]);
              else if (!prov && (kn.includes("prov") || kn.includes("marc"))) prov = normVal(row[k]);
            });
            if (!nom && keys.length >= 2) {
              cod = normVal(row[keys[0]]);
              nom = normVal(row[keys[1]]);
              if (keys.length >= 3) prov = normVal(row[keys[2]]);
            } else if (!nom && keys.length === 1) {
              nom = normVal(row[keys[0]]);
            }
            if (nom && !existentes.has(nom)) {
              existentes.add(nom);
              nuevos.push({ codigo: cod, nombre: nom, proveedor: prov });
            }
          });

          const col = getColeccionCatalogo();
          for (let i = 0; i < nuevos.length; i += 400) {
            const batch = db.batch();
            nuevos.slice(i, i + 400).forEach((item) => batch.set(col.doc(), item));
            await batch.commit();
          }
          alert(`✅ Catálogo inteligente actualizado: ${nuevos.length} productos nuevos cargados.`);
        } catch (err) {
          alert("Error leyendo Excel: " + err.message);
        }
        setImportandoXlsx(false);
        e.target.value = "";
      };

      const agregarProductoManual = async (e) => {
        e.preventDefault();
        if (!prodManualNom.trim()) return;
        const col = getColeccionCatalogo();
        await col.add({
          codigo: prodManualCod.trim().toUpperCase(),
          nombre: prodManualNom.trim().toUpperCase(),
          proveedor: prodManualProv.trim().toUpperCase()
        });
        setProdManualCod("");
        setProdManualNom("");
        setProdManualProv("");
      };

      const borrarProductoCat = async (id) => {
        await getColeccionCatalogo().doc(id).delete();
      };

      const guardarConfigApis = async (e) => {
        e.preventDefault();
        if (!empresa) return;
        setGuardandoApis(true);
        try {
          await db.collection("saas_empresas").doc(empresa.id).update({ apis: apisForm });
          alert("✅ Credenciales API y parámetros SII guardados de forma segura.");
        } catch (err) {
          alert("Error al guardar: " + err.message);
        }
        setGuardandoApis(false);
      };

      const toggleModuloEmpresa = async (emp, modId) => {
        const actuales = emp.modulosActivos || {};
        const nuevoValor = actuales[modId] === false ? true : false;
        await db.collection("saas_empresas").doc(emp.id).update({
          [`modulosActivos.${modId}`]: nuevoValor
        });
      };

      const catalogoFiltrado = useMemo(() => {
        const q = busquedaCat.trim().toLowerCase();
        if (!q) return catalogoLocal;
        return catalogoLocal.filter((p) =>
          (p.nombre || "").toLowerCase().includes(q) ||
          (p.codigo || "").toLowerCase().includes(q) ||
          (p.proveedor || "").toLowerCase().includes(q)
        );
      }, [catalogoLocal, busquedaCat]);

      const abrirModulo = (mod) => {
        if (mod.archivo.startsWith("#config_")) {
          const destino = mod.archivo.replace("#config_", "");
          setTabPanel(destino === "empresa" ? "equipo" : destino);
          return;
        }
        if (!mod.listo) {
          return alert(`🚧 Módulo ${mod.num} (${mod.nombre}): Espacios API y base de datos ya están creados. En el siguiente paso desplegaremos su interfaz (${mod.archivo}).`);
        }
        window.location.href = mod.archivo;
      };

      if (modoSuperAdmin) {
        if (!adminAutenticado) {
          return (
            <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
              <div className="max-w-sm w-full bg-slate-900 border border-slate-800 rounded-3xl p-7 space-y-4">
                <span className="text-xs font-extrabold uppercase tracking-widest text-amber-400">NEXUS MASTER CONSOLE</span>
                <h1 className="text-xl font-black">Acceso Fundador</h1>
                <input
                  type="password"
                  value={pinAdmin}
                  onChange={(e) => setPinAdmin(e.target.value)}
                  placeholder="PIN Maestro (Ej: 2026)"
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-400"
                />
                <button
                  onClick={() => (pinAdmin === "2026" ? setAdminAutenticado(true) : alert("PIN incorrecto"))}
                  className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-sm cursor-pointer"
                >
                  Entrar al Centro de Control
                </button>
                <a href="#" className="block text-center text-xs text-slate-400 pt-2">← Volver al Portal Empresas</a>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-slate-950 text-white p-4 sm:p-8">
            <div className="max-w-5xl mx-auto space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
                <div>
                  <span className="text-[11px] font-extrabold text-amber-400 uppercase tracking-widest">NEXUS SaaS • SUPER ADMIN</span>
                  <h1 className="text-2xl font-black">Control Global de Empresas y 18 Módulos</h1>
                </div>
                <a href="#" className="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl">
                  ← Salir de Super Admin
                </a>
              </div>

              {todasEmpresas.map((emp) => (
                <div key={emp.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <h2 className="text-lg font-black text-amber-400">{emp.nombre}</h2>
                      <p className="text-xs text-slate-400">RUT: {emp.rut} • Rubro: {emp.rubro || "General"}</p>
                    </div>
                    <button
                      onClick={() => {
                        localStorage.setItem("nexus_empresa_rut", emp.id);
                        setRutActivo(emp.id);
                        window.location.hash = "";
                      }}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black px-4 py-2 rounded-xl cursor-pointer"
                    >
                      Entrar como esta empresa ➔
                    </button>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                    {CATALOGO_18_MODULOS.map((m) => {
                      const encendido = emp.modulosActivos?.[m.id] !== false;
                      return (
                        <button
                          key={m.id}
                          onClick={() => toggleModuloEmpresa(emp, m.id)}
                          className={`p-2 rounded-xl border text-left text-[11px] font-bold transition cursor-pointer ${
                            encendido ? "bg-emerald-950/60 border-emerald-500/50 text-emerald-300" : "bg-slate-950 border-slate-800 text-slate-500"
                          }`}
                        >
                          <span className="block">{m.icono} M{m.num}</span>
                          <span className="truncate block">{m.nombre}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      if (!rutActivo || !empresa) {
        return (
          <div className="min-h-screen bg-slate-950 text-white flex flex-col justify-center items-center p-4">
            <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-1">
                <span className="inline-block px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-amber-500/10 text-amber-400 border border-amber-500/30">
                  NEXUS ERP CHILE • 18 MÓDULOS
                </span>
                <h1 className="text-2xl sm:text-3xl font-black tracking-tight pt-1">
                  Sistema Operativo <span className="text-amber-400">Empresarial</span>
                </h1>
                <p className="text-xs text-slate-400">
                  Inventario inteligente, logística, ventas POS, marketplaces y facturación SII en un solo lugar.
                </p>
              </div>

              <div className="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                <button
                  type="button"
                  onClick={() => setTabAuth("ingresar")}
                  className={`py-2.5 rounded-xl text-xs font-black transition cursor-pointer ${tabAuth === "ingresar" ? "bg-amber-500 text-slate-950" : "text-slate-400"}`}
                >
                  🔑 Ingresar con RUT
                </button>
                <button
                  type="button"
                  onClick={() => setTabAuth("registrar")}
                  className={`py-2.5 rounded-xl text-xs font-black transition cursor-pointer ${tabAuth === "registrar" ? "bg-amber-500 text-slate-950" : "text-slate-400"}`}
                >
                  ✨ Crear Empresa Nueva
                </button>
              </div>

              {tabAuth === "ingresar" ? (
                <form onSubmit={ingresarConRut} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1.5">RUT de tu Empresa *</label>
                    <input
                      type="text"
                      value={rutInput}
                      onChange={(e) => setRutInput(e.target.value)}
                      placeholder="Ej: 77.528.042-5"
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-4 py-3.5 text-base font-black text-white outline-none"
                      required
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={cargandoAuth}
                    className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl text-sm shadow-lg transition cursor-pointer"
                  >
                    {cargandoAuth ? "Verificando..." : "Entrar a mi Espacio de Trabajo ➔"}
                  </button>
                </form>
              ) : (
                <form onSubmit={registrarNuevaEmpresa} className="space-y-3.5">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">RUT Empresa *</label>
                    <input
                      type="text"
                      value={rutInput}
                      onChange={(e) => setRutInput(e.target.value)}
                      placeholder="Ej: 77.528.042-5"
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-4 py-2.5 text-sm font-bold text-white outline-none"
                      required
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Razón Social / Nombre Comercial *</label>
                    <input
                      type="text"
                      value={nombreReg}
                      onChange={(e) => setNombreReg(e.target.value)}
                      placeholder="Ej: Tecnoshop Company SpA"
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-4 py-2.5 text-sm font-bold text-white outline-none"
                      required
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Rubro Principal</label>
                    <select
                      value={rubroReg}
                      onChange={(e) => setRubroReg(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm font-bold text-white outline-none"
                    >
                      <option>Distribuidora / Mayorista</option>
                      <option>E-Commerce / Retail Omnicanal</option>
                      <option>Minimarket / Almacén</option>
                      <option>Ferretería / Materiales</option>
                      <option>Otro Rubro Comercial</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Tu Nombre (Jefe / Administrador) *</label>
                    <input
                      type="text"
                      value={jefeReg}
                      onChange={(e) => setJefeReg(e.target.value)}
                      placeholder="Ej: Director General"
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-4 py-2.5 text-sm font-bold text-white outline-none"
                      required
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={cargandoAuth}
                    className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm shadow-lg transition cursor-pointer mt-2"
                  >
                    {cargandoAuth ? "Creando ecosistema..." : "🚀 Activar Empresa con 18 Módulos Liberados"}
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      const modulosHabilitados = CATALOGO_18_MODULOS.filter((m) => empresa.modulosActivos?.[m.id] !== false);
      const equipoLista = Array.isArray(empresa.equipo) ? empresa.equipo : [];
      const tieneApis = !!(empresa.apis?.meliClientId || empresa.apis?.falabellaApiKey || empresa.apis?.siiApiKey);

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-6 pb-20 space-y-6">
          <div className="card-clean rounded-3xl p-6 sm:p-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <div className="flex flex-wrap items-center gap-2 mb-2">
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-extrabold px-3 py-1 rounded-full">
                  ● RUT {empresa.rut}
                </span>
                <span className="bg-amber-50 text-amber-800 border border-amber-200 text-[11px] font-extrabold px-3 py-1 rounded-full">
                  {modulosHabilitados.length} de 18 Módulos Liberados
                </span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-black text-slate-900">{empresa.nombre}</h1>
              <p className="text-xs sm:text-sm text-slate-500 mt-0.5">
                Centro de Mando Universal • Configura tu equipo, sube tu catálogo y opera todos tus canales.
              </p>
            </div>

            <div className="flex flex-wrap gap-2">
              <button
                onClick={cerrarSesion}
                className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer"
              >
                ⇄ Cambiar Empresa
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <button
              onClick={() => setTabPanel("equipo")}
              className="card-clean rounded-2xl p-4 text-left hover:border-amber-400 transition cursor-pointer flex items-center justify-between"
            >
              <div>
                <span className="text-[10px] font-extrabold uppercase text-amber-700 block">Paso 1 • Jerarquía</span>
                <p className="text-sm font-black text-slate-900 mt-0.5">
                  {equipoLista.length > 0 ? `${equipoLista.length} Colaboradores Creados` : "Crear Jefes, Ventas y Bodega"}
                </p>
              </div>
              <span className="text-xl">{equipoLista.length > 0 ? "✅" : "👥"}</span>
            </button>

            <button
              onClick={() => setTabPanel("catalogo")}
              className="card-clean rounded-2xl p-4 text-left hover:border-amber-400 transition cursor-pointer flex items-center justify-between"
            >
              <div>
                <span className="text-[10px] font-extrabold uppercase text-emerald-700 block">Paso 2 • Catálogo Inteligente</span>
                <p className="text-sm font-black text-slate-900 mt-0.5">
                  {catalogoLocal.length > 0 ? `${catalogoLocal.length} Productos Sincronizados` : "Subir Excel (.xlsx) Maestro"}
                </p>
              </div>
              <span className="text-xl">{catalogoLocal.length > 0 ? "✅" : "📚"}</span>
            </button>

            <button
              onClick={() => setTabPanel("apis")}
              className="card-clean rounded-2xl p-4 text-left hover:border-amber-400 transition cursor-pointer flex items-center justify-between"
            >
              <div>
                <span className="text-[10px] font-extrabold uppercase text-indigo-700 block">Paso 3 • E-Commerce y SII</span>
                <p className="text-sm font-black text-slate-900 mt-0.5">
                  {tieneApis ? "APIs Conectadas" : "Conectar MeLi / OpenFactura"}
                </p>
              </div>
              <span className="text-xl">{tieneApis ? "✅" : "🔌"}</span>
            </button>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
            <button
              onClick={() => setTabPanel("modulos")}
              className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tabPanel === "modulos" ? "bg-amber-500 text-slate-950" : "text-slate-600 hover:bg-slate-100"}`}
            >
              🧩 Los 18 Módulos ({modulosHabilitados.length})
            </button>
            <button
              onClick={() => setTabPanel("equipo")}
              className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tabPanel === "equipo" ? "bg-amber-500 text-slate-950" : "text-slate-600 hover:bg-slate-100"}`}
            >
              👥 Jerarquía y Equipo ({equipoLista.length})
            </button>
            <button
              onClick={() => setTabPanel("catalogo")}
              className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tabPanel === "catalogo" ? "bg-amber-500 text-slate-950" : "text-slate-600 hover:bg-slate-100"}`}
            >
              📚 Catálogo Inteligente ({catalogoLocal.length})
            </button>
            <button
              onClick={() => setTabPanel("apis")}
              className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tabPanel === "apis" ? "bg-amber-500 text-slate-950" : "text-slate-600 hover:bg-slate-100"}`}
            >
              🔌 APIs MeLi / SII
            </button>
          </div>

          {tabPanel === "modulos" && (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {modulosHabilitados.map((mod) => (
                <div
                  key={mod.id}
                  onClick={() => abrirModulo(mod)}
                  className="card-clean rounded-2xl p-5 hover:border-amber-400 transition cursor-pointer flex flex-col justify-between gap-4"
                >
                  <div>
                    <div className="flex items-center justify-between gap-2 mb-2">
                      <span className="text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-lg bg-slate-100 text-slate-600">
                        Módulo {mod.num} • {mod.grupo}
                      </span>
                      <span className={`text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${mod.listo ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-amber-50 text-amber-800 border border-amber-200"}`}>
                        {mod.listo ? "● Operativo" : "⚡ Listo para Conectar"}
                      </span>
                    </div>
                    <h3 className="text-base font-black text-slate-900 flex items-center gap-2">
                      <span>{mod.icono}</span>
                      <span>{mod.nombre}</span>
                    </h3>
                    <p className="text-xs text-slate-500 mt-1 leading-relaxed">{mod.desc}</p>
                  </div>

                  <div className="text-xs font-extrabold text-amber-700 flex items-center justify-between pt-2 border-t border-slate-100">
                    <span>Abrir módulo</span>
                    <span>➔</span>
                  </div>
                </div>
              ))}
            </div>
          )}

          {tabPanel === "equipo" && (
            <div className="card-clean rounded-3xl p-6 sm:p-8 space-y-6">
              <div>
                <h2 className="text-xl font-black text-slate-900">👥 Estructura y Jerarquía de tu Empresa</h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  Agrega aquí a tus jefes, vendedores, bodegueros y choferes. Todo el sistema (rutas, ventas, compras internas y gráficos) tomará automáticamente estos nombres.
                </p>
              </div>

              <form onSubmit={agregarMiembroEquipo} className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <input
                  type="text"
                  value={nuevoNombreMiembro}
                  onChange={(e) => setNuevoNombreMiembro(e.target.value)}
                  placeholder="Nombre del colaborador..."
                  className="bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-sm font-bold outline-none focus:border-amber-500"
                  required
                />
                <select
                  value={nuevoRolMiembro}
                  onChange={(e) => setNuevoRolMiembro(e.target.value)}
                  className="bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-sm font-bold outline-none"
                >
                  {ROLES_JERARQUIA.map((r) => <option key={r} value={r}>{r}</option>)}
                </select>
                <button type="submit" className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-2.5 px-4 rounded-xl text-xs sm:text-sm cursor-pointer">
                  ➕ Agregar a Jerarquía
                </button>
              </form>

              {equipoLista.length === 0 ? (
                <div className="text-center p-8 bg-slate-50 rounded-2xl text-xs text-slate-500">
                  Aún no has agregado colaboradores. Crea tu primer jefe o vendedor arriba.
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  {equipoLista.map((m) => (
                    <div key={m.id} className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center justify-between">
                      <div>
                        <p className="text-sm font-black text-slate-900">{m.nombre}</p>
                        <span className="text-[11px] font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-md mt-1 inline-block">
                          {m.rol}
                        </span>
                      </div>
                      <button
                        onClick={() => eliminarMiembroEquipo(m.id)}
                        className="text-rose-600 hover:bg-rose-50 p-2 rounded-xl text-xs font-bold cursor-pointer"
                      >
                        🗑️
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tabPanel === "catalogo" && (
            <div className="card-clean rounded-3xl p-6 sm:p-8 space-y-6">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                  <h2 className="text-xl font-black text-slate-900">📚 Catálogo Maestro Inteligente</h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Este catálogo alimenta automáticamente tu <strong>Inventario</strong>, tu <strong>Punto de Venta</strong>, tus <strong>Incidencias</strong> y tus publicaciones en <strong>Mercado Libre / Falabella / Lider</strong>.
                  </p>
                </div>
                <label className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black px-5 py-3 rounded-xl cursor-pointer shadow-sm text-center shrink-0">
                  {importandoXlsx ? "⏳ Procesando Excel..." : "📥 Subir Excel (.xlsx)"}
                  <input type="file" accept=".xlsx,.xls,.csv" onChange={subirExcelCatalogo} disabled={importandoXlsx} className="hidden" />
                </label>
              </div>

              <form onSubmit={agregarProductoManual} className="grid grid-cols-1 sm:grid-cols-4 gap-2.5 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <input
                  type="text"
                  value={prodManualCod}
                  onChange={(e) => setProdManualCod(e.target.value)}
                  placeholder="Código / SKU"
                  className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none"
                />
                <input
                  type="text"
                  value={prodManualNom}
                  onChange={(e) => setProdManualNom(e.target.value)}
                  placeholder="Nombre del producto *"
                  className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none"
                  required
                />
                <input
                  type="text"
                  value={prodManualProv}
                  onChange={(e) => setProdManualProv(e.target.value)}
                  placeholder="Proveedor / Marca"
                  className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none"
                />
                <button type="submit" className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-2 px-4 rounded-xl text-xs cursor-pointer">
                  ➕ Agregar Ítem
                </button>
              </form>

              <input
                type="text"
                value={busquedaCat}
                onChange={(e) => setBusquedaCat(e.target.value)}
                placeholder="🔍 Buscar en el catálogo por código, nombre o proveedor..."
                className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-amber-500"
              />

              <div className="max-h-80 overflow-y-auto divide-y divide-slate-200 border border-slate-200 rounded-2xl">
                {catalogoFiltrado.length === 0 ? (
                  <p className="p-8 text-center text-xs text-slate-500">Sin productos cargados aún.</p>
                ) : (
                  catalogoFiltrado.slice(0, 150).map((p) => (
                    <div key={p.id} className="px-4 py-2.5 flex items-center justify-between gap-2 text-xs hover:bg-slate-50">
                      <div className="min-w-0">
                        <span className="font-bold text-slate-900 block truncate">
                          {p.codigo ? `[${p.codigo}] ` : ""}{p.nombre}
                        </span>
                        {p.proveedor && <span className="text-[10px] text-slate-500">Proveedor: {p.proveedor}</span>}
                      </div>
                      <button onClick={() => borrarProductoCat(p.id)} className="text-rose-600 font-bold text-[11px] px-2 py-1 rounded hover:bg-rose-50 cursor-pointer">
                        🗑️
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {tabPanel === "apis" && (
            <form onSubmit={guardarConfigApis} className="card-clean rounded-3xl p-6 sm:p-8 space-y-6">
              <div>
                <h2 className="text-xl font-black text-slate-900">🔌 Integraciones Omnicanal y Facturación Electrónica (SII)</h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  Conecta tus canales de venta online y tu proveedor de documentos tributarios para automatizar stock y boletas/facturas.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-amber-50/60 border border-amber-200 rounded-2xl p-4 space-y-3">
                  <h3 className="text-sm font-black text-amber-900">🟡 Mercado Libre Chile API</h3>
                  <input
                    type="text"
                    value={apisForm.meliClientId}
                    onChange={(e) => setApisForm({ ...apisForm, meliClientId: e.target.value })}
                    placeholder="App ID / Client ID"
                    className="w-full bg-white border border-amber-300 rounded-xl px-3.5 py-2 text-xs font-bold outline-none"
                  />
                  <input
                    type="password"
                    value={apisForm.meliSecret}
                    onChange={(e) => setApisForm({ ...apisForm, meliSecret: e.target.value })}
                    placeholder="Client Secret / Access Token"
                    className="w-full bg-white border border-amber-300 rounded-xl px-3.5 py-2 text-xs font-bold outline-none"
                  />
                </div>

                <div className="bg-emerald-50/60 border border-emerald-200 rounded-2xl p-4 space-y-3">
                  <h3 className="text-sm font-black text-emerald-900">🟢 Falabella Seller Center API</h3>
                  <input
                    type="text"
                    value={apisForm.falabellaUser}
                    onChange={(e) => setApisForm({ ...apisForm, falabellaUser: e.target.value })}
                    placeholder="User ID (Correo Seller Center)"
                    className="w-full bg-white border border-emerald-300 rounded-xl px-3.5 py-2 text-xs font-bold outline-none"
                  />
                  <input
                    type="password"
                    value={apisForm.falabellaApiKey}
                    onChange={(e) => setApisForm({ ...apisForm, falabellaApiKey: e.target.value })}
                    placeholder="API Key Falabella"
                    className="w-full bg-white border border-emerald-300 rounded-xl px-3.5 py-2 text-xs font-bold outline-none"
                  />
                </div>

                <div className="bg-sky-50/60 border border-sky-200 rounded-2xl p-4 space-y-3">
                  <h3 className="text-sm font-black text-sky-900">🔵 Lider / Walmart Marketplace API</h3>
                  <input
                    type="password"
                    value={apisForm.liderApiKey}
                    onChange={(e) => setApisForm({ ...apisForm, liderApiKey: e.target.value })}
                    placeholder="Client Secret / Token Lider"
                    className="w-full bg-white border border-sky-300 rounded-xl px-3.5 py-2 text-xs font-bold outline-none"
                  />
                  <p className="text-[11px] text-sky-800">
                    * Incluye bandeja física separada para impresión de etiquetas Lider.
                  </p>
                </div>

                <div className="bg-indigo-50/60 border border-indigo-200 rounded-2xl p-4 space-y-3">
                  <h3 className="text-sm font-black text-indigo-900">🧾 SII / OpenFactura (Boleta 39 y Factura 33)</h3>
                  <select
                    value={apisForm.siiProveedor}
                    onChange={(e) => setApisForm({ ...apisForm, siiProveedor: e.target.value })}
                    className="w-full bg-white border border-indigo-300 rounded-xl px-3.5 py-2 text-xs font-bold outline-none"
                  >
                    <option>OpenFactura (Haulmer)</option>
                    <option>SimpleFactura</option>
                    <option>SII Directo (Certificado .PFX + CAF)</option>
                  </select>
                  <input
                    type="password"
                    value={apisForm.siiApiKey}
                    onChange={(e) => setApisForm({ ...apisForm, siiApiKey: e.target.value })}
                    placeholder="API Key OpenFactura / Clave Certificado"
                    className="w-full bg-white border border-indigo-300 rounded-xl px-3.5 py-2 text-xs font-bold outline-none"
                  />
                </div>
              </div>

              <button
                type="submit"
                disabled={guardandoApis}
                className="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-3.5 rounded-2xl text-sm shadow-md transition cursor-pointer"
              >
                {guardandoApis ? "Guardando..." : "💾 Guardar Conexiones API y Tributarias"}
              </button>
            </form>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
