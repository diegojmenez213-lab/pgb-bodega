<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGB Distribution Chile SpA • Control Bodega</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const UNIDADES = ["Unidad", "Caja", "Manga", "Fardo", "Unidad suelta", "Display", "Pack"];
    const MOTIVOS = [
      { id: "Faltante", label: "Faltante en Ruta", desc: "Faltó entregar al cliente (Sobra en bodega)" },
      { id: "Sobrante", label: "Sobrante en Ruta", desc: "Fue de más en el furgón (Falta en bodega)" },
      { id: "Cruce", label: "Cruce de Producto", desc: "Se facturó un producto pero se envió otro físico" },
      { id: "Rechazo", label: "Rechazo Cliente", desc: "Cliente devuelve o no recibe mercadería" },
      { id: "Daño/Merma", label: "Daño / Merma", desc: "Producto roto, vencido o averiado" }
    ];
    const ARMADORES = ["Diego", "Nico", "Edwin"];
    const RUTAS = ["Ruta 1 (Juan / Julio)", "Ruta 2 (Carlos / Horacio)", "Retiro Bodega / Otra"];
    const ACCIONES = [
      "Ajustar Inventario en Bodega",
      "Enviar / Reponer Producto al Cliente",
      "Nota de Crédito / Descuento Factura",
      "Chofer Retorna Producto a Bodega"
    ];

    function App() {
      const [incidencias, setIncidencias] = useState([]);
      const [cierres, setCierres] = useState([]);
      const [vista, setVista] = useState("dashboard");
      const [conectado, setConectado] = useState(false);
      const [editandoId, setEditandoId] = useState(null);
      const [cierreExpandido, setCierreExpandido] = useState(null);

      const [busqueda, setBusqueda] = useState("");
      const [filtroEstado, setFiltroEstado] = useState("todos");
      const [filtroArmador, setFiltroArmador] = useState("todos");
      const [filtroRuta, setFiltroRuta] = useState("todos");

      const hoy = new Date().toISOString().split("T")[0];
      const [factura, setFactura] = useState("");
      const [cliente, setCliente] = useState("");
      const [fecha, setFecha] = useState(hoy);
      const [ruta, setRuta] = useState(RUTAS[0]);
      const [armador, setArmador] = useState(ARMADORES[0]);
      const [motivo, setMotivo] = useState("Faltante");

      const [producto, setProducto] = useState("");
      const [cantidad, setCantidad] = useState(1);
      const [unidad, setUnidad] = useState(UNIDADES[0]);

      const [productoCruce, setProductoCruce] = useState("");
      const [cantidadCruce, setCantidadCruce] = useState(1);
      const [unidadCruce, setUnidadCruce] = useState(UNIDADES[0]);

      const [accionResolucion, setAccionResolucion] = useState(ACCIONES[0]);
      const [notas, setNotas] = useState("");

      useEffect(() => {
        auth.signInAnonymously().catch(() => {});

        const unsubInc = db.collection("incidencias")
          .onSnapshot((snap) => {
            setConectado(true);
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setIncidencias(lista);
          }, () => {});

        const unsubCierres = db.collection("cierres_semanales")
          .onSnapshot((snap) => {
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            lista.sort((a, b) => new Date(b.fechaCierre) - new Date(a.fechaCierre));
            setCierres(lista);
          });

        return () => {
          unsubInc();
          unsubCierres();
        };
      }, []);

      const limpiarFormulario = () => {
        setFactura("");
        setCliente("");
        setProducto("");
        setCantidad(1);
        setUnidad(UNIDADES[0]);
        setProductoCruce("");
        setCantidadCruce(1);
        setUnidadCruce(UNIDADES[0]);
        setNotas("");
        setEditandoId(null);
      };

      const guardarIncidencia = async (e) => {
        e.preventDefault();
        if (!factura.trim() || !producto.trim()) {
          return alert("Completa el Nº de Factura y el Producto.");
        }
        if (motivo === "Cruce" && !productoCruce.trim()) {
          return alert("En un Cruce indica el producto enviado por error.");
        }

        const datos = {
          factura: factura.trim(),
          cliente: cliente.trim(),
          fecha,
          ruta,
          armador,
          motivo,
          producto: producto.trim().toUpperCase(),
          cantidad: Number(cantidad),
          unidad,
          productoCruce: motivo === "Cruce" ? productoCruce.trim().toUpperCase() : null,
          cantidadCruce: motivo === "Cruce" ? Number(cantidadCruce) : null,
          unidadCruce: motivo === "Cruce" ? unidadCruce : null,
          accionResolucion,
          notas: notas.trim(),
          timestamp: Date.now()
        };

        try {
          if (editandoId) {
            delete datos.timestamp;
            await db.collection("incidencias").doc(editandoId).update(datos);
          } else {
            datos.resuelto = false;
            await db.collection("incidencias").add(datos);
          }
          limpiarFormulario();
          setVista("dashboard");
        } catch (err) {
          alert("Error al guardar: " + err.message);
        }
      };

      const cargarParaEditar = (item) => {
        setEditandoId(item.id);
        setFactura(item.factura || "");
        setCliente(item.cliente || "");
        setFecha(item.fecha || hoy);
        setRuta(item.ruta || RUTAS[0]);
        setArmador(item.armador || ARMADORES[0]);
        setMotivo(item.motivo || "Faltante");
        setProducto(item.producto || "");
        setCantidad(item.cantidad || 1);
        setUnidad(item.unidad || UNIDADES[0]);
        if (item.motivo === "Cruce") {
          setProductoCruce(item.productoCruce || "");
          setCantidadCruce(item.cantidadCruce || 1);
          setUnidadCruce(item.unidadCruce || UNIDADES[0]);
        }
        setAccionResolucion(item.accionResolucion || ACCIONES[0]);
        setNotas(item.notas || "");
        setVista("nuevo");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const cambiarEstado = async (id, estadoActual) => {
        await db.collection("incidencias").doc(id).update({ resuelto: !estadoActual });
      };

      const eliminarIncidencia = async (id) => {
        if (confirm("¿Eliminar este registro?")) {
          await db.collection("incidencias").doc(id).delete();
        }
      };

      const cerrarSemana = async () => {
        if (incidencias.length === 0) return alert("No hay incidencias activas.");
        const nombreSemana = prompt("Nombre del cierre (Ej: Semana 09 al 14 Nov):");
        if (!nombreSemana) return;

        try {
          await db.collection("cierres_semanales").add({
            nombreSemana,
            fechaCierre: new Date().toISOString(),
            totalRegistros: incidencias.length,
            registros: incidencias
          });
          const batch = db.batch();
          incidencias.forEach(inc => batch.delete(db.collection("incidencias").doc(inc.id)));
          await batch.commit();
          alert("✅ Semana cerrada y archivada.");
          setVista("historial");
        } catch (err) {
          alert("Error: " + err.message);
        }
      };

      const copiarResumenWhatsApp = () => {
        if (incidencias.length === 0) return alert("Sin incidencias.");
        let texto = `📦 *REPORTE BODEGA PGB DISTRIBUTION*\n📅 Fecha: ${hoy}\n━━━━━━━━━━━━━━\n`;
        incidencias.forEach((i, idx) => {
          const estado = i.resuelto ? "✅ RESUELTO" : "⏳ PENDIENTE";
          texto += `*${idx + 1}. Fact #${i.factura}* (${i.motivo}) - ${estado}\n`;
          texto += `   • Prod: ${i.cantidad} ${i.unidad} de ${i.producto}\n`;
          if (i.motivo === "Cruce" && i.productoCruce) {
            texto += `   • Error: ${i.cantidadCruce} ${i.unidadCruce} de ${i.productoCruce}\n`;
          }
          texto += `   • Armó: ${i.armador} | ${i.ruta}\n\n`;
        });
        navigator.clipboard.writeText(texto);
        alert("📋 ¡Reporte copiado para WhatsApp!");
      };

      const kpis = useMemo(() => {
        return {
          total: incidencias.length,
          pendientes: incidencias.filter(i => !i.resuelto).length,
          resueltas: incidencias.filter(i => i.resuelto).length,
          cruces: incidencias.filter(i => i.motivo === "Cruce").length
        };
      }, [incidencias]);

      const incidenciasFiltradas = useMemo(() => {
        return incidencias.filter(item => {
          const coincideTexto =
            item.factura?.toLowerCase().includes(busqueda.toLowerCase()) ||
            item.producto?.toLowerCase().includes(busqueda.toLowerCase()) ||
            item.cliente?.toLowerCase().includes(busqueda.toLowerCase());
          const coincideEstado =
            filtroEstado === "todos" ? true : filtroEstado === "pendientes" ? !item.resuelto : item.resuelto;
          const coincideArmador = filtroArmador === "todos" ? true : item.armador === filtroArmador;
          const coincideRuta = filtroRuta === "todos" ? true : item.ruta === filtroRuta;
          return coincideTexto && coincideEstado && coincideArmador && coincideRuta;
        });
      }, [incidencias, busqueda, filtroEstado, filtroArmador, filtroRuta]);

      const resumenInventario = useMemo(() => {
        const mapa = {};
        const sumar = (prod, uni, cant, tipo, fact) => {
          const clave = `${prod}__${uni}`;
          if (!mapa[clave]) mapa[clave] = { producto: prod, unidad: uni, sobranteBodega: 0, faltanteBodega: 0, facturas: [] };
          if (tipo === "SOBRA_EN_BODEGA") mapa[clave].sobranteBodega += cant;
          if (tipo === "FALTA_EN_BODEGA") mapa[clave].faltanteBodega += cant;
          if (!mapa[clave].facturas.includes(fact)) mapa[clave].facturas.push(fact);
        };

        incidencias.forEach(inc => {
          if (inc.motivo === "Faltante") sumar(inc.producto, inc.unidad, inc.cantidad, "SOBRA_EN_BODEGA", inc.factura);
          else if (inc.motivo === "Sobrante") sumar(inc.producto, inc.unidad, inc.cantidad, "FALTA_EN_BODEGA", inc.factura);
          else if (inc.motivo === "Cruce") {
            sumar(inc.producto, inc.unidad, inc.cantidad, "SOBRA_EN_BODEGA", inc.factura);
            if (inc.productoCruce) sumar(inc.productoCruce, inc.unidadCruce, inc.cantidadCruce, "FALTA_EN_BODEGA", inc.factura);
          }
        });
        return Object.values(mapa);
      }, [incidencias]);

      return (
        <div className="max-w-5xl mx-auto px-3 sm:px-6 pt-4 pb-24">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 mb-5 shadow-2xl">
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <span className={`h-2.5 w-2.5 rounded-full ${conectado ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                  <span className="text-xs font-bold text-slate-400">{conectado ? "CONECTADO A FIREBASE" : "CONECTANDO..."}</span>
                </div>
                <h1 className="text-2xl font-black text-white mt-1">PGB <span className="text-amber-400">DISTRIBUTION</span> CHILE</h1>
                <p className="text-xs text-slate-400">Control de Bodega • Jefatura: Pedro y Bedanli</p>
              </div>
              <div className="flex gap-2">
                <button onClick={copiarResumenWhatsApp} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl">
                  📲 WhatsApp
                </button>
                <button onClick={() => { limpiarFormulario(); setVista("nuevo"); }} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs px-3.5 py-2.5 rounded-xl">
                  ➕ Registrar
                </button>
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4 pt-4 border-t border-slate-800">
              <div className="bg-slate-950 p-2.5 rounded-xl">
                <span className="text-[10px] text-slate-400 uppercase">Total</span>
                <p className="text-xl font-black text-white">{kpis.total}</p>
              </div>
              <div className="bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20">
                <span className="text-[10px] text-amber-300 uppercase">Pendientes</span>
                <p className="text-xl font-black text-amber-400">{kpis.pendientes}</p>
              </div>
              <div className="bg-emerald-500/10 p-2.5 rounded-xl border border-emerald-500/20">
                <span className="text-[10px] text-emerald-300 uppercase">Resueltas</span>
                <p className="text-xl font-black text-emerald-400">{kpis.resueltas}</p>
              </div>
              <div className="bg-purple-500/10 p-2.5 rounded-xl border border-purple-500/20">
                <span className="text-[10px] text-purple-300 uppercase">Cruces</span>
                <p className="text-xl font-black text-purple-400">{kpis.cruces}</p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-4 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 mb-4">
            <button onClick={() => setVista("dashboard")} className={`py-2 rounded-xl text-xs font-extrabold ${vista === "dashboard" ? "bg-amber-500 text-slate-950" : "text-slate-400"}`}>Tablero</button>
            <button onClick={() => setVista("nuevo")} className={`py-2 rounded-xl text-xs font-extrabold ${vista === "nuevo" ? "bg-amber-500 text-slate-950" : "text-slate-400"}`}>Anotar</button>
            <button onClick={() => setVista("balance")} className={`py-2 rounded-xl text-xs font-extrabold ${vista === "balance" ? "bg-amber-500 text-slate-950" : "text-slate-400"}`}>Cuadratura</button>
            <button onClick={() => setVista("historial")} className={`py-2 rounded-xl text-xs font-extrabold ${vista === "historial" ? "bg-amber-500 text-slate-950" : "text-slate-400"}`}>Cierres</button>
          </div>

          {vista === "dashboard" && (
            <div className="space-y-3">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2">
                <input type="text" value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="🔍 Buscar factura o producto..." className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white outline-none" />
                <div className="grid grid-cols-3 gap-2">
                  <select value={filtroEstado} onChange={e => setFiltroEstado(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-white">
                    <option value="todos">Estado: Todos</option>
                    <option value="pendientes">Pendientes</option>
                    <option value="resueltos">Resueltos</option>
                  </select>
                  <select value={filtroArmador} onChange={e => setFiltroArmador(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-white">
                    <option value="todos">Armador: Todos</option>
                    {ARMADORES.map(a => <option key={a} value={a}>{a}</option>)}
                  </select>
                  <select value={filtroRuta} onChange={e => setFiltroRuta(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-white">
                    <option value="todos">Ruta: Todas</option>
                    {RUTAS.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                </div>
              </div>

              <div className="flex justify-between items-center px-1">
                <span className="text-xs text-slate-400">{incidenciasFiltradas.length} registros</span>
                <button onClick={cerrarSemana} className="bg-rose-600/20 text-rose-400 border border-rose-500/30 text-xs font-bold px-3 py-1.5 rounded-xl">🔒 Cerrar Semana</button>
              </div>

              {incidenciasFiltradas.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">
                  No hay registros activos.
                </div>
              ) : (
                incidenciasFiltradas.map(item => (
                  <div key={item.id} className={`p-4 rounded-2xl border ${item.resuelto ? "bg-slate-900/40 border-emerald-900/50 opacity-75" : "bg-slate-900 border-slate-800"}`}>
                    <div className="flex justify-between items-center mb-2">
                      <div className="flex gap-2 items-center">
                        <span className="bg-amber-500/20 text-amber-300 font-bold text-xs px-2.5 py-1 rounded-lg">#{item.factura}</span>
                        <span className="text-xs font-extrabold text-white">{item.motivo}</span>
                      </div>
                      <span className="text-xs text-slate-400">{item.armador} • {item.ruta}</span>
                    </div>
                    <p className="text-sm font-bold text-white mb-1">{item.cantidad} {item.unidad} — {item.producto}</p>
                    {item.motivo === "Cruce" && item.productoCruce && (
                      <p className="text-xs text-rose-300 mb-2">🔄 Cruzado con: {item.cantidadCruce} {item.unidadCruce} de {item.productoCruce}</p>
                    )}
                    {item.notas && <p className="text-xs text-slate-400 italic mb-2">"{item.notas}"</p>}
                    <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-xs">
                      <span className="text-amber-300">📌 {item.accionResolucion}</span>
                      <div className="flex gap-1.5">
                        <button onClick={() => cambiarEstado(item.id, item.resuelto)} className={`px-2.5 py-1 rounded-lg font-bold ${item.resuelto ? "bg-emerald-600 text-white" : "bg-slate-800 text-amber-300"}`}>
                          {item.resuelto ? "✓ Resuelto" : "Pendiente"}
                        </button>
                        <button onClick={() => cargarParaEditar(item)} className="px-2.5 py-1 bg-slate-800 text-sky-300 rounded-lg">Editar</button>
                        <button onClick={() => eliminarIncidencia(item.id)} className="px-2.5 py-1 bg-slate-800 text-rose-400 rounded-lg">🗑️</button>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {vista === "nuevo" && (
            <form onSubmit={guardarIncidencia} className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
              <h2 className="text-base font-black text-white">{editandoId ? "✏️ Editar Incidencia" : "➕ Nueva Incidencia"}</h2>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-300 block mb-1">Factura *</label>
                  <input type="text" value={factura} onChange={e => setFactura(e.target.value)} placeholder="Ej: 45892" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required />
                </div>
                <div>
                  <label className="text-xs text-slate-300 block mb-1">Fecha</label>
                  <input type="date" value={fecha} onChange={e => setFecha(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-300 block mb-1">Ruta</label>
                  <select value={ruta} onChange={e => setRuta(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    {RUTAS.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs text-slate-300 block mb-1">Armador</label>
                  <select value={armador} onChange={e => setArmador(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    {ARMADORES.map(a => <option key={a} value={a}>{a}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label className="text-xs text-slate-300 block mb-1">Motivo</label>
                <select value={motivo} onChange={e => setMotivo(e.target.value)} className="w-full bg-slate-950 border border-amber-500/50 rounded-xl px-3 py-2 text-sm font-bold text-amber-300">
                  {MOTIVOS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                </select>
              </div>
              <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-3">
                <p className="text-xs font-bold text-emerald-400">{motivo === "Cruce" ? "1️⃣ Producto en Factura" : "📦 Producto"}</p>
                <div className="grid grid-cols-3 gap-2">
                  <input type="text" value={producto} onChange={e => setProducto(e.target.value)} placeholder="Nombre..." className="col-span-2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required />
                  <input type="number" min="1" value={cantidad} onChange={e => setCantidad(e.target.value)} placeholder="Cant" className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required />
                </div>
                <select value={unidad} onChange={e => setUnidad(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                  {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                </select>
              </div>
              {motivo === "Cruce" && (
                <div className="bg-rose-950/30 p-3 rounded-2xl border border-rose-800 space-y-3">
                  <p className="text-xs font-bold text-rose-300">2️⃣ Producto enviado por error</p>
                  <div className="grid grid-cols-3 gap-2">
                    <input type="text" value={productoCruce} onChange={e => setProductoCruce(e.target.value)} placeholder="Producto..." className="col-span-2 bg-slate-900 border border-rose-700 rounded-xl px-3 py-2 text-sm text-white" required />
                    <input type="number" min="1" value={cantidadCruce} onChange={e => setCantidadCruce(e.target.value)} placeholder="Cant" className="bg-slate-900 border border-rose-700 rounded-xl px-3 py-2 text-sm text-white" required />
                  </div>
                  <select value={unidadCruce} onChange={e => setUnidadCruce(e.target.value)} className="w-full bg-slate-900 border border-rose-700 rounded-xl px-3 py-2 text-sm text-white">
                    {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                  </select>
                </div>
              )}
              <div className="grid grid-cols-2 gap-2">
                <select value={accionResolucion} onChange={e => setAccionResolucion(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                  {ACCIONES.map(ac => <option key={ac} value={ac}>{ac}</option>)}
                </select>
                <input type="text" value={notas} onChange={e => setNotas(e.target.value)} placeholder="Notas..." className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
              </div>
              <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-sm">
                Guardar Registro
              </button>
            </form>
          )}

          {vista === "balance" && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5">
              <h2 className="text-base font-black text-amber-400 mb-3">⚖️ Cuadratura de Bodega</h2>
              {resumenInventario.length === 0 ? (
                <p className="text-xs text-slate-400">Sin desfases registrados.</p>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-950 text-slate-400 uppercase">
                      <tr>
                        <th className="p-2.5">Producto</th>
                        <th className="p-2.5 text-emerald-400">Sobra (+)</th>
                        <th className="p-2.5 text-rose-400">Falta (-)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {resumenInventario.map((item, idx) => (
                        <tr key={idx}>
                          <td className="p-2.5 font-bold text-white">{item.producto} ({item.unidad})</td>
                          <td className="p-2.5 font-black text-emerald-400">{item.sobranteBodega > 0 ? `+${item.sobranteBodega}` : "—"}</td>
                          <td className="p-2.5 font-black text-rose-400">{item.faltanteBodega > 0 ? `-${item.faltanteBodega}` : "—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {vista === "historial" && (
            <div className="space-y-3">
              <h2 className="text-base font-black text-amber-400">📁 Historial de Cierres</h2>
              {cierres.length === 0 ? (
                <p className="text-xs text-slate-400 bg-slate-900 p-4 rounded-2xl border border-slate-800">Sin semanas archivadas.</p>
              ) : (
                cierres.map(c => (
                  <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <h3 className="font-bold text-white text-sm">{c.nombreSemana}</h3>
                    <p className="text-xs text-slate-400">{c.totalRegistros} registros</p>
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
