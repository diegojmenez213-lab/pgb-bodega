    // ICONOS VECTORIALES CORPORATIVOS

    };

    const limpiarRut = (val) => (val || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRutVisual = (rut) => {
      const clean = limpiarRut(rut);
      if (clean.length < 2) return clean;
      const cuerpo = clean.slice(0, -1);
      const dv = clean.slice(-1);
      return `${cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".")}-${dv}`;
    };

    const PLANTILLAS_RUBRO = {
      distribuidora: {

        modulos: {

          cuarentenaRuta: false, rendicionChoferes: false, comprasXML: true,

        tarifaUF: 1.5,
        modulos: {
          pickingBodega: false, incidenciasRetornos: false, conteoCiclico: true,
          cuarentenaRuta: false, rendicionChoferes: false, comprasXML: true,
          sugeridoProveedor: true, puntoEquilibrio: true, ecommerce247: false,
          bandejasLotes: false, posRapido: true, agendaServicios: false,
          multiSucursal: false, autoCAF: false
        }
      },
      barberia: {
        nombre: "Servicios y Estética",

        tarifaUF: 1.5,
        modulos: {
          pickingBodega: false, incidenciasRetornos: false, conteoCiclico: false,
          cuarentenaRuta: false, rendicionChoferes: false, comprasXML: false,

    const ETIQUETAS_MODULOS = {
      pickingBodega: "Control Picking y Armadores",
      incidenciasRetornos: "Incidencias y Retornos en Ruta",
      conteoCiclico: "Inventario y Conteo Cíclico",
      cuarentenaRuta: "Cuarentena Fuera de Ruta",
      rendicionChoferes: "Rendición de Choferes y Créditos",
      ecommerce247: "Facturación SII 24/7 + Marketplaces",
      bandejasLotes: "Bandejas Impresión (Líder / General)",
      posRapido: "Punto de Venta Rápido (POS)",
      agendaServicios: "Agenda Horas y Comisiones",
      comprasXML: "Carga Compras XML / Foto IA",
      sugeridoProveedor: "Sugerido Compras por Proveedor",
      puntoEquilibrio: "Punto de Equilibrio Neto Vivo",
      multiSucursal: "Modo Cadena Multi-Sucursal (18+)",
      autoCAF: "Add-on Auto-CAF Folios SII"
    };

    const EMPRESAS_SEMILLA = [
      {
        rut: "769497226",
        razonSocial: "PGB Distribution Chile SpA",
        clave: "1234",
        rubro: "distribuidora",
        estado: "activo",
        modoJerarquia: false,
        tarifaUF: 6,
        sucursales: ["Casa Matriz Macul (Av. Exequiel Fernández 3397)"],
        logoBase64: "",
        rutaLegacy: "pgb-operacion.html",
        modulos: PLANTILLAS_RUBRO.distribuidora.modulos
      },
      {
        rut: "775280425",
        razonSocial: "Tecnoshop Company SpA",
        clave: "1234",
        rubro: "ecommerce",
        estado: "activo",
        modoJerarquia: false,
        tarifaUF: 4,
        sucursales: ["Bodega Central Santiago"],
        logoBase64: "",
        rutaLegacy: "",
        modulos: PLANTILLAS_RUBRO.ecommerce.modulos
      }
    ];

    function App() {
      const [vista, setVista] = useState("cargando");
      const [empresas, setEmpresas] = useState([]);
      const [empresaActiva, setEmpresaActiva] = useState(null);
      const [toquesSecretos, setToquesSecretos] = useState(0);

      // Navegación Admin
      const [seccionAdmin, setSeccionAdmin] = useState("directorio"); // directorio | arquitectura
      const [tabDrawer, setTabDrawer] = useState("general"); // general | marca | modulos

      const [rutInput, setRutInput] = useState("");
      const [claveInput, setClaveInput] = useState("");
      const [errorLogin, setErrorLogin] = useState("");
      const [ingresando, setIngresando] = useState(false);

      const [masterInput, setMasterInput] = useState("");
      const [errorMaster, setErrorMaster] = useState("");
      const [busqueda, setBusqueda] = useState("");
      const [filtroEstado, setFiltroEstado] = useState("todos");
      const [drawerEmpresa, setDrawerEmpresa] = useState(null);
      const [guardando, setGuardando] = useState(false);

      useEffect(() => {
        const checkHash = () => {
          if (window.location.hash === "#/comando") {
            const saAuth = sessionStorage.getItem("nexus_sa_auth");
            setVista(saAuth === "OK" ? "superadmin" : "superadmin_login");
          }
        };
        checkHash();
        window.addEventListener("hashchange", checkHash);
        return () => window.removeEventListener("hashchange", checkHash);
      }, []);

      useEffect(() => {
        let unsubscribe = null;

        const iniciarSistema = async () => {
          try {
            if (!auth.currentUser) {
              await auth.signInAnonymously().catch(() => {});
            }

            for (const emp of EMPRESAS_SEMILLA) {
              const ref = db.collection("saas_empresas").doc(emp.rut);
              const snap = await ref.get();
              if (!snap.exists) {
                await ref.set({
                  ...emp,
                  creadoEn: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
            }

            unsubscribe = db.collection("saas_empresas").onSnapshot((snapshot) => {
              const lista = [];
              snapshot.forEach((doc) => lista.push({ id: doc.id, ...doc.data() }));
              setEmpresas(lista);

              if (window.location.hash === "#/comando") {
                const saAuth = sessionStorage.getItem("nexus_sa_auth");
                setVista(saAuth === "OK" ? "superadmin" : "superadmin_login");
                return;
              }

              const sesionGuardada = localStorage.getItem("nexus_empresa_rut");
              if (sesionGuardada) {
                const encontrada = lista.find((e) => e.rut === sesionGuardada);
                if (encontrada && encontrada.estado !== "suspendido") {
                  if (encontrada.rutaLegacy) {
                    window.location.href = encontrada.rutaLegacy;
                    return;
                  }
                  setEmpresaActiva(encontrada);
                  setVista("cliente");
                  return;
                }
              }
              setVista("login");
            });
          } catch (err) {
            setVista("login");
          }
        };

        iniciarSistema();
        return () => { if (unsubscribe) unsubscribe(); };
      }, []);

      const manejarToqueSecreto = () => {
        const nuevo = toquesSecretos + 1;
        if (nuevo >= 5) {
          setToquesSecretos(0);
          window.location.hash = "#/comando";
        } else {
          setToquesSecretos(nuevo);
        }
      };

      const manejarLoginCliente = async (e) => {
        e.preventDefault();
        setErrorLogin("");
        setIngresando(true);

        const rutLimpio = limpiarRut(rutInput);
        if (!rutLimpio || !claveInput) {
          setErrorLogin("Ingresa el RUT corporativo y la clave de acceso.");
          setIngresando(false);
          return;
        }

        try {
          let emp = empresas.find((x) => x.rut === rutLimpio);
          if (!emp) {
            const docSnap = await db.collection("saas_empresas").doc(rutLimpio).get();
            if (docSnap.exists) emp = docSnap.data();
          }

          if (!emp) {
            setErrorLogin("RUT no registrado en el directorio corporativo.");
            setIngresando(false);
            return;
          }

          if (emp.clave !== claveInput.trim()) {
            setErrorLogin("Clave incorrecta. Verifica tus credenciales.");
            setIngresando(false);
            return;
          }

          if (emp.estado === "suspendido") {
            setErrorLogin("Instancia suspendida. Contacta a soporte administrativo.");
            setIngresando(false);
            return;
          }

          localStorage.setItem("nexus_empresa_rut", emp.rut);

          if (emp.rutaLegacy) {
            window.location.href = emp.rutaLegacy;
            return;
          }

          setEmpresaActiva(emp);
          setVista("cliente");
        } catch (err) {
          setErrorLogin("Error de conexión al validar identidad.");
        }
        setIngresando(false);
      };

      const manejarLoginMaster = (e) => {
        e.preventDefault();
        if (masterInput === MASTER_KEY) {
          sessionStorage.setItem("nexus_sa_auth", "OK");
          setErrorMaster("");
          setMasterInput("");
          setVista("superadmin");
        } else {
          setErrorMaster("Clave maestra inválida.");
        }
      };

      const cerrarSesionCliente = () => {
        localStorage.removeItem("nexus_empresa_rut");
        setEmpresaActiva(null);
        setRutInput("");
        setClaveInput("");
        setVista("login");
      };

      const salirSuperAdmin = () => {
        sessionStorage.removeItem("nexus_sa_auth");
        window.location.hash = "";
        setVista("login");
      };

      const abrirDrawerNueva = () => {
        setTabDrawer("general");
        setDrawerEmpresa({
          esNueva: true,
          rut: "",
          razonSocial: "",
          clave: "1234",
          rubro: "minimarket",
          estado: "activo",
          modoJerarquia: false,
          tarifaUF: 1.5,
          sucursales: ["Casa Matriz"],
          logoBase64: "",
          rutaLegacy: "",
          modulos: { ...PLANTILLAS_RUBRO.minimarket.modulos }
        });
      };

      const abrirDrawerEditar = (emp, tabInicial = "general") => {
        setTabDrawer(tabInicial);
        setDrawerEmpresa({ ...emp, esNueva: false });
      };

      const cambiarRubroDrawer = (nuevoRubro) => {
        const plantilla = PLANTILLAS_RUBRO[nuevoRubro];
        setDrawerEmpresa({
          ...drawerEmpresa,
          rubro: nuevoRubro,
          tarifaUF: plantilla.tarifaUF,
          modulos: { ...plantilla.modulos }
        });
      };

      const manejarSubidaLogo = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 750000) {
          alert("El archivo supera los 750 KB. Comprime el PNG antes de subirlo.");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          setDrawerEmpresa({ ...drawerEmpresa, logoBase64: reader.result });
        };
        reader.readAsDataURL(file);
      };

      const guardarEmpresa = async (e) => {
        e.preventDefault();
        const rutClean = limpiarRut(drawerEmpresa.rut);
        if (!rutClean || !drawerEmpresa.razonSocial.trim()) {
          alert("RUT y Razón Social son obligatorios.");
          return;
        }
        setGuardando(true);
        try {
          const payload = {
            rut: rutClean,
            razonSocial: drawerEmpresa.razonSocial.trim(),
            clave: drawerEmpresa.clave.trim() || "1234",
            rubro: drawerEmpresa.rubro,
            estado: drawerEmpresa.estado,
            modoJerarquia: !!drawerEmpresa.modoJerarquia,
            tarifaUF: Number(drawerEmpresa.tarifaUF) || 0,
            sucursales: drawerEmpresa.sucursales || ["Casa Matriz"],
            logoBase64: drawerEmpresa.logoBase64 || "",
            rutaLegacy: drawerEmpresa.rutaLegacy || "",
            modulos: drawerEmpresa.modulos,
            actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection("saas_empresas").doc(rutClean).set(payload, { merge: true });
          setDrawerEmpresa(null);
        } catch (err) {
          alert("Error al guardar: " + err.message);
        }
        setGuardando(false);
      };

      const entrarComoAdmin = (emp) => {
        localStorage.setItem("nexus_empresa_rut", emp.rut);
        window.location.hash = "";
        if (emp.rutaLegacy) {
          window.location.href = emp.rutaLegacy;
          return;
        }
        setEmpresaActiva(emp);
        setVista("cliente");
      };

      // PANTALLA DE CARGA
      if (vista === "cargando") {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="flex items-center gap-3 text-slate-500 text-xs font-medium">
              <div className="w-4 h-4 border-2 border-slate-300 border-t-slate-900 rounded-full animate-spin"></div>
              Cargando entorno empresarial...
            </div>
          </div>
        );
      }

      // 1. PORTAL DE ACCESO CORPORATIVO (SPLIT-SCREEN INSTITUCIONAL)
      if (vista === "login") {
        return (
          <div className="min-h-screen grid grid-cols-1 lg:grid-cols-12 bg-white">
            {/* Columna Izquierda Institucional (Visible en Desktop) */}
            <div className="hidden lg:flex lg:col-span-5 bg-slate-950 text-white p-12 flex-col justify-between relative overflow-hidden">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded bg-white text-slate-950 flex items-center justify-center">
                  <Icon name="layers" className="w-4 h-4" />
                </div>
                <span className="text-sm font-bold tracking-wider uppercase">NEXUS ERP</span>
              </div>

              <div className="space-y-4 max-w-sm">
                <span className="inline-block text-[11px] font-mono-num uppercase tracking-widest text-emerald-400">
                  Cloud Infrastructure • Chile
                </span>
                <h2 className="text-3xl font-semibold tracking-tight leading-tight">
                  Gestión operativa, inventario y facturación SII en tiempo real.
                </h2>
                <p className="text-sm text-slate-400 leading-relaxed">
                  Entornos aislados por RUT con sincronización continua y trazabilidad completa por sucursal.
                </p>
              </div>

              <div className="border-t border-slate-800 pt-6 flex items-center justify-between text-xs text-slate-500 font-mono-num">
                <span>SII DTE 33 / 39 / 61</span>
                <span>LATENCIA &lt; 50ms</span>
              </div>
            </div>

            {/* Columna Derecha Formulario Limpio */}
            <div className="lg:col-span-7 flex flex-col justify-between p-6 sm:p-12 bg-slate-50/50">
              <div className="flex items-center justify-between">
                <div className="flex lg:hidden items-center gap-2">
                  <div className="w-7 h-7 rounded bg-slate-900 text-white flex items-center justify-center">
                    <Icon name="layers" className="w-3.5 h-3.5" />
                  </div>
                  <span className="text-xs font-bold tracking-wider uppercase text-slate-900">NEXUS ERP</span>
                </div>
                <div className="ml-auto flex items-center gap-2 text-[11px] font-mono-num text-slate-500">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  SISTEMA EN LÍNEA
                </div>
              </div>

              <div className="w-full max-w-[360px] mx-auto my-auto py-8">
                <div className="mb-8">
                  <div
                    onClick={manejarToqueSecreto}
                    className="w-10 h-10 rounded-lg bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-900 mb-5 cursor-pointer select-none hover:border-slate-400 transition"
                  >
                    <Icon name="shield" className="w-5 h-5" />
                  </div>
                  <h1 className="text-2xl font-semibold tracking-tight text-slate-900">
                    Iniciar sesión
                  </h1>
                  <p className="text-sm text-slate-500 mt-1">
                    Ingresa el RUT de tu empresa para acceder a tu panel.
                  </p>
                </div>

                <form onSubmit={manejarLoginCliente} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-700 mb-1.5">
                      RUT Corporativo
                    </label>
                    <input
                      type="text"
                      value={rutInput}
                      onChange={(e) => setRutInput(e.target.value)}
                      placeholder="Sin puntos ni guion"
                      className="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900 font-mono-num placeholder-slate-400 focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition"
                      autoComplete="username"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-700 mb-1.5">
                      Clave de Acceso
                    </label>
                    <input
                      type="password"
                      value={claveInput}
                      onChange={(e) => setClaveInput(e.target.value)}
                      placeholder="••••••••"
                      className="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition"
                      autoComplete="current-password"
                    />
                  </div>

                  {errorLogin && (
                    <div className="p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                      {errorLogin}
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={ingresando}
                    className="w-full py-2.5 px-4 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm flex items-center justify-center gap-2 transition disabled:opacity-50"
                  >
                    <span>{ingresando ? "Verificando..." : "Continuar al espacio"}</span>
                    <Icon name="arrowRight" className="w-4 h-4" />
                  </button>
                </form>

                              />
                              <button
                                type="button"
                                onClick={() => setDrawerEmpresa({ ...drawerEmpresa, logoBase64: "" })}
                                className="text-xs text-rose-600 font-medium hover:underline"
                              >
                                Quitar logotipo actual
                              </button>
                            </div>
                          ) : (
                            <div className="space-y-2">
                              <div className="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center mx-auto text-slate-500">
                                <Icon name="upload" className="w-4 h-4" />
                              </div>
                              <p className="text-xs font-medium text-slate-900">
                                Subir logotipo original (PNG transparente)
                              </p>
                              <p className="text-[11px] text-slate-500">
                                Se aplicará en el portal, cabecera operativa y reportes PDF.
                              </p>
                            </div>
                          )}

                          <input
                            type="file"
                            accept="image/png,image/webp,image/jpeg"
                            onChange={manejarSubidaLogo}
                            className="mt-4 text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border file:border-slate-300 file:text-xs file:font-medium file:bg-white file:text-slate-800 hover:file:bg-slate-100"
                          />
                        </div>
                      </div>
                    )}

                    {tabDrawer === "modulos" && (
                      <div className="divide-y divide-slate-200 border border-slate-200 rounded-xl overflow-hidden">
                        {Object.entries(ETIQUETAS_MODULOS).map(([modKey, label]) => {
                          const activo = !!drawerEmpresa.modulos?.[modKey];
                          return (
                            <div
                              key={modKey}
                              onClick={() =>
                                setDrawerEmpresa({
                                  ...drawerEmpresa,
                                  modulos: { ...drawerEmpresa.modulos, [modKey]: !activo }
                                })
                              }
                              className="flex items-center justify-between px-4 py-3 bg-white hover:bg-slate-50 cursor-pointer transition"
                            >
                              <span className="text-xs font-medium text-slate-800">{label}</span>
                              <div
                                className={`w-8 h-4 rounded-full p-0.5 transition shrink-0 ${
                                  activo ? "bg-slate-900" : "bg-slate-200"
                                }`}
                              >
                                <div
                                  className={`w-3 h-3 rounded-full bg-white transition-transform ${
                                    activo ? "translate-x-4" : "translate-x-0"
                                  }`}
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {/* Pie Fijo Drawer */}
                    <div className="pt-4 border-t border-slate-200 flex items-center justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setDrawerEmpresa(null)}
                        className="px-4 py-2 rounded-lg bg-white border border-slate-300 text-slate-700 text-xs font-medium hover:bg-slate-50"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={guardando}
                        className="px-5 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium"
                      >
                        {guardando ? "Guardando..." : "Guardar Cambios"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      // 4. ESPACIO DE TRABAJO CLIENTE (TECNOSHOP / NUEVAS EMPRESAS)
      if (vista === "cliente" && empresaActiva) {
        const infoRubro = PLANTILLAS_RUBRO[empresaActiva.rubro] || PLANTILLAS_RUBRO.minimarket;
        const activos = Object.entries(empresaActiva.modulos || {}).filter(([, val]) => val);

        return (
          <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
            {empresaActiva.estado === "aviso" && (
              <div className="bg-amber-50 border-b border-amber-200 text-amber-800 text-xs font-medium text-center py-2 px-4">
                Aviso administrativo: Existe un saldo pendiente en tu suscripción mensual.
              </div>
            )}

            <header className="h-14 bg-white border-b border-slate-200 px-6 flex items-center justify-between">
              <div className="flex items-center gap-3">
                {empresaActiva.logoBase64 ? (
                  <img
                    src={empresaActiva.logoBase64}
                    alt={empresaActiva.razonSocial}
                    className="w-8 h-8 object-contain rounded border border-slate-200 p-0.5"
                  />
                ) : (
                  <div className="w-8 h-8 rounded bg-slate-900 text-white flex items-center justify-center text-xs font-bold">
                    {empresaActiva.razonSocial.substring(0, 2).toUpperCase()}
                  </div>
                )}
                <div>
                  <h1 className="font-semibold text-slate-900 text-sm leading-tight">
                    {empresaActiva.razonSocial}
                  </h1>
                  <p className="text-[11px] text-slate-500 font-mono-num">
                    {formatearRutVisual(empresaActiva.rut)} • {infoRubro.nombre}
                  </p>
                </div>
              </div>

              <button
                onClick={cerrarSesionCliente}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-white hover:bg-slate-100 border border-slate-200 text-xs font-medium text-slate-700 transition"
              >
                <Icon name="logout" className="w-3.5 h-3.5" />
                Cerrar sesión
              </button>
            </header>

            <main className="max-w-5xl w-full mx-auto px-6 py-8 space-y-6">
              <div className="bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden">
                <div className="px-6 py-5 border-b border-slate-200 flex items-center justify-between">
                  <div>
                    <h2 className="text-base font-semibold text-slate-900">
                      Módulos Activos de la Organización
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Instancia aislada y configurada desde la consola central.
                    </p>
                  </div>
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    En línea
                  </span>
                </div>

                <div className="divide-y divide-slate-200">
                  {activos.map(([key]) => (
                    <div key={key} className="px-6 py-3.5 flex items-center justify-between text-xs">
                      <span className="font-medium text-slate-800">{ETIQUETAS_MODULOS[key] || key}</span>
                      <span className="font-mono-num text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">
                        Habilitado
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
