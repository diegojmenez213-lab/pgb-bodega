<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGB Distribution Chile SpA • ERP Logística Bodega</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .print-only { display: none; }
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="bg-[#050811] text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const UNIDADES = ["Unidad", "Caja", "Manga", "Fardo", "Unidad suelta", "Display", "Pack"];
    const MOTIVOS = [
      { id: "Faltante", label: "Faltante en Ruta", desc: "No llegó al cliente (Sobra en bodega)" },
      { id: "Sobrante", label: "Sobrante en Ruta", desc: "Fue de más en el furgón (Falta en bodega)" },
      { id: "Cruce", label: "Cruce de Producto", desc: "Se facturó un producto pero se envió otro físico" },
      { id: "AceptadoPorCliente", label: "Aceptado por Cliente", desc: "Cliente acepta producto cruzado/alternativo" },
      { id: "Rechazo", label: "Rechazo Cliente", desc: "Cliente devuelve o no recibe mercadería" },
      { id: "Daño/Merma", label: "Daño / Merma", desc: "Producto roto, vencido o averiado" }
    ];
    const ARMADORES = ["Diego", "Nico", "Edwin", "Julio", "Horacio", "Sra. Rosa"];
    const RUTAS = ["Ruta 1 (Juan / Julio)", "Ruta 2 (Carlos / Horacio)", "Retiro Bodega / Otra"];
    const USUARIOS_SISTEMA = ["Edwin", "Nico", "Diego", "Bedanli", "Pedro", "Gabriel"];

    const ACCIONES_DISPONIBLES = [
      "Ajustar Inventario en Bodega",
      "Enviar / Reponer Producto al Cliente",
      "Descuento en Factura / Cuenta Corriente",
      "Nota de Crédito (Tributaria)",
      "Chofer Retorna Producto a Bodega"
    ];

    function App() {
      const [incidencias, setIncidencias] = useState([]);
      const [cierres, setCierres] = useState([]);
      const [catalogoProductos, setCatalogoProductos] = useState([]);
      const [historialInventario, setHistorialInventario] = useState([]);
      const [conteoPendiente, setConteoPendiente] = useState([]);
      const [seleccionadosInventario, setSeleccionadosInventario] = useState({});
      const [seleccionadosRetornosPDF, setSeleccionadosRetornosPDF] = useState({});
      const [modoImpresionReporte, setModoImpresionReporte] = useState(null);
      const [facturaImprimirIndividual, setFacturaImprimirIndividual] = useState(null);

      const [recibiendoRetornoId, setRecibiendoRetornoId] = useState(null);
      const [retornoFormState, setRetornoFormState] = useState({});

      const [vista, setVista] = useState("dashboard");
      const [conectado, setConectado] = useState(false);
      const [editandoId, setEditandoId] = useState(null);
      const [cierreExpandido, setCierreExpandido] = useState(null);
      const [tarjetasAbiertas, setTarjetasAbiertas] = useState({});

      const [busqueda, setBusqueda] = useState("");
      const [filtroEstado, setFiltroEstado] = useState("todos");
      const [filtroArmador, setFiltroArmador] = useState("todos");
      const [filtroRuta, setFiltroRuta] = useState("todos");

      const hoy = new Date().toISOString().split("T")[0];
      const [factura, setFactura] = useState("");
      const [cliente, setCliente] = useState("");
      const [fecha, setFecha] = useState(hoy);
      const [ruta, setRuta] = useState(RUTAS[0]);
      const [armador, setArmador] = useState(ARMADORES[0]);
      const [registradoPor, setRegistradoPor] = useState("Diego");
      const [motivo, setMotivo] = useState("Faltante");

      const [producto, setProducto] = useState("");
      const [cantidad, setCantidad] = useState(1);
      const [unidad, setUnidad] = useState(UNIDADES[0]);

      const [productoCruce, setProductoCruce] = useState("");
      const [cantidadCruce, setCantidadCruce] = useState(1);
      const [unidadCruce, setUnidadCruce] = useState(UNIDADES[0]);

      const [accionesSeleccionadas, setAccionesSeleccionadas] = useState(["Ajustar Inventario en Bodega"]);
      const [notas, setNotas] = useState("");

      useEffect(() => {
        auth.signInAnonymously().catch(() => {});
        
        const unsubInc = db.collection("incidencias").onSnapshot((snap) => {
          setConectado(true);
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setIncidencias(lista);
        }, () => {});

        const unsubCierres = db.collection("cierres_semanales").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => new Date(b.fechaCierre) - new Date(a.fechaCierre));
          setCierres(lista);
        });

        const unsubCat = db.collection("catalogo_productos").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => a.nombre.localeCompare(b.nombre));
          setCatalogoProductos(lista);
        });

        const unsubHistInv = db.collection("historial_inventario").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setHistorialInventario(lista);
        });

        const unsubConteo = db.collection("conteo_pendiente").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setConteoPendiente(lista);
        });

        return () => { unsubInc(); unsubCierres(); unsubCat(); unsubHistInv(); unsubConteo(); };
      }, []);

      const limpiarFormulario = () => {
        setFactura(""); setCliente(""); setProducto(""); setCantidad(1); setUnidad(UNIDADES[0]);
        setProductoCruce(""); setCantidadCruce(1); setUnidadCruce(UNIDADES[0]); setNotas(""); setEditandoId(null);
        setAccionesSeleccionadas(["Ajustar Inventario en Bodega"]);
      };

      const registrarProductoEnCatalogo = async (nombreProd) => {
        if (!nombreProd || !nombreProd.trim()) return;
        const nombreMayus = nombreProd.trim().toUpperCase();
        const existe = catalogoProductos.some(p => p.nombre === nombreMayus);
        if (!existe) {
          try { await db.collection("catalogo_productos").add({ nombre: nombreMayus }); } catch (err) {}
        }
      };

      const registrarConteoPendiente = async (prod, uni, cant, fact) => {
        try {
          const existe = conteoPendiente.some(cp => cp.producto === prod && cp.unidad === uni);
          if (!existe) {
            await db.collection("conteo_pendiente").add({
              producto: prod,
              unidad: uni,
              cantidad: cant,
              factura: fact,
              conteoFisicoHecho: false,
              ajusteSistemaHecho: false,
              responsableConteo: "",
              responsableAjuste: "",
              timestamp: Date.now()
            });
          }
        } catch (err) {}
      };

      const eliminarProductoCatalogo = async (id, e) => {
        e.stopPropagation();
        if (confirm("¿Eliminar este producto del catálogo?")) {
          try { await db.collection("catalogo_productos").doc(id).delete(); } catch (err) { alert(err.message); }
        }
      };

      const eliminarRegistroHistorialInv = async (id) => {
        if (confirm("¿Deseas eliminar este registro del historial de inventario?")) {
          try { await db.collection("historial_inventario").doc(id).delete(); } catch (err) { alert(err.message); }
        }
      };

      const toggleSeleccionInventario = (id) => {
        setSeleccionadosInventario(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleSeleccionRetornoPDF = (id) => {
        setSeleccionadosRetornosPDF(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleAccionForm = (acc) => {
        if (accionesSeleccionadas.includes(acc)) {
          if (accionesSeleccionadas.length === 1) return;
          setAccionesSeleccionadas(accionesSeleccionadas.filter(a => a !== acc));
        } else {
          setAccionesSeleccionadas([...accionesSeleccionadas, acc]);
        }
      };

      const guardarIncidencia = async (e) => {
        e.preventDefault();
        if (!factura.trim() || !producto.trim()) return alert("Completa el Nº de Factura y el Producto.");
        if ((motivo === "Cruce" || motivo === "AceptadoPorCliente") && !productoCruce.trim()) return alert("Indica el producto alternativo o enviado por error.");

        await registrarProductoEnCatalogo(producto);
        if ((motivo === "Cruce" || motivo === "AceptadoPorCliente") && productoCruce) await registrarProductoEnCatalogo(productoCruce);

        if (motivo !== "AceptadoPorCliente") {
          await registrarConteoPendiente(producto.trim().toUpperCase(), unidad, Number(cantidad), factura.trim());
        }
        if ((motivo === "Cruce" || motivo === "AceptadoPorCliente") && productoCruce) {
          await registrarConteoPendiente(productoCruce.trim().toUpperCase(), unidadCruce, Number(cantidadCruce), factura.trim());
        }

        const checksIniciales = {};
        accionesSeleccionadas.forEach(ac => {
          checksIniciales[ac] = { completado: false, por: "", fechaHora: "" };
        });

        const datos = {
          factura: factura.trim(),
          cliente: cliente.trim(),
          fecha,
          ruta,
          armador,
          registradoPor,
          motivo,
          producto: producto.trim().toUpperCase(),
          cantidad: Number(cantidad),
          unidad,
          productoCruce: (motivo === "Cruce" || motivo === "AceptadoPorCliente") ? productoCruce.trim().toUpperCase() : null,
          cantidadCruce: (motivo === "Cruce" || motivo === "AceptadoPorCliente") ? Number(cantidadCruce) : null,
          unidadCruce: (motivo === "Cruce" || motivo === "AceptadoPorCliente") ? unidadCruce : null,
          acciones: accionesSeleccionadas,
          checksAcciones: checksIniciales,
          retornoBodegaInfo: null,
          notas: notas.trim(),
          timestamp: Date.now()
        };

        try {
          if (editandoId) {
            delete datos.timestamp;
            delete datos.checksAcciones;
            delete datos.retornoBodegaInfo;
            await db.collection("incidencias").doc(editandoId).update(datos);
          } else {
            datos.resuelto = false;
            await db.collection("incidencias").add(datos);
          }
          limpiarFormulario();
          setVista("dashboard");
        } catch (err) { alert("Error: " + err.message); }
      };

      const registrarEnHistorialInventario = async (productoNombre, unidadMedida, facturaNum, responsable) => {
        try {
          const colRef = db.collection("historial_inventario");
          await colRef.add({
            producto: productoNombre,
            unidad: unidadMedida,
            factura: facturaNum,
            corregidoPor: responsable,
            fechaHora: new Date().toLocaleString("es-CL"),
            timestamp: Date.now()
          });

          const snapshot = await colRef.where("producto", "==", productoNombre).get();
          const registrosProducto = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          registrosProducto.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

          if (registrosProducto.length > 10) {
            const excess = registrosProducto.slice(6);
            const batch = db.batch();
            excess.forEach(item => batch.delete(colRef.doc(item.id)));
            await batch.commit();
          }
        } catch (err) { console.error(err); }
      };

      const abrirFormRetorno = (item) => {
        setRecibiendoRetornoId(item.id);
        let rutaDefaultResp = item.ruta?.includes("Ruta 2") ? "Carlos" : "Juan";
        let listaItems = [{ nombre: item.producto, cantidad: item.cantidad, unidad: item.unidad, recibido: true, motivoFalta: "Se partió / rompió en el trayecto", responsableRuta: rutaDefaultResp, cantFalta: 1, detalle: "" }];
        if (item.productoCruce) {
          listaItems.push({ nombre: item.productoCruce, cantidad: item.cantidadCruce, unidad: item.unidadCruce, recibido: true, motivoFalta: "Se partió / rompió en el trayecto", responsableRuta: rutaDefaultResp, cantFalta: 1, detalle: "" });
        }
        if (item.retornoBodegaInfo && item.retornoBodegaInfo.itemsDetalle) {
          setRetornoFormState({
            responsable: item.retornoBodegaInfo.recibidoPor || "Edwin",
            items: item.retornoBodegaInfo.itemsDetalle
          });
        } else {
          setRetornoFormState({
            responsable: "Edwin",
            items: listaItems
          });
        }
      };

      const guardarRecepcionRetornoDirecto = async (item) => {
        const resp = retornoFormState.responsable || "Edwin";
        const items = retornoFormState.items || [];

        let discrepancias = [];
        let todoCompleto = true;

        items.forEach(it => {
          if (!it.recibido) {
            todoCompleto = false;
            let responsableDanio = it.responsableRuta || (item.ruta?.includes("Ruta 2") ? "Carlos" : "Juan");
            let motivoTexto = it.motivoFalta;
            if (motivoTexto.includes("rompió")) {
              motivoTexto += ` (Responsable afectado/daño: ${responsableDanio})`;
            } else if (motivoTexto.includes("fábrica")) {
              motivoTexto += ` (Reclamar a Proveedor / Origen)`;
            }
            discrepancias.push(`Faltante/Dañado: ${it.cantFalta || 0} de ${it.cantidad} ${it.unidad} de ${it.nombre} — Motivo: ${motivoTexto} (Detalle: ${it.detalle || 'N/A'})`);
          } else {
            discrepancias.push(`Recibido conforme: ${it.cantidad} ${it.unidad} de ${it.nombre}`);
          }
        });

        const infoRetorno = {
          recibido: true,
          completo: todoCompleto,
          discrepanciasTexto: discrepancias.join(" | "),
          itemsDetalle: items,
          recibidoPor: resp,
          fechaHoraRecibo: new Date().toLocaleString("es-CL")
        };

        // Marcar automáticamente la acción "Chofer Retorna Producto a Bodega" como completada
        const checks = item.checksAcciones || {};
        const ahoraStr = new Date().toLocaleString("es-CL");
        checks["Chofer Retorna Producto a Bodega"] = {
          completado: true,
          por: resp,
          fechaHora: ahoraStr
        };

        const todasListas = (item.acciones || []).every(ac => checks[ac] && checks[ac].completado);

        try {
          await db.collection("incidencias").doc(item.id).update({
            retornoBodegaInfo: infoRetorno,
            checksAcciones: checks,
            resuelto: todasListas ? true : item.resuelto
          });
          setRecibiendoRetornoId(null);
          alert("✅ Recepción de retorno registrada y acción marcada automáticamente.");
        } catch (err) {
          alert("Error al guardar: " + err.message);
        }
      };

      const toggleCheckConteoFisico = async (id, estadoActual) => {
        const resp = prompt(`Selecciona tu nombre:\n1. Edwin\n2. Nico\n3. Diego\n4. Bedanli\n5. Pedro\n6. Gabriel\n\n(Escribe el nombre exacto):`, "Diego");
        if (!resp || !USUARIOS_SISTEMA.includes(resp.trim())) {
          if (resp) alert("Nombre no válido. Debe ser uno del equipo.");
          return;
        }
        try {
          await db.collection("conteo_pendiente").doc(id).update({
            conteoFisicoHecho: !estadoActual,
            responsableConteo: !estadoActual ? resp.trim() : ""
          });
        } catch (err) { alert(err.message); }
      };

      const toggleCheckAjusteSistema = async (id, estadoActual) => {
        const resp = prompt(`Confirma tu nombre:\n1. Edwin\n2. Nico\n3. Diego\n4. Bedanli\n5. Pedro\n6. Gabriel\n\n(Escribe el nombre exacto):`, "Bedanli");
        if (!resp || !USUARIOS_SISTEMA.includes(resp.trim())) {
          if (resp) alert("Nombre no válido. Debe ser uno del equipo.");
          return;
        }

        const itemConteo = conteoPendiente.find(cp => cp.id === id);
        const nuevoEstado = !estadoActual;

        try {
          await db.collection("conteo_pendiente").doc(id).update({
            ajusteSistemaHecho: nuevoEstado,
            responsableAjuste: nuevoEstado ? resp.trim() : ""
          });

          if (nuevoEstado && itemConteo) {
            await registrarEnHistorialInventario(itemConteo.producto, itemConteo.unidad, itemConteo.factura, resp.trim());
          }
        } catch (err) { alert(err.message); }
      };

      const eliminarItemConteoPendiente = async (id) => {
        if (confirm("¿Eliminar este ítem de conteo?")) {
          try { await db.collection("conteo_pendiente").doc(id).delete(); } catch (err) { alert(err.message); }
        }
      };

      const imprimirHojaConteo = () => { window.print(); };

      const imprimirReporteGeneral = () => {
        setModoImpresionReporte('general');
        setFacturaImprimirIndividual(null);
        setTimeout(() => { window.print(); setModoImpresionReporte(null); }, 200);
      };

      const imprimirReporteInventarioSeleccionado = () => {
        const seleccionados = historialInventario.filter(h => seleccionadosInventario[h.id]);
        if (seleccionados.length === 0) return alert("Selecciona al menos un ítem del historial de inventario con el check para generar el reporte.");
        setModoImpresionReporte('inventario');
        setFacturaImprimirIndividual(null);
        setTimeout(() => { window.print(); setModoImpresionReporte(null); }, 200);
      };

      const imprimirReporteIndividualFactura = (item) => {
        setModoImpresionReporte('individual');
        setFacturaImprimirIndividual(item);
        setTimeout(() => { window.print(); setModoImpresionReporte(null); setFacturaImprimirIndividual(null); }, 200);
      };

      const imprimirReporteRetornosSeleccionados = () => {
        const seleccionados = incidencias.filter(i => seleccionadosRetornosPDF[i.id]);
        if (seleccionados.length === 0) return alert("Selecciona al menos un retorno de bodega con el check para generar el reporte consolidado por ruta.");
        setModoImpresionReporte('retornos_consolidado');
        setTimeout(() => { window.print(); setModoImpresionReporte(null); }, 200);
      };

      const toggleCheckAccion = async (id, accionNombre, estadoActual) => {
        const usuarioActual = prompt(`Selecciona tu nombre:\n1. Edwin\n2. Nico\n3. Diego\n4. Bedanli\n5. Pedro\n6. Gabriel\n\n(Escribe el nombre exacto):`, "Diego");
        if (!usuarioActual || !USUARIOS_SISTEMA.includes(usuarioActual.trim())) {
          if (usuarioActual) alert("Nombre no válido. Debe ser uno del equipo.");
          return;
        }

        const incidenciaActual = incidencias.find(i => i.id === id);
        if (!incidenciaActual) return;

        const checks = incidenciaActual.checksAcciones || {};
        const ahora = new Date().toLocaleString("es-CL");

        checks[accionNombre] = {
          completado: !estadoActual,
          por: usuarioActual.trim(),
          fechaHora: !estadoActual ? ahora : ""
        };

        if (!estadoActual && accionNombre.includes("Inventario")) {
          await registrarEnHistorialInventario(incidenciaActual.producto, incidenciaActual.unidad, incidenciaActual.factura, usuarioActual.trim());
          if (incidenciaActual.productoCruce) {
            await registrarEnHistorialInventario(incidenciaActual.productoCruce, incidenciaActual.unidadCruce, incidenciaActual.factura, usuarioActual.trim());
          }
        }

        const todasListas = incidenciaActual.acciones.every(ac => checks[ac] && checks[ac].completado);

        try {
          await db.collection("incidencias").doc(id).update({
            checksAcciones: checks,
            resuelto: todasListas ? true : incidenciaActual.resuelto
          });
        } catch (err) { alert("Error al actualizar check: " + err.message); }
      };

      const toggleExpandirTarjeta = (id) => {
        setTarjetasAbiertas(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const cargarParaEditar = (item) => {
        setEditandoId(item.id);
        setFactura(item.factura || ""); setCliente(item.cliente || ""); setFecha(item.fecha || hoy);
        setRuta(item.ruta || RUTAS[0]); setArmador(item.armador || ARMADORES[0]);
        setRegistradoPor(item.registradoPor || "Diego"); setMotivo(item.motivo || "Faltante");
        setProducto(item.producto || ""); setCantidad(item.cantidad || 1); setUnidad(item.unidad || UNIDADES[0]);
        if (item.motivo === "Cruce" || item.motivo === "AceptadoPorCliente") {
          setProductoCruce(item.productoCruce || ""); setCantidadCruce(item.cantidadCruce || 1); setUnidadCruce(item.unidadCruce || UNIDADES[0]);
        }
        setAccionesSeleccionadas(item.acciones || [item.accionResolucion || ACCIONES_DISPONIBLES[0]]);
        setNotas(item.notas || "");
        setVista("nuevo"); window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const cambiarEstado = async (id, estadoActual) => {
        await db.collection("incidencias").doc(id).update({ resuelto: !estadoActual });
      };

      const eliminarIncidencia = async (id) => {
        if (confirm("¿Deseas eliminar este registro?")) await db.collection("incidencias").doc(id).delete();
      };

      const cerrarSemana = async () => {
        if (incidencias.length === 0) return alert("No hay incidencias activas.");
        const nombreSemana = prompt("Nombre del cierre (Ej: Semana 09 al 14 Nov):");
        if (!nombreSemana) return;

        try {
          await db.collection("cierres_semanales").add({
            nombreSemana, fechaCierre: new Date().toISOString(), totalRegistros: incidencias.length, registros: incidencias
          });
          
          const batch = db.batch();

                    {motivo === "AceptadoPorCliente" ? "2️⃣ Producto Alternativo que el Cliente Aceptó" : "2️⃣ Producto enviado físicamente por error"}
                  </p>
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <div className="sm:col-span-2 relative">
                      <label className="text-[11px] text-purple-300/80 block mb-1">Producto entregado *</label>
                      <input type="text" list="lista-catalogo" value={productoCruce} onChange={e => setProductoCruce(e.target.value)} placeholder="Producto alternativo..." className="w-full bg-slate-900 border border-purple-700/60 rounded-xl px-4 py-2.5 text-sm text-white" required />
                    </div>
                    <div>
                      <label className="text-[11px] text-purple-300/80 block mb-1">Cantidad *</label>
                      <input type="number" min="1" value={cantidadCruce} onChange={e => setCantidadCruce(e.target.value)} className="w-full bg-slate-900 border border-purple-700/60 rounded-xl px-4 py-2.5 text-sm font-bold text-white" required />
                    </div>
                    <div>
                      <label className="text-[11px] text-purple-300/80 block mb-1">Unidad</label>
                      <select value={unidadCruce} onChange={e => setUnidadCruce(e.target.value)} className="w-full bg-slate-900 border border-purple-700/60 rounded-xl px-4 py-2.5 text-sm font-semibold text-purple-300">
                        {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                  </div>
                </div>
              )}

              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                <details className="group">
                  <summary className="text-xs font-bold text-amber-400 cursor-pointer flex items-center justify-between">
                    <span>📚 Administrar Catálogo Inteligente ({catalogoProductos.length} guardados)</span>
                    <span className="text-[10px] bg-slate-900 px-2 py-1 rounded-lg text-slate-300 group-open:rotate-180 transition">▼ Ver lista</span>
                  </summary>
                  <div className="max-h-36 overflow-y-auto space-y-1.5 mt-2 pr-1">
                    {catalogoProductos.length === 0 ? (
                      <p className="text-xs text-slate-500 italic">Aún no hay productos guardados.</p>
                    ) : (
                      catalogoProductos.map(cp => (
                        <div key={cp.id} className="flex items-center justify-between bg-slate-900 px-3 py-1.5 rounded-xl text-xs">
                          <span className="font-semibold text-white">{cp.nombre}</span>
                          <button type="button" onClick={(e) => eliminarProductoCatalogo(cp.id, e)} className="text-rose-400 hover:text-rose-300 text-[11px] font-bold bg-rose-950/50 px-2 py-0.5 rounded-lg border border-rose-900/50">
                            🗑️ Borrar error
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </details>
              </div>

              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                <label className="text-xs font-bold text-slate-300 block mb-2">📌 Acciones a Tomar (Puedes marcar una o varias a la vez)</label>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {ACCIONES_DISPONIBLES.map(ac => {
                    const seleccionada = accionesSeleccionadas.includes(ac);
                    return (
                      <button
                        type="button"
                        key={ac}
                        onClick={() => toggleAccionForm(ac)}
                        className={`p-3 rounded-xl border text-left text-xs font-bold transition flex items-center justify-between ${
                          seleccionada ? "bg-amber-500/20 border-amber-400 text-amber-300" : "bg-slate-900 border-slate-800 text-slate-400 hover:text-white"
                        }`}
                      >
                        <span>{ac}</span>
                        <span className={`w-5 h-5 rounded-md flex items-center justify-center text-[10px] ${seleccionada ? "bg-amber-500 text-slate-950 font-black" : "border border-slate-700"}`}>
                          {seleccionada ? "✓" : ""}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-slate-300 block mb-1">💬 Notas Opcionales</label>
                <input type="text" value={notas} onChange={e => setNotas(e.target.value)} placeholder="Ej: Se rompió una bolsa..." className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white" />
              </div>

              <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-2xl text-sm shadow-xl transition">
                {editandoId ? "💾 Guardar Cambios" : "✅ Guardar y Sincronizar en Vivo"}
              </button>
            </form>
          )}

          {/* VISTA BALANCE (CUADRATURA + LISTA DE CONTEO PENDIENTE + HISTORIAL + GESTIÓN RETORNOS PDF) */}
          {vista === "balance" && (
            <div className="space-y-6 no-print">
              
              {/* HOJA DE CONTEO FÍSICO PENDIENTE */}
              <div className="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-5">
                  <div>
                    <h2 className="text-xl font-black text-amber-400">📋 Lista de Conteo Cíclico por Incidencias</h2>
                    <p className="text-xs sm:text-sm text-slate-400 mt-0.5">
                      Productos pendientes de conteo físico en estantería (Doble confirmación: Bodega + Sistema).
                    </p>
                  </div>
                  <button
                    onClick={imprimirHojaConteo}
                    className="inline-flex items-center justify-center gap-2 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition"
                  >
                    🖨️ Imprimir Hoja de Conteo en Columnas
                  </button>
                </div>

                {conteoPendiente.length === 0 ? (
                  <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">
                    No hay productos pendientes de conteo cíclico. Todo al día.
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs sm:text-sm">
                      <thead className="bg-slate-950 text-slate-400 uppercase text-[11px]">
                        <tr>
                          <th className="p-3 rounded-l-xl">Producto</th>
                          <th className="p-3">Unidad</th>
                          <th className="p-3">Factura</th>
                          <th className="p-3 text-center">1. Conteo Físico Bodega</th>
                          <th className="p-3 text-center">2. Ajuste en Sistema</th>
                          <th className="p-3 rounded-r-xl text-right">Acciones</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {conteoPendiente.map((cp) => (
                          <tr key={cp.id} className="hover:bg-slate-950/40">
                            <td className="p-3 font-black text-white">{cp.producto}</td>
                            <td className="p-3 text-slate-300">{cp.unidad}</td>
                            <td className="p-3 text-amber-300 font-bold">#{cp.factura}</td>
                            <td className="p-3 text-center">
                              <button
                                onClick={() => toggleCheckConteoFisico(cp.id, cp.conteoFisicoHecho)}
                                className={`px-3 py-1.5 rounded-xl font-bold text-xs transition ${cp.conteoFisicoHecho ? 'bg-emerald-600 text-white' : 'bg-slate-900 border border-slate-700 text-slate-300'}`}
                              >
                                {cp.conteoFisicoHecho ? `✓ Hecho (${cp.responsableConteo})` : "[ ] Marcar Conteo Físico"}
                              </button>
                            </td>
                            <td className="p-3 text-center">
                              <button
                                onClick={() => toggleCheckAjusteSistema(cp.id, cp.ajusteSistemaHecho)}
                                className={`px-3 py-1.5 rounded-xl font-bold text-xs transition ${cp.ajusteSistemaHecho ? 'bg-emerald-600 text-white' : 'bg-slate-900 border border-slate-700 text-slate-300'}`}
                              >
                                {cp.ajusteSistemaHecho ? `✓ Ajustado (${cp.responsableAjuste})` : "[ ] Marcar Sistema"}
                              </button>
                            </td>
                            <td className="p-3 text-right">
                              <button
                                onClick={() => eliminarItemConteoPendiente(cp.id)}
                                className="bg-rose-950/60 hover:bg-rose-900 text-rose-400 border border-rose-900/50 px-2.5 py-1.5 rounded-xl text-xs font-bold transition"
                              >
                                🗑️
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              {/* SECCIÓN: REPORTES CONSOLIDADOS DE RETORNOS POR RUTA */}
              <div className="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-5">
                  <div>
                    <h2 className="text-xl font-black text-amber-400">🚚 Reporte Consolidado de Retornos a Bodega por Ruta</h2>
                    <p className="text-xs sm:text-sm text-slate-400 mt-0.5">
                      Selecciona las facturas con retorno y genera un reporte PDF agrupado por chofer / ruta (ej. Juan vs Carlos).
                    </p>
                  </div>
                  <button
                    onClick={imprimirReporteRetornosSeleccionados}
                    className="inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition"
                  >
                    📄 Imprimir PDF Retornos Seleccionados
                  </button>
                </div>

                {incidencias.filter(i => (i.acciones || []).includes("Chofer Retorna Producto a Bodega")).length === 0 ? (
                  <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">
                    No hay incidencias registradas con acción de retorno a bodega.
                  </div>
                ) : (
                  <div className="space-y-2">
                    {incidencias.filter(i => (i.acciones || []).includes("Chofer Retorna Producto a Bodega")).map((item) => {
                      const seleccionado = seleccionadosRetornosPDF[item.id] || false;
                      const procesado = !!item.retornoBodegaInfo;
                      return (
                        <div key={item.id} className={`border p-3.5 rounded-2xl flex flex-wrap items-center justify-between gap-3 text-xs transition ${seleccionado ? 'bg-sky-500/10 border-sky-500/40' : 'bg-slate-950 border-slate-800/80'}`}>
                          <div className="flex items-center gap-3">
                            <input
                              type="checkbox"
                              checked={seleccionado}
                              onChange={() => toggleSeleccionRetornoPDF(item.id)}
                              className="w-4 h-4 accent-sky-500 cursor-pointer"
                            />
                            <div>
                              <span className="font-black text-white text-sm">Fact #{item.factura}</span>
                              <span className="text-slate-300 ml-2">({item.ruta})</span>
                              <span className="bg-slate-900 text-amber-300 px-2 py-0.5 rounded-md ml-2 font-bold">{item.cantidad} {item.unidad} — {item.producto}</span>
                            </div>
                          </div>
                          <div>
                            {procesado ? (
                              <span className="bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-1 rounded-lg font-bold">
                                ✓ Recibido ({item.retornoBodegaInfo.recibidoPor})
                              </span>
                            ) : (
                              <span className="bg-amber-950 text-amber-300 border border-amber-800 px-2.5 py-1 rounded-lg font-bold">
                                ⏳ Pendiente en bodega
                              </span>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* CUADRATURA AUTOMÁTICA */}
              <div className="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl">
                <h2 className="text-xl font-black text-amber-400">⚖️ Cuadratura Automática de Inventario en Bodega</h2>
                <p className="text-xs sm:text-sm text-slate-400 mt-1 mb-6">
                  Cálculo instantáneo de lo que sobra (+) o falta (-) físicamente en estanterías según las incidencias de ruta.
                </p>

                {resumenInventario.length === 0 ? (
                  <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-10 text-center text-sm text-slate-400">
                    Sin desfases de inventario registrados esta semana. ¡Todo cuadrado!
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs sm:text-sm">
                      <thead className="bg-slate-950 text-slate-400 uppercase text-[11px]">
                        <tr>
                          <th className="p-4 rounded-l-xl">Producto</th>
                          <th className="p-4">Unidad</th>
                          <th className="p-4 text-emerald-400">Sobra en Bodega (+)</th>
                          <th className="p-4 text-rose-400">Falta en Bodega (-)</th>
                          <th className="p-4 rounded-r-xl">Facturas</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {resumenInventario.map((item, idx) => (
                          <tr key={idx} className="hover:bg-slate-950/40">
                            <td className="p-4 font-black text-white">{item.producto}</td>
                            <td className="p-4 text-slate-300 font-semibold">{item.unidad}</td>
                            <td className="p-4 font-black text-emerald-400 text-base">{item.sobranteBodega > 0 ? `+${item.sobranteBodega}` : "—"}</td>
                            <td className="p-4 font-black text-rose-400 text-base">{item.faltanteBodega > 0 ? `-${item.faltanteBodega}` : "—"}</td>
                            <td className="p-4 text-xs text-amber-300 font-semibold">#{item.facturas.join(", #")}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              {/* HISTORIAL ACUMULATIVO CON SELECCIÓN DE REPORTE PDF */}
              <div className="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-5">
                  <div>
                    <h2 className="text-lg font-black text-amber-400 mb-1">🕒 Historial Acumulativo de Correcciones de Inventario</h2>
                    <p className="text-xs text-slate-400">
                      Marca con un check los ítems que deseas incluir en el reporte formal y genera el PDF impreso.
                    </p>
                  </div>
                  <button
                    onClick={imprimirReporteInventarioSeleccionado}
                    className="inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition"
                  >
                    📄 Imprimir Reporte PDF de Ítems Seleccionados
                  </button>
                </div>

                {historialInventario.length === 0 ? (
                  <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">
                    Aún no hay correcciones de inventario tildadas en las tarjetas.
                  </div>
                ) : (
                  <div className="space-y-2">
                    {historialInventario.map((h, i) => {
                      const seleccionado = seleccionadosInventario[h.id] || false;
                      return (
                        <div key={h.id || i} className={`border p-3.5 rounded-2xl flex flex-wrap items-center justify-between gap-3 text-xs transition ${seleccionado ? 'bg-amber-500/10 border-amber-500/40' : 'bg-slate-950 border-slate-800/80'}`}>
                          <div className="flex items-center gap-3">
                            <input
                              type="checkbox"
                              checked={seleccionado}
                              onChange={() => toggleSeleccionInventario(h.id)}
                              className="w-4 h-4 accent-amber-500 cursor-pointer"
                            />
                            <div>
                              <span className="font-black text-white text-sm">{h.producto}</span>
                              <span className="text-slate-400 ml-2">({h.unidad})</span>
                              <span className="bg-slate-900 text-amber-300 px-2 py-0.5 rounded-md ml-2 font-bold">Fact #{h.factura}</span>
                            </div>
                          </div>
                          <div className="flex items-center gap-4">
                            <div className="text-right">
                              <span className="text-emerald-400 font-bold">Actualizado por {h.corregidoPor}</span>
                              <span className="text-slate-400 block text-[11px]">{h.fechaHora}</span>
                            </div>
                            <button
                              onClick={() => eliminarRegistroHistorialInv(h.id)}
                              className="bg-rose-950/60 hover:bg-rose-900 text-rose-400 border border-rose-900/50 px-2.5 py-1.5 rounded-xl text-xs font-bold transition"
                              title="Eliminar este registro"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* VISTA HISTORIAL SEMANAL */}
          {vista === "historial" && (
            <div className="space-y-4 max-w-3xl mx-auto no-print">
              <div className="glass-card rounded-2xl p-5">
                <h2 className="text-lg font-black text-amber-400">📁 Historial de Cierres Semanales</h2>
                <p className="text-xs text-slate-400 mt-1">Registros archivados de semanas anteriores.</p>
              </div>

              {cierres.length === 0 ? (
                <div className="glass-card rounded-2xl p-8 text-center text-sm text-slate-400">
                  Aún no se han archivado semanas cerradas.
                </div>
              ) : (
                cierres.map(c => (
                  <div key={c.id} className="glass-card rounded-2xl p-5">
                    <div onClick={() => setCierreExpandido(cierreExpandido === c.id ? null : c.id)} className="flex justify-between items-center cursor-pointer">
                      <div>
                        <h3 className="font-black text-white text-base">📦 {c.nombreSemana}</h3>
                        <p className="text-xs text-slate-400">Cerrado el {new Date(c.fechaCierre).toLocaleString("es-CL")}</p>
                      </div>
                      <span className="text-xs font-extrabold bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl">
                        {c.totalRegistros} registros {cierreExpandido === c.id ? "▲" : "▼"}
                      </span>
                    </div>

                    {cierreExpandido === c.id && c.registros && (
                      <div className="mt-4 pt-3 border-t border-slate-800 space-y-2">
                        {c.registros.map((r, i) => (
                          <div key={i} className="bg-slate-950 p-3 rounded-xl text-xs flex justify-between items-center">
                            <div>
                              <span className="font-bold text-amber-400">Fact #${r.factura}</span> • <span className="font-bold text-white">{r.motivo}</span>: {r.cantidad} {r.unidad} de {r.producto}
                            </div>
                            <div className="text-slate-400">Armó: {r.armador} | Registró: {r.registradoPor}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
