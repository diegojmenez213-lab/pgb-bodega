<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGB Distribution Chile SpA • ERP Logística Bodega</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    .light-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); }
    .print-only { display: none; }

</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-amber-400 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const UNIDADES = ["Unidad", "Caja", "Manga", "Unidad suelta", "Display", "Pack"];
    const MOTIVOS = [
      { id: "Faltante", label: "Faltante en Ruta", desc: "No llegó al cliente (Sobra en bodega)", fisico: true },
      { id: "Sobrante", label: "Sobrante en Ruta", desc: "Fue de más en el furgón (Falta en bodega)", fisico: true },
      { id: "Cruce", label: "Cruce de Producto", desc: "Se facturó un producto pero se envió otro físico", fisico: true },
      { id: "ErrorFacturacion", label: "Error de Facturación", desc: "Vendedor facturó mal; cliente rechaza y retorna", fisico: false },
      { id: "AceptadoPorCliente", label: "Aceptado por Cliente", desc: "Cliente acepta producto cruzado/alternativo", fisico: false },
      { id: "Rechazo", label: "Rechazo Cliente", desc: "Cliente devuelve o no recibe mercadería", fisico: true },
      { id: "Daño/Merma", label: "Daño / Merma", desc: "Producto roto, vencido o averiado", fisico: true }
    ];
    const ARMADORES = ["Diego", "Nico", "Edwin", "Julio", "Horacio", "Sra. Rosa"];
    const COLORES_ARMADORES = {
      "Diego": { hex: "#f59e0b", bg: "bg-amber-500", badge: "bg-amber-100 text-amber-900 border-amber-300" },
      "Nico": { hex: "#0284c7", bg: "bg-sky-600", badge: "bg-sky-100 text-sky-900 border-sky-300" },
      "Edwin": { hex: "#10b981", bg: "bg-emerald-500", badge: "bg-emerald-100 text-emerald-900 border-emerald-300" },
      "Julio": { hex: "#8b5cf6", bg: "bg-violet-500", badge: "bg-violet-100 text-violet-900 border-violet-300" },
      "Horacio": { hex: "#f43f5e", bg: "bg-rose-500", badge: "bg-rose-100 text-rose-900 border-rose-300" },
      "Sra. Rosa": { hex: "#ec4899", bg: "bg-pink-500", badge: "bg-pink-100 text-pink-900 border-pink-300" }
    };

    const RUTAS_BASE = ["Ruta 1", "Ruta 2", "Ruta Alternativa"];
    const EQUIPO_RUTA_ALTERNATIVA = ["Pedro", "Juan", "Carlos", "Horacio", "Julio", "Nico", "Diego", "Edwin"];
    const JERARQUIA_CHOFERES = ["Pedro", "Juan", "Carlos", "Nico"];

    const USUARIOS_SISTEMA = ["Edwin", "Nico", "Diego", "Bedanli", "Pedro", "Gabriel"];
    const PERSONAL_EQUIPO = ["Nico", "Edwin", "Horacio", "Julio", "Juan", "Sra. Rosa", "Diego", "Bedanli", "Pedro", "Gabriel", "Carlos"];
    const MOTIVOS_BODEGA_INTERNA = [
      "Rotura accidental en pasillo",
      "Compra personal (Descuento sueldo)",
      "Consumo / Uso interno bodega",
      "Dañado de fábrica (Mal sellado)",
      "Pérdida o extravío interno"
    ];

    const CAUSAS_DANIO_RUTA = [
      "Dañado de fábrica (Mal sellado / Defecto origen)",
      "Accidente en trayecto (Golpe dentro del furgón)",
      "Rotura por manipulación (Chofer / Pioneta)"
    ];

    const ACCIONES_DISPONIBLES = [
      "Ajustar Inventario en Bodega",
      "Enviar / Reponer Producto al Cliente",
      "Descuento en Factura / Cuenta Corriente",
      "Nota de Crédito (Tributaria)",
      "Chofer Retorna Producto a Bodega"
    ];

    const normalizarTexto = (str) => {
      if (!str) return "";
      return str.trim().replace(/\s+/g, ' ').toUpperCase();
    };

    const resolverRolesRutaAlternativa = (seleccionados) => {
      if (!seleccionados || seleccionados.length === 0) return { chofer: "", pioneta: "", texto: "Ruta Alternativa" };
      const ordenados = [...seleccionados].sort((a, b) => {
        const idxA = JERARQUIA_CHOFERES.indexOf(a);
        const idxB = JERARQUIA_CHOFERES.indexOf(b);
        const rankA = idxA !== -1 ? idxA : 99;
        const rankB = idxB !== -1 ? idxB : 99;
        return rankA - rankB;
      });
      const chofer = ordenados[0];
      const pioneta = ordenados[1] || "";
      const texto = pioneta
        ? `Ruta Alternativa (Chofer: ${chofer} / Pioneta: ${pioneta})`
        : `Ruta Alternativa (Chofer: ${chofer})`;
      return { chofer, pioneta, texto };
    };

    function App() {
      const [incidencias, setIncidencias] = useState([]);
      const [incidentesBodega, setIncidentesBodega] = useState([]);
      const [cierres, setCierres] = useState([]);
      const [catalogoProductos, setCatalogoProductos] = useState([]);
      const [catalogoClientes, setCatalogoClientes] = useState([]);
      const [historialInventario, setHistorialInventario] = useState([]);
      const [conteoPendiente, setConteoPendiente] = useState([]);
      const [seleccionadosInventario, setSeleccionadosInventario] = useState({});
      const [seleccionadosRetornosPDF, setSeleccionadosRetornosPDF] = useState({});
      
      const [seleccionadosConteoDigital, setSeleccionadosConteoDigital] = useState({});
      const [modoConteoDigitalActivo, setModoConteoDigitalActivo] = useState(false);
      const [valoresConteoDigital, setValoresConteoDigital] = useState({});

      const [modoImpresionReporte, setModoImpresionReporte] = useState(null);
      const [facturaImprimirIndividual, setFacturaImprimirIndividual] = useState(null);

      const [recibiendoRetornoId, setRecibiendoRetornoId] = useState(null);
      const [retornoFormState, setRetornoFormState] = useState({});

      const [prodBodega, setProdBodega] = useState("");
      const [cantBodega, setCantBodega] = useState(1);
      const [uniBodega, setUniBodega] = useState(UNIDADES[0]);
      const [motivoBodega, setMotivoBodega] = useState(MOTIVOS_BODEGA_INTERNA[0]);
      const [responsableBodega, setResponsableBodega] = useState(PERSONAL_EQUIPO[0]);
      const [notasBodega, setNotasBodega] = useState("");

      const [vista, setVista] = useState("dashboard");
      const [conectado, setConectado] = useState(false);
      const [editandoId, setEditandoId] = useState(null);
      const [cierreExpandido, setCierreExpandido] = useState(null);
      const [tarjetasAbiertas, setTarjetasAbiertas] = useState({});

      const [busqueda, setBusqueda] = useState("");
      const [filtroEstado, setFiltroEstado] = useState("todos");
      const [filtroArmador, setFiltroArmador] = useState("todos");
      const [filtroRuta, setFiltroRuta] = useState("todos");
      const [filtroFechaDesde, setFiltroFechaDesde] = useState("");
      const [filtroFechaHasta, setFiltroFechaHasta] = useState("");

      const hoy = new Date().toISOString().split("T")[0];
      const mesActualDefault = hoy.slice(0, 7);
      const [mesGrafico, setMesGrafico] = useState(mesActualDefault);

      const [factura, setFactura] = useState("");
      const [cliente, setCliente] = useState("");
      const [fecha, setFecha] = useState(hoy);
      const [rutaTipo, setRutaTipo] = useState("Ruta 1");
      const [equipoAlternativo, setEquipoAlternativo] = useState(["Pedro"]);
      const [armador, setArmador] = useState(ARMADORES[0]);
      const [registradoPor, setRegistradoPor] = useState("Diego");
      const [motivo, setMotivo] = useState("Faltante");

      const [producto, setProducto] = useState("");
      const [cantidad, setCantidad] = useState(1);
      const [unidad, setUnidad] = useState(UNIDADES[0]);

      const [productoCruce, setProductoCruce] = useState("");
      const [cantidadCruce, setCantidadCruce] = useState(1);
      const [unidadCruce, setUnidadCruce] = useState(UNIDADES[0]);

      const [productoMalFacturado, setProductoMalFacturado] = useState("");
      const [cantidadMalFacturada, setCantidadMalFacturada] = useState(1);
      const [unidadMalFacturada, setUnidadMalFacturada] = useState(UNIDADES[0]);

      const [causaDanio, setCausaDanio] = useState(CAUSAS_DANIO_RUTA[0]);
      const [responsableDanio, setResponsableDanio] = useState("Juan");
      const [danioTotalForm, setDanioTotalForm] = useState(true);
      const [cantDanadaParcial, setCantDanadaParcial] = useState(1);

      const [accionesSeleccionadas, setAccionesSeleccionadas] = useState(["Ajustar Inventario en Bodega"]);
      const [notas, setNotas] = useState("");

      const sincronizandoRef = useRef(false);

      const toggleIntegranteAlternativo = (nombre) => {
        if (equipoAlternativo.includes(nombre)) {
          if (equipoAlternativo.length === 1) return;
          setEquipoAlternativo(equipoAlternativo.filter(n => n !== nombre));
        } else {
          let nuevaLista = equipoAlternativo.length >= 2 ? [equipoAlternativo[0], nombre] : [...equipoAlternativo, nombre];
          const tieneChofer = nuevaLista.some(n => JERARQUIA_CHOFERES.includes(n));
          if (!tieneChofer) {
            return alert("Debe haber al menos un chofer habilitado (Pedro, Juan, Carlos o Nico) en la ruta.");
          }
          setEquipoAlternativo(nuevaLista);
        }
      };

      const personalRutaActual = useMemo(() => {
        if (rutaTipo === "Ruta 1") return ["Juan", "Julio"];
        if (rutaTipo === "Ruta 2") return ["Carlos", "Horacio"];
        return equipoAlternativo.length > 0 ? equipoAlternativo : EQUIPO_RUTA_ALTERNATIVA;
      }, [rutaTipo, equipoAlternativo]);

      useEffect(() => {
        if (!personalRutaActual.includes(responsableDanio)) {
          setResponsableDanio(personalRutaActual[0]);
        }
      }, [rutaTipo, personalRutaActual]);

      useEffect(() => {
        auth.signInAnonymously().catch(() => {});
        
        const unsubInc = db.collection("incidencias").onSnapshot((snap) => {
          setConectado(true);
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setIncidencias(lista);
        }, () => {});

        const unsubIncBodega = db.collection("incidentes_bodega").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setIncidentesBodega(lista);
        }, () => {});

        const unsubCierres = db.collection("cierres_semanales").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => new Date(b.fechaCierre) - new Date(a.fechaCierre));
          setCierres(lista);
        });

        const unsubCat = db.collection("catalogo_productos").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => a.nombre.localeCompare(b.nombre));
          setCatalogoProductos(lista);
        });

        const unsubCatClientes = db.collection("catalogo_clientes").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => a.nombre.localeCompare(b.nombre));
          setCatalogoClientes(lista);
        });

        const unsubHistInv = db.collection("historial_inventario").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setHistorialInventario(lista);
        });

        const unsubConteo = db.collection("conteo_pendiente").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setConteoPendiente(lista);
        });

        return () => { unsubInc(); unsubIncBodega(); unsubCierres(); unsubCat(); unsubCatClientes(); unsubHistInv(); unsubConteo(); };
      }, []);

      // SINCRONIZACIÓN AUTOMÁTICA: ASEGURA QUE TODA INCIDENCIA PENDIENTE DE AJUSTE DE INVENTARIO ESTÉ EN CONTEO CÍCLICO
      useEffect(() => {
        if (!conectado || sincronizandoRef.current) return;

        const sincronizarPendientesFaltantes = async () => {
          sincronizandoRef.current = true;
          try {
            for (const inc of incidencias) {
              const requiereAjuste = (inc.acciones || []).includes("Ajustar Inventario en Bodega");
              const yaAjustado = inc.checksAcciones?.["Ajustar Inventario en Bodega"]?.completado;
              const motivoObj = MOTIVOS.find(m => m.id === inc.motivo);
              const esFisico = motivoObj ? motivoObj.fisico : true;

              if (requiereAjuste && !yaAjustado && esFisico && inc.motivo !== "AceptadoPorCliente" && inc.motivo !== "ErrorFacturacion") {
                const prodNorm = normalizarTexto(inc.producto);
                const uniNorm = (inc.motivo === "Daño/Merma" && inc.detalleDanio) ? inc.detalleDanio.unidadDanada : inc.unidad;
                const cantNorm = (inc.motivo === "Daño/Merma" && inc.detalleDanio) ? Number(inc.detalleDanio.cantidadDanada) : Number(inc.cantidad);

                const yaEnConteo = conteoPendiente.some(cp =>
                  cp.producto === prodNorm &&
                  cp.unidad === uniNorm &&
                  cp.factura && cp.factura.includes(inc.factura)
                );

                if (!yaEnConteo) {
                  await registrarConteoPendiente(prodNorm, uniNorm, cantNorm, inc.factura);
                }

                if (inc.motivo === "Cruce" && inc.productoCruce) {
                  const prodCruceN = normalizarTexto(inc.productoCruce);
                  const yaEnConteoCruce = conteoPendiente.some(cp =>
                    cp.producto === prodCruceN &&
                    cp.unidad === inc.unidadCruce &&
                    cp.factura && cp.factura.includes(inc.factura)
                  );
                  if (!yaEnConteoCruce) {
                    await registrarConteoPendiente(prodCruceN, inc.unidadCruce, Number(inc.cantidadCruce), inc.factura);
                  }
                }
              }
            }
          } catch (e) {
            console.error(e);
          } finally {
            sincronizandoRef.current = false;
          }
        };

        const timer = setTimeout(sincronizarPendientesFaltantes, 800);
        return () => clearTimeout(timer);
      }, [incidencias, conteoPendiente, conectado]);

      const seleccionarMotivo = (nuevoMotivo) => {
        setMotivo(nuevoMotivo);
        if (nuevoMotivo === "ErrorFacturacion") {
          setAccionesSeleccionadas(["Chofer Retorna Producto a Bodega", "Nota de Crédito (Tributaria)"]);
        } else if (!editandoId) {
          setAccionesSeleccionadas(["Ajustar Inventario en Bodega"]);
        }
      };

      const limpiarFormulario = () => {
        setFactura(""); setCliente(""); setProducto(""); setCantidad(1); setUnidad(UNIDADES[0]);
        setProductoCruce(""); setCantidadCruce(1); setUnidadCruce(UNIDADES[0]);
        setProductoMalFacturado(""); setCantidadMalFacturada(1); setUnidadMalFacturada(UNIDADES[0]);
        setNotas(""); setEditandoId(null);
        setRutaTipo("Ruta 1");
        setEquipoAlternativo(["Pedro"]);
        setAccionesSeleccionadas(["Ajustar Inventario en Bodega"]);
        setCausaDanio(CAUSAS_DANIO_RUTA[0]);
        setDanioTotalForm(true);
        setCantDanadaParcial(1);
      };

      const registrarProductoEnCatalogo = async (nombreProd) => {
        const nombreNorm = normalizarTexto(nombreProd);
        if (!nombreNorm) return;
        const existe = catalogoProductos.some(p => p.nombre === nombreNorm);
        if (!existe) {
          try { await db.collection("catalogo_productos").add({ nombre: nombreNorm }); } catch (err) {}
        }
      };

      const registrarClienteEnCatalogo = async (nombreCliente) => {
        const nombreNorm = normalizarTexto(nombreCliente);
        if (!nombreNorm) return;
        const existe = catalogoClientes.some(c => c.nombre === nombreNorm);
        if (!existe) {
          try { await db.collection("catalogo_clientes").add({ nombre: nombreNorm }); } catch (err) {}
        }
      };

      const registrarConteoPendiente = async (prod, uni, cant, fact) => {
        try {
          const prodNorm = normalizarTexto(prod);
          const snap = await db.collection("conteo_pendiente").where("producto", "==", prodNorm).get();
          const existenteDoc = snap.docs.find(d => d.data().unidad === uni);

          if (existenteDoc) {
            const dataExist = existenteDoc.data();
            if (dataExist.factura && dataExist.factura.includes(fact)) return;
            const nuevaCantidad = (Number(dataExist.cantidad) || 0) + Number(cant);
            const nuevasFacturas = dataExist.factura ? `${dataExist.factura}, #${fact}` : fact;
            await db.collection("conteo_pendiente").doc(existenteDoc.id).update({
              cantidad: nuevaCantidad,
              factura: nuevasFacturas,
              timestamp: Date.now()
            });
          } else {
            await db.collection("conteo_pendiente").add({
              producto: prodNorm,
              unidad: uni,
              cantidad: Number(cant),
              factura: fact,
              conteoFisicoHecho: false,
              ajusteSistemaHecho: false,
              responsableConteo: "",
              fechaHoraConteo: "",
              responsableAjuste: "",
              fechaHoraAjuste: "",
              timestamp: Date.now()
            });
          }
        } catch (err) { console.error(err); }
      };

      const eliminarProductoCatalogo = async (id, e) => {
        e.stopPropagation();
        if (confirm("¿Eliminar este producto del catálogo?")) {
          try { await db.collection("catalogo_productos").doc(id).delete(); } catch (err) { alert(err.message); }
        }
      };

      const eliminarClienteCatalogo = async (id, e) => {
        e.stopPropagation();
        if (confirm("¿Eliminar este cliente del catálogo?")) {
          try { await db.collection("catalogo_clientes").doc(id).delete(); } catch (err) { alert(err.message); }
        }
      };

      const eliminarRegistroHistorialInv = async (id) => {
        if (confirm("¿Deseas eliminar este registro del historial de inventario?")) {
          try { await db.collection("historial_inventario").doc(id).delete(); } catch (err) { alert(err.message); }
        }
      };

      const toggleSeleccionInventario = (id) => {
        setSeleccionadosInventario(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleSeleccionRetornosPDF = (id) => {
        setSeleccionadosRetornosPDF(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleSeleccionConteoDigital = (id) => {
        setSeleccionadosConteoDigital(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleAccionForm = (acc) => {
        if (accionesSeleccionadas.includes(acc)) {
          if (accionesSeleccionadas.length === 1) return;
          setAccionesSeleccionadas(accionesSeleccionadas.filter(a => a !== acc));
        } else {
          setAccionesSeleccionadas([...accionesSeleccionadas, acc]);
        }
      };

      const guardarIncidencia = async (e) => {
        e.preventDefault();
        if (!factura.trim()) return alert("Completa el Nº de Factura.");
        if (motivo !== "ErrorFacturacion" && !producto.trim()) return alert("Completa el Producto.");
        if ((motivo === "Cruce" || motivo === "AceptadoPorCliente") && !productoCruce.trim()) return alert("Indica el producto alternativo o enviado por error.");
        if (motivo === "ErrorFacturacion" && !productoMalFacturado.trim()) return alert("Indica qué producto se envió mal facturado por el vendedor.");
        if (rutaTipo === "Ruta Alternativa" && !equipoAlternativo.some(n => JERARQUIA_CHOFERES.includes(n))) {
          return alert("Selecciona al menos un chofer válido en la Ruta Alternativa.");
        }

        let rutaTextoFinal = rutaTipo;
        let integrantesRuta = [];
        if (rutaTipo === "Ruta 1") {
          rutaTextoFinal = "Ruta 1 (Juan / Julio)";
          integrantesRuta = ["Juan", "Julio"];
        } else if (rutaTipo === "Ruta 2") {
          rutaTextoFinal = "Ruta 2 (Carlos / Horacio)";
          integrantesRuta = ["Carlos", "Horacio"];
        } else {
          const roles = resolverRolesRutaAlternativa(equipoAlternativo);
          rutaTextoFinal = roles.texto;
          integrantesRuta = equipoAlternativo;
        }

        const clienteNorm = normalizarTexto(cliente);
        const prodPrincipal = motivo === "ErrorFacturacion" ? normalizarTexto(productoMalFacturado) : normalizarTexto(producto);
        const cantPrincipal = motivo === "ErrorFacturacion" ? Number(cantidadMalFacturada) : Number(cantidad);
        const uniPrincipal = motivo === "ErrorFacturacion" ? unidadMalFacturada : unidad;
        const prodCruceNorm = productoCruce ? normalizarTexto(productoCruce) : null;

        if (clienteNorm) await registrarClienteEnCatalogo(clienteNorm);
        await registrarProductoEnCatalogo(prodPrincipal);
        if ((motivo === "Cruce" || motivo === "AceptadoPorCliente") && prodCruceNorm) await registrarProductoEnCatalogo(prodCruceNorm);

        const motivoObj = MOTIVOS.find(m => m.id === motivo);
        const requiereFisico = motivoObj ? motivoObj.fisico : true;
        const requiereAjusteInv = accionesSeleccionadas.includes("Ajustar Inventario en Bodega");

        let infoDanioObj = null;
        let cantidadParaConteo = cantPrincipal;

            unidad: unidadMedida,
            factura: facturaNum || "INTERNO",
            corregidoPor: responsableAjuste,
            fechaHoraAjuste: fechaAjuste || new Date().toLocaleString("es-CL"),

            detalle: detalleExtra,
            fechaHora: new Date().toLocaleString("es-CL"),
            timestamp: Date.now()
          });

          const snapshot = await colRef.where("producto", "==", prodNorm).get();

          texto += `   • Prod: ${i.cantidad} ${i.unidad} de ${i.producto}\n`;

      const kpis = useMemo(() => ({

        const conteo = {};
        ARMADORES.forEach(a => { conteo[a] = 0; });

        const todosLosRegistros = [...incidencias];
        cierres.forEach(c => {
          if (Array.isArray(c.registros)) {

              if (!todosLosRegistros.some(act => act.id === r.id)) {
                todosLosRegistros.push(r);

            });
          }

        let totalMes = 0;
        todosLosRegistros.forEach(item => {
          if (item.motivo === "ErrorFacturacion") return;
          if (item.fecha && item.fecha.startsWith(mesGrafico)) {
            const arm = item.armador;
            if (arm) {
              conteo[arm] = (conteo[arm] || 0) + 1;
              totalMes++;
            }
          }
        });

        const lista = Object.entries(conteo)
          .map(([nombre, errores]) => {
            const pctExacto = totalMes > 0 ? (errores / totalMes) * 100 : 0;
            return {
              nombre,
              errores,
              pctExacto,
              pctRedondeado: totalMes > 0 ? Math.round(pctExacto * 10) / 10 : 0
            };
          })
          .sort((a, b) => b.errores - a.errores);

        let acumulado = 0;
        const segmentosConic = lista
          .filter(item => item.errores > 0)
          .map(item => {
            const inicio = acumulado;
            const fin = acumulado + item.pctExacto;
            acumulado = fin;
            const color = COLORES_ARMADORES[item.nombre]?.hex || "#94a3b8";
            return `${color} ${inicio}% ${fin}%`;
          });

        const conicGradient = segmentosConic.length > 0
          ? `conic-gradient(${segmentosConic.join(", ")})`
          : "conic-gradient(#e2e8f0 0% 100%)";

        return { lista, totalMes, conicGradient };

      const incidenciasFiltradas = useMemo(() => {

          const coincideEstado = filtroEstado === "todos" ? true : filtroEstado === "pendientes" ? !item.resuelto : item.resuelto;
          const coincideArmador = filtroArmador === "todos" ? true : item.armador === filtroArmador;
          const coincideRuta = filtroRuta === "todos" ? true : (item.rutaTipo === filtroRuta || item.ruta?.startsWith(filtroRuta));
          
          let coincideFecha = true;
          if (filtroFechaDesde && item.fecha < filtroFechaDesde) coincideFecha = false;
          if (filtroFechaHasta && item.fecha > filtroFechaHasta) coincideFecha = false;

          return coincideTexto && coincideEstado && coincideArmador && coincideRuta && coincideFecha;

        });

                          <div className="mt-4 pt-3 border-t border-slate-200 space-y-2">
                            {c.registros.map((r, i) => (
                              <div key={i} className="bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs flex justify-between items-center">
                                <div>
                                  <span className="font-bold text-amber-700">Fact #{r.factura}</span> • <span className="font-bold text-slate-900">{r.motivo}</span>: {r.cantidad} {r.unidad} de {r.producto}
                                </div>
                                <div className="text-slate-600">Armó: <strong className="text-slate-900">{r.armador}</strong> | Registró: {r.registradoPor}</div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
