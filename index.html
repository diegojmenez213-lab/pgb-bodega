<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ERP • Infraestructura Empresarial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .corp-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.06); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-slate-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();

    const MODULOS_PGB = {
      m1_empresa: true, m2_jerarquia: true, m3_catalogo: true, m4_apis: false,
      m5_inv_general: true, m6_conteo_ciclico: true, m7_auditoria_inv: true,
      m8_omnicanal: false, m9_stock_sync: false, m10_sii_dte: false, m11_colas_print: false,
      m12_ruta_inc: true, m13_retornos_merma: true, m14_analitica_err: true,
      m15_pos_ventas: false, m16_caja_cobros: false, m17_compras_prov: false, m18_finanzas_bi: false
    };

    function PortadaApp() {
      const [toques, setToques] = useState(0);
      const [rutInput, setRutInput] = useState("");
      const [claveInput, setClaveInput] = useState("");
      const [cargando, setCargando] = useState(false);

      useEffect(() => {
        if (window.location.hash === "#/comando") {
          window.location.href = "super-admin.html";
          return;
        }
        auth.signInAnonymously().then(() => {
          db.collection("saas_empresas").doc(RUT_PGB).set({
            rut: "76.949.722-6",
            nombre: "PGB Distribution Chile SpA",
            rubro: "Distribuidora / Mayorista",
            activa: true,
            pinAcceso: "1234",
            archivoPrincipal: "pgb-operacion.html",
            modulosActivos: MODULOS_PGB
          }, { merge: true }).catch(() => {});
        }).catch(() => {});
      }, []);

      const toqueCandado = () => {
        const next = toques + 1;
        if (next >= 5) {
          setToques(0);
          window.location.href = "super-admin.html";
        } else {
          setToques(next);
        }
      };

      const ingresar = async (e) => {
        e.preventDefault();
        const raw = rutInput.trim();
        const clean = limpiarRut(raw);
        if (clean.length < 7) return alert("Ingresa un RUT válido.");

        if (clean === RUT_PGB) {
          if (raw !== RUT_PGB) return alert("Para esta organización ingresa el RUT sin puntos ni guiones.");
          if (claveInput.trim() !== "1234") return alert("Clave incorrecta.");
          localStorage.setItem("nexus_empresa_rut", RUT_PGB);
          window.location.href = "pgb-operacion.html";
          return;
        }

        setCargando(true);
        try {
          const snap = await db.collection("saas_empresas").doc(clean).get();
          if (!snap.exists) {
            alert("La organización ingresada no está registrada.");
            setCargando(false);
            return;
          }
          const data = snap.data();
          if (data.activa === false) {
            alert("Esta organización se encuentra pausada.");
            setCargando(false);
            return;
          }
          if (claveInput.trim() !== String(data.pinAcceso || "1234")) {
            alert("Clave incorrecta.");
            setCargando(false);
            return;
          }
          localStorage.setItem("nexus_empresa_rut", clean);
          window.location.href = "empresa-panel.html";
        } catch (err) {
          alert("Error de conexión: " + err.message);
        }
        setCargando(false);
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col justify-between p-4 sm:p-8">
          <header className="max-w-6xl w-full mx-auto flex items-center justify-between py-2">
            <div className="flex items-center gap-2.5 select-none">
              <div className="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-extrabold text-sm">
                N
              </div>
              <button
                type="button"
                onClick={toqueCandado}
                aria-label="Acceso reservado"
                className="text-slate-300 hover:text-slate-400 p-0.5 cursor-pointer"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="w-3 h-3">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </button>
              <span className="font-extrabold tracking-tight text-base">NEXUS ERP</span>
            </div>
            <span className="text-xs font-semibold text-slate-500">Chile • Cloud Multi-Empresa</span>
          </header>

          <main className="max-w-6xl w-full mx-auto my-auto py-6 lg:grid lg:grid-cols-12 lg:gap-10 lg:items-center space-y-8 lg:space-y-0">
            <div className="lg:col-span-7 space-y-4 text-center lg:text-left">
              <span className="inline-block text-[11px] font-bold uppercase tracking-widest text-slate-400">
                Arquitectura Modular de Alta Precisión
              </span>
              <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight text-slate-900 leading-tight">
                Control operativo, stock sincronizado y facturación sin fricción.
              </h1>
              <p className="text-sm sm:text-base text-slate-500 max-w-xl mx-auto lg:mx-0 leading-relaxed">
                Cada organización opera con datos aislados por RUT, módulos activados según su necesidad real y conexión directa a canales y SII.
              </p>
              <div className="hidden lg:grid grid-cols-3 gap-3 pt-2 max-w-xl">
                <div className="corp-card rounded-2xl p-4">
                  <p className="text-xs font-extrabold text-slate-900">100% Aislado por RUT</p>
                  <p className="text-[11px] text-slate-500 mt-0.5">Cero cruce de datos entre clientes.</p>
                </div>
                <div className="corp-card rounded-2xl p-4">
                  <p className="text-xs font-extrabold text-slate-900">Activación por Switch</p>
                  <p className="text-[11px] text-slate-500 mt-0.5">Cada empresa usa solo lo que necesita.</p>
                </div>
                <div className="corp-card rounded-2xl p-4">
                  <p className="text-xs font-extrabold text-slate-900">Multi-Sucursal</p>
                  <p className="text-[11px] text-slate-500 mt-0.5">Escala sin frenos ni caídas.</p>
                </div>
              </div>
            </div>

            <div className="lg:col-span-5 max-w-md w-full mx-auto">
              <div className="corp-card rounded-3xl p-7 sm:p-9 space-y-6">
                <div>
                  <span className="text-[11px] font-bold uppercase tracking-widest text-slate-400">Ingreso Corporativo</span>
                  <h2 className="text-xl font-extrabold text-slate-900 mt-1">Acceder a tu Organización</h2>
                </div>

                <form onSubmit={ingresar} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1.5">RUT de la Empresa</label>
                    <input
                      type="text"
                      value={rutInput}
                      onChange={(e) => setRutInput(e.target.value)}
                      placeholder="Ingresa el RUT"
                      className="w-full bg-slate-50 border border-slate-300 focus:border-slate-900 focus:bg-white rounded-xl px-4 py-3 text-sm font-bold outline-none"
                      required
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1.5">Clave de Acceso</label>
                    <input
                      type="password"
                      value={claveInput}
                      onChange={(e) => setClaveInput(e.target.value)}
                      placeholder="Ingresa tu clave"
                      className="w-full bg-slate-50 border border-slate-300 focus:border-slate-900 focus:bg-white rounded-xl px-4 py-3 text-sm font-bold outline-none"
                      required
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={cargando}
                    className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-sm transition cursor-pointer"
                  >
                    {cargando ? "Verificando..." : "Ingresar al Sistema"}
                  </button>
                </form>
              </div>
            </div>
          </main>

          <footer className="max-w-6xl w-full mx-auto text-center text-[11px] text-slate-400 py-2">
            NEXUS ERP • Plataforma Multi-Empresa
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PortadaApp />);
  </script>
</body>
</html>
