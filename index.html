<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGB Distribution Chile SpA • ERP Logística Bodega</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-[#050811] text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const UNIDADES = ["Unidad", "Caja", "Manga", "Fardo", "Unidad suelta", "Display", "Pack"];
    const MOTIVOS = [
      { id: "Faltante", label: "Faltante en Ruta", desc: "No llegó al cliente (Sobra en bodega)" },
      { id: "Sobrante", label: "Sobrante en Ruta", desc: "Fue de más en el furgón (Falta en bodega)" },
      { id: "Cruce", label: "Cruce de Producto", desc: "Se facturó un producto pero se envió otro físico" },
      { id: "Rechazo", label: "Rechazo Cliente", desc: "Cliente devuelve o no recibe mercadería" },
      { id: "Daño/Merma", label: "Daño / Merma", desc: "Producto roto, vencido o averiado" }
    ];

    // Armadores actualizados con Diego, Nico, Edwin, Julio, Horacio y Sra. Rosa
    const ARMADORES = ["Diego", "Nico", "Edwin", "Julio", "Horacio", "Sra. Rosa"];
    const RUTAS = ["Ruta 1 (Juan / Julio)", "Ruta 2 (Carlos / Horacio)", "Retiro Bodega / Otra"];
    const USUARIOS_SISTEMA = ["Edwin", "Nico", "Diego", "Bedanli", "Pedro", "Gabriel"];

    const ACCIONES_DISPONIBLES = [
      "Ajustar Inventario en Bodega",
      "Enviar / Reponer Producto al Cliente",
      "Nota de Crédito / Descuento Factura",
      "Chofer Retorna Producto a Bodega"
    ];

    function App() {
      const [incidencias, setIncidencias] = useState([]);
      const [cierres, setCierres] = useState([]);
      const [catalogoProductos, setCatalogoProductos] = useState([]);
      const [historialInventario, setHistorialInventario] = useState([]);
      const [vista, setVista] = useState("dashboard");
      const [conectado, setConectado] = useState(false);
      const [editandoId, setEditandoId] = useState(null);
      const [cierreExpandido, setCierreExpandido] = useState(null);
      const [tarjetasAbiertas, setTarjetasAbiertas] = useState({});

      const [busqueda, setBusqueda] = useState("");
      const [filtroEstado, setFiltroEstado] = useState("todos");
      const [filtroArmador, setFiltroArmador] = useState("todos");
      const [filtroRuta, setFiltroRuta] = useState("todos");

      const hoy = new Date().toISOString().split("T")[0];
      const [factura, setFactura] = useState("");
      const [cliente, setCliente] = useState("");
      const [fecha, setFecha] = useState(hoy);
      const [ruta, setRuta] = useState(RUTAS[0]);
      const [armador, setArmador] = useState(ARMADORES[0]);
      const [registradoPor, setRegistradoPor] = useState("Diego");
      const [motivo, setMotivo] = useState("Faltante");

      const [producto, setProducto] = useState("");
      const [cantidad, setCantidad] = useState(1);
      const [unidad, setUnidad] = useState(UNIDADES[0]);

      const [productoCruce, setProductoCruce] = useState("");
      const [cantidadCruce, setCantidadCruce] = useState(1);
      const [unidadCruce, setUnidadCruce] = useState(UNIDADES[0]);

      const [accionesSeleccionadas, setAccionesSeleccionadas] = useState(["Ajustar Inventario en Bodega"]);
      const [notas, setNotas] = useState("");

      useEffect(() => {
        auth.signInAnonymously().catch(() => {});
        
        const unsubInc = db.collection("incidencias").onSnapshot((snap) => {
          setConectado(true);
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setIncidencias(lista);
        }, () => {});

        const unsubCierres = db.collection("cierres_semanales").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => new Date(b.fechaCierre) - new Date(a.fechaCierre));
          setCierres(lista);
        });

        const unsubCat = db.collection("catalogo_productos").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => a.nombre.localeCompare(b.nombre));
          setCatalogoProductos(lista);
        });

        const unsubHistInv = db.collection("historial_inventario").onSnapshot((snap) => {
          const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setHistorialInventario(lista);
        });

        return () => { unsubInc(); unsubCierres(); unsubCat(); unsubHistInv(); };
      }, []);

      const limpiarFormulario = () => {
        setFactura(""); setCliente(""); setProducto(""); setCantidad(1); setUnidad(UNIDADES[0]);
        setProductoCruce(""); setCantidadCruce(1); setUnidadCruce(UNIDADES[0]); setNotas(""); setEditandoId(null);
        setAccionesSeleccionadas(["Ajustar Inventario en Bodega"]);
      };

      const registrarProductoEnCatalogo = async (nombreProd) => {
        if (!nombreProd || !nombreProd.trim()) return;
        const nombreMayus = nombreProd.trim().toUpperCase();
        const existe = catalogoProductos.some(p => p.nombre === nombreMayus);
        if (!existe) {
          try { await db.collection("catalogo_productos").add({ nombre: nombreMayus }); } catch (err) {}
        }
      };

      const eliminarProductoCatalogo = async (id, e) => {
        e.stopPropagation();
        if (confirm("¿Eliminar este producto del catálogo?")) {
          try { await db.collection("catalogo_productos").doc(id).delete(); } catch (err) { alert(err.message); }
        }
      };

      const toggleAccionForm = (acc) => {
        if (accionesSeleccionadas.includes(acc)) {
          if (accionesSeleccionadas.length === 1) return;
          setAccionesSeleccionadas(accionesSeleccionadas.filter(a => a !== acc));
        } else {
          setAccionesSeleccionadas([...accionesSeleccionadas, acc]);
        }
      };

      const guardarIncidencia = async (e) => {
        e.preventDefault();
        if (!factura.trim() || !producto.trim()) return alert("Completa el Nº de Factura y el Producto.");
        if (motivo === "Cruce" && !productoCruce.trim()) return alert("Indica el producto enviado por error.");

        await registrarProductoEnCatalogo(producto);
        if (motivo === "Cruce" && productoCruce) await registrarProductoEnCatalogo(productoCruce);

        const checksIniciales = {};
        accionesSeleccionadas.forEach(ac => {
          checksIniciales[ac] = { completado: false, por: "", fechaHora: "" };
        });

        const datos = {
          factura: factura.trim(),
          cliente: cliente.trim(),
          fecha,
          ruta,
          armador,
          registradoPor,
          motivo,
          producto: producto.trim().toUpperCase(),
          cantidad: Number(cantidad),
          unidad,
          productoCruce: motivo === "Cruce" ? productoCruce.trim().toUpperCase() : null,
          cantidadCruce: motivo === "Cruce" ? Number(cantidadCruce) : null,
          unidadCruce: motivo === "Cruce" ? unidadCruce : null,
          acciones: accionesSeleccionadas,
          checksAcciones: checksIniciales,
          notas: notas.trim(),
          timestamp: Date.now()
        };

        try {
          if (editandoId) {
            delete datos.timestamp;
            delete datos.checksAcciones;
            await db.collection("incidencias").doc(editandoId).update(datos);
          } else {
            datos.resuelto = false;
            await db.collection("incidencias").add(datos);
          }
          limpiarFormulario();
          setVista("dashboard");
        } catch (err) { alert("Error: " + err.message); }
      };

      const registrarEnHistorialInventario = async (productoNombre, unidadMedida, facturaNum, responsable) => {
        try {
          const colRef = db.collection("historial_inventario");
          await colRef.add({
            producto: productoNombre,
            unidad: unidadMedida,
            factura: facturaNum,
            corregidoPor: responsable,
            fechaHora: new Date().toLocaleString("es-CL"),
            timestamp: Date.now()
          });

          const snapshot = await colRef.where("producto", "==", productoNombre).get();
          const registrosProducto = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          registrosProducto.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

          if (registrosProducto.length > 10) {
            const excess = registrosProducto.slice(6);
            const batch = db.batch();
            excess.forEach(item => {
              batch.delete(colRef.doc(item.id));
            });
            await batch.commit();
          }
        } catch (err) {
          console.error("Error al gestionar historial de inventario:", err);
        }
      };

      const toggleCheckAccion = async (id, accionNombre, estadoActual) => {
        const usuarioActual = prompt("Confirma tu nombre (Edwin, Nico, Diego, Bedanli, Pedro, Gabriel):");
        if (!usuarioActual || !usuarioActual.trim()) return;

        const incidenciaActual = incidencias.find(i => i.id === id);
        if (!incidenciaActual) return;

        const checks = incidenciaActual.checksAcciones || {};
        const ahora = new Date().toLocaleString("es-CL");

        checks[accionNombre] = {
          completado: !estadoActual,
          por: usuarioActual.trim(),
          fechaHora: !estadoActual ? ahora : ""
        };

        if (!estadoActual && accionNombre.includes("Inventario")) {
          await registrarEnHistorialInventario(incidenciaActual.producto, incidenciaActual.unidad, incidenciaActual.factura, usuarioActual.trim());
          if (incidenciaActual.productoCruce) {
            await registrarEnHistorialInventario(incidenciaActual.productoCruce, incidenciaActual.unidadCruce, incidenciaActual.factura, usuarioActual.trim());
          }
        }

        const todasListas = incidenciaActual.acciones.every(ac => checks[ac] && checks[ac].completado);

        try {
          await db.collection("incidencias").doc(id).update({
            checksAcciones: checks,
            resuelto: todasListas ? true : incidenciaActual.resuelto
          });
        } catch (err) { alert("Error al actualizar check: " + err.message); }
      };

      const toggleExpandirTarjeta = (id) => {
        setTarjetasAbiertas(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const cargarParaEditar = (item) => {
        setEditandoId(item.id);
        setFactura(item.factura || ""); setCliente(item.cliente || ""); setFecha(item.fecha || hoy);
        setRuta(item.ruta || RUTAS[0]); setArmador(item.armador || ARMADORES[0]);
        setRegistradoPor(item.registradoPor || "Diego"); setMotivo(item.motivo || "Faltante");
        setProducto(item.producto || ""); setCantidad(item.cantidad || 1); setUnidad(item.unidad || UNIDADES[0]);
        if (item.motivo === "Cruce") {
          setProductoCruce(item.productoCruce || ""); setCantidadCruce(item.cantidadCruce || 1); setUnidadCruce(item.unidadCruce || UNIDADES[0]);
        }
        setAccionesSeleccionadas(item.acciones || [item.accionResolucion || ACCIONES_DISPONIBLES[0]]);
        setNotas(item.notas || "");
        setVista("nuevo"); window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const cambiarEstado = async (id, estadoActual) => {
        await db.collection("incidencias").doc(id).update({ resuelto: !estadoActual });
      };

      const eliminarIncidencia = async (id) => {
        if (confirm("¿Deseas eliminar este registro?")) await db.collection("incidencias").doc(id).delete();
      };

      const cerrarSemana = async () => {
        if (incidencias.length === 0) return alert("No hay incidencias activas.");
        const nombreSemana = prompt("Nombre del cierre (Ej: Semana 09 al 14 Nov):");
        if (!nombreSemana) return;

        try {
          await db.collection("cierres_semanales").add({
            nombreSemana, fechaCierre: new Date().toISOString(), totalRegistros: incidencias.length, registros: incidencias
          });
          const batch = db.batch();
          incidencias.forEach(inc => batch.delete(db.collection("incidencias").doc(inc.id)));
          await batch.commit();
          alert("✅ Semana cerrada y archivada en Historial.");
          setVista("historial");
        } catch (err) { alert("Error: " + err.message); }
      };

      const copiarResumenWhatsApp = () => {
        if (incidencias.length === 0) return alert("Sin incidencias para copiar.");
        let texto = `📦 *REPORTE BODEGA PGB DISTRIBUTION*\n📅 Fecha: ${hoy}\n━━━━━━━━━━━━━━\n`;
        incidencias.forEach((i, idx) => {
          const estado = i.resuelto ? "✅ RESUELTO" : "⏳ PENDIENTE";
          const acs = i.acciones ? i.acciones.join(" + ") : (i.accionResolucion || "N/A");
          texto += `*${idx + 1}. Fact #${i.factura}* (${i.motivo}) - ${estado}\n`;
          texto += `   • Prod: ${i.cantidad} ${i.unidad} de ${i.producto}\n`;
          if (i.motivo === "Cruce" && i.productoCruce) {
            texto += `   • Error: ${i.cantidadCruce} ${i.unidadCruce} de ${i.productoCruce}\n`;
          }
          texto += `   • Armó: ${i.armador} | Registró: ${i.registradoPor || 'N/A'}\n`;
          texto += `   • Acciones: ${acs}\n\n`;
        });
        navigator.clipboard.writeText(texto);
        alert("📋 ¡Reporte copiado para WhatsApp!");
      };

      const kpis = useMemo(() => ({
        total: incidencias.length,
        pendientes: incidencias.filter(i => !i.resuelto).length,
        resueltas: incidencias.filter(i => i.resuelto).length,
        cruces: incidencias.filter(i => i.motivo === "Cruce").length
      }), [incidencias]);

      const incidenciasFiltradas = useMemo(() => {
        return incidencias.filter(item => {
          const coincideTexto = item.factura?.toLowerCase().includes(busqueda.toLowerCase()) || item.producto?.toLowerCase().includes(busqueda.toLowerCase()) || item.cliente?.toLowerCase().includes(busqueda.toLowerCase()) || item.registradoPor?.toLowerCase().includes(busqueda.toLowerCase()) || item.armador?.toLowerCase().includes(busqueda.toLowerCase());
          const coincideEstado = filtroEstado === "todos" ? true : filtroEstado === "pendientes" ? !item.resuelto : item.resuelto;
          const coincideArmador = filtroArmador === "todos" ? true : item.armador === filtroArmador;
          const coincideRuta = filtroRuta === "todos" ? true : item.ruta === filtroRuta;
          return coincideTexto && coincideEstado && coincideArmador && coincideRuta;
        });
      }, [incidencias, busqueda, filtroEstado, filtroArmador, filtroRuta]);

      const resumenInventario = useMemo(() => {
        const mapa = {};
        const sumar = (prod, uni, cant, tipo, fact) => {
          const clave = `${prod}__${uni}`;
          if (!mapa[clave]) mapa[clave] = { producto: prod, unidad: uni, sobranteBodega: 0, faltanteBodega: 0, facturas: [] };
          if (tipo === "SOBRA_EN_BODEGA") mapa[clave].sobranteBodega += cant;
          if (tipo === "FALTA_EN_BODEGA") mapa[clave].faltanteBodega += cant;
          if (!mapa[clave].facturas.includes(fact)) mapa[clave].facturas.push(fact);
        };
        incidencias.forEach(inc => {
          if (inc.motivo === "Faltante") sumar(inc.producto, inc.unidad, inc.cantidad, "SOBRA_EN_BODEGA", inc.factura);
          else if (inc.motivo === "Sobrante") sumar(inc.producto, inc.unidad, inc.cantidad, "FALTA_EN_BODEGA", inc.factura);
          else if (inc.motivo === "Cruce") {
            sumar(inc.producto, inc.unidad, inc.cantidad, "SOBRA_EN_BODEGA", inc.factura);
            if (inc.productoCruce) sumar(inc.productoCruce, inc.unidadCruce, inc.cantidadCruce, "FALTA_EN_BODEGA", inc.factura);
          }
        });
        return Object.values(mapa);
      }, [incidencias]);

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-8 pt-6 pb-28">
          <div className="glass-card rounded-3xl p-6 sm:p-8 mb-6 shadow-2xl relative overflow-hidden">
            <div className="absolute -right-10 -top-10 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-5 relative z-10">
              <div>
                <div className="flex items-center gap-2.5 mb-2">
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                    <span className={`h-2 w-2 rounded-full ${conectado ? 'bg-emerald-400 animate-ping' : 'bg-amber-400'}`}></span>
                    {conectado ? "EN VIVO • FIREBASE" : "CONECTANDO..."}
                  </span>
                  <span className="text-xs text-slate-400 font-medium">PGB Distribution SpA</span>
                </div>
                <h1 className="text-2xl sm:text-4xl font-extrabold tracking-tight text-white">
                  CONTROL DE <span className="text-amber-400">BODEGA</span>
                </h1>
                <p className="text-xs sm:text-sm text-slate-400 mt-1">
                  Supervisión General: <strong className="text-slate-200">Pedro y Bedanli</strong> • Santiago, Chile
                </p>
              </div>

              <div className="flex flex-wrap gap-2.5">
                <button onClick={copiarResumenWhatsApp} className="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm px-4 py-3 rounded-2xl shadow-lg transition">
                  📲 Copiar a WhatsApp
                </button>
                <button onClick={() => { limpiarFormulario(); setVista("nuevo"); }} className="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs sm:text-sm px-5 py-3 rounded-2xl shadow-xl transition">
                  ➕ Registrar Incidencia
                </button>
              </div>
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-6 pt-6 border-t border-slate-800/80">
              <div className="bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4">
                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Registros Activos</span>
                <p className="text-3xl font-black text-white mt-1">{kpis.total}</p>
              </div>
              <div className="bg-amber-500/10 border border-amber-500/20 rounded-2xl p-4">
                <span className="text-xs font-semibold text-amber-300 uppercase tracking-wider">⏳ Pendientes</span>
                <p className="text-3xl font-black text-amber-400 mt-1">{kpis.pendientes}</p>
              </div>
              <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-2xl p-4">
                <span className="text-xs font-semibold text-emerald-300 uppercase tracking-wider">✅ Resueltas</span>
                <p className="text-3xl font-black text-emerald-400 mt-1">{kpis.resueltas}</p>
              </div>
              <div className="bg-purple-500/10 border border-purple-500/20 rounded-2xl p-4">
                <span className="text-xs font-semibold text-purple-300 uppercase tracking-wider">🔄 Cruces de Stock</span>
                <p className="text-3xl font-black text-purple-400 mt-1">{kpis.cruces}</p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-900/80 p-2 rounded-2xl border border-slate-800 mb-6 shadow-md">
            <button onClick={() => setVista("dashboard")} className={`py-3 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition ${vista === "dashboard" ? "bg-amber-500 text-slate-950 shadow" : "text-slate-400 hover:text-white"}`}>
              📋 Tablero Activo ({incidencias.length})
            </button>
            <button onClick={() => setVista("nuevo")} className={`py-3 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition ${vista === "nuevo" ? "bg-amber-500 text-slate-950 shadow" : "text-slate-400 hover:text-white"}`}>
              {editandoId ? "✏️ Editando Factura" : "➕ Nueva Incidencia"}
            </button>
            <button onClick={() => setVista("balance")} className={`py-3 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition ${vista === "balance" ? "bg-amber-500 text-slate-950 shadow" : "text-slate-400 hover:text-white"}`}>
              ⚖️ Cuadratura Bodega ({resumenInventario.length})
            </button>
            <button onClick={() => setVista("historial")} className={`py-3 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition ${vista === "historial" ? "bg-amber-500 text-slate-950 shadow" : "text-slate-400 hover:text-white"}`}>
              📁 Archivo Semanal ({cierres.length})
            </button>
          </div>

          {vista === "dashboard" && (
            <div className="space-y-4">
              <div className="glass-card rounded-2xl p-4 shadow-lg space-y-3">
                <div className="flex flex-col lg:flex-row gap-3">
                  <div className="flex-1">
                    <input type="text" value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="🔍 Buscar por Nº Factura, producto, cliente, armador o quién registró..." className="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-xl px-4 py-3 text-sm text-white outline-none" />
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">

                          <span className="font-black text-white text-sm">{h.producto}</span>
                          <span className="text-slate-400 ml-2">({h.unidad})</span>
                          <span className="bg-slate-900 text-amber-300 px-2 py-0.5 rounded-md ml-2 font-bold">Fact #{h.factura}</span>
                        </div>
                        <div className="text-right">
                          <span className="text-emerald-400 font-bold">Actualizado por {h.corregidoPor}</span>
                          <span className="text-slate-400 block text-[11px]">{h.fechaHora}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {vista === "historial" && (
            <div className="space-y-4 max-w-3xl mx-auto">
              <div className="glass-card rounded-2xl p-5">
                <h2 className="text-lg font-black text-amber-400">📁 Historial de Cierres Semanales</h2>
                <p className="text-xs text-slate-400 mt-1">Registros archivados de semanas anteriores.</p>
              </div>

              {cierres.length === 0 ? (
                <div className="glass-card rounded-2xl p-8 text-center text-sm text-slate-400">
                  Aún no se han archivado semanas cerradas.
                </div>
              ) : (
                cierres.map(c => (
                  <div key={c.id} className="glass-card rounded-2xl p-5">
                    <div onClick={() => setCierreExpandido(cierreExpandido === c.id ? null : c.id)} className="flex justify-between items-center cursor-pointer">
                      <div>
                        <h3 className="font-black text-white text-base">📦 {c.nombreSemana}</h3>
                        <p className="text-xs text-slate-400">Cerrado el {new Date(c.fechaCierre).toLocaleString("es-CL")}</p>
                      </div>
                      <span className="text-xs font-extrabold bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl">
                        {c.totalRegistros} registros {cierreExpandido === c.id ? "▲" : "▼"}
                      </span>
                    </div>

                    {cierreExpandido === c.id && c.registros && (
                      <div className="mt-4 pt-3 border-t border-slate-800 space-y-2">
                        {c.registros.map((r, i) => (
                          <div key={i} className="bg-slate-950 p-3 rounded-xl text-xs flex justify-between items-center">
                            <div>
                              <span className="font-bold text-amber-400">Fact #{r.factura}</span> • <span className="font-bold text-white">{r.motivo}</span>: {r.cantidad} {r.unidad} de {r.producto}
                            </div>
                            <div className="text-slate-400">Armó: {r.armador} | Registró: {r.registradoPor}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
