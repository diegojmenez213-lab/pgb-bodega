<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>NEXUS ERP • Acceso Empresarial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
    .hero-grid {
      background-image:
        linear-gradient(to right, rgba(15, 23, 42, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    @keyframes pulseSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .dot-live { animation: pulseSoft 2.2s infinite; }
  </style>
  <script>
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) {
        window.location.reload();
      }
    });
    window.onerror = function (msg, url, line) {
      var box = document.getElementById("error-fallback");
      if (box) {
        box.style.display = "block";
        box.innerText = "Error detectado (Línea " + line + "): " + msg;
      }
    };
  </script>
</head>
<body class="bg-white text-slate-900 min-h-screen hero-grid flex flex-col selection:bg-slate-900 selection:text-white">
  <!-- Barra superior limpia a juego con presentacion.html -->
  <header class="w-full border-b border-slate-200/80 bg-white/85 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="relative w-8 h-8 rounded-xl bg-slate-950 text-white flex items-center justify-center font-extrabold text-sm tracking-tight shadow-sm select-none">
          <span>N</span>
          <span
            id="nexus-shield-seal"
            aria-hidden="true"
            class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 shadow-xs cursor-default select-none"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-2.5 h-2.5">
              <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/>
            </svg>
          </span>
        </div>
        <a href="presentacion.html" class="leading-none">
          <span class="font-extrabold text-sm tracking-tight text-slate-950 block">NEXUS ERP</span>
          <span class="text-[10px] font-semibold text-slate-500 tracking-wide">CHILE & VENEZUELA • MULTI-EMPRESA</span>
        </a>
      </div>

      <a href="presentacion.html" class="text-xs font-bold text-slate-600 hover:text-slate-950 transition">
        ← Presentación
      </a>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6">
    <div id="error-fallback" style="display:none; background:#fee2e2; color:#991b1b; padding:12px 16px; border-radius:12px; font-size:12px; font-weight:700; margin-bottom:16px; max-width:28rem; width:100%;"></div>
    <div id="root" class="w-full max-w-md"></div>
  </main>

  <footer class="py-5 text-center text-[11px] font-medium text-slate-400">
    NEXUS ERP • Infraestructura aislada multi-empresa • Chile & Venezuela
  </footer>

  <script>
    (function () {
      var seal = document.getElementById("nexus-shield-seal");
      if (!seal) return;
      var taps = 0;
      var timer = null;
      seal.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        taps += 1;
        clearTimeout(timer);
        if (taps >= 3) {
          taps = 0;
          window.location.href = "super-admin.html";
          return;
        }
        timer = setTimeout(function () {
          taps = 0;
        }, 1200);
      });
    })();
  </script>

  <!-- Puente modular aislado para acceso de empresas Venezuela -->
  <script type="module">
    import { db, doc, getDoc, normalizarIdVE } from "./venezuela/core/db.js";
    import { guardarSesionVE } from "./venezuela/core/auth-tenant.js";

    window.NEXUS_VE_AUTH = {
      normalizarIdVE,
      async intentarLoginVenezuela(documentoIngresado, claveIngresada) {
        const idVE = normalizarIdVE(documentoIngresado);
        const snap = await getDoc(doc(db, "empresas", idVE));

        if (!snap.exists()) {
          return { ok: false, status: 404, error: "RIF / Cédula o clave de acceso incorrectos." };
        }

        const empresa = snap.data();
        if (empresa.pais !== "VE") {
          return { ok: false, status: 404, error: "Esta empresa no pertenece al entorno Venezuela." };
        }

        if (empresa.activo === false) {
          return { ok: false, status: 403, error: "Esta cuenta se encuentra suspendida." };
        }

        if (String(empresa.claveAcceso || "") !== String(claveIngresada || "")) {
          return { ok: false, status: 401, error: "RIF / Cédula o clave de acceso incorrectos." };
        }

        sessionStorage.clear();
        guardarSesionVE({
          tenantId: snap.id,
          nombreEmpresa: empresa.nombre || snap.id,
          usuario: "Administrador",
          rol: "dueno"
        });

        window.location.replace("./venezuela/index.html");
        return { ok: true };
      }
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const NEXUS_API_BASE = "https://pgb-bodega.vercel.app/api";
    const RUT_PGB = "769497226";

    const esInputVenezuela = (val) => /^[VEJGP]/i.test(String(val || "").trim());

    const formatearDocVE = (raw) => {
      const s = String(raw || "").toUpperCase().replace(/[^VEJGP0-9-]/g, "");
      if (!s) return "";
      const letra = s[0];
      if (!/[VEJGP]/.test(letra)) return s;
      const resto = s.slice(1).replace(/[^0-9]/g, "");
      if (!resto) return letra;
      if ((letra === "J" || letra === "G") && resto.length > 8) {
        return `${letra}-${resto.slice(0, 8)}-${resto.slice(8, 9)}`;
      }
      return `${letra}-${resto.slice(0, 9)}`;
    };

    const validarDocVE = (val) => {
      const s = String(val || "").trim().toUpperCase();
      return /^[VEJGP]-\d{6,9}(-\d)?$/.test(s);
    };

    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase().slice(0, 9);
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    // VALIDADOR OFICIAL DE RUT CHILENO (MÓDULO 11)
    const validarRutChileno = (rut) => {
      const limpio = limpiarRut(rut);
      if (limpio.length < 7 || limpio.length > 9) return false;
      const cuerpo = limpio.slice(0, -1);
      const dv = limpio.slice(-1);
      if (!/^\d+$/.test(cuerpo)) return false;
      let suma = 0;
      let multiplo = 2;
      for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo.charAt(i), 10) * multiplo;
        multiplo = multiplo < 7 ? multiplo + 1 : 2;
      }
      const dvEsperado = 11 - (suma % 11);
      const dvCalc = dvEsperado === 11 ? "0" : dvEsperado === 10 ? "K" : String(dvEsperado);
      return dv === dvCalc;
    };

    function LoginNexusApp() {
      const [docInput, setDocInput] = useState("");
      const [claveInput, setClaveInput] = useState("");
      const [verClave, setVerClave] = useState(false);
      const [cargando, setCargando] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");
      const [intentosFallidos, setIntentosFallidos] = useState(0);
      const [bloqueoHastaTs, setBloqueoHastaTs] = useState(0);
      const [segundosRestantes, setSegundosRestantes] = useState(0);

      const loginLockRef = useRef(false);

      useEffect(() => {
        sessionStorage.removeItem("nexus_admin_ok");
      }, []);

      // Contador visual de pausa preventiva si excedió 5 intentos fallidos
      useEffect(() => {
        if (!bloqueoHastaTs) return;
        const tick = () => {
          const diff = Math.ceil((bloqueoHastaTs - Date.now()) / 1000);
          if (diff <= 0) {
            setBloqueoHastaTs(0);
            setSegundosRestantes(0);
            setIntentosFallidos(0);
          } else {
            setSegundosRestantes(diff);
          }
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, [bloqueoHastaTs]);

      const registrarFalloAcceso = (mensaje) => {
        const nuevos = intentosFallidos + 1;
        setIntentosFallidos(nuevos);
        if (nuevos >= 5) {
          setBloqueoHastaTs(Date.now() + 30000);
          setErrorMsg("Demasiados intentos fallidos. Espera 30 segundos antes de volver a intentar.");
        } else {
          setErrorMsg(mensaje);
        }
      };

      const manejarCambioDocumento = (valor) => {
        if (esInputVenezuela(valor)) {
          setDocInput(formatearDocVE(valor));
        } else {
          setDocInput(formatearRut(valor));
        }
      };

      const ingresarEmpresa = async (e) => {
        e.preventDefault();
        if (loginLockRef.current) return;

        if (bloqueoHastaTs > Date.now()) {
          setErrorMsg(`Acceso pausado temporalmente. Intenta en ${segundosRestantes}s.`);
          return;
        }

        setErrorMsg("");
        const esVE = esInputVenezuela(docInput);

        if (esVE) {
          if (!validarDocVE(docInput)) {
            setErrorMsg("Ingresa una Cédula o RIF venezolano válido (Ej: J-50343856-8 o V-20504570).");
            return;
          }

          if (!window.NEXUS_VE_AUTH) {
            setErrorMsg("Módulo de acceso Venezuela cargando. Intenta de nuevo en un segundo.");
            return;
          }

          loginLockRef.current = true;
          setCargando(true);
          try {
            const resVE = await window.NEXUS_VE_AUTH.intentarLoginVenezuela(docInput, claveInput.trim());
            if (!resVE.ok) {
              if (resVE.status === 401 || resVE.status === 404) {
                registrarFalloAcceso(resVE.error);
              } else {
                setErrorMsg(resVE.error || "No se pudo validar el acceso en este momento.");
              }
            }
          } catch (err) {
            if (!navigator.onLine) {
              setErrorMsg("Sin conexión a internet. Verifica tu señal e intenta nuevamente.");
            } else {
              setErrorMsg("Error de conexión con Firestore. Verifica la configuración de db.js.");
            }
          } finally {
            setCargando(false);
            loginLockRef.current = false;
          }
          return;
        }

        // Flujo Chile (intacto)
        const rutLimpio = limpiarRut(docInput);
        if (rutLimpio.length < 7) {
          setErrorMsg("Ingresa un RUT chileno o Cédula/RIF venezolano válido.");
          return;
        }

        loginLockRef.current = true;
        setCargando(true);
        try {
          const resp = await fetch(`${NEXUS_API_BASE}/auth/login-empresa`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              rut: rutLimpio,
              clave: claveInput.trim()
            })
          });

          const data = await resp.json().catch(() => ({}));

          if (!resp.ok || !data.ok) {
            // Respaldo silencioso por si ingresaron una cédula venezolana solo con números
            if (resp.status === 404 && /^\d{6,9}$/.test(rutLimpio) && window.NEXUS_VE_AUTH) {
              const resVE = await window.NEXUS_VE_AUTH.intentarLoginVenezuela(rutLimpio, claveInput.trim());
              if (resVE.ok) return;
              if (resVE.status === 401 || resVE.status === 403) {
                if (resVE.status === 401) registrarFalloAcceso(resVE.error);
                else setErrorMsg(resVE.error);
                return;
              }
            }

            if (resp.status === 401 || resp.status === 404) {
              registrarFalloAcceso(data.error || "Documento o clave de acceso incorrectos.");
            } else {
              setErrorMsg(data.error || "No se pudo validar el acceso en este momento.");
            }
            return;
          }

          const rutFinal = limpiarRut(data.rutEmpresa || rutLimpio);

          // Sesión aislada por RUT + token firmado para Bóveda AES-256 automática
          sessionStorage.clear();
          if (data.sessionToken) {
            sessionStorage.setItem(`nexus_session_token_${rutFinal}`, data.sessionToken);
          }
          localStorage.setItem("nexus_empresa_rut", rutFinal);
          localStorage.setItem("nexus_session_ts", String(Date.now()));

          if (data.esPgb || rutFinal === RUT_PGB) {
            window.location.replace("pgb-operacion.html");
          } else {
            window.location.replace("empresa-panel.html");
          }
        } catch (err) {
          if (!navigator.onLine) {
            setErrorMsg("Sin conexión a internet. Verifica tu señal e intenta nuevamente.");
          } else {
            setErrorMsg("Error de conexión con el servidor. Intenta de nuevo en unos segundos.");
          }
        } finally {
          setCargando(false);
          loginLockRef.current = false;
        }
      };

      const modoVE = esInputVenezuela(docInput);
      const rutLimpioActual = limpiarRut(docInput);
      const bloqueadoAhora = segundosRestantes > 0;

      return (
        <div className="bg-white border border-slate-200/90 rounded-3xl p-7 sm:p-9 shadow-2xl shadow-slate-900/5 space-y-6">
          <div className="text-center space-y-2">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-100 border border-slate-200/80 text-[10px] font-extrabold uppercase tracking-wider text-slate-700">
              <span className="w-2 h-2 rounded-full bg-emerald-500 dot-live"></span>
              Acceso Seguro • Bóveda AES-256
            </div>
            <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-950 pt-1">
              Portal Corporativo
            </h1>
            <p className="text-xs sm:text-sm text-slate-500 font-medium">
              Ingresa tu RUT (Chile) o Cédula / RIF (Venezuela) para entrar a tu entorno privado.
            </p>
          </div>

          {errorMsg && (
            <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold p-3.5 rounded-2xl text-center">
              {errorMsg}
            </div>
          )}

          <form onSubmit={ingresarEmpresa} className="space-y-4">
            <div>
              <label className="text-xs font-bold text-slate-700 block mb-1.5">RUT / Cédula o RIF *</label>
              <input
                type="text"
                value={docInput}
                onChange={(e) => manejarCambioDocumento(e.target.value)}
                placeholder="Ej: 77.528.042-5 o J-50343856-8"
                autoComplete="username"
                className="w-full bg-slate-50 border border-slate-300 focus:border-slate-950 focus:bg-white rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-950 placeholder:text-slate-400 outline-none transition"
                required
              />
              {modoVE && docInput.length >= 3 && (
                <p className={`text-[11px] font-bold mt-1.5 px-1 ${validarDocVE(docInput) ? "text-emerald-600" : "text-slate-500"}`}>
                  {validarDocVE(docInput)
                    ? "✓ Formato Cédula / RIF Venezuela detectado"
                    : "Ingresa prefijo y números (Ej: J-50343856-8 o V-20504570)"}
                </p>
              )}
              {!modoVE && rutLimpioActual.length >= 7 && (
                <p className={`text-[11px] font-bold mt-1.5 px-1 ${validarRutChileno(rutLimpioActual) ? "text-emerald-600" : "text-amber-600"}`}>
                  {validarRutChileno(rutLimpioActual)
                    ? "✓ Formato de RUT chileno verificado"
                    : "⚠️ Revisa el dígito verificador del RUT"}
                </p>
              )}
            </div>

            <div>
              <label className="text-xs font-bold text-slate-700 block mb-1.5">Clave de Acceso</label>
              <div className="relative">
                <input
                  type={verClave ? "text" : "password"}
                  value={claveInput}
                  onChange={(e) => setClaveInput(e.target.value)}
                  placeholder="Ingresa tu clave empresarial"
                  autoComplete="current-password"
                  className="w-full bg-slate-50 border border-slate-300 focus:border-slate-950 focus:bg-white rounded-2xl pl-4 pr-16 py-3.5 text-sm font-bold text-slate-950 placeholder:text-slate-400 outline-none transition"
                />
                <button
                  type="button"
                  onClick={() => setVerClave(!verClave)}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-bold text-slate-500 hover:text-slate-950 px-2 py-1 cursor-pointer"
                >
                  {verClave ? "Ocultar" : "Ver"}
                </button>
              </div>
            </div>

            <button
              type="submit"
              disabled={cargando || bloqueadoAhora}
              className="w-full bg-slate-950 hover:bg-slate-800 disabled:opacity-40 text-white font-extrabold py-4 rounded-2xl text-xs uppercase tracking-wider shadow-lg shadow-slate-950/15 transition cursor-pointer"
            >
              {cargando
                ? "Verificando Acceso..."
                : bloqueadoAhora
                  ? `Espera ${segundosRestantes}s...`
                  : modoVE
                    ? "Ingresar a Entorno Venezuela →"
                    : "Ingresar a mi Empresa →"}
            </button>
          </form>

          <div className="pt-4 border-t border-slate-100 flex items-center justify-center text-[11px] text-slate-400 font-medium">
            <span className="font-mono-tech text-[10px]">AISLAMIENTO POR RUT / RIF • SESIÓN CIFRADA</span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<LoginNexusApp />);
  </script>
</body>
</html>
