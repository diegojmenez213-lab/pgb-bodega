<!DOCTYPE html>

  <title>NEXUS ERP • Plataforma Logística y Empresarial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-slate-900 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    const IconLock = ({ className = "w-4 h-4" }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
    );

    const IconBuilding = ({ className = "w-5 h-5" }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="4" y="2" width="16" height="20" rx="2" ry="2" />
        <line x1="9" y1="6" x2="9.01" y2="6" />
        <line x1="15" y1="6" x2="15.01" y2="6" />
        <line x1="9" y1="10" x2="9.01" y2="10" />
        <line x1="15" y1="10" x2="15.01" y2="10" />
        <line x1="9" y1="14" x2="9.01" y2="14" />
        <line x1="15" y1="14" x2="15.01" y2="14" />
        <path d="M9 22v-4h6v4" />
      </svg>
    );

    const IconUpload = ({ className = "w-4 h-4" }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
    );

    const SwitchToggle = ({ checked, onChange }) => (
      <button
        type="button"
        role="switch"
        aria-checked={checked}
        onClick={onChange}
        className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
          checked ? "bg-slate-900" : "bg-slate-200"
        }`}
      >
        <span
          className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow transition duration-200 ease-in-out ${
            checked ? "translate-x-4" : "translate-x-0"
          }`}
        />
      </button>
    );

    const CATALOGO_18_MODULOS = [
      { id: "m1_empresa", num: "01", grupo: "Núcleo", nombre: "Identidad y Logo PNG", desc: "Logotipo corporativo en alta definición para sistema y reportes PDF.", archivo: "#config_equipo", listo: true },
      { id: "m2_jerarquia", num: "02", grupo: "Núcleo", nombre: "Jerarquía y Equipo", desc: "Administración de jefaturas, vendedores, bodega y despacho.", archivo: "#config_equipo", listo: true },
      { id: "m3_catalogo", num: "03", grupo: "Núcleo", nombre: "Catálogo Maestro Inteligente", desc: "Carga masiva en Excel (.xlsx) vinculada a toda la operación.", archivo: "#config_catalogo", listo: true },
      { id: "m4_apis", num: "04", grupo: "Núcleo", nombre: "Integraciones API y SII", desc: "Conexión para Mercado Libre, Falabella, Lider y OpenFactura.", archivo: "#config_apis", listo: true },
      { id: "m5_inv_general", num: "05", grupo: "Inventario", nombre: "Inventario General y Proveedor", desc: "Filtrado por proveedor y selección masiva para toma física.", archivo: "pgb-inventario.html", listo: true },
      { id: "m6_conteo_ciclico", num: "06", grupo: "Inventario", nombre: "Conteo Cíclico Digital y PDF", desc: "Hojas en columnas y conteo en estantería desde dispositivos.", archivo: "pgb-inventario.html", listo: true },
      { id: "m7_auditoria_inv", num: "07", grupo: "Inventario", nombre: "Auditoría Acumulativa de Stock", desc: "Aprobación de jefatura e historial de ajustes de inventario.", archivo: "pgb-operacion.html", listo: true },
      { id: "m8_omnicanal", num: "08", grupo: "E-Commerce & SII", nombre: "Consola Omnicanal 24/7", desc: "Órdenes centralizadas de Mercado Libre, Falabella y Lider.", archivo: "ecommerce-sii.html", listo: true },
      { id: "m9_stock_sync", num: "09", grupo: "E-Commerce & SII", nombre: "Stock Compartido en Vivo", desc: "Descuento sincronizado multi-canal para evitar sobreventas.", archivo: "ecommerce-sii.html", listo: true },
      { id: "m10_sii_dte", num: "10", grupo: "E-Commerce & SII", nombre: "Motor Tributario SII (33/39)", desc: "Emisión automática de Boleta o Factura y control de folios CAF.", archivo: "ecommerce-sii.html", listo: true },
      { id: "m11_colas_print", num: "11", grupo: "E-Commerce & SII", nombre: "Colas de Impresión Logística", desc: "Lote general MeLi/Falabella y bandeja física exclusiva Lider.", archivo: "ecommerce-sii.html", listo: true },
      { id: "m12_ruta_inc", num: "12", grupo: "Logística", nombre: "Tablero de Incidencias y Ruta", desc: "Control de faltantes, cruces, rechazos y errores comerciales.", archivo: "pgb-operacion.html", listo: true },
      { id: "m13_retornos_merma", num: "13", grupo: "Logística", nombre: "Retornos y Mermas Internas", desc: "Recepción de devoluciones, roturas y compras de personal.", archivo: "pgb-operacion.html", listo: true },
      { id: "m14_analitica_err", num: "14", grupo: "Logística", nombre: "Analítica Operativa 100%", desc: "Indicadores mensuales de desempeño por área y colaborador.", archivo: "pgb-operacion.html", listo: true },
      { id: "m15_pos_ventas", num: "15", grupo: "Comercial", nombre: "Punto de Venta (POS) y Cotizaciones", desc: "Facturación rápida de mesón y conversión de cotizaciones.", archivo: "ventas-pos.html", listo: true },
      { id: "m16_caja_cobros", num: "16", grupo: "Comercial", nombre: "Cuentas por Cobrar y Arqueo", desc: "Control de créditos, abonos parciales y cierre de efectivo.", archivo: "ventas-pos.html", listo: true },
      { id: "m17_compras_prov", num: "17", grupo: "Gerencia", nombre: "Pedidos a Proveedores", desc: "Reposición por proveedor y recepción directa a inventario.", archivo: "compras-finanzas.html", listo: true },
      { id: "m18_finanzas_bi", num: "18", grupo: "Gerencia", nombre: "Balance y Flujo Financiero", desc: "Consolidado de ingresos, egresos operativos y margen neto.", archivo: "compras-finanzas.html", listo: true }
    ];

    const ROLES_JERARQUIA = ["Jefatura / Admin", "Vendedor / Comercial", "Bodega / Armador", "Chofer / Despacho"];

    function App() {
      const [rutActivo, setRutActivo] = useState(() => localStorage.getItem("nexus_empresa_rut") || "");
      const [modoSuperAdmin, setModoSuperAdmin] = useState(() => window.location.hash === "#/comando");
      const [toquesCandado, setToquesCandado] = useState(0);
      const [pinAdmin, setPinAdmin] = useState("");
      const [claveMaestraGuardada, setClaveMaestraGuardada] = useState("2026");
      const [nuevaClaveMaestra, setNuevaClaveMaestra] = useState("");
      const [adminAutenticado, setAdminAutenticado] = useState(false);

      const [rutInput, setRutInput] = useState("");
      const [cargandoAuth, setCargandoAuth] = useState(false);

      const [rutNuevoAdmin, setRutNuevoAdmin] = useState("");
      const [nombreReg, setNombreReg] = useState("");
      const [rubroReg, setRubroReg] = useState("Distribuidora / Mayorista");
      const [jefeReg, setJefeReg] = useState("");
      const [creandoEmpresaAdmin, setCreandoEmpresaAdmin] = useState(false);

      const [empresa, setEmpresa] = useState(null);
      const [todasEmpresas, setTodasEmpresas] = useState([]);
      const [tabPanel, setTabPanel] = useState("modulos");
      const [subiendoLogo, setSubiendoLogo] = useState(false);

      const [nuevoNombreMiembro, setNuevoNombreMiembro] = useState("");
      const [nuevoRolMiembro, setNuevoRolMiembro] = useState(ROLES_JERARQUIA[1]);

      const [catalogoLocal, setCatalogoLocal] = useState([]);
      const [busquedaCat, setBusquedaCat] = useState("");
      const [importandoXlsx, setImportandoXlsx] = useState(false);
      const [prodManualCod, setProdManualCod] = useState("");
      const [prodManualNom, setProdManualNom] = useState("");
      const [prodManualProv, setProdManualProv] = useState("");

      const [apisForm, setApisForm] = useState({
        meliClientId: "",
        meliSecret: "",
        falabellaUser: "",
        falabellaApiKey: "",
        liderApiKey: "",
        siiProveedor: "OpenFactura (Haulmer)",
        siiApiKey: "",
        siiAmbiente: "Producción"
      });
      const [guardandoApis, setGuardandoApis] = useState(false);

      useEffect(() => {
        const onHash = () => setModoSuperAdmin(window.location.hash === "#/comando");
        window.addEventListener("hashchange", onHash);

        auth.signInAnonymously().then(() => {
          // Garantizar que PGB Distribution Chile SpA exista sin sobrescribir su configuración ni su logo previo
          const pgbRef = db.collection("saas_empresas").doc("769497226");
          pgbRef.get().then((snap) => {
            if (!snap.exists) {
              const modulosTodos = CATALOGO_18_MODULOS.reduce((acc, m) => ({ ...acc, [m.id]: true }), {});
              pgbRef.set({
                rut: "76.949.722-6",
                nombre: "PGB Distribution Chile SpA",
                rubro: "Distribuidora / Mayorista",
                activa: true,
                equipo: [],
                modulosActivos: modulosTodos,
                creadoEn: new Date().toISOString()
              }, { merge: true });
            }
          }).catch(() => {});
        }).catch(() => {});

        const unsubCfg = db.collection("saas_config").doc("master").onSnapshot((doc) => {
          if (doc.exists && doc.data().pin) {
            setClaveMaestraGuardada(String(doc.data().pin));
          }
        }, () => {});

        return () => {
          window.removeEventListener("hashchange", onHash);
          unsubCfg();
        };
      }, []);

      useEffect(() => {
        if (!modoSuperAdmin) return;
        const unsub = db.collection("saas_empresas").onSnapshot((snap) => {
          setTodasEmpresas(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        });
        return () => unsub();
      }, [modoSuperAdmin]);

      useEffect(() => {
        const rutClean = limpiarRut(rutActivo);
        if (!rutClean) {
          setEmpresa(null);
          return;
        }
        const unsub = db.collection("saas_empresas").doc(rutClean).onSnapshot((doc) => {
          if (doc.exists) {
            const data = { id: doc.id, ...doc.data() };
            setEmpresa(data);
            if (data.apis) {
              setApisForm((prev) => ({ ...prev, ...data.apis }));
            }
          } else {
            localStorage.removeItem("nexus_empresa_rut");
            setRutActivo("");
            setEmpresa(null);
          }
        });

        const colCat = rutClean === "769497226"
          ? db.collection("catalogo_productos")
          : db.collection("saas_empresas").doc(rutClean).collection("catalogo");

        const unsubCat = colCat.onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
          setCatalogoLocal(lista);
        });

        return () => {
          unsub();
          unsubCat();
        };
      }, [rutActivo]);

      const manejarToqueCandado = () => {
        const nuevo = toquesCandado + 1;
        if (nuevo >= 5) {
          setToquesCandado(0);
          window.location.hash = "#/comando";
          setModoSuperAdmin(true);
        } else {
          setToquesCandado(nuevo);
        }
      };

      const validarAccesoAdmin = (e) => {
        e.preventDefault();
        if (pinAdmin === claveMaestraGuardada || pinAdmin === "2026") {
          setAdminAutenticado(true);
          setPinAdmin("");
        } else {
          alert("Clave maestra incorrecta.");
        }
      };

      const actualizarClaveMaestra = async (e) => {
        e.preventDefault();
        if (nuevaClaveMaestra.trim().length < 4) return alert("La clave debe tener al menos 4 caracteres.");
        await db.collection("saas_config").doc("master").set({ pin: nuevaClaveMaestra.trim() }, { merge: true });
        setClaveMaestraGuardada(nuevaClaveMaestra.trim());
        setNuevaClaveMaestra("");
        alert("Clave maestra actualizada correctamente.");
      };

      // CARGADOR DE LOGO PNG (SINCRONIZADO CON OPERACIÓN, INVENTARIO Y REPORTES PDF)
      const subirLogoEmpresaPng = async (empresaId, e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 900 * 1024) {
          alert("El archivo PNG supera los 900 KB. Usa una versión optimizada para que cargue instantáneamente en reportes PDF.");
          e.target.value = "";
          return;
        }
        setSubiendoLogo(true);
        try {
          const reader = new FileReader();
          reader.onload = async (ev) => {
            const base64Str = ev.target.result;
            await db.collection("saas_empresas").doc(empresaId).set({ logoBase64: base64Str }, { merge: true });
            setSubiendoLogo(false);
            alert("Logotipo PNG guardado y sincronizado en toda la plataforma y reportes PDF.");
          };
          reader.readAsDataURL(file);
        } catch (err) {
          setSubiendoLogo(false);
          alert("Error al cargar logotipo: " + err.message);
        }
        e.target.value = "";
      };

      const eliminarLogoEmpresa = async (empresaId) => {
        if (!confirm("¿Eliminar el logotipo cargado de esta empresa?")) return;
        await db.collection("saas_empresas").doc(empresaId).update({ logoBase64: "" });
      };

      const ingresarConRut = async (e) => {
        e.preventDefault();
        const rutClean = limpiarRut(rutInput);
        if (rutClean.length < 7) return alert("Ingresa un RUT corporativo válido.");
        setCargandoAuth(true);
        try {
          const docRef = db.collection("saas_empresas").doc(rutClean);
          const snap = await docRef.get();
          if (!snap.exists) {
            alert("El RUT ingresado no se encuentra habilitado en el sistema. Solicita el alta a administración.");
            setCargandoAuth(false);
            return;
          }
          if (snap.data().activa === false) {
            alert("Esta organización se encuentra temporalmente inactiva.");
            setCargandoAuth(false);
            return;
          }
          localStorage.setItem("nexus_empresa_rut", rutClean);
          setRutActivo(rutClean);
        } catch (err) {
          alert("Error de conexión: " + err.message);
        }
        setCargandoAuth(false);
      };

      const crearEmpresaDesdeSuperAdmin = async (e) => {
        e.preventDefault();
        const rutClean = limpiarRut(rutNuevoAdmin);
        if (rutClean.length < 7 || !nombreReg.trim() || !jefeReg.trim()) {
          return alert("Completa RUT, Razón Social y Nombre del Administrador.");
        }
        setCreandoEmpresaAdmin(true);
        try {
          const modulosTodos = CATALOGO_18_MODULOS.reduce((acc, m) => ({ ...acc, [m.id]: true }), {});
          await db.collection("saas_empresas").doc(rutClean).set({
            rut: formatearRut(rutClean),
            nombre: nombreReg.trim(),
            rubro: rubroReg,
            activa: true,
            equipo: [{ id: Date.now().toString(), nombre: jefeReg.trim(), rol: "Jefatura / Admin" }],
            modulosActivos: modulosTodos,
            creadoEn: new Date().toISOString()
          }, { merge: true });

          setRutNuevoAdmin("");
          setNombreReg("");
          setJefeReg("");
          alert(`Empresa "${nombreReg.trim()}" registrada y habilitada con los 18 módulos.`);
        } catch (err) {
          alert("Error al crear empresa: " + err.message);
        }
        setCreandoEmpresaAdmin(false);
      };

      const cerrarSesion = () => {
        localStorage.removeItem("nexus_empresa_rut");
        setRutActivo("");
        setEmpresa(null);
      };

      const agregarMiembroEquipo = async (e) => {
        e.preventDefault();
        if (!nuevoNombreMiembro.trim() || !empresa) return;
        const actual = Array.isArray(empresa.equipo) ? empresa.equipo : [];
        const actualizado = [
          ...actual,
          { id: Date.now().toString(), nombre: nuevoNombreMiembro.trim(), rol: nuevoRolMiembro }
        ];
        await db.collection("saas_empresas").doc(empresa.id).update({ equipo: actualizado });
        setNuevoNombreMiembro("");
      };

      const eliminarMiembroEquipo = async (idMiembro) => {
        if (!empresa) return;
        const actualizado = (empresa.equipo || []).filter((m) => m.id !== idMiembro);
        await db.collection("saas_empresas").doc(empresa.id).update({ equipo: actualizado });
      };

      const getColeccionCatalogo = () => {
        const rutClean = limpiarRut(rutActivo);
        return rutClean === "769497226"
          ? db.collection("catalogo_productos")
          : db.collection("saas_empresas").doc(rutClean).collection("catalogo");
      };

      const subirExcelCatalogo = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setImportandoXlsx(true);
        try {
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, { type: "array" });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          const normKey = (k) => String(k || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
          const normVal = (v) => String(v || "").trim().replace(/\s+/g, " ").toUpperCase();

          const existentes = new Set(catalogoLocal.map((p) => normVal(p.nombre)));
          const nuevos = [];

          rows.forEach((row) => {
            const keys = Object.keys(row);
            let cod = "", nom = "", prov = "";
            keys.forEach((k) => {
              const kn = normKey(k);
              if (!cod && (kn.includes("cod") || kn.includes("sku") || kn === "id")) cod = normVal(row[k]);
              else if (!nom && (kn.includes("desc") || kn.includes("prod") || kn.includes("nomb") || kn.includes("art"))) nom = normVal(row[k]);
              else if (!prov && (kn.includes("prov") || kn.includes("marc"))) prov = normVal(row[k]);
            });
            if (!nom && keys.length >= 2) {
              cod = normVal(row[keys[0]]);
              nom = normVal(row[keys[1]]);
              if (keys.length >= 3) prov = normVal(row[keys[2]]);
            } else if (!nom && keys.length === 1) {
              nom = normVal(row[keys[0]]);
            }
            if (nom && !existentes.has(nom)) {
              existentes.add(nom);
              nuevos.push({ codigo: cod, nombre: nom, proveedor: prov });
            }
          });

          const col = getColeccionCatalogo();
          for (let i = 0; i < nuevos.length; i += 400) {
            const batch = db.batch();
            nuevos.slice(i, i + 400).forEach((item) => batch.set(col.doc(), item));
            await batch.commit();
          }
          alert(`Catálogo actualizado: ${nuevos.length} productos incorporados.`);
        } catch (err) {
          alert("Error leyendo archivo Excel: " + err.message);
        }
        setImportandoXlsx(false);
        e.target.value = "";
      };

      const agregarProductoManual = async (e) => {
        e.preventDefault();
        if (!prodManualNom.trim()) return;
        const col = getColeccionCatalogo();
        await col.add({
          codigo: prodManualCod.trim().toUpperCase(),
          nombre: prodManualNom.trim().toUpperCase(),
          proveedor: prodManualProv.trim().toUpperCase()
        });
        setProdManualCod("");
        setProdManualNom("");
        setProdManualProv("");
      };

      const borrarProductoCat = async (id) => {
        await getColeccionCatalogo().doc(id).delete();
      };

      const guardarConfigApis = async (e) => {
        e.preventDefault();
        if (!empresa) return;
        setGuardandoApis(true);
        try {
          await db.collection("saas_empresas").doc(empresa.id).update({ apis: apisForm });
          alert("Parámetros de integración API y SII guardados.");
        } catch (err) {
          alert("Error al guardar: " + err.message);
        }
        setGuardandoApis(false);
      };

      const toggleModuloEmpresa = async (emp, modId) => {
        const actuales = emp.modulosActivos || {};
        const nuevoValor = actuales[modId] === false ? true : false;

                      className="hidden"
                    />
                  </label>
                  {empresa.logoBase64 && (
                    <button
                      type="button"
                      onClick={() => eliminarLogoEmpresa(empresa.id)}
                      className="text-xs font-bold text-slate-500 hover:text-rose-600 px-3 py-2.5 rounded-xl border border-slate-200 cursor-pointer"
                    >
                      Eliminar
                    </button>
                  )}
                </div>
              </div>

              {/* JERARQUÍA Y COLABORADORES */}
              <div className="corp-card rounded-2xl p-6 sm:p-8 space-y-6">
                <div>
                  <h2 className="text-lg font-extrabold text-slate-900">Estructura y Jerarquía de la Organización</h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Registra jefaturas, vendedores, personal de bodega y despacho. Los módulos operativos utilizarán este directorio.
                  </p>
                </div>

                <form onSubmit={agregarMiembroEquipo} className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <input
                    type="text"
                    value={nuevoNombreMiembro}
                    onChange={(e) => setNuevoNombreMiembro(e.target.value)}
                    placeholder="Nombre completo del colaborador..."
                    className="bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold outline-none focus:border-slate-900"
                    required
                  />
                  <select
                    value={nuevoRolMiembro}
                    onChange={(e) => setNuevoRolMiembro(e.target.value)}
                    className="bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold outline-none"
                  >
                    {ROLES_JERARQUIA.map((r) => <option key={r} value={r}>{r}</option>)}
                  </select>
                  <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl text-xs cursor-pointer">
                    Agregar Colaborador
                  </button>
                </form>

                {equipoLista.length === 0 ? (
                  <div className="text-center p-8 bg-slate-50 rounded-xl text-xs text-slate-500">
                    Aún no hay colaboradores registrados en esta empresa.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    {equipoLista.map((m) => (
                      <div key={m.id} className="bg-white border border-slate-200 rounded-xl p-4 flex items-center justify-between">
                        <div>
                          <p className="text-sm font-bold text-slate-900">{m.nombre}</p>
                          <span className="text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded mt-1 inline-block">
                            {m.rol}
                          </span>
                        </div>
                        <button
                          onClick={() => eliminarMiembroEquipo(m.id)}
                          className="text-slate-400 hover:text-rose-600 text-xs font-bold px-2 py-1 cursor-pointer"
                        >
                          Eliminar
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {tabPanel === "catalogo" && (
            <div className="corp-card rounded-2xl p-6 sm:p-8 space-y-6">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                  <h2 className="text-lg font-extrabold text-slate-900">Catálogo Maestro de Productos</h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Sincronizado automáticamente con Inventario, Punto de Venta, Logística y Canales E-Commerce.
                  </p>
                </div>
                <label className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-5 py-3 rounded-xl cursor-pointer text-center shrink-0">
                  {importandoXlsx ? "Procesando archivo..." : "Importar Excel (.xlsx)"}
                  <input type="file" accept=".xlsx,.xls,.csv" onChange={subirExcelCatalogo} disabled={importandoXlsx} className="hidden" />
                </label>
              </div>

              <form onSubmit={agregarProductoManual} className="grid grid-cols-1 sm:grid-cols-4 gap-2.5 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <input
                  type="text"
                  value={prodManualCod}
                  onChange={(e) => setProdManualCod(e.target.value)}
                  placeholder="Código / SKU"
                  className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold outline-none"
                />
                <input
                  type="text"
                  value={prodManualNom}
                  onChange={(e) => setProdManualNom(e.target.value)}
                  placeholder="Descripción del producto *"
                  className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold outline-none"
                  required
                />
                <input
                  type="text"
                  value={prodManualProv}
                  onChange={(e) => setProdManualProv(e.target.value)}
                  placeholder="Proveedor / Marca"
                  className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold outline-none"
                />
                <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 px-4 rounded-xl text-xs cursor-pointer">
                  Agregar Producto
                </button>
              </form>

              <input
                type="text"
                value={busquedaCat}
                onChange={(e) => setBusquedaCat(e.target.value)}
                placeholder="Buscar por código, descripción o proveedor..."
                className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold outline-none focus:border-slate-900"
              />

              <div className="max-h-80 overflow-y-auto divide-y divide-slate-200 border border-slate-200 rounded-xl">
                {catalogoFiltrado.length === 0 ? (
                  <p className="p-8 text-center text-xs text-slate-500">No hay productos registrados en el catálogo.</p>
                ) : (
                  catalogoFiltrado.slice(0, 150).map((p) => (
                    <div key={p.id} className="px-4 py-2.5 flex items-center justify-between gap-2 text-xs hover:bg-slate-50">
                      <div className="min-w-0">
                        <span className="font-bold text-slate-900 block truncate">
                          {p.codigo ? `[${p.codigo}] ` : ""}{p.nombre}
                        </span>
                        {p.proveedor && <span className="text-[10px] text-slate-500">Proveedor: {p.proveedor}</span>}
                      </div>
                      <button onClick={() => borrarProductoCat(p.id)} className="text-slate-400 hover:text-rose-600 font-bold text-[11px] px-2 py-1 cursor-pointer">
                        Eliminar
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {tabPanel === "apis" && (
            <form onSubmit={guardarConfigApis} className="corp-card rounded-2xl p-6 sm:p-8 space-y-6">
              <div>
                <h2 className="text-lg font-extrabold text-slate-900">Integraciones Omnicanal y Facturación Electrónica (SII)</h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  Configura las credenciales de tus canales de venta y tu proveedor tributario.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-700">Mercado Libre Chile API</h3>
                  <input
                    type="text"
                    value={apisForm.meliClientId}
                    onChange={(e) => setApisForm({ ...apisForm, meliClientId: e.target.value })}
                    placeholder="App ID / Client ID"
                    className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-semibold outline-none"
                  />
                  <input
                    type="password"
                    value={apisForm.meliSecret}
                    onChange={(e) => setApisForm({ ...apisForm, meliSecret: e.target.value })}
                    placeholder="Client Secret / Access Token"
                    className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-semibold outline-none"
                  />
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-700">Falabella Seller Center API</h3>
                  <input
                    type="text"
                    value={apisForm.falabellaUser}
                    onChange={(e) => setApisForm({ ...apisForm, falabellaUser: e.target.value })}
                    placeholder="User ID (Correo Seller Center)"
                    className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-semibold outline-none"
                  />
                  <input
                    type="password"
                    value={apisForm.falabellaApiKey}
                    onChange={(e) => setApisForm({ ...apisForm, falabellaApiKey: e.target.value })}
                    placeholder="API Key Falabella"
                    className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-semibold outline-none"
                  />
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-700">Lider / Walmart Marketplace API</h3>
                  <input
                    type="password"
                    value={apisForm.liderApiKey}
                    onChange={(e) => setApisForm({ ...apisForm, liderApiKey: e.target.value })}
                    placeholder="Client Secret / Token Lider"
                    className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-semibold outline-none"
                  />
                  <p className="text-[11px] text-slate-500">
                    Incluye bandeja física separada para impresión de etiquetas Lider.
                  </p>
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-700">SII / OpenFactura (DTE 33 y 39)</h3>
                  <select
                    value={apisForm.siiProveedor}
                    onChange={(e) => setApisForm({ ...apisForm, siiProveedor: e.target.value })}
                    className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-semibold outline-none"
                  >
                    <option>OpenFactura (Haulmer)</option>
                    <option>SimpleFactura</option>
                    <option>SII Directo (Certificado .PFX + CAF)</option>
                  </select>
                  <input
                    type="password"
                    value={apisForm.siiApiKey}
                    onChange={(e) => setApisForm({ ...apisForm, siiApiKey: e.target.value })}
                    placeholder="API Key OpenFactura / Clave Certificado"
                    className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-xs font-semibold outline-none"
                  />
                </div>
              </div>

              <button
                type="submit"
                disabled={guardandoApis}
                className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-sm transition cursor-pointer"
              >
                {guardandoApis ? "Guardando..." : "Guardar Credenciales y Parámetros SII"}
              </button>
            </form>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
