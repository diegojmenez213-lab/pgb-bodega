        check: <polyline points="20 6 9 17 4 12" />,

      return (

          {icons[name] || icons.layers}

      );
    };

    const limpiarRut = (val) => (val || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRutVisual = (rut) => {
      const clean = limpiarRut(rut);
      if (clean.length < 2) return clean;
      const cuerpo = clean.slice(0, -1);
      const dv = clean.slice(-1);
      return `${cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".")}-${dv}`;
    };

        modulos: {

        }

          bandejasLotes: false, posRapido: true, agendaServicios: true,
          multiSucursal: false, autoCAF: false
        }
      }

    const ETIQUETAS_MODULOS = {
      pickingBodega: "Control Picking y Armadores",
      incidenciasRetornos: "Incidencias y Retornos en Ruta",
      conteoCiclico: "Inventario y Conteo Cíclico",
      cuarentenaRuta: "Cuarentena Fuera de Ruta",
      rendicionChoferes: "Rendición de Choferes y Créditos",
      ecommerce247: "Facturación SII 24/7 + Marketplaces",
      bandejasLotes: "Bandejas Impresión (Líder / General)",
      posRapido: "Punto de Venta Rápido (POS)",
      agendaServicios: "Agenda Horas y Comisiones",
      comprasXML: "Carga Compras XML / Foto IA",
      sugeridoProveedor: "Sugerido Compras por Proveedor",
      puntoEquilibrio: "Punto de Equilibrio Neto Vivo",
      multiSucursal: "Modo Cadena Multi-Sucursal (18+)",
      autoCAF: "Add-on Auto-CAF Folios SII"
    };

    const EMPRESAS_SEMILLA = [
      {
        rut: "769497226",
        razonSocial: "PGB Distribution Chile SpA",
        clave: "1234",
        rubro: "distribuidora",
        estado: "activo",
        modoJerarquia: false,
        tarifaUF: 6,
        sucursales: ["Casa Matriz Macul (Av. Exequiel Fernández 3397)"],
        logoBase64: "",
        rutaLegacy: "pgb-operacion.html",
        modulos: PLANTILLAS_RUBRO.distribuidora.modulos
      },
      {
        rut: "775280425",
        razonSocial: "Tecnoshop Company SpA",
        clave: "1234",
        rubro: "ecommerce",
        estado: "activo",
        modoJerarquia: false,
        tarifaUF: 4,
        sucursales: ["Bodega Central Santiago"],
        logoBase64: "",
        rutaLegacy: "",
        modulos: PLANTILLAS_RUBRO.ecommerce.modulos
      }
    ];

    function App() {
      const [vista, setVista] = useState("cargando");
      const [empresas, setEmpresas] = useState([]);
      const [empresaActiva, setEmpresaActiva] = useState(null);
      const [toquesSecretos, setToquesSecretos] = useState(0);
      const [tabAdmin, setTabAdmin] = useState("empresas"); // empresas | infraestructura

      const [rutInput, setRutInput] = useState("");
      const [claveInput, setClaveInput] = useState("");
      const [errorLogin, setErrorLogin] = useState("");
      const [ingresando, setIngresando] = useState(false);

      const [masterInput, setMasterInput] = useState("");
      const [errorMaster, setErrorMaster] = useState("");
      const [busqueda, setBusqueda] = useState("");
      const [filtroEstado, setFiltroEstado] = useState("todos");
      const [modalEmpresa, setModalEmpresa] = useState(null);
      const [guardando, setGuardando] = useState(false);

      useEffect(() => {
        const checkHash = () => {
          if (window.location.hash === "#/comando") {
            const saAuth = sessionStorage.getItem("nexus_sa_auth");
            setVista(saAuth === "OK" ? "superadmin" : "superadmin_login");
          }
        };
        checkHash();
        window.addEventListener("hashchange", checkHash);
        return () => window.removeEventListener("hashchange", checkHash);
      }, []);

      useEffect(() => {
        let unsubscribe = null;

        const iniciarSistema = async () => {
          try {
            if (!auth.currentUser) {
              await auth.signInAnonymously().catch(() => {});
            }

            for (const emp of EMPRESAS_SEMILLA) {
              const ref = db.collection("saas_empresas").doc(emp.rut);
              const snap = await ref.get();
              if (!snap.exists) {
                await ref.set({
                  ...emp,
                  creadoEn: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
            }

            unsubscribe = db.collection("saas_empresas").onSnapshot((snapshot) => {
              const lista = [];
              snapshot.forEach((doc) => lista.push({ id: doc.id, ...doc.data() }));
              setEmpresas(lista);

              if (window.location.hash === "#/comando") {
                const saAuth = sessionStorage.getItem("nexus_sa_auth");
                setVista(saAuth === "OK" ? "superadmin" : "superadmin_login");
                return;
              }

              const sesionGuardada = localStorage.getItem("nexus_empresa_rut");
              if (sesionGuardada) {
                const encontrada = lista.find((e) => e.rut === sesionGuardada);
                if (encontrada && encontrada.estado !== "suspendido") {
                  if (encontrada.rutaLegacy) {
                    window.location.href = encontrada.rutaLegacy;
                    return;
                  }
                  setEmpresaActiva(encontrada);
                  setVista("cliente");
                  return;
                }
              }
              setVista("login");
            });
          } catch (err) {
            setVista("login");
          }
        };

        iniciarSistema();
        return () => { if (unsubscribe) unsubscribe(); };
      }, []);

      const manejarToqueSecreto = () => {
        const nuevo = toquesSecretos + 1;
        if (nuevo >= 5) {
          setToquesSecretos(0);
          window.location.hash = "#/comando";
        } else {
          setToquesSecretos(nuevo);
        }
      };

      const manejarLoginCliente = async (e) => {
        e.preventDefault();
        setErrorLogin("");
        setIngresando(true);

        const rutLimpio = limpiarRut(rutInput);
        if (!rutLimpio || !claveInput) {
          setErrorLogin("Ingresa el RUT corporativo y la clave de acceso.");
          setIngresando(false);
          return;
        }

        try {
          let emp = empresas.find((x) => x.rut === rutLimpio);
          if (!emp) {
            const docSnap = await db.collection("saas_empresas").doc(rutLimpio).get();
            if (docSnap.exists) emp = docSnap.data();
          }

          if (!emp) {
            setErrorLogin("RUT no registrado en el directorio de empresas.");
            setIngresando(false);
            return;
          }

          if (emp.clave !== claveInput.trim()) {
            setErrorLogin("Credenciales inválidas. Verifica tu clave.");
            setIngresando(false);
            return;
          }

          if (emp.estado === "suspendido") {
            setErrorLogin("Instancia suspendida temporalmente. Contacta a administración.");
            setIngresando(false);
            return;
          }

          localStorage.setItem("nexus_empresa_rut", emp.rut);

          if (emp.rutaLegacy) {
            window.location.href = emp.rutaLegacy;
            return;
          }

          setEmpresaActiva(emp);
          setVista("cliente");
        } catch (err) {
          setErrorLogin("Error de red al verificar credenciales.");
        }
        setIngresando(false);
      };

      const manejarLoginMaster = (e) => {
        e.preventDefault();
        if (masterInput === MASTER_KEY) {
          sessionStorage.setItem("nexus_sa_auth", "OK");
          setErrorMaster("");
          setMasterInput("");
          setVista("superadmin");
        } else {
          setErrorMaster("Clave maestra incorrecta.");
        }
      };

      const cerrarSesionCliente = () => {
        localStorage.removeItem("nexus_empresa_rut");
        setEmpresaActiva(null);
        setRutInput("");
        setClaveInput("");
        setVista("login");
      };

      const salirSuperAdmin = () => {
        sessionStorage.removeItem("nexus_sa_auth");
        window.location.hash = "";
        setVista("login");
      };

      const abrirNuevaEmpresa = () => {
        setModalEmpresa({
          esNueva: true,
          rut: "",
          razonSocial: "",
          clave: "1234",
          rubro: "minimarket",
          estado: "activo",
          modoJerarquia: false,
          tarifaUF: 1.5,
          sucursales: ["Casa Matriz"],
          logoBase64: "",
          rutaLegacy: "",
          modulos: { ...PLANTILLAS_RUBRO.minimarket.modulos }
        });
      };

      const cambiarRubroModal = (nuevoRubro) => {
        const plantilla = PLANTILLAS_RUBRO[nuevoRubro];
        setModalEmpresa({
          ...modalEmpresa,
          rubro: nuevoRubro,
          tarifaUF: plantilla.tarifaUF,
          modulos: { ...plantilla.modulos }
        });
      };

      const manejarSubidaLogo = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 750000) {
          alert("El archivo supera los 750 KB. Comprime el PNG antes de subirlo.");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          setModalEmpresa({ ...modalEmpresa, logoBase64: reader.result });
        };
        reader.readAsDataURL(file);
      };

      const guardarEmpresa = async (e) => {
        e.preventDefault();
        const rutClean = limpiarRut(modalEmpresa.rut);
        if (!rutClean || !modalEmpresa.razonSocial.trim()) {
          alert("RUT y Razón Social son campos obligatorios.");
          return;
        }
        setGuardando(true);
        try {
          const payload = {
            rut: rutClean,
            razonSocial: modalEmpresa.razonSocial.trim(),
            clave: modalEmpresa.clave.trim() || "1234",
            rubro: modalEmpresa.rubro,
            estado: modalEmpresa.estado,
            modoJerarquia: !!modalEmpresa.modoJerarquia,
            tarifaUF: Number(modalEmpresa.tarifaUF) || 0,
            sucursales: modalEmpresa.sucursales || ["Casa Matriz"],
            logoBase64: modalEmpresa.logoBase64 || "",
            rutaLegacy: modalEmpresa.rutaLegacy || "",
            modulos: modalEmpresa.modulos,
            actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection("saas_empresas").doc(rutClean).set(payload, { merge: true });
          setModalEmpresa(null);
        } catch (err) {
          alert("Error al guardar: " + err.message);
        }
        setGuardando(false);
      };

      const entrarComoAdmin = (emp) => {
        localStorage.setItem("nexus_empresa_rut", emp.rut);
        window.location.hash = "";
        if (emp.rutaLegacy) {
          window.location.href = emp.rutaLegacy;
          return;
        }
        setEmpresaActiva(emp);
        setVista("cliente");
      };

      // PANTALLA DE CARGA MINIMALISTA
      if (vista === "cargando") {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-[#09090b]">
            <div className="w-8 h-8 border-2 border-zinc-700 border-t-emerald-400 rounded-full animate-spin mb-3"></div>
            <p className="text-zinc-500 text-xs font-medium tracking-wider uppercase">Sincronizando entorno...</p>
          </div>
        );
      }

      // 1. PORTAL DE ACCESO CORPORATIVO (ESTILO STRIPE / LINEAR)
      if (vista === "login") {
        return (
          <div className="min-h-screen grid-bg flex flex-col justify-between p-6 relative overflow-hidden">
            {/* Luz ambiental superior sutil */}
            <div className="pointer-events-none absolute -top-40 left-1/2 -translate-x-1/2 w-[500px] h-[300px] bg-emerald-500/10 blur-[120px] rounded-full"></div>

            <div className="max-w-5xl w-full mx-auto flex items-center justify-between pt-2">
              <div className="flex items-center gap-2.5">
                <div className="w-7 h-7 rounded-lg bg-zinc-900 border border-white/10 flex items-center justify-center text-emerald-400">
                  <Icon name="layers" className="w-4 h-4" />
                </div>
                <span className="text-xs font-semibold tracking-widest uppercase text-zinc-400">
                  NEXUS <span className="text-zinc-600">/</span> ERP CLOUD
                </span>
              </div>
              <div className="flex items-center gap-2 text-[11px] text-zinc-500 font-mono-tabular">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                SII-CL OPERATIVO
              </div>
            </div>

            <div className="w-full max-w-[380px] mx-auto my-auto py-8">
              <div className="bg-zinc-950/90 backdrop-blur-xl border border-white/[0.08] rounded-2xl p-7 shadow-2xl shadow-black/80">
                <div className="mb-7">
                  <div
                    onClick={manejarToqueSecreto}
                    className="w-10 h-10 rounded-xl bg-zinc-900 border border-white/10 flex items-center justify-center text-emerald-400 mb-5 cursor-pointer select-none hover:border-emerald-500/40 transition"
                  >
                    <Icon name="shield" className="w-5 h-5" />
                  </div>
                  <h1 className="text-xl font-semibold tracking-tight text-white">Acceso Corporativo</h1>
                  <p className="text-zinc-400 text-xs mt-1 leading-relaxed">
                    Autenticación por RUT de empresa para ingresar a tu espacio de trabajo.
                  </p>
                </div>

                <form onSubmit={manejarLoginCliente} className="space-y-4">
                  <div>
                    <label className="block text-[11px] font-medium text-zinc-400 mb-1.5">
                      RUT Empresa
                    </label>
                    <input
                      type="text"
                      value={rutInput}
                      onChange={(e) => setRutInput(e.target.value)}
                      placeholder="Sin puntos ni guion"
                      className="w-full px-3.5 py-2.5 rounded-lg bg-zinc-900/80 border border-white/10 text-sm text-white font-mono-tabular placeholder-zinc-600 focus:outline-none focus:border-emerald-500/60 focus:ring-1 focus:ring-emerald-500/30 transition"
                      autoComplete="username"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-medium text-zinc-400 mb-1.5">
                      Clave de Seguridad
                    </label>
                    <input
                      type="password"
                      value={claveInput}
                      onChange={(e) => setClaveInput(e.target.value)}
                      placeholder="••••••••"
                      className="w-full px-3.5 py-2.5 rounded-lg bg-zinc-900/80 border border-white/10 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500/60 focus:ring-1 focus:ring-emerald-500/30 transition"
                      autoComplete="current-password"
                    />
                  </div>

                  {errorLogin && (
                    <div className="p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs">
                      {errorLogin}
                    </div>
                  )}

                        type="button"
                        onClick={() =>
                          setModalEmpresa({ ...modalEmpresa, modoJerarquia: !modalEmpresa.modoJerarquia })
                        }
                        className={`px-3 py-1.5 rounded-lg text-[11px] font-semibold border transition ${
                          modalEmpresa.modoJerarquia
                            ? "bg-emerald-500/15 border-emerald-500/30 text-emerald-400"
                            : "bg-zinc-900 border-white/10 text-zinc-400"
                        }`}
                      >
                        {modalEmpresa.modoJerarquia ? "Por Roles" : "Unificado"}
                      </button>
                    </div>

                    {/* Switches de Módulos */}
                    <div>
                      <label className="block text-[11px] font-medium text-zinc-400 mb-2">
                        Módulos Habilitados en Instancia
                      </label>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {Object.entries(ETIQUETAS_MODULOS).map(([modKey, label]) => {
                          const activo = !!modalEmpresa.modulos?.[modKey];
                          return (
                            <div
                              key={modKey}
                              onClick={() =>
                                setModalEmpresa({
                                  ...modalEmpresa,
                                  modulos: { ...modalEmpresa.modulos, [modKey]: !activo }
                                })
                              }
                              className={`flex items-center justify-between p-2.5 rounded-lg border cursor-pointer transition ${
                                activo
                                  ? "bg-zinc-900 border-white/15 text-zinc-100"
                                  : "bg-zinc-950 border-white/[0.05] text-zinc-500 hover:border-white/10"
                              }`}
                            >
                              <span className="text-xs pr-2">{label}</span>
                              <div
                                className={`w-8 h-4 rounded-full p-0.5 transition shrink-0 ${
                                  activo ? "bg-emerald-500" : "bg-zinc-800"
                                }`}
                              >
                                <div
                                  className={`w-3 h-3 rounded-full bg-white transition-transform ${
                                    activo ? "translate-x-4" : "translate-x-0"
                                  }`}
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="flex justify-end gap-2.5 pt-4 border-t border-white/[0.08]">
                      <button
                        type="button"
                        onClick={() => setModalEmpresa(null)}
                        className="px-4 py-2 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-300 text-xs font-medium"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={guardando}
                        className="px-5 py-2 rounded-lg bg-white hover:bg-zinc-200 text-zinc-950 text-xs font-semibold"
                      >
                        {guardando ? "Aplicando cambios..." : "Guardar Configuración"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      // 4. ESPACIO DE TRABAJO CLIENTE (TECNOSHOP / NUEVAS EMPRESAS)
      if (vista === "cliente" && empresaActiva) {
        const infoRubro = PLANTILLAS_RUBRO[empresaActiva.rubro] || PLANTILLAS_RUBRO.minimarket;
        const activos = Object.entries(empresaActiva.modulos || {}).filter(([, val]) => val);

        return (
          <div className="min-h-screen bg-[#09090b] text-zinc-100 flex flex-col">
            {empresaActiva.estado === "aviso" && (
              <div className="bg-amber-500/15 border-b border-amber-500/30 text-amber-300 text-xs text-center py-2 px-4">
                Aviso administrativo: Existe un saldo de suscripción pendiente de regularización.
              </div>
            )}

            <header className="h-16 bg-zinc-950 border-b border-white/[0.08] px-6 flex items-center justify-between">
              <div className="flex items-center gap-3.5">
                {empresaActiva.logoBase64 ? (
                  <img
                    src={empresaActiva.logoBase64}
                    alt={empresaActiva.razonSocial}
                    className="w-9 h-9 object-contain bg-white rounded-lg p-1"
                  />
                ) : (
                  <div className="w-9 h-9 rounded-lg bg-zinc-900 border border-white/10 flex items-center justify-center text-emerald-400">
                    <Icon name={infoRubro.iconName} className="w-4 h-4" />
                  </div>
                )}
                <div>
                  <h1 className="font-semibold text-white text-sm leading-tight">
                    {empresaActiva.razonSocial}
                  </h1>
                  <p className="text-[11px] text-zinc-500 font-mono-tabular">
                    RUT {formatearRutVisual(empresaActiva.rut)} • {infoRubro.nombre}
                  </p>
                </div>
              </div>

              <button
                onClick={cerrarSesionCliente}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-white/10 text-xs font-medium text-zinc-300 transition"
              >
                <Icon name="logout" className="w-3.5 h-3.5" />
                Salir
              </button>
            </header>

            <main className="max-w-5xl w-full mx-auto px-6 py-8 space-y-6">
              <div className="bg-zinc-950 border border-white/[0.08] rounded-2xl p-6">
                <div className="flex items-center gap-2 text-xs text-emerald-400 font-medium mb-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  Entorno Dedicado Activo
                </div>
                <h2 className="text-lg font-semibold text-white">
                  Módulos Operativos de {empresaActiva.razonSocial}
                </h2>
                <p className="text-xs text-zinc-400 mt-1">
                  Arquitectura aislada gobernada en tiempo real desde la consola central.
                </p>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-6">
                  {activos.map(([key]) => (
                    <div
                      key={key}
                      className="p-3.5 rounded-xl bg-zinc-900/60 border border-white/[0.08] flex items-center gap-3"
                    >
                      <div className="w-6 h-6 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0">
                        <Icon name="check" className="w-3.5 h-3.5" />
                      </div>
                      <span className="text-xs font-medium text-zinc-200">
                        {ETIQUETAS_MODULOS[key] || key}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
