<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>NEXUS ERP • Acceso Empresarial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
  <script>
    // Si el usuario vuelve a la portada con el botón Atrás, aseguramos limpieza de sesión residual si venía de cerrar sesión
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) {
        window.location.reload();
      }
    });
  </script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 selection:bg-blue-600 selection:text-white">
  <div id="root" class="w-full max-w-md"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    function LoginNexusApp() {
      const [rutInput, setRutInput] = useState("");
      const [claveInput, setClaveInput] = useState("");
      const [cargando, setCargando] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");

      useEffect(() => {
        auth.signInAnonymously().catch(() => {});
      }, []);

      const ingresarEmpresa = async (e) => {
        e.preventDefault();
        setErrorMsg("");
        const rutLimpio = limpiarRut(rutInput);
        if (rutLimpio.length < 7) {
          setErrorMsg("Ingresa un RUT empresarial válido.");
          return;
        }

        setCargando(true);
        try {
          await auth.signInAnonymously().catch(() => {});
          const docRef = db.collection("saas_empresas").doc(rutLimpio);
          const snap = await docRef.get();

          if (!snap.exists) {
            if (rutLimpio === RUT_PGB) {
              // Acceso directo PGB si aún no tiene ficha en saas_empresas
              sessionStorage.clear();
              localStorage.setItem("nexus_empresa_rut", RUT_PGB);
              window.location.replace("pgb-operacion.html");
              return;
            }
            setErrorMsg("Este RUT no está registrado en la plataforma. Contacta al administrador.");
            setCargando(false);
            return;
          }

          const data = snap.data();
          if (data.activa === false) {
            setErrorMsg("El acceso para esta empresa se encuentra pausado temporalmente.");
            setCargando(false);
            return;
          }

          const claveGuardada = String(data.claveAcceso || data.pin || "").trim();
          if (claveGuardada && claveInput.trim() !== claveGuardada) {
            setErrorMsg("Clave de acceso incorrecta.");
            setCargando(false);
            return;
          }

          // Limpiamos cualquier rastro previo y usamos replace() para que el botón Atrás no regrese a otra empresa
          sessionStorage.clear();
          localStorage.setItem("nexus_empresa_rut", rutLimpio);
          localStorage.setItem("nexus_session_ts", String(Date.now()));

          if (rutLimpio === RUT_PGB) {
            window.location.replace("pgb-operacion.html");
          } else {
            window.location.replace("empresa-panel.html");
          }
        } catch (err) {
          setErrorMsg("Error de conexión: " + err.message);
          setCargando(false);
        }
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-7 sm:p-9 shadow-2xl space-y-6">
          <div className="text-center space-y-1.5">
            <span className="inline-block text-[10px] font-extrabold uppercase tracking-widest px-3 py-1 rounded-full bg-blue-950 text-blue-400 border border-blue-800/60">
              NEXUS ERP • MULTI-EMPRESA
            </span>
            <h1 className="text-2xl font-extrabold tracking-tight text-white pt-1">
              Portal Corporativo
            </h1>
            <p className="text-xs text-slate-400">
              Ingresa el RUT de tu empresa para acceder a tu entorno privado.
            </p>
          </div>

          {errorMsg && (
            <div className="bg-rose-950/80 border border-rose-800 text-rose-200 text-xs font-bold p-3.5 rounded-2xl text-center">
              {errorMsg}
            </div>
          )}

          <form onSubmit={ingresarEmpresa} className="space-y-4">
            <div>
              <label className="text-xs font-bold text-slate-300 block mb-1.5">RUT Empresa *</label>
              <input
                type="text"
                value={rutInput}
                onChange={(e) => setRutInput(formatearRut(e.target.value))}
                placeholder="Ej: 77.528.042-5"
                className="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-2xl px-4 py-3.5 text-sm font-bold text-white outline-none"
                required
              />
            </div>

            <div>
              <label className="text-xs font-bold text-slate-300 block mb-1.5">Clave de Acceso</label>
              <input
                type="password"
                value={claveInput}
                onChange={(e) => setClaveInput(e.target.value)}
                placeholder="Ingresa tu clave empresarial"
                className="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-2xl px-4 py-3.5 text-sm font-bold text-white outline-none"
              />
            </div>

            <button
              type="submit"
              disabled={cargando}
              className="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold py-4 rounded-2xl text-xs uppercase tracking-wider shadow-lg transition cursor-pointer"
            >
              {cargando ? "Verificando Acceso..." : "Ingresar a mi Empresa →"}
            </button>
          </form>

          <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
            <span>Aislamiento de datos por RUT</span>
            <a href="super-admin.html" className="hover:text-slate-300 font-bold">
              Admin
            </a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<LoginNexusApp />);
  </script>
</body>
</html>
