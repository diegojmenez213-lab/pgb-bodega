<!DOCTYPE html>

<head>

<body class="bg-[#090d16] text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const UNIDADES = ["Unidad", "Caja", "Manga", "Fardo", "Unidad suelta", "Display", "Pack"];
    const MOTIVOS = [
      { id: "Faltante", label: "Faltante en Ruta", desc: "Faltó entregar al cliente (Sobra en bodega)" },
      { id: "Sobrante", label: "Sobrante en Ruta", desc: "Fue de más en el furgón (Falta en bodega)" },
      { id: "Cruce", label: "Cruce de Producto", desc: "Se facturó un producto pero se envió otro físico" },
      { id: "Rechazo", label: "Rechazo Cliente", desc: "Cliente devuelve o no recibe mercadería" },
      { id: "Daño/Merma", label: "Daño / Merma", desc: "Producto roto, vencido o averiado" }
    ];
    const ARMADORES = ["Diego", "Nico", "Edwin"];
    const RUTAS = ["Ruta 1 (Juan / Julio)", "Ruta 2 (Carlos / Horacio)", "Retiro Bodega / Otra"];
    const ACCIONES = [
      "Ajustar Inventario en Bodega",
      "Enviar / Reponer Producto al Cliente",
      "Nota de Crédito / Descuento Factura",
      "Chofer Retorna Producto a Bodega"
    ];

    function App() {
      const [incidencias, setIncidencias] = useState([]);
      const [cierres, setCierres] = useState([]);
      const [vista, setVista] = useState("dashboard"); // dashboard | nuevo | balance | historial
      const [conectado, setConectado] = useState(false);
      const [editandoId, setEditandoId] = useState(null);
      const [cierreExpandido, setCierreExpandido] = useState(null);

      // Filtros de búsqueda
      const [busqueda, setBusqueda] = useState("");
      const [filtroEstado, setFiltroEstado] = useState("todos"); // todos | pendientes | resueltos
      const [filtroArmador, setFiltroArmador] = useState("todos");
      const [filtroRuta, setFiltroRuta] = useState("todos");

      // Estado del formulario
      const hoy = new Date().toISOString().split("T")[0];
      const [factura, setFactura] = useState("");
      const [cliente, setCliente] = useState("");
      const [fecha, setFecha] = useState(hoy);
      const [ruta, setRuta] = useState(RUTAS[0]);
      const [armador, setArmador] = useState(ARMADORES[0]);
      const [motivo, setMotivo] = useState("Faltante");

      const [producto, setProducto] = useState("");
      const [cantidad, setCantidad] = useState(1);
      const [unidad, setUnidad] = useState(UNIDADES[0]);

      const [productoCruce, setProductoCruce] = useState("");
      const [cantidadCruce, setCantidadCruce] = useState(1);
      const [unidadCruce, setUnidadCruce] = useState(UNIDADES[0]);

      const [accionResolucion, setAccionResolucion] = useState(ACCIONES[0]);
      const [notas, setNotas] = useState("");

      useEffect(() => {
        auth.signInAnonymously().catch(() => {});

        const unsubInc = db.collection("incidencias")
          .onSnapshot((snap) => {
            setConectado(true);
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setIncidencias(lista);
          }, (err) => console.error(err));

        const unsubCierres = db.collection("cierres_semanales")
          .onSnapshot((snap) => {
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            lista.sort((a, b) => new Date(b.fechaCierre) - new Date(a.fechaCierre));
            setCierres(lista);
          });

        return () => {
          unsubInc();
          unsubCierres();
        };
      }, []);

      const limpiarFormulario = () => {
        setFactura("");
        setCliente("");
        setProducto("");
        setCantidad(1);
        setUnidad(UNIDADES[0]);
        setProductoCruce("");
        setCantidadCruce(1);
        setUnidadCruce(UNIDADES[0]);
        setNotas("");
        setEditandoId(null);
      };

      const guardarIncidencia = async (e) => {
        e.preventDefault();
        if (!factura.trim() || !producto.trim()) {
          return alert("Completa el Nº de Factura y el Producto.");
        }
        if (motivo === "Cruce" && !productoCruce.trim()) {
          return alert("En un Cruce debes indicar también el producto que salió físicamente por error.");
        }

        const datos = {
          factura: factura.trim(),
          cliente: cliente.trim(),
          fecha,
          ruta,
          armador,
          motivo,
          producto: producto.trim().toUpperCase(),
          cantidad: Number(cantidad),
          unidad,
          productoCruce: motivo === "Cruce" ? productoCruce.trim().toUpperCase() : null,
          cantidadCruce: motivo === "Cruce" ? Number(cantidadCruce) : null,
          unidadCruce: motivo === "Cruce" ? unidadCruce : null,
          accionResolucion,
          notas: notas.trim(),
          timestamp: Date.now()
        };

        try {
          if (editandoId) {
            delete datos.timestamp;
            await db.collection("incidencias").doc(editandoId).update(datos);
          } else {
            datos.resuelto = false;
            await db.collection("incidencias").add(datos);
          }
          limpiarFormulario();
          setVista("dashboard");
        } catch (err) {
          alert("Error al guardar en Firebase: " + err.message);
        }
      };

      const cargarParaEditar = (item) => {
        setEditandoId(item.id);
        setFactura(item.factura || "");
        setCliente(item.cliente || "");
        setFecha(item.fecha || hoy);
        setRuta(item.ruta || RUTAS[0]);
        setArmador(item.armador || ARMADORES[0]);
        setMotivo(item.motivo || "Faltante");
        setProducto(item.producto || "");
        setCantidad(item.cantidad || 1);
        setUnidad(item.unidad || UNIDADES[0]);
        if (item.motivo === "Cruce") {
          setProductoCruce(item.productoCruce || "");
          setCantidadCruce(item.cantidadCruce || 1);
          setUnidadCruce(item.unidadCruce || UNIDADES[0]);
        }
        setAccionResolucion(item.accionResolucion || ACCIONES[0]);
        setNotas(item.notas || "");
        setVista("nuevo");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const cambiarEstado = async (id, estadoActual) => {
        await db.collection("incidencias").doc(id).update({ resuelto: !estadoActual });
      };

      const eliminarIncidencia = async (id) => {
        if (confirm("¿Seguro que deseas eliminar este registro de la base de datos?")) {
          await db.collection("incidencias").doc(id).delete();
        }
      };

      const cerrarSemana = async () => {
        if (incidencias.length === 0) return alert("No hay incidencias activas para cerrar la semana.");
        const nombreSemana = prompt("Nombre o fecha del cierre semanal (Ej: Semana 09 al 14 Nov):");
        if (!nombreSemana) return;

        try {
          await db.collection("cierres_semanales").add({
            nombreSemana,
            fechaCierre: new Date().toISOString(),
            totalRegistros: incidencias.length,
            registros: incidencias
          });

          const batch = db.batch();
          incidencias.forEach((inc) => {
            const ref = db.collection("incidencias").doc(inc.id);
            batch.delete(ref);
          });
          await batch.commit();
          alert("✅ Semana cerrada y archivada en Historial.");
          setVista("historial");
        } catch (err) {
          alert("Error al cerrar semana: " + err.message);
        }
      };

      const copiarResumenWhatsApp = () => {
        if (incidencias.length === 0) return alert("No hay incidencias para copiar.");
        let texto = `📦 *REPORTE BODEGA PGB DISTRIBUTION*\n📅 Fecha: ${hoy}\n━━━━━━━━━━━━━━\n`;
        incidencias.forEach((i, idx) => {
          const estado = i.resuelto ? "✅ RESUELTO" : "⏳ PENDIENTE";
          texto += `*${idx + 1}. Fact #${i.factura}* (${i.motivo}) - ${estado}\n`;
          texto += `   • Prod: ${i.cantidad} ${i.unidad} de ${i.producto}\n`;
          if (i.motivo === "Cruce" && i.productoCruce) {
            texto += `   • Se envió por error: ${i.cantidadCruce} ${i.unidadCruce} de ${i.productoCruce}\n`;
          }
          texto += `   • Armó: ${i.armador} | ${i.ruta}\n`;
          texto += `   • Acción: ${i.accionResolucion}\n\n`;
        });
        navigator.clipboard.writeText(texto);
        alert("📋 ¡Reporte copiado! Ya puedes pegarlo en el grupo de WhatsApp.");
      };

      // Métricas KPIs
      const kpis = useMemo(() => {
        const total = incidencias.length;
        const pendientes = incidencias.filter(i => !i.resuelto).length;
        const resueltas = incidencias.filter(i => i.resuelto).length;
        const cruces = incidencias.filter(i => i.motivo === "Cruce").length;
        return { total, pendientes, resueltas, cruces };
      }, [incidencias]);

      // Lista filtrada
      const incidenciasFiltradas = useMemo(() => {
        return incidencias.filter(item => {
          const coincideTexto =
            item.factura?.toLowerCase().includes(busqueda.toLowerCase()) ||
            item.producto?.toLowerCase().includes(busqueda.toLowerCase()) ||
            item.productoCruce?.toLowerCase().includes(busqueda.toLowerCase()) ||
            item.cliente?.toLowerCase().includes(busqueda.toLowerCase());
          const coincideEstado =
            filtroEstado === "todos" ? true :
            filtroEstado === "pendientes" ? !item.resuelto : item.resuelto;
          const coincideArmador =
            filtroArmador === "todos" ? true : item.armador === filtroArmador;
          const coincideRuta =
            filtroRuta === "todos" ? true : item.ruta === filtroRuta;
          return coincideTexto && coincideEstado && coincideArmador && coincideRuta;
        });
      }, [incidencias, busqueda, filtroEstado, filtroArmador, filtroRuta]);

      // Cuadratura automática de bodega
      const resumenInventario = useMemo(() => {
        const mapa = {};
        const sumar = (prod, uni, cant, tipo, fact) => {
          const clave = `${prod}__${uni}`;
          if (!mapa[clave]) {
            mapa[clave] = { producto: prod, unidad: uni, sobranteBodega: 0, faltanteBodega: 0, facturas: [] };
          }
          if (tipo === "SOBRA_EN_BODEGA") mapa[clave].sobranteBodega += cant;
          if (tipo === "FALTA_EN_BODEGA") mapa[clave].faltanteBodega += cant;
          if (!mapa[clave].facturas.includes(fact)) mapa[clave].facturas.push(fact);
        };

        incidencias.forEach(inc => {
          if (inc.motivo === "Faltante") {
            sumar(inc.producto, inc.unidad, inc.cantidad, "SOBRA_EN_BODEGA", inc.factura);
          } else if (inc.motivo === "Sobrante") {
            sumar(inc.producto, inc.unidad, inc.cantidad, "FALTA_EN_BODEGA", inc.factura);
          } else if (inc.motivo === "Cruce") {
            sumar(inc.producto, inc.unidad, inc.cantidad, "SOBRA_EN_BODEGA", inc.factura);
            if (inc.productoCruce) {
              sumar(inc.productoCruce, inc.unidadCruce, inc.cantidadCruce, "FALTA_EN_BODEGA", inc.factura);
            }
          }
        });
        return Object.values(mapa);
      }, [incidencias]);

      return (
        <div className="max-w-5xl mx-auto px-3 sm:px-6 pt-4 pb-24">
          {/* Topbar Corporativa */}
          <div className="relative overflow-hidden bg-gradient-to-br from-slate-900 via-slate-900 to-amber-950/30 border border-slate-800 rounded-3xl p-5 sm:p-6 mb-5 shadow-2xl">
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <div className="flex items-center gap-2.5">
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                    <span className={`h-2 w-2 rounded-full ${conectado ? 'bg-emerald-400 animate-ping' : 'bg-amber-400'}`}></span>
                    {conectado ? "EN VIVO • FIREBASE" : "CONECTANDO..."}
                  </span>
                  <span className="text-xs text-slate-400 font-semibold">Santiago, Chile</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white mt-2">
                  PGB <span className="text-amber-400">DISTRIBUTION</span> CHILE SpA
                </h1>
                <p className="text-xs sm:text-sm text-slate-400 mt-0.5">
                  Sistema de Auditoría de Bodega, Rutas y Cruces • Jefatura: <strong className="text-slate-200">Pedro y Bedanli</strong>
                </p>
              </div>

              <div className="flex flex-wrap gap-2">
                <button
                  onClick={copiarResumenWhatsApp}
                  className="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-emerald-950/50 transition"
                >
                  📲 Copiar a WhatsApp
                </button>
                <button
                  onClick={() => { limpiarFormulario(); setVista("nuevo"); }}
                  className="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-amber-950/50 transition"
                >
                  ➕ Nueva Incidencia
                </button>
              </div>
            </div>

            {/* Tarjetas de KPIs */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-5 pt-5 border-t border-slate-800/80">
              <div className="bg-slate-950/60 border border-slate-800/80 rounded-2xl p-3">
                <span className="text-[11px] font-semibold text-slate-400 uppercase">Total Semana</span>
                <p className="text-2xl font-black text-white mt-0.5">{kpis.total}</p>
              </div>
              <div className="bg-amber-500/10 border border-amber-500/20 rounded-2xl p-3">
                <span className="text-[11px] font-semibold text-amber-300 uppercase">⏳ Pendientes</span>
                <p className="text-2xl font-black text-amber-400 mt-0.5">{kpis.pendientes}</p>
              </div>
              <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-2xl p-3">
                <span className="text-[11px] font-semibold text-emerald-300 uppercase">✅ Resueltas</span>
                <p className="text-2xl font-black text-emerald-400 mt-0.5">{kpis.resueltas}</p>
              </div>
              <div className="bg-purple-500/10 border border-purple-500/20 rounded-2xl p-3">
                <span className="text-[11px] font-semibold text-purple-300 uppercase">🔄 Cruces Bodega</span>
                <p className="text-2xl font-black text-purple-400 mt-0.5">{kpis.cruces}</p>
              </div>
            </div>
          </div>

          {/* Barra de Navegación Principal */}
          <div className="grid grid-cols-4 gap-1.5 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800 mb-5">
            <button
              onClick={() => setVista("dashboard")}
              className={`py-2.5 px-2 rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-1.5 ${
                vista === "dashboard" ? "bg-amber-500 text-slate-950 shadow" : "text-slate-400 hover:text-white"
              }`}
            >
              📋 Tablero ({incidencias.length})
            </button>
            <button

                              <span className="font-bold text-amber-400">Fact #{r.factura}</span> • <span className="font-bold text-white">{r.motivo}</span>: {r.cantidad} {r.unidad} de {r.producto}
                              {r.motivo === "Cruce" && r.productoCruce && (
                                <span className="text-rose-300 block">↳ Cruzado con: {r.cantidadCruce} {r.unidadCruce} de {r.productoCruce}</span>
                              )}
                            </div>
                            <div className="text-slate-400">
                              Armó: {r.armador} | {r.ruta}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
