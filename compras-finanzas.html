<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>NEXUS ERP • Recepción Automática SII, Compras & Finanzas</title>
  <script>
    (function () {
      var limpiar = function (r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); };
      var rutInicial = limpiar(localStorage.getItem("nexus_empresa_rut"));
      if (!rutInicial) window.location.replace("index.html");
      window.addEventListener("pageshow", function (ev) {
        var rutActual = limpiar(localStorage.getItem("nexus_empresa_rut"));
        if (!rutActual) window.location.replace("index.html");
        else if (ev.persisted && rutActual !== rutInicial) window.location.reload();
      });
      window.addEventListener("storage", function (ev) {
        if (ev.key === "nexus_empresa_rut") {
          var rutNuevo = limpiar(ev.newValue);
          if (!rutNuevo) window.location.replace("index.html");
          else if (rutNuevo !== rutInicial) window.location.reload();
        }
      });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      return `${c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".")}-${c.slice(-1)}`;
    };

    const TEMAS = {
      claro_retail: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", muted: "bg-slate-50 border border-slate-200", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-blue-700 hover:bg-blue-800 text-white", sec: "bg-slate-100 hover:bg-slate-200 text-slate-800", tag: "bg-blue-50 text-blue-800", top: "border-blue-700" },
      claro_ejecutivo: { page: "bg-slate-100 text-slate-900", card: "bg-white border border-slate-300 shadow-sm", muted: "bg-slate-100 border border-slate-200", main: "text-slate-900", sub: "text-slate-600", input: "bg-white border border-slate-300 text-slate-900", btn: "bg-slate-900 hover:bg-slate-800 text-white", sec: "bg-slate-200 text-slate-800", tag: "bg-slate-200 text-slate-800", top: "border-slate-900" },
      oscuro_obsidian: { page: "bg-slate-950 text-slate-100", card: "bg-slate-900 border border-slate-800 shadow-lg", muted: "bg-slate-950 border border-slate-800", main: "text-white", sub: "text-slate-400", input: "bg-slate-950 border border-slate-700 text-white", btn: "bg-indigo-600 hover:bg-indigo-500 text-white", sec: "bg-slate-800 text-slate-200", tag: "bg-indigo-950 text-indigo-300", top: "border-indigo-500" },
      claro_esmeralda: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", muted: "bg-emerald-50/40 border border-emerald-200", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-emerald-700 hover:bg-emerald-800 text-white", sec: "bg-slate-100 text-slate-800", tag: "bg-emerald-50 text-emerald-800", top: "border-emerald-700" }
    };

    function ComprasFinanzasApp() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut") || ""));
      const [empresa, setEmpresa] = useState(null);
      const [catalogo, setCatalogo] = useState([]);
      const [compras, setCompras] = useState([]);
      const [ventas, setVentas] = useState([]);

      const [tab, setTab] = useState("lector");
      const [rutEmisor, setRutEmisor] = useState("");
      const [folioFactura, setFolioFactura] = useState("");
      const [timbreScan, setTimbreScan] = useState("");
      const [vistaPreviaFactura, setVistaPreviaFactura] = useState(null);
      const [guardando, setGuardando] = useState(false);

      // Carga manual rápida de ítem en vista previa
      const [itemCod, setItemCod] = useState("");
      const [itemNom, setItemNom] = useState("");
      const [itemCant, setItemCant] = useState(1);
      const [itemCosto, setItemCosto] = useState(0);

      useEffect(() => {
        if (!rutActivo) {
          window.location.replace("index.html");
          return;
        }
        auth.signInAnonymously().catch(() => {});
        const empRef = db.collection("saas_empresas").doc(rutActivo);

        const u1 = empRef.onSnapshot((doc) => {
          if (!doc.exists) {
            window.location.replace("index.html");
            return;
          }
          const data = { id: doc.id, ...doc.data() };
          const m = data.modulosActivos || {};
          if (rutActivo !== RUT_PGB && !m.m17_compras_prov && !m.m18_finanzas_bi) {
            window.location.replace("empresa-panel.html");
            return;
          }
          setEmpresa(data);
        });

        const colCat = rutActivo === RUT_PGB ? db.collection("catalogo_productos") : empRef.collection("catalogo");
        const u2 = colCat.onSnapshot((snap) => {
          setCatalogo(snap.docs.map((d) => ({ id: d.id, stockOnline: 0, ...d.data() })));
        });

        const u3 = empRef.collection("compras_proveedores").onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setCompras(lista);
        });

        const u4 = empRef.collection("ecommerce_ordenes").onSnapshot((snap) => {
          setVentas(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        });

        return () => { u1(); u2(); u3(); u4(); };
      }, [rutActivo]);

      const empRef = () => db.collection("saas_empresas").doc(rutActivo);
      const catRef = () => (rutActivo === RUT_PGB ? db.collection("catalogo_productos") : empRef().collection("catalogo"));

      const consultarPorFolioApi = (e) => {
        e.preventDefault();
        if (!rutEmisor.trim() || !folioFactura.trim()) return;
        const tieneKey = Boolean(empresa?.apis?.siiApiKey);
        setVistaPreviaFactura({
          origen: tieneKey ? "API OpenFactura SII" : "Consulta Preliminar",
          rutProveedor: formatearRut(rutEmisor),
          proveedor: `PROVEEDOR ${formatearRut(rutEmisor)}`,
          folio: folioFactura.trim(),
          fecha: new Date().toISOString().slice(0, 10),
          totalClp: 0,
          items: []
        });
      };

      const procesarArchivoXml = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const texto = await file.text();
          const parser = new DOMParser();
          const xml = parser.parseFromString(texto, "text/xml");
          const getTag = (parent, name) => {
            const el = parent.getElementsByTagName(name)[0];
            return el ? el.textContent.trim() : "";
          };

          const rutProv = getTag(xml, "RUTEmisor") || "S/I";
          const razonProv = getTag(xml, "RznSoc") || `PROVEEDOR ${rutProv}`;
          const folio = getTag(xml, "Folio") || String(Date.now()).slice(-6);
          const fchEmis = getTag(xml, "FchEmis") || new Date().toISOString().slice(0, 10);
          const mntTotal = Number(getTag(xml, "MntTotal") || 0);

          const detalles = Array.from(xml.getElementsByTagName("Detalle"));
          const items = detalles.map((det) => {
            const cod = getTag(det, "VlrCodigo") || "";
            const nom = (getTag(det, "NmbItem") || "ARTICULO XML").toUpperCase();
            const cant = Math.max(1, Number(getTag(det, "QtyItem") || 1));
            const monto = Number(getTag(det, "MontoItem") || 0);
            return { codigo: cod.toUpperCase(), nombre: nom, cantidad: cant, costoTotal: monto };
          });

          setVistaPreviaFactura({
            origen: "Archivo XML DTE SII",
            rutProveedor: formatearRut(rutProv),
            proveedor: razonProv.toUpperCase(),
            folio,
            fecha: fchEmis,
            totalClp: mntTotal || items.reduce((a, b) => a + b.costoTotal, 0),
            items
          });
        } catch (err) {
          alert("No se pudo leer el archivo XML: " + err.message);
        }
        e.target.value = "";
      };

      const procesarTimbrePdf417 = (val) => {
        setTimbreScan(val);
        if (val.includes("</TED>") || (val.includes("<F>") && val.includes("</F>"))) {
          const reMatch = val.match(/<RE>(.*?)<\/RE>/);
          const fMatch = val.match(/<F>(.*?)<\/F>/);
          const mMatch = val.match(/<MNT>(.*?)<\/MNT>/);
          const feMatch = val.match(/<FE>(.*?)<\/FE>/);
          setVistaPreviaFactura({
            origen: "Escaneo Timbre PDF417 SII",
            rutProveedor: reMatch ? formatearRut(reMatch[1]) : "S/I",
            proveedor: reMatch ? `PROVEEDOR ${formatearRut(reMatch[1])}` : "PROVEEDOR SII",
            folio: fMatch ? fMatch[1] : "S/N",
            fecha: feMatch ? feMatch[1] : new Date().toISOString().slice(0, 10),
            totalClp: mMatch ? Number(mMatch[1]) : 0,
            items: []
          });
          setTimbreScan("");
        }
      };

      const agregarItemVistaPrevia = (e) => {
        e.preventDefault();
        if (!itemNom.trim() || !vistaPreviaFactura) return;
        const nuevoItem = {
          codigo: itemCod.trim().toUpperCase(),
          nombre: itemNom.trim().toUpperCase(),
          cantidad: Math.max(1, Number(itemCant)),
          costoTotal: Number(itemCosto)
        };
        const itemsAct = [...vistaPreviaFactura.items, nuevoItem];
        setVistaPreviaFactura({
          ...vistaPreviaFactura,
          items: itemsAct,
          totalClp: vistaPreviaFactura.totalClp || itemsAct.reduce((a, b) => a + b.costoTotal, 0)
        });
        setItemCod("");
        setItemNom("");
        setItemCant(1);
        setItemCosto(0);
      };

      const confirmarYSumarStock = async () => {
        if (!vistaPreviaFactura) return;
        setGuardando(true);
        try {
          const batch = db.batch();
          const porNombre = new Map(catalogo.map((p) => [String(p.nombre || "").trim().toUpperCase(), p]));
          const porSku = new Map(catalogo.filter((p) => p.codigo).map((p) => [String(p.codigo || "").trim().toUpperCase(), p]));

          vistaPreviaFactura.items.forEach((it) => {
            const existente = (it.codigo && porSku.get(it.codigo)) || porNombre.get(it.nombre);
            if (existente) {
              const nuevoStock = (Number(existente.stockOnline) || 0) + Number(it.cantidad || 0);
              batch.update(catRef().doc(existente.id), { stockOnline: nuevoStock });
            } else {
              batch.set(catRef().doc(), {
                codigo: it.codigo || "",
                nombre: it.nombre,
                proveedor: vistaPreviaFactura.proveedor || "",
                stockOnline: Number(it.cantidad || 0)
              });
            }
          });

          const totalFinal = Number(vistaPreviaFactura.totalClp) || vistaPreviaFactura.items.reduce((a, b) => a + Number(b.costoTotal || 0), 0);
          batch.set(empRef().collection("compras_proveedores").doc(), {
            ...vistaPreviaFactura,
            totalClp: totalFinal,
            timestamp: Date.now()
          });

          await batch.commit();
          alert(`Factura #${vistaPreviaFactura.folio} registrada y stock sincronizado en el catálogo.`);
          setVistaPreviaFactura(null);
          setRutEmisor("");
          setFolioFactura("");
        } catch (err) {
          alert("Error al sincronizar: " + err.message);
        }
        setGuardando(false);
      };

      const ingresosTotales = useMemo(() => ventas.reduce((a, b) => a + Number(b.totalClp || 0), 0), [ventas]);
      const egresosTotales = useMemo(() => compras.reduce((a, b) => a + Number(b.totalClp || 0), 0), [compras]);

      if (!empresa) return <div className="min-h-screen flex items-center justify-center text-xs font-bold">Cargando módulo SII...</div>;

      const T = TEMAS[empresa.temaVisual || "claro_retail"] || TEMAS.claro_retail;
      const urlVolver = rutActivo === RUT_PGB ? "pgb-operacion.html" : "empresa-panel.html";

      return (
        <div className={`min-h-screen pb-20 ${T.page}`}>
          <div className="max-w-4xl mx-auto px-4 pt-5 space-y-4">
            <div className={`${T.card} rounded-2xl p-5 border-t-4 ${T.top} flex items-center justify-between gap-3`}>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <button onClick={() => window.location.replace(urlVolver)} className={`text-xs font-bold px-3 py-1 rounded-lg cursor-pointer ${T.btn}`}>
                    Volver
                  </button>
                  <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${T.tag}`}>
                    {empresa.nombre} • {empresa.rut}
                  </span>
                </div>
                <h1 className={`text-xl font-extrabold ${T.main}`}>Recepción Automática SII, Compras & Finanzas</h1>
                <p className={`text-xs ${T.sub}`}>Importa facturas vía OpenFactura, XML SII o lector PDF417 y suma stock al instante.</p>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-3">
              <div className={`${T.card} rounded-2xl p-4`}>
                <span className={`text-[10px] font-extrabold uppercase ${T.sub}`}>Ingresos</span>
                <p className="text-lg font-extrabold text-emerald-600 mt-1">${ingresosTotales.toLocaleString("es-CL")}</p>
              </div>
              <div className={`${T.card} rounded-2xl p-4`}>
                <span className={`text-[10px] font-extrabold uppercase ${T.sub}`}>Compras SII</span>
                <p className="text-lg font-extrabold text-rose-500 mt-1">${egresosTotales.toLocaleString("es-CL")}</p>
              </div>
              <div className={`${T.card} rounded-2xl p-4`}>
                <span className={`text-[10px] font-extrabold uppercase ${T.sub}`}>Resultado Neto</span>
                <p className={`text-lg font-extrabold mt-1 ${T.main}`}>${(ingresosTotales - egresosTotales).toLocaleString("es-CL")}</p>
              </div>
            </div>

            <div className={`${T.card} rounded-2xl p-1.5 grid grid-cols-2 gap-1.5`}>
              <button onClick={() => setTab("lector")} className={`py-2.5 rounded-xl text-xs font-extrabold cursor-pointer ${tab === "lector" ? T.btn : T.sec}`}>
                1. Lector Facturas SII
              </button>
              <button onClick={() => setTab("historial")} className={`py-2.5 rounded-xl text-xs font-extrabold cursor-pointer ${tab === "historial" ? T.btn : T.sec}`}>
                2. Historial Compras ({compras.length})
              </button>
            </div>

            {tab === "lector" && (
              <div className="space-y-4">
                {vistaPreviaFactura ? (
                  <div className={`${T.card} rounded-2xl p-5 space-y-4 border-2 border-blue-600`}>
                    <div className="flex items-center justify-between border-b border-slate-200/30 pb-3">
                      <div>
                        <span className={`text-[10px] font-extrabold uppercase px-2 py-0.5 rounded ${T.tag}`}>{vistaPreviaFactura.origen}</span>
                        <h2 className={`text-base font-extrabold mt-1 ${T.main}`}>
                          Factura #{vistaPreviaFactura.folio} • {vistaPreviaFactura.proveedor}
                        </h2>
                        <p className={`text-xs ${T.sub}`}>RUT: {vistaPreviaFactura.rutProveedor} • Fecha: {vistaPreviaFactura.fecha}</p>
                      </div>
                      <button onClick={() => setVistaPreviaFactura(null)} className={`text-xs font-bold px-3 py-1.5 rounded-xl cursor-pointer ${T.sec}`}>Cancelar</button>
                    </div>

                    <form onSubmit={agregarItemVistaPrevia} className="grid grid-cols-1 sm:grid-cols-5 gap-2">
                      <input type="text" value={itemCod} onChange={(e) => setItemCod(e.target.value)} placeholder="SKU" className={`rounded-xl px-3 py-2 text-xs font-bold ${T.input}`} />
                      <input type="text" value={itemNom} onChange={(e) => setItemNom(e.target.value)} placeholder="Producto *" className={`sm:col-span-2 rounded-xl px-3 py-2 text-xs font-bold ${T.input}`} required />
                      <input type="number" min="1" value={itemCant} onChange={(e) => setItemCant(e.target.value)} placeholder="Cant" className={`rounded-xl px-3 py-2 text-xs font-bold ${T.input}`} required />
                      <button type="submit" className={`rounded-xl px-3 py-2 text-xs font-extrabold cursor-pointer ${T.btn}`}>+ Ítem</button>
                    </form>

                    <div className="divide-y divide-slate-200/30">
                      {vistaPreviaFactura.items.length === 0 ? (
                        <p className={`text-xs text-center py-4 ${T.sub}`}>Agrega los productos recibidos arriba si el documento no trajo detalle XML.</p>
                      ) : (
                        vistaPreviaFactura.items.map((it, idx) => (
                          <div key={idx} className="py-2.5 flex items-center justify-between text-xs">
                            <span className={`font-bold ${T.main}`}>{it.codigo ? `[${it.codigo}] ` : ""}{it.nombre}</span>
                            <span className={`font-extrabold px-2.5 py-0.5 rounded ${T.tag}`}>+{it.cantidad} unds</span>
                          </div>
                        ))
                      )}
                    </div>

                    <button
                      onClick={confirmarYSumarStock}
                      disabled={guardando || vistaPreviaFactura.items.length === 0}
                      className={`w-full font-extrabold py-3.5 rounded-xl text-xs cursor-pointer ${T.btn}`}
                    >
                      {guardando ? "Sincronizando..." : "Confirmar y Sumar Ítems al Catálogo y Stock"}
                    </button>
                  </div>
                ) : (
                  <>
                    <form onSubmit={consultarPorFolioApi} className={`${T.card} rounded-2xl p-5 space-y-3`}>
                      <span className={`text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded ${T.tag}`}>Vía API (OpenFactura / SII)</span>
                      <h2 className={`text-base font-extrabold ${T.main}`}>Consultar Factura Completa por Folio</h2>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" value={rutEmisor} onChange={(e) => setRutEmisor(formatearRut(e.target.value))} placeholder="RUT Proveedor *" className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`} required />
                        <input type="text" value={folioFactura} onChange={(e) => setFolioFactura(e.target.value)} placeholder="N° Folio Factura *" className={`rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`} required />
                      </div>
                      <button type="submit" className={`w-full font-extrabold py-3 rounded-xl text-xs cursor-pointer ${T.btn}`}>
                        Descargar Factura Completa
                      </button>
                    </form>

                    <div className={`${T.card} rounded-2xl p-5 space-y-3`}>
                      <span className={`text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded ${T.tag}`}>Instantáneo Sin Digitar</span>
                      <h2 className={`text-base font-extrabold ${T.main}`}>Cargar XML DTE o Escanear Timbre SII</h2>
                      <label className={`block w-full text-center font-extrabold py-3.5 rounded-xl text-xs cursor-pointer ${T.btn}`}>
                        Subir Archivo XML de Factura (.xml)
                        <input type="file" accept=".xml" onChange={procesarArchivoXml} className="hidden" />
                      </label>
                      <input
                        type="text"
                        value={timbreScan}
                        onChange={(e) => procesarTimbrePdf417(e.target.value)}
                        placeholder="O haz clic aquí y escanea el código PDF417 del SII con pistola 2D"
                        className={`w-full rounded-xl px-3.5 py-2.5 text-xs font-semibold ${T.input}`}
                      />
                    </div>
                  </>
                )}
              </div>
            )}

            {tab === "historial" && (
              <div className={`${T.card} rounded-2xl p-5 space-y-3`}>
                <h2 className={`text-sm font-extrabold ${T.main}`}>Facturas de Compra Registradas ({compras.length})</h2>
                {compras.length === 0 ? (
                  <p className={`text-xs text-center py-8 ${T.sub}`}>Aún no hay facturas de compra registradas.</p>
                ) : (
                  <div className="divide-y divide-slate-200/30">
                    {compras.map((c) => (
                      <div key={c.id} className="py-3 flex items-center justify-between text-xs">
                        <div>
                          <span className={`font-extrabold ${T.main}`}>Factura #{c.folio} • {c.proveedor}</span>
                          <span className={`block text-[11px] ${T.sub}`}>{c.fecha} • {(c.items || []).length} productos sumados</span>
                        </div>
                        <span className={`font-extrabold ${T.main}`}>${Number(c.totalClp || 0).toLocaleString("es-CL")}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ComprasFinanzasApp />);
  </script>
</body>
</html>
