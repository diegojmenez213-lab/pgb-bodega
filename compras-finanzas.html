<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ERP • Compras a Proveedores & Balance Financiero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .corp-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 2px 14px -2px rgba(15, 23, 42, 0.04); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-slate-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      const cuerpo = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `${cuerpo}-${c.slice(-1)}`;
    };

    const PALETAS = {
      ejecutivo: { btn: "bg-slate-900 hover:bg-slate-800 text-white", tag: "bg-slate-100 text-slate-800", border: "border-slate-900" },
      ecommerce: { btn: "bg-blue-700 hover:bg-blue-800 text-white", tag: "bg-blue-50 text-blue-800", border: "border-blue-700" },
      logistica: { btn: "bg-emerald-700 hover:bg-emerald-800 text-white", tag: "bg-emerald-50 text-emerald-800", border: "border-emerald-700" },
      industrial: { btn: "bg-amber-700 hover:bg-amber-800 text-white", tag: "bg-amber-50 text-amber-800", border: "border-amber-700" }
    };

    function AppComprasFinanzas() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut")) || "");
      const [empresa, setEmpresa] = useState(null);
      const [pedidos, setPedidos] = useState([]);
      const [movimientos, setMovimientos] = useState([]);
      const [tab, setTab] = useState("compras");

      const [proveedor, setProveedor] = useState("");
      const [detallePedido, setDetallePedido] = useState("");
      const [montoPedido, setMontoPedido] = useState("");

      const [tipoMov, setTipoMov] = useState("Egreso Operativo");
      const [conceptoMov, setConceptoMov] = useState("");
      const [montoMov, setMontoMov] = useState("");

      useEffect(() => {
        if (!rutActivo) {
          window.location.href = "index.html";
          return;
        }
        let unsubs = [];
        const init = () => {
          const empRef = db.collection("saas_empresas").doc(rutActivo);
          const u1 = empRef.onSnapshot((doc) => {
            if (doc.exists) setEmpresa({ id: doc.id, ...doc.data() });
          });
          const u2 = empRef.collection("compras_proveedores").onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setPedidos(lista);
          });
          const u3 = empRef.collection("finanzas_movimientos").onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setMovimientos(lista);
          });
          unsubs = [u1, u2, u3];
        };
        auth.signInAnonymously().then(init).catch(init);
        return () => unsubs.forEach((f) => typeof f === "function" && f());
      }, [rutActivo]);

      const empRef = () => db.collection("saas_empresas").doc(rutActivo);

      const crearPedido = async (e) => {
        e.preventDefault();
        if (!proveedor.trim() || !detallePedido.trim()) return;
        await empRef().collection("compras_proveedores").add({
          proveedor: proveedor.trim().toUpperCase(),
          detalle: detallePedido.trim(),
          monto: Number(montoPedido || 0),
          recibido: false,
          fecha: new Date().toLocaleDateString("es-CL"),
          timestamp: Date.now()
        });
        setProveedor("");
        setDetallePedido("");
        setMontoPedido("");
      };

      const marcarRecibido = async (p) => {
        await empRef().collection("compras_proveedores").doc(p.id).update({ recibido: !p.recibido });
      };

      const registrarMovimiento = async (e) => {
        e.preventDefault();
        if (!conceptoMov.trim() || !montoMov) return;
        await empRef().collection("finanzas_movimientos").add({
          tipo: tipoMov,
          concepto: conceptoMov.trim(),
          monto: Number(montoMov),
          fecha: new Date().toLocaleDateString("es-CL"),
          timestamp: Date.now()
        });
        setConceptoMov("");
        setMontoMov("");
      };

      const balance = useMemo(() => {
        let ingresos = 0, egresos = 0;
        movimientos.forEach((m) => {
          if (m.tipo === "Ingreso") ingresos += Number(m.monto || 0);
          else egresos += Number(m.monto || 0);
        });
        pedidos.filter((p) => p.recibido).forEach((p) => {
          egresos += Number(p.monto || 0);
        });
        return { ingresos, egresos, neto: ingresos - egresos };
      }, [movimientos, pedidos]);

      const urlVolver = rutActivo === RUT_PGB ? "pgb-operacion.html" : "empresa-panel.html";
      const tema = PALETAS[empresa?.paleta || "ejecutivo"] || PALETAS.ejecutivo;

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-5 pb-24 space-y-6">
          <div className={`corp-card rounded-2xl p-6 sm:p-8 border-t-4 ${tema.border} flex flex-col md:flex-row md:items-center justify-between gap-4`}>
            <div className="flex items-center gap-4">
              {empresa?.logoBase64 && (
                <div className="w-24 h-16 rounded-xl border border-slate-200 bg-white flex items-center justify-center p-1.5 shrink-0">
                  <img src={empresa.logoBase64} alt={empresa.nombre} className="max-h-full max-w-full object-contain" />
                </div>
              )}
              <div>
                <div className="flex flex-wrap items-center gap-2 mb-1.5">
                  <a href={urlVolver} className={`text-xs font-bold px-3.5 py-1.5 rounded-xl ${tema.btn}`}>
                    Volver
                  </a>
                  <span className={`text-[11px] font-bold px-3 py-1 rounded-full ${tema.tag}`}>
                    {empresa?.nombre || "Cargando..."} • {empresa?.rut || formatearRut(rutActivo)}
                  </span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900">Compras a Proveedores & Balance Financiero</h1>
                <p className="text-xs text-slate-500 mt-0.5">Reposición de mercadería, recepción de órdenes y flujo financiero consolidado.</p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div className="corp-card rounded-2xl p-4">
              <span className="text-[10px] font-bold uppercase text-slate-400">Ingresos Registrados</span>
              <p className="text-xl font-extrabold text-emerald-700 mt-1">${balance.ingresos.toLocaleString("es-CL")}</p>
            </div>
            <div className="corp-card rounded-2xl p-4">
              <span className="text-[10px] font-bold uppercase text-slate-400">Egresos y Compras</span>
              <p className="text-xl font-extrabold text-rose-700 mt-1">${balance.egresos.toLocaleString("es-CL")}</p>
            </div>
            <div className="corp-card rounded-2xl p-4">
              <span className="text-[10px] font-bold uppercase text-slate-400">Resultado Neto</span>
              <p className="text-xl font-extrabold text-slate-900 mt-1">${balance.neto.toLocaleString("es-CL")}</p>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-1.5 bg-white p-1.5 rounded-2xl border border-slate-200">
            <button onClick={() => setTab("compras")} className={`py-2.5 rounded-xl text-xs font-bold cursor-pointer ${tab === "compras" ? tema.btn : "text-slate-600"}`}>Pedidos a Proveedores ({pedidos.length})</button>
            <button onClick={() => setTab("finanzas")} className={`py-2.5 rounded-xl text-xs font-bold cursor-pointer ${tab === "finanzas" ? tema.btn : "text-slate-600"}`}>Flujo Financiero ({movimientos.length})</button>
          </div>

          {tab === "compras" && (
            <div className="space-y-4">
              <form onSubmit={crearPedido} className="corp-card rounded-2xl p-6 grid grid-cols-1 sm:grid-cols-4 gap-3">
                <input type="text" value={proveedor} onChange={(e) => setProveedor(e.target.value)} placeholder="Proveedor *" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold" required />
                <input type="text" value={detallePedido} onChange={(e) => setDetallePedido(e.target.value)} placeholder="Detalle de mercadería *" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold" required />
                <input type="number" min="0" value={montoPedido} onChange={(e) => setMontoPedido(e.target.value)} placeholder="Monto Total CLP" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold" />
                <button type="submit" className={`font-bold py-2.5 px-4 rounded-xl text-xs cursor-pointer ${tema.btn}`}>Registrar Pedido</button>
              </form>

              <div className="corp-card rounded-2xl p-6 space-y-2.5">
                {pedidos.map((p) => (
                  <div key={p.id} className="p-4 border border-slate-200 rounded-xl flex flex-wrap items-center justify-between gap-2 text-xs">
                    <div>
                      <span className={`font-bold px-2 py-0.5 rounded mr-2 ${tema.tag}`}>{p.proveedor}</span>
                      <strong className="text-slate-900">{p.detalle}</strong>
                      <span className="block text-[11px] text-slate-500 mt-0.5">${Number(p.monto).toLocaleString("es-CL")} CLP • {p.fecha}</span>
                    </div>
                    <button onClick={() => marcarRecibido(p)} className={`font-bold px-3.5 py-1.5 rounded-xl cursor-pointer ${p.recibido ? "bg-emerald-700 text-white" : tema.btn}`}>
                      {p.recibido ? "Recibido en Bodega" : "Confirmar Recepción"}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === "finanzas" && (
            <div className="space-y-4">
              <form onSubmit={registrarMovimiento} className="corp-card rounded-2xl p-6 grid grid-cols-1 sm:grid-cols-4 gap-3">
                <select value={tipoMov} onChange={(e) => setTipoMov(e.target.value)} className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold">
                  <option>Ingreso</option>
                  <option>Egreso Operativo</option>
                </select>
                <input type="text" value={conceptoMov} onChange={(e) => setConceptoMov(e.target.value)} placeholder="Concepto *" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold" required />
                <input type="number" min="1" value={montoMov} onChange={(e) => setMontoMov(e.target.value)} placeholder="Monto CLP *" className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold" required />
                <button type="submit" className={`font-bold py-2.5 px-4 rounded-xl text-xs cursor-pointer ${tema.btn}`}>Registrar Movimiento</button>
              </form>

              <div className="corp-card rounded-2xl p-6 space-y-2">
                {movimientos.map((m) => (
                  <div key={m.id} className="p-3.5 border border-slate-200 rounded-xl flex justify-between items-center text-xs">
                    <div>
                      <span className={`font-bold px-2 py-0.5 rounded mr-2 ${m.tipo === "Ingreso" ? "bg-emerald-50 text-emerald-700" : "bg-rose-50 text-rose-700"}`}>{m.tipo}</span>
                      <strong className="text-slate-900">{m.concepto}</strong> <span className="text-slate-400">({m.fecha})</span>
                    </div>
                    <span className="font-extrabold text-slate-900">${Number(m.monto).toLocaleString("es-CL")}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AppComprasFinanzas />);
  </script>
</body>
</html>
