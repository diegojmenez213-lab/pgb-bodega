<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ERP • Compras a Proveedores y Finanzas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .card-clean { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); }
  </style>
  <script>
    window.onerror = function (msg, url, line) {
      var box = document.getElementById("error-fallback");
      if (box) {
        box.style.display = "block";
        box.innerText = "Error detectado (Línea " + line + "): " + msg;
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-amber-400 selection:text-slate-950">
  <div id="error-fallback" style="display:none; background:#fee2e2; color:#991b1b; padding:14px; font-size:12px; font-weight:700; border-bottom:2px solid #ef4444;"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      return `${c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".")}-${c.slice(-1)}`;
    };

    const CATEGORIAS_GASTO = [
      "Compra de Mercadería / Proveedores",
      "Sueldos y Honorarios",
      "Arriendo y Gastos Comunes",
      "Combustible, Fletes y Despacho",
      "Servicios Básicos e Internet",
      "Insumos, Embalaje y Otros"
    ];

    function AppComprasFinanzas() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut")) || "775280425");
      const [empresa, setEmpresa] = useState(null);
      const [catalogo, setCatalogo] = useState([]);
      const [ordenesCompra, setOrdenesCompra] = useState([]);
      const [ventasPos, setVentasPos] = useState([]);
      const [ordenesEcommerce, setOrdenesEcommerce] = useState([]);
      const [gastos, setGastos] = useState([]);

      const [tab, setTab] = useState("finanzas"); // finanzas | compras

      // Estado Módulo 17: Pedidos a Proveedores
      const [proveedorFiltro, setProveedorFiltro] = useState("TODOS");
      const [soloStockCritico, setSoloStockCritico] = useState(false);
      const [pedidoCantidades, setPedidoCantidades] = useState({});
      const [proveedorOrdenNombre, setProveedorOrdenNombre] = useState("");
      const [costoEstimadoOc, setCostoEstimadoOc] = useState("");

      // Estado Módulo 18: Registro de Gastos
      const [conceptoGasto, setConceptoGasto] = useState("");
      const [categoriaGasto, setCategoriaGasto] = useState(CATEGORIAS_GASTO[0]);
      const [montoGasto, setMontoGasto] = useState("");
      const [fechaGasto, setFechaGasto] = useState(() => new Date().toISOString().split("T")[0]);

      useEffect(() => {
        let unsubs = [];
        const conectar = () => {
          const empRef = db.collection("saas_empresas").doc(rutActivo);

          const u1 = empRef.onSnapshot((doc) => {
            if (doc.exists) {
              setEmpresa({ id: doc.id, ...doc.data() });
            } else {
              setEmpresa({ id: rutActivo, rut: formatearRut(rutActivo), nombre: `Empresa ${formatearRut(rutActivo)}` });
            }
          });

          const colCat = rutActivo === "769497226"
            ? db.collection("catalogo_productos")
            : empRef.collection("catalogo");

          const u2 = colCat.onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, stockOnline: 20, ...d.data() }));
            lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
            setCatalogo(lista);
          });

          const u3 = empRef.collection("ordenes_compra").onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setOrdenesCompra(lista);
          });

          const u4 = empRef.collection("ventas_pos").onSnapshot((snap) => {
            setVentasPos(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          });

          const u5 = empRef.collection("ecommerce_ordenes").onSnapshot((snap) => {
            setOrdenesEcommerce(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          });

          const u6 = empRef.collection("gastos_operativos").onSnapshot((snap) => {
            const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setGastos(lista);
          });

          unsubs = [u1, u2, u3, u4, u5, u6];
        };

        auth.signInAnonymously().then(conectar).catch(conectar);
        return () => unsubs.forEach((fn) => typeof fn === "function" && fn());
      }, [rutActivo]);

      const empRef = () => db.collection("saas_empresas").doc(rutActivo);
      const catRef = () =>
        rutActivo === "769497226"
          ? db.collection("catalogo_productos")
          : empRef().collection("catalogo");

      // Proveedores disponibles en catálogo
      const proveedoresLista = useMemo(() => {
        const s = new Set();
        catalogo.forEach((p) => {
          if (p.proveedor && p.proveedor.trim()) s.add(p.proveedor.trim().toUpperCase());
        });
        return Array.from(s).sort();
      }, [catalogo]);

      const productosFiltradosOc = useMemo(() => {
        return catalogo.filter((p) => {
          if (proveedorFiltro !== "TODOS" && (p.proveedor || "").trim().toUpperCase() !== proveedorFiltro) return false;
          if (soloStockCritico && Number(p.stockOnline ?? 20) > 5) return false;
          return true;
        });
      }, [catalogo, proveedorFiltro, soloStockCritico]);

      const itemsSeleccionadosOc = useMemo(() => {
        return catalogo
          .filter((p) => Number(pedidoCantidades[p.id]) > 0)
          .map((p) => ({
            id: p.id,
            codigo: p.codigo || "S/C",
            nombre: p.nombre,
            proveedor: p.proveedor || "General",
            cantidadPedida: Number(pedidoCantidades[p.id])
          }));
      }, [catalogo, pedidoCantidades]);

      const crearOrdenCompra = async (e) => {
        e.preventDefault();
        if (itemsSeleccionadosOc.length === 0) {
          return alert("Ingresa la cantidad a pedir en al menos un producto.");
        }
        const provFinal =
          proveedorOrdenNombre.trim() ||
          (proveedorFiltro !== "TODOS" ? proveedorFiltro : itemsSeleccionadosOc[0].proveedor);

        const nuevaOc = {
          folio: `OC-${Math.floor(1000 + Math.random() * 9000)}`,
          proveedor: provFinal,
          items: itemsSeleccionadosOc,
          costoTotal: Number(costoEstimadoOc || 0),
          recibida: false,
          fecha: new Date().toLocaleString("es-CL"),
          timestamp: Date.now()
        };

        try {
          await empRef().collection("ordenes_compra").add(nuevaOc);
          setPedidoCantidades({});
          setProveedorOrdenNombre("");
          setCostoEstimadoOc("");
          alert(`✅ Orden de Compra ${nuevaOc.folio} creada para ${provFinal}.`);
        } catch (err) {
          alert(err.message);
        }
      };

      const copiarPedidoWhatsApp = (oc) => {
        let txt = `📦 *ORDEN DE COMPRA ${oc.folio}*\n🏢 Empresa: ${empresa?.nombre}\n🏭 Proveedor: ${oc.proveedor}\n━━━━━━━━━━━━━━\n`;
        (oc.items || []).forEach((it, idx) => {
          txt += `${idx + 1}. *[${it.codigo}] ${it.nombre}* — Cant: *${it.cantidadPedida}*\n`;
        });
        navigator.clipboard.writeText(txt);
        alert("📋 Pedido copiado al portapapeles para enviar por WhatsApp al proveedor.");
      };

      const recibirMercaderiaOc = async (oc) => {
        if (!confirm(`¿Confirmas la recepción física de ${oc.folio}? Esto sumará automáticamente las cantidades al inventario.`)) return;

        try {
          const batch = db.batch();
          batch.update(empRef().collection("ordenes_compra").doc(oc.id), {
            recibida: true,
            fechaRecepcion: new Date().toLocaleString("es-CL")
          });

          (oc.items || []).forEach((it) => {
            const prodCat = catalogo.find((p) => p.id === it.id);
            if (prodCat) {
              const nuevoStock = Number(prodCat.stockOnline ?? 20) + Number(it.cantidadPedida);
              batch.update(catRef().doc(it.id), { stockOnline: nuevoStock });
            }
          });

          // Si tiene costo asociado, registrarlo automáticamente como gasto de mercadería
          if (Number(oc.costoTotal) > 0) {
            batch.set(empRef().collection("gastos_operativos").doc(), {
              concepto: `Recepción ${oc.folio} (${oc.proveedor})`,
              categoria: "Compra de Mercadería / Proveedores",
              monto: Number(oc.costoTotal),
              fecha: new Date().toISOString().split("T")[0],
              timestamp: Date.now()
            });
          }

          await batch.commit();
          alert("✅ Mercadería ingresada al inventario y actualizada en todos los canales.");
        } catch (err) {
          alert(err.message);
        }
      };

      // Módulo 18: Gastos y Balance Consolidado
      const registrarGasto = async (e) => {
        e.preventDefault();
        if (!conceptoGasto.trim() || !montoGasto) return;
        try {
          await empRef().collection("gastos_operativos").add({
            concepto: conceptoGasto.trim(),
            categoria: categoriaGasto,
            monto: Number(montoGasto),
            fecha: fechaGasto,
            timestamp: Date.now()
          });
          setConceptoGasto("");
          setMontoGasto("");
        } catch (err) {
          alert(err.message);
        }
      };

      const eliminarGasto = async (id) => {
        if (confirm("¿Eliminar este gasto?")) {
          await empRef().collection("gastos_operativos").doc(id).delete();
        }
      };

      const finanzas = useMemo(() => {
        const ingresosPos = ventasPos
          .filter((v) => v.tipo === "venta")
          .reduce((s, v) => s + Number(v.total || 0), 0);

        const ingresosEcommerce = ordenesEcommerce.reduce((s, o) => s + Number(o.totalClp || 0), 0);
        const ingresosTotales = ingresosPos + ingresosEcommerce;
        const gastosTotales = gastos.reduce((s, g) => s + Number(g.monto || 0), 0);
        const utilidadNeta = ingresosTotales - gastosTotales;
        const margenPct = ingresosTotales > 0 ? Math.round((utilidadNeta / ingresosTotales) * 1000) / 10 : 0;

        return { ingresosPos, ingresosEcommerce, ingresosTotales, gastosTotales, utilidadNeta, margenPct };
      }, [ventasPos, ordenesEcommerce, gastos]);

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-5 pb-24 space-y-6">
          {/* CABECERA */}
          <div className="card-clean rounded-3xl p-5 sm:p-7 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <div className="flex flex-wrap items-center gap-2 mb-2">
                <a href="index.html" className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl">
                  ← Volver al Núcleo
                </a>
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-extrabold px-3 py-1 rounded-full">
                  ● {empresa?.nombre || "Cargando..."} ({empresa?.rut || formatearRut(rutActivo)})
                </span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-black text-slate-900">
                📈 GERENCIA: <span className="text-amber-500">COMPRAS Y FINANZAS</span>
              </h1>
              <p className="text-xs text-slate-500 mt-0.5">
                Reposición inteligente a proveedores, recepción de stock y estado de resultados consolidado en tiempo real.
              </p>
            </div>
          </div>

          {/* PESTAÑAS */}
          <div className="grid grid-cols-2 gap-2 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
            <button
              onClick={() => setTab("finanzas")}
              className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tab === "finanzas" ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-100"}`}
            >
              📈 Balance y Flujo Financiero (M18)
            </button>
            <button
              onClick={() => setTab("compras")}
              className={`py-3 px-3 rounded-xl text-xs sm:text-sm font-black transition cursor-pointer ${tab === "compras" ? "bg-amber-500 text-slate-950" : "text-slate-600 hover:bg-slate-100"}`}
            >
              📋 Pedidos a Proveedores (M17)
            </button>
          </div>

          {/* MÓDULO 18: DASHBOARD FINANCIERO EJECUTIVO */}
          {tab === "finanzas" && (
            <div className="space-y-6">
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                <div className="card-clean rounded-2xl p-4">
                  <span className="text-[10px] font-extrabold uppercase text-slate-500">Ingresos Totales</span>
                  <p className="text-xl sm:text-2xl font-black text-slate-900 mt-1">${finanzas.ingresosTotales.toLocaleString("es-CL")}</p>
                  <span className="text-[10px] text-slate-500 block mt-0.5">POS + E-Commerce</span>
                </div>
                <div className="card-clean rounded-2xl p-4 border-rose-200 bg-rose-50/30">
                  <span className="text-[10px] font-extrabold uppercase text-rose-800">Egresos / Gastos</span>
                  <p className="text-xl sm:text-2xl font-black text-rose-600 mt-1">${finanzas.gastosTotales.toLocaleString("es-CL")}</p>
                  <span className="text-[10px] text-rose-700 block mt-0.5">{gastos.length} movimientos</span>
                </div>
                <div className={`card-clean rounded-2xl p-4 ${finanzas.utilidadNeta >= 0 ? "border-emerald-300 bg-emerald-50/40" : "border-rose-300 bg-rose-50/50"}`}>
                  <span className="text-[10px] font-extrabold uppercase text-emerald-800">Flujo / Utilidad Neta</span>
                  <p className={`text-xl sm:text-2xl font-black mt-1 ${finanzas.utilidadNeta >= 0 ? "text-emerald-700" : "text-rose-700"}`}>
                    ${finanzas.utilidadNeta.toLocaleString("es-CL")}
                  </p>
                  <span className="text-[10px] font-bold text-slate-600 block mt-0.5">Margen: {finanzas.margenPct}%</span>
                </div>
                <div className="card-clean rounded-2xl p-4 border-indigo-200 bg-indigo-50/30">
                  <span className="text-[10px] font-extrabold uppercase text-indigo-800">Desglose Canales</span>
                  <p className="text-xs font-black text-slate-800 mt-1.5">POS: ${finanzas.ingresosPos.toLocaleString("es-CL")}</p>
                  <p className="text-xs font-black text-indigo-700">Web: ${finanzas.ingresosEcommerce.toLocaleString("es-CL")}</p>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                <form onSubmit={registrarGasto} className="card-clean rounded-3xl p-6 space-y-3.5 h-fit">
                  <h2 className="text-base font-black text-slate-900">➖ Registrar Egreso / Gasto</h2>
                  <div>
                    <label className="text-xs font-bold text-slate-600 block mb-1">Concepto *</label>
                    <input
                      type="text"
                      value={conceptoGasto}
                      onChange={(e) => setConceptoGasto(e.target.value)}
                      placeholder="Ej: Pago arriendo bodega / Bencina"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold outline-none"
                      required
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600 block mb-1">Categoría</label>
                    <select
                      value={categoriaGasto}
                      onChange={(e) => setCategoriaGasto(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold outline-none"
                    >
                      {CATEGORIAS_GASTO.map((c) => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">Monto CLP *</label>
                      <input
                        type="number"
                        min="1"
                        value={montoGasto}
                        onChange={(e) => setMontoGasto(e.target.value)}
                        placeholder="150000"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-black outline-none"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600 block mb-1">Fecha</label>
                      <input
                        type="date"
                        value={fechaGasto}
                        onChange={(e) => setFechaGasto(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none"
                      />
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-3 rounded-xl text-xs cursor-pointer">
                    💾 Guardar Egreso
                  </button>
                </form>

                <div className="lg:col-span-2 card-clean rounded-3xl p-6 space-y-3">
                  <h2 className="text-base font-black text-slate-900">📜 Historial de Egresos y Compras</h2>
                  {gastos.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-10 bg-slate-50 rounded-2xl">
                      No hay egresos registrados aún.
                    </p>
                  ) : (
                    <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                      {gastos.map((g) => (
                        <div key={g.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 flex items-center justify-between gap-3 text-xs">
                          <div>
                            <p className="font-black text-slate-900">{g.concepto}</p>
                            <p className="text-[11px] text-slate-500">{g.categoria} • {g.fecha}</p>
                          </div>
                          <div className="flex items-center gap-3">
                            <span className="font-black text-rose-600 text-sm">-${Number(g.monto).toLocaleString("es-CL")}</span>
                            <button onClick={() => eliminarGasto(g.id)} className="text-rose-500 hover:text-rose-700 font-bold cursor-pointer">
                              🗑️
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MÓDULO 17: PEDIDOS SUGERIDOS A PROVEEDORES Y RECEPCIÓN */}
          {tab === "compras" && (
            <div className="space-y-6">
              <form onSubmit={crearOrdenCompra} className="card-clean rounded-3xl p-6 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-black text-slate-900">📋 Armar Orden de Compra por Proveedor</h2>
                    <p className="text-xs text-slate-500">
                      Filtra por marca o stock crítico, define cantidades y genera tu orden lista para WhatsApp.
                    </p>
                  </div>
                  <label className="flex items-center gap-2 text-xs font-black text-rose-700 bg-rose-50 border border-rose-200 px-3 py-2 rounded-xl cursor-pointer">
                    <input
                      type="checkbox"
                      checked={soloStockCritico}
                      onChange={(e) => setSoloStockCritico(e.target.checked)}
                      className="accent-rose-600"
                    />
                    <span>Solo stock bajo (≤ 5 unds)</span>
                  </label>
                </div>

                {/* Botones Proveedor */}
                <div className="flex flex-wrap gap-1.5">
                  <button
                    type="button"
                    onClick={() => setProveedorFiltro("TODOS")}
                    className={`px-3 py-1.5 rounded-xl text-xs font-black border cursor-pointer ${
                      proveedorFiltro === "TODOS" ? "bg-slate-900 text-white border-slate-900" : "bg-slate-50 text-slate-700 border-slate-300"
                    }`}
                  >
                    Todos ({catalogo.length})
                  </button>
                  {proveedoresLista.map((prov) => (
                    <button
                      type="button"
                      key={prov}
                      onClick={() => setProveedorFiltro(prov)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-black border cursor-pointer ${
                        proveedorFiltro === prov ? "bg-amber-500 text-slate-950 border-amber-500" : "bg-white text-slate-700 border-slate-300"
                      }`}
                    >
                      {prov}
                    </button>
                  ))}
                </div>

                {/* Lista de productos para pedir */}
                <div className="max-h-72 overflow-y-auto divide-y divide-slate-200 border border-slate-200 rounded-2xl">
                  {productosFiltradosOc.length === 0 ? (
                    <p className="p-8 text-center text-xs text-slate-500">Sin productos en este filtro.</p>
                  ) : (
                    productosFiltradosOc.slice(0, 100).map((p) => (
                      <div key={p.id} className="px-4 py-2.5 flex items-center justify-between gap-3 text-xs">
                        <div className="min-w-0">
                          <span className="font-bold text-slate-900 block truncate">
                            {p.codigo ? `[${p.codigo}] ` : ""}{p.nombre}
                          </span>
                          <span className="text-[10px] text-slate-500">
                            Prov: {p.proveedor || "General"} • Stock actual: <strong>{p.stockOnline ?? 20}</strong>
                          </span>
                        </div>
                        <input
                          type="number"
                          min="0"
                          placeholder="Pedir"
                          value={pedidoCantidades[p.id] || ""}
                          onChange={(e) => setPedidoCantidades({ ...pedidoCantidades, [p.id]: e.target.value })}
                          className="w-20 bg-slate-50 border border-slate-300 focus:border-amber-500 rounded-xl px-2.5 py-1.5 text-center font-black outline-none"
                        />
                      </div>
                    ))
                  )}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                  <input
                    type="text"
                    value={proveedorOrdenNombre}
                    onChange={(e) => setProveedorOrdenNombre(e.target.value)}
                    placeholder={proveedorFiltro !== "TODOS" ? `Proveedor: ${proveedorFiltro}` : "Nombre Proveedor (Opcional)"}
                    className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold outline-none"
                  />
                  <input
                    type="number"
                    min="0"
                    value={costoEstimadoOc}
                    onChange={(e) => setCostoEstimadoOc(e.target.value)}
                    placeholder="Costo Total Orden CLP (Opcional)"
                    className="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold outline-none"
                  />
                  <button
                    type="submit"
                    className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-2.5 px-4 rounded-xl text-xs sm:text-sm cursor-pointer"
                  >
                    ➕ Generar Orden ({itemsSeleccionadosOc.length} ítems)
                  </button>
                </div>
              </form>

              {/* Órdenes de Compra Emitidas */}
              <div className="card-clean rounded-3xl p-6 space-y-3">
                <h2 className="text-base font-black text-slate-900">🚚 Órdenes de Compra Emitidas ({ordenesCompra.length})</h2>
                {ordenesCompra.length === 0 ? (
                  <p className="text-xs text-slate-500 text-center py-8 bg-slate-50 rounded-2xl">Aún no has emitido órdenes de compra.</p>
                ) : (
                  ordenesCompra.map((oc) => (
                    <div key={oc.id} className={`border rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-xs ${oc.recibida ? "bg-emerald-50/40 border-emerald-200" : "bg-slate-50 border-slate-200"}`}>
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="font-black text-slate-900 text-sm">{oc.folio}</span>
                          <span className="bg-amber-100 text-amber-900 px-2.5 py-0.5 rounded font-bold">{oc.proveedor}</span>
                          <span className="text-slate-500">{oc.items?.length || 0} productos</span>
                        </div>
                        <p className="text-slate-600">
                          Creada: {oc.fecha} {oc.costoTotal > 0 ? `• Costo: $${Number(oc.costoTotal).toLocaleString("es-CL")}` : ""}
                        </p>
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        <button
                          type="button"
                          onClick={() => copiarPedidoWhatsApp(oc)}
                          className="bg-slate-900 hover:bg-slate-800 text-white font-bold px-3 py-2 rounded-xl cursor-pointer"
                        >
                          📲 Copiar Pedido
                        </button>
                        {!oc.recibida ? (
                          <button
                            type="button"
                            onClick={() => recibirMercaderiaOc(oc)}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-3.5 py-2 rounded-xl cursor-pointer"
                          >
                            📥 Recibir Mercadería (+Stock)
                          </button>
                        ) : (
                          <span className="bg-emerald-100 text-emerald-800 border border-emerald-300 px-3 py-2 rounded-xl font-black">
                            ✅ Stock Ingresado
                          </span>
                        )}
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AppComprasFinanzas />);
  </script>
</body>
</html>
