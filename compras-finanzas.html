<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NEXUS ERP • Recepción XML SII, Carga por Foto, Cuadratura IVA & Archivo</title>
  <script>
    // GUARDIA DE SEGURIDAD INMEDIATO (BLOQUEA RETROCESO / BFCACHE ENTRE EMPRESAS)
    (function () {
      var limpiar = function (r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); };
      var rutInicial = limpiar(localStorage.getItem("nexus_empresa_rut"));
      if (!rutInicial) window.location.replace("index.html");
      window.addEventListener("pageshow", function (ev) {
        var rutActual = limpiar(localStorage.getItem("nexus_empresa_rut"));
        if (!rutActual) window.location.replace("index.html");
        else if (ev.persisted && rutActual !== rutInicial) window.location.reload();
      });
      window.addEventListener("storage", function (ev) {
        if (ev.key === "nexus_empresa_rut") {
          var rutNuevo = limpiar(ev.newValue);
          if (!rutNuevo) window.location.replace("index.html");
          else if (rutNuevo !== rutInicial) window.location.reload();
        }
      });
    })();
  </script>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA49y0R5hCMLuPX-v8P2o9A_fUMnek1K1Y",
      authDomain: "pgb-bodegad.firebaseapp.com",
      projectId: "pgb-bodegad",
      storageBucket: "pgb-bodegad.firebasestorage.app",
      messagingSenderId: "497839332750",
      appId: "1:497839332750:web:bb1e6003a603d60cafd8df"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const FieldValue = firebase.firestore.FieldValue;

    const RUT_PGB = "769497226";
    const limpiarRut = (r) => String(r || "").replace(/[^0-9kK]/g, "").toUpperCase();
    const formatearRut = (r) => {
      const c = limpiarRut(r);
      if (c.length < 2) return c;
      return `${c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".")}-${c.slice(-1)}`;
    };

    // FECHA Y HORA LOCAL OFICIAL DE CHILE (AMERICA/SANTIAGO)
    const fechaIsoChile = (ts = Date.now()) => {
      try {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Santiago",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(new Date(ts));
      } catch (e) {
        const d = new Date(ts);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
    };

    const fechaLegibleChile = (ts = Date.now()) => {
      try {
        return new Intl.DateTimeFormat("es-CL", {
          timeZone: "America/Santiago",
          dateStyle: "short",
          timeStyle: "short"
        }).format(new Date(ts));
      } catch (e) {
        return new Date(ts).toLocaleString("es-CL");
      }
    };

    const TEMAS = {
      claro_retail: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", muted: "bg-slate-50 border border-slate-200", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-blue-700 hover:bg-blue-800 text-white", sec: "bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200", tag: "bg-blue-50 text-blue-800", top: "border-blue-700" },
      claro_ejecutivo: { page: "bg-slate-100 text-slate-900", card: "bg-white border border-slate-300 shadow-sm", muted: "bg-slate-100 border border-slate-200", main: "text-slate-900", sub: "text-slate-600", input: "bg-white border border-slate-300 text-slate-900", btn: "bg-slate-900 hover:bg-slate-800 text-white", sec: "bg-slate-200 text-slate-800", tag: "bg-slate-200 text-slate-800", top: "border-slate-900" },
      oscuro_obsidian: { page: "bg-slate-950 text-slate-100", card: "bg-slate-900 border border-slate-800 shadow-lg", muted: "bg-slate-950 border border-slate-800", main: "text-white", sub: "text-slate-400", input: "bg-slate-950 border border-slate-700 text-white", btn: "bg-indigo-600 hover:bg-indigo-500 text-white", sec: "bg-slate-800 text-slate-200 border border-slate-700", tag: "bg-indigo-950 text-indigo-300", top: "border-indigo-500" },
      claro_esmeralda: { page: "bg-slate-50 text-slate-900", card: "bg-white border border-slate-200 shadow-sm", muted: "bg-emerald-50/40 border border-emerald-200", main: "text-slate-900", sub: "text-slate-500", input: "bg-slate-50 border border-slate-300 text-slate-900", btn: "bg-emerald-700 hover:bg-emerald-800 text-white", sec: "bg-slate-100 text-slate-800", tag: "bg-emerald-50 text-emerald-800", top: "border-emerald-700" }
    };

    function ComprasFinanzasApp() {
      const [rutActivo] = useState(() => limpiarRut(localStorage.getItem("nexus_empresa_rut") || ""));
      const [empresa, setEmpresa] = useState(null);
      const [catalogo, setCatalogo] = useState([]);
      const [compras, setCompras] = useState([]);
      const [ventas, setVentas] = useState([]);

      const [tab, setTab] = useState("lector");
      const [rutEmisor, setRutEmisor] = useState("");
      const [folioFactura, setFolioFactura] = useState("");
      const [timbreScan, setTimbreScan] = useState("");

      // Pre-visualización editable + foto de referencia local (no pesa en Firestore)
      const [vistaPreviaFactura, setVistaPreviaFactura] = useState(null);
      const [fotoReferenciaUrl, setFotoReferenciaUrl] = useState("");
      const [guardando, setGuardando] = useState(false);

      // Nuevo ítem manual en la pre-visualización
      const [itemCod, setItemCod] = useState("");
      const [itemNom, setItemNom] = useState("");
      const [itemCant, setItemCant] = useState(1);
      const [itemNetoUnit, setItemNetoUnit] = useState(0);
      const [itemExento, setItemExento] = useState(false);

      // Archivo Histórico Infinito de Compras
      const [busquedaArchivo, setBusquedaArchivo] = useState("");
      const [fechaDesdeArchivo, setFechaDesdeArchivo] = useState("");
      const [fechaHastaArchivo, setFechaHastaArchivo] = useState("");
      const [facturaAuditando, setFacturaAuditando] = useState(null);

      useEffect(() => {
        return () => {
          if (fotoReferenciaUrl) URL.revokeObjectURL(fotoReferenciaUrl);
        };
      }, [fotoReferenciaUrl]);

      useEffect(() => {
        if (!rutActivo) {
          window.location.replace("index.html");
          return;
        }
        auth.signInAnonymously().catch(() => {});
        const empRef = db.collection("saas_empresas").doc(rutActivo);

        const u1 = empRef.onSnapshot((doc) => {
          if (!doc.exists) {
            window.location.replace("index.html");
            return;
          }
          const data = { id: doc.id, ...doc.data() };
          if (data.activa === false) {
            localStorage.removeItem("nexus_empresa_rut");
            window.location.replace("index.html");
            return;
          }
          const m = data.modulosActivos || {};
          if (rutActivo !== RUT_PGB && !m.m17_compras_prov && !m.m18_finanzas_bi) {
            window.location.replace("empresa-panel.html");
            return;
          }
          setEmpresa(data);
        });

        const colCat = rutActivo === RUT_PGB ? db.collection("catalogo_productos") : empRef.collection("catalogo");
        const u2 = colCat.onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, stockOnline: 0, ...d.data() }));
          lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
          setCatalogo(lista);
        });

        const u3 = empRef.collection("compras_proveedores").onSnapshot((snap) => {
          const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setCompras(lista);
        });

        const u4 = empRef.collection("ecommerce_ordenes").onSnapshot((snap) => {
          setVentas(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        });

        return () => { u1(); u2(); u3(); u4(); };
      }, [rutActivo]);

      const empRef = () => db.collection("saas_empresas").doc(rutActivo);
      const catRef = () => (rutActivo === RUT_PGB ? db.collection("catalogo_productos") : empRef().collection("catalogo"));

      const limpiarVistaPrevia = () => {
        if (fotoReferenciaUrl) URL.revokeObjectURL(fotoReferenciaUrl);
        setFotoReferenciaUrl("");
        setVistaPreviaFactura(null);
      };

      // ================= LECTURA XML DTE (CON SOPORTE PARA DESCUENTOS Y EXENTOS DE IVA) =================
      const procesarArchivoXml = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const texto = await file.text();
          const parser = new DOMParser();
          const xml = parser.parseFromString(texto, "text/xml");
          const getTag = (parent, name) => {
            const el = parent.getElementsByTagName(name)[0];
            return el ? el.textContent.trim() : "";
          };

          const rutProv = getTag(xml, "RUTEmisor") || "S/I";
          const razonProv = getTag(xml, "RznSoc") || `PROVEEDOR ${rutProv}`;
          const folio = getTag(xml, "Folio") || String(Date.now()).slice(-6);
          const fchEmis = getTag(xml, "FchEmis") || fechaIsoChile();
          const mntNetoXml = Number(getTag(xml, "MntNeto") || 0);
          const mntExeXml = Number(getTag(xml, "MntExe") || 0);
          const ivaXml = Number(getTag(xml, "IVA") || 0);
          const mntTotalXml = Number(getTag(xml, "MntTotal") || 0);

          const detalles = Array.from(xml.getElementsByTagName("Detalle"));
          const items = detalles.map((det, idx) => {
            const cod = (getTag(det, "VlrCodigo") || "").toUpperCase();
            const nom = (getTag(det, "NmbItem") || "ARTICULO XML").toUpperCase();
            const cant = Math.max(1, Number(getTag(det, "QtyItem") || 1));
            const indExe = getTag(det, "IndExe") === "1";

            // Prioriza MontoItem (neto real de línea tras descuentos) sobre PrcItem bruto
            const montoNetoLinea = Number(getTag(det, "MontoItem") || 0);
            const precioUnitXml = Number(getTag(det, "PrcItem") || 0);
            const netoUnitario = montoNetoLinea > 0
              ? Math.round(montoNetoLinea / cant)
              : Math.round(precioUnitXml);

            return {
              uid: `${Date.now()}_${idx}`,
              codigo: cod,
              nombre: nom,
              cantidad: cant,
              netoUnitario: Math.max(0, netoUnitario),
              exentoIva: indExe,
              sumarAlStock: true
            };
          });

          limpiarVistaPrevia();
          setVistaPreviaFactura({
            origen: "Archivo XML DTE SII",
            rutProveedor: formatearRut(rutProv),
            proveedor: razonProv.toUpperCase(),
            folio,
            fecha: fchEmis,
            netoDeclaradoXml: mntNetoXml,
            exentoDeclaradoXml: mntExeXml,
            ivaDeclaradoXml: ivaXml,
            totalDeclaradoXml: mntTotalXml,
            items
          });
        } catch (err) {
          alert("No se pudo leer el archivo XML: " + err.message);
        }
        e.target.value = "";
      };

      const abrirCargaManualDesdeFoto = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (fotoReferenciaUrl) URL.revokeObjectURL(fotoReferenciaUrl);
        const url = URL.createObjectURL(file);
        setFotoReferenciaUrl(url);
        if (!vistaPreviaFactura) {
          setVistaPreviaFactura({
            origen: "Carga Manual desde Foto / Comprobante",
            rutProveedor: rutEmisor.trim() ? formatearRut(rutEmisor) : "",
            proveedor: "",
            folio: folioFactura.trim() || "",
            fecha: fechaIsoChile(),
            netoDeclaradoXml: 0,
            exentoDeclaradoXml: 0,
            ivaDeclaradoXml: 0,
            totalDeclaradoXml: 0,
            items: []
          });
        }
        e.target.value = "";
      };

      const consultarPorFolioApi = (e) => {
        e.preventDefault();
        if (!rutEmisor.trim() || !folioFactura.trim()) return;
        const tieneKey = Boolean(empresa?.apis?.siiApiKey);
        limpiarVistaPrevia();
        setVistaPreviaFactura({
          origen: tieneKey ? "Consulta / Carga Manual por Folio" : "Ingreso Manual por Folio",
          rutProveedor: formatearRut(rutEmisor),
          proveedor: `PROVEEDOR ${formatearRut(rutEmisor)}`,
          folio: folioFactura.trim(),
          fecha: fechaIsoChile(),
          netoDeclaradoXml: 0,
          exentoDeclaradoXml: 0,
          ivaDeclaradoXml: 0,
          totalDeclaradoXml: 0,
          items: []
        });
      };

      const procesarTimbrePdf417 = (val) => {
        setTimbreScan(val);
        if (val.includes("</TED>") || (val.includes("<F>") && val.includes("</F>"))) {
          const reMatch = val.match(/<RE>(.*?)<\/RE>/);
          const fMatch = val.match(/<F>(.*?)<\/F>/);
          const mMatch = val.match(/<MNT>(.*?)<\/MNT>/);
          const feMatch = val.match(/<FE>(.*?)<\/FE>/);
          const tot = mMatch ? Number(mMatch[1]) : 0;
          const netoEst = Math.round(tot / 1.19);
          limpiarVistaPrevia();
          setVistaPreviaFactura({
            origen: "Escaneo Timbre PDF417 SII",
            rutProveedor: reMatch ? formatearRut(reMatch[1]) : "S/I",
            proveedor: reMatch ? `PROVEEDOR ${formatearRut(reMatch[1])}` : "PROVEEDOR SII",
            folio: fMatch ? fMatch[1] : "S/N",
            fecha: feMatch ? feMatch[1] : fechaIsoChile(),
            netoDeclaradoXml: netoEst,
            exentoDeclaradoXml: 0,
            ivaDeclaradoXml: tot - netoEst,
            totalDeclaradoXml: tot,
            items: []
          });
          setTimbreScan("");
        }
      };

      // ================= EDICIÓN EN TIEMPO REAL DE LA PRE-VISUALIZACIÓN =================
      const actualizarItemPrevia = (uid, campo, valor) => {
        setVistaPreviaFactura((prev) => {
          if (!prev) return null;
          const itemsAct = prev.items.map((it) => {
            if (it.uid !== uid) return it;
            if (campo === "cantidad") return { ...it, cantidad: Math.max(0, Number(valor)) };
            if (campo === "netoUnitario") return { ...it, netoUnitario: Math.max(0, Number(valor)) };
            if (campo === "sumarAlStock" || campo === "exentoIva") return { ...it, [campo]: Boolean(valor) };
            return { ...it, [campo]: String(valor).toUpperCase() };
          });
          return { ...prev, items: itemsAct };
        });
      };

      const eliminarItemPrevia = (uid) => {
        setVistaPreviaFactura((prev) => {
          if (!prev) return null;
          return { ...prev, items: prev.items.filter((it) => it.uid !== uid) };
        });
      };

      const agregarItemVistaPrevia = (e) => {
        e.preventDefault();
        if (!itemNom.trim() || !vistaPreviaFactura) return;
        const nuevo = {
          uid: `${Date.now()}_man`,
          codigo: itemCod.trim().toUpperCase(),
          nombre: itemNom.trim().toUpperCase(),
          cantidad: Math.max(1, Number(itemCant)),
          netoUnitario: Math.max(0, Number(itemNetoUnit)),
          exentoIva: Boolean(itemExento),
          sumarAlStock: true
        };
        setVistaPreviaFactura({
          ...vistaPreviaFactura,
          items: [...vistaPreviaFactura.items, nuevo]
        });
        setItemCod("");
        setItemNom("");
        setItemCant(1);
        setItemNetoUnit(0);
        setItemExento(false);
      };

      // Cuadratura automática Neto Afecto + Exento + IVA 19% + Total
      const cuadraturaPrevia = useMemo(() => {
        if (!vistaPreviaFactura) return { netoAfecto: 0, exento: 0, netoTotal: 0, iva: 0, total: 0, diferenciaXml: 0, cuadraConXml: true };
        let netoAfecto = 0;
        let exento = 0;

        vistaPreviaFactura.items.forEach((it) => {
          const linea = Math.round(Number(it.cantidad || 0) * Number(it.netoUnitario || 0));
          if (it.exentoIva) exento += linea;
          else netoAfecto += linea;
        });

        const iva = Math.round(netoAfecto * 0.19);
        const total = netoAfecto + exento + iva;
        const totXml = Number(vistaPreviaFactura.totalDeclaradoXml || 0);
        const diferenciaXml = totXml > 0 ? total - totXml : 0;
        return {
          netoAfecto,
          exento,
          netoTotal: netoAfecto + exento,
          iva,
          total,
          diferenciaXml,
          cuadraConXml: totXml === 0 || Math.abs(diferenciaXml) <= 5
        };
      }, [vistaPreviaFactura]);

      // ================= CONFIRMACIÓN ATÓMICA (AGRUPA SKUS REPETIDOS + FIELDVALUE.INCREMENT) =================
      const confirmarYSumarStock = async () => {
        if (!vistaPreviaFactura) return;
        if (vistaPreviaFactura.items.length === 0) {
          return alert("La factura debe tener al menos un producto para confirmar.");
        }
        if (!vistaPreviaFactura.folio.trim() || !vistaPreviaFactura.proveedor.trim()) {
          return alert("Completa el Proveedor y el N° de Folio de la factura antes de confirmar.");
        }

        const duplicada = compras.find(
          (c) =>
            limpiarRut(c.rutProveedor) === limpiarRut(vistaPreviaFactura.rutProveedor) &&
            String(c.folio || "").trim() === String(vistaPreviaFactura.folio || "").trim()
        );
        if (duplicada) {
          const seguir = confirm(
            `ADVERTENCIA: La Factura #${vistaPreviaFactura.folio} de ${vistaPreviaFactura.proveedor} ya fue cargada el ${duplicada.fecha}.\n\n¿Seguro que deseas cargarla nuevamente?`
          );
          if (!seguir) return;
        }

        setGuardando(true);
        try {
          const batch = db.batch();
          const porNombre = new Map(catalogo.map((p) => [String(p.nombre || "").trim().toUpperCase(), p]));
          const porSku = new Map(catalogo.filter((p) => p.codigo).map((p) => [String(p.codigo || "").trim().toUpperCase(), p]));

          // Acumuladores para evitar pisar stock o duplicar fichas si un SKU viene repetido en el XML
          const deltasExistentes = new Map(); // docId -> { cant, ultimoCostoNeto, ultimoCostoBruto }
          const nuevosCatalogo = new Map();   // key -> { codigo, nombre, proveedor, stockOnline, ultimoCostoNeto, ultimoCostoBruto }
          let lineasSumadas = 0;

          const itemsGuardados = vistaPreviaFactura.items.map((it) => {
            const cant = Math.max(0, Number(it.cantidad || 0));
            const netoUnit = Math.max(0, Number(it.netoUnitario || 0));
            const netoLinea = Math.round(cant * netoUnit);
            const ivaLinea = it.exentoIva ? 0 : Math.round(netoLinea * 0.19);
            const totalLinea = netoLinea + ivaLinea;
            const unitConIva = it.exentoIva ? netoUnit : Math.round(netoUnit * 1.19);

            if (it.sumarAlStock && cant > 0) {
              lineasSumadas++;
              const skuKey = String(it.codigo || "").trim().toUpperCase();
              const nomKey = String(it.nombre || "").trim().toUpperCase();
              const existente = (skuKey && porSku.get(skuKey)) || porNombre.get(nomKey);

              if (existente) {
                const prev = deltasExistentes.get(existente.id) || { cant: 0, ultimoCostoNeto: 0, ultimoCostoBruto: 0 };
                deltasExistentes.set(existente.id, {
                  cant: prev.cant + cant,
                  ultimoCostoNeto: netoUnit > 0 ? netoUnit : prev.ultimoCostoNeto,
                  ultimoCostoBruto: unitConIva > 0 ? unitConIva : prev.ultimoCostoBruto
                });
              } else {
                const nuevaKey = skuKey || nomKey;
                const prevNuevo = nuevosCatalogo.get(nuevaKey);
                if (prevNuevo) {
                  prevNuevo.stockOnline += cant;
                  if (netoUnit > 0) {
                    prevNuevo.ultimoCostoNeto = netoUnit;
                    prevNuevo.ultimoCostoBruto = unitConIva;
                  }
                } else {
                  nuevosCatalogo.set(nuevaKey, {
                    codigo: skuKey,
                    nombre: nomKey,
                    proveedor: vistaPreviaFactura.proveedor.trim().toUpperCase(),
                    stockOnline: cant,
                    ultimoCostoNeto: netoUnit,
                    ultimoCostoBruto: unitConIva
                  });
                }
              }
            }

            return {
              codigo: it.codigo || "",
              nombre: it.nombre,
              cantidad: cant,
              netoUnitario: netoUnit,
              unitConIva,
              exentoIva: Boolean(it.exentoIva),
              netoLinea,
              ivaLinea,
              totalLinea,
              sumadoAlStock: Boolean(it.sumarAlStock)
            };
          });

          // Aplica 1 solo incremento atómico por cada documento existente
          deltasExistentes.forEach((info, docId) => {
            const updateObj = { stockOnline: FieldValue.increment(info.cant) };
            if (info.ultimoCostoNeto > 0) {
              updateObj.ultimoCostoNeto = info.ultimoCostoNeto;
              updateObj.ultimoCostoBruto = info.ultimoCostoBruto;
            }
            batch.update(catRef().doc(docId), updateObj);
          });

          // Crea 1 sola ficha nueva por cada SKU/producto nuevo consolidado
          nuevosCatalogo.forEach((nuevoProd) => {
            batch.set(catRef().doc(), nuevoProd);
          });

            String(c.folio || "").toLowerCase().includes(q) ||
            (c.proveedor || "").toLowerCase().includes(q) ||
            (c.rutProveedor || "").toLowerCase().includes(q);
          const coincideProducto = (c.items || []).some(
            (it) => (it.nombre || "").toLowerCase().includes(q) || (it.codigo || "").toLowerCase().includes(q)

          return coincideCabecera || coincideProducto;

                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>

                      {/* AGREGAR LÍNEA MANUAL CON AUTOCOMPLETADO DEL CATÁLOGO */}
                      <form onSubmit={agregarItemVistaPrevia} className="grid grid-cols-1 sm:grid-cols-7 gap-2 pt-2">
                        <input type="text" value={itemCod} onChange={(e) => setItemCod(e.target.value)} placeholder="SKU" className={`rounded-xl px-3 py-2 text-xs font-bold ${T.input}`} />
                        <div className="sm:col-span-2">
                          <input
                            type="text"
                            list="catalogo-productos-dl"
                            value={itemNom}
                            onChange={(e) => {
                              const val = e.target.value;
                              setItemNom(val);
                              const match = catalogo.find((p) => (p.nombre || "").toUpperCase() === val.trim().toUpperCase());
                              if (match && match.codigo && !itemCod) setItemCod(match.codigo);
                            }}
                            placeholder="Agregar producto *"
                            className={`w-full rounded-xl px-3 py-2 text-xs font-bold ${T.input}`}
                            required
                          />
                          <datalist id="catalogo-productos-dl">
                            {catalogo.map((p) => <option key={p.id} value={p.nombre} />)}
                          </datalist>
                        </div>
                        <input type="number" min="1" value={itemCant} onChange={(e) => setItemCant(e.target.value)} placeholder="Cant." className={`rounded-xl px-3 py-2 text-xs font-bold ${T.input}`} required />
                        <input type="number" min="0" value={itemNetoUnit} onChange={(e) => setItemNetoUnit(e.target.value)} placeholder="Costo Neto Unit." className={`rounded-xl px-3 py-2 text-xs font-bold ${T.input}`} required />
                        <label className={`${T.muted} rounded-xl px-2.5 py-2 flex items-center justify-center gap-1.5 text-[11px] font-bold cursor-pointer`}>
                          <input type="checkbox" checked={itemExento} onChange={(e) => setItemExento(e.target.checked)} className="w-3.5 h-3.5" />
                          <span>Exento</span>
                        </label>
                        <button type="submit" className={`rounded-xl px-3 py-2 text-xs font-extrabold cursor-pointer ${T.sec}`}>+ Línea</button>
                      </form>
                    </div>

                    <button
                      type="button"
                      onClick={confirmarYSumarStock}
                      disabled={guardando || vistaPreviaFactura.items.length === 0}
                      className={`w-full font-extrabold py-4 rounded-2xl text-xs uppercase tracking-wider shadow-lg cursor-pointer disabled:opacity-40 ${T.btn}`}
                    >
                      {guardando
                        ? "Confirmando, Cuadrando IVA y Sumando Stock..."
                        : `Confirmar Factura #${vistaPreviaFactura.folio || "---"}, Cuadrar IVA ($${cuadraturaPrevia.iva.toLocaleString("es-CL")}) y Sumar Stock`}
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div className={`${T.card} rounded-2xl p-6 space-y-3`}>
                      <span className={`text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded ${T.tag}`}>Carga Automática con Pre-Auditoría</span>
                      <h2 className={`text-base font-extrabold ${T.main}`}>Subir Archivo XML de Factura SII (.xml)</h2>
                      <p className={`text-xs ${T.sub}`}>
                        Extrae proveedor, folio, productos, descuentos e ítems exentos. Muestra la tabla editable antes de modificar tu inventario.
                      </p>
                      <label className={`block w-full text-center font-extrabold py-4 rounded-xl text-xs cursor-pointer shadow-sm ${T.btn}`}>
                        Seleccionar Archivo XML (.xml)
                        <input type="file" accept=".xml" onChange={procesarArchivoXml} className="hidden" />
                      </label>
                      <div className="pt-2">
                        <label className={`text-[11px] font-bold block mb-1 ${T.sub}`}>O escanea el timbre PDF417 impreso con pistola 2D:</label>
                        <input
                          type="text"
                          value={timbreScan}
                          onChange={(e) => procesarTimbrePdf417(e.target.value)}
                          placeholder="Haz clic aquí y escanea el código del SII..."
                          className={`w-full rounded-xl px-3.5 py-2.5 text-xs font-semibold ${T.input}`}
                        />
                      </div>
                    </div>

                    <div className={`${T.card} rounded-2xl p-6 space-y-4`}>
                      <form onSubmit={consultarPorFolioApi} className="space-y-3">
                        <span className={`text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded ${T.tag}`}>Carga Manual o desde Foto</span>
                        <h2 className={`text-base font-extrabold ${T.main}`}>Ingresar Factura Manual / Con Foto</h2>
                        <p className={`text-xs ${T.sub}`}>
                          Si solo tienes una foto o factura en papel, adjunta la imagen para verla en pantalla mientras ingresas los productos y cuadras el 19% de IVA.
                        </p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          <input type="text" value={rutEmisor} onChange={(e) => setRutEmisor(formatearRut(e.target.value))} placeholder="RUT Proveedor *" className={`w-full rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`} required />
                          <input type="text" value={folioFactura} onChange={(e) => setFolioFactura(e.target.value)} placeholder="N° Folio Factura *" className={`w-full rounded-xl px-3.5 py-2.5 text-xs font-bold ${T.input}`} required />
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          <button type="submit" className={`w-full font-extrabold py-3 rounded-xl text-xs cursor-pointer ${T.btn}`}>
                            Abrir Carga Manual →
                          </button>
                          <label className={`w-full text-center font-extrabold py-3 rounded-xl text-xs cursor-pointer ${T.sec}`}>
                            Cargar desde Foto
                            <input type="file" accept="image/*" onChange={abrirCargaManualDesdeFoto} className="hidden" />
                          </label>
                        </div>
                      </form>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ================= TAB 2: ARCHIVO HISTÓRICO INFINITO DE FACTURAS DE COMPRA ================= */}
            {tab === "historial" && (
              <div className={`${T.card} rounded-2xl p-5 sm:p-6 space-y-4`}>
                <div>
                  <h2 className={`text-base font-extrabold ${T.main}`}>Archivo Histórico Infinito de Facturas Cargadas ({compras.length})</h2>
                  <p className={`text-xs ${T.sub}`}>
                    Todas las facturas confirmadas quedan respaldadas de por vida con su desglose de Neto, IVA y productos ingresados. Toca cualquier factura para auditarla.
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                  <div className="sm:col-span-2">
                    <label className={`text-[11px] font-bold block mb-1 ${T.sub}`}>Buscar por N° Folio, Proveedor, RUT o Producto</label>
                    <input
                      type="text"
                      value={busquedaArchivo}
                      onChange={(e) => setBusquedaArchivo(e.target.value)}
                      placeholder="Ej: 4521, Intcomex, Router..."
                      className={`w-full rounded-xl px-3.5 py-2.5 text-xs font-bold outline-none ${T.input}`}
                    />
                  </div>
                  <div>
                    <label className={`text-[11px] font-bold block mb-1 ${T.sub}`}>Fecha Desde</label>
                    <input type="date" value={fechaDesdeArchivo} onChange={(e) => setFechaDesdeArchivo(e.target.value)} className={`w-full rounded-xl px-3 py-2.5 text-xs font-bold outline-none ${T.input}`} />
                  </div>
                  <div>
                    <label className={`text-[11px] font-bold block mb-1 ${T.sub}`}>Fecha Hasta</label>
                    <input type="date" value={fechaHastaArchivo} onChange={(e) => setFechaHastaArchivo(e.target.value)} className={`w-full rounded-xl px-3 py-2.5 text-xs font-bold outline-none ${T.input}`} />
                  </div>
                </div>

                {(busquedaArchivo || fechaDesdeArchivo || fechaHastaArchivo) && (
                  <div className="flex items-center justify-between text-xs">
                    <span className={T.sub}>Mostrando {comprasFiltradas.length} de {compras.length} facturas archivadas</span>
                    <button
                      onClick={() => { setBusquedaArchivo(""); setFechaDesdeArchivo(""); setFechaHastaArchivo(""); }}
                      className="font-bold underline cursor-pointer"
                    >
                      Limpiar Filtros
                    </button>
                  </div>
                )}

                {comprasFiltradas.length === 0 ? (
                  <div className={`${T.muted} rounded-xl p-8 text-center space-y-1`}>
                    <p className={`text-xs font-bold ${T.main}`}>No hay facturas de compra registradas con ese filtro</p>
                    <p className={`text-[11px] ${T.sub}`}>Sube un archivo XML o carga desde foto en la primera pestaña para auditarlo y guardarlo aquí.</p>
                  </div>
                ) : (
                  <div className="divide-y divide-slate-200/40">
                    {comprasFiltradas.map((c) => {
                      const neto = Number(c.netoClp !== undefined ? c.netoClp : Math.round((c.totalClp || 0) / 1.19));
                      const iva = Number(c.ivaClp !== undefined ? c.ivaClp : ((c.totalClp || 0) - neto));
                      const total = Number(c.totalClp || 0);
                      return (
                        <div
                          key={c.id}
                          onClick={() => setFacturaAuditando(c)}
                          className="py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs cursor-pointer hover:opacity-85"
                        >
                          <div>
                            <div className="flex flex-wrap items-center gap-2">
                              <span className={`font-extrabold text-sm ${T.main}`}>Factura N° {c.folio}</span>
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${T.tag}`}>{c.proveedor}</span>
                              <span className={`text-[11px] ${T.sub}`}>Fecha: {c.fecha}</span>
                            </div>
                            <p className={`mt-1 ${T.sub}`}>
                              {(c.items || []).length} producto(s) • Neto/Exento: <strong>${neto.toLocaleString("es-CL")}</strong> + IVA: <strong>${iva.toLocaleString("es-CL")}</strong>
                            </p>
                          </div>

                          <div className="flex items-center gap-3 shrink-0">
                            <span className={`text-sm font-extrabold ${T.main}`}>Total: ${total.toLocaleString("es-CL")}</span>
                            <button
                              type="button"
                              onClick={(e) => { e.stopPropagation(); setFacturaAuditando(c); }}
                              className={`px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer ${T.sec}`}
                            >
                              Auditar Detalle
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ComprasFinanzasApp />);
  </script>
</body>
</html>
