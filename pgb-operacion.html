      "Maglys Pareja": { hex: "#db2777", bg: "bg-pink-600", badge: "bg-pink-100 text-pink-900 border-pink-300" },
      "José García": { hex: "#2563eb", bg: "bg-blue-600", badge: "bg-blue-100 text-blue-900 border-blue-300" },
      "Felliand Millan": { hex: "#7c3aed", bg: "bg-violet-600", badge: "bg-violet-100 text-violet-900 border-violet-300" }
    };

    const COLORES_GLOBAL = { ...COLORES_ARMADORES, ...COLORES_VENDEDORES };

    const RUTAS_BASE = ["Ruta 1", "Ruta 2", "Ruta Alternativa"];
    const SUBTITULOS_RUTA = {

    };
    const EQUIPO_RUTA_ALTERNATIVA = ["Pedro", "Juan", "Carlos", "Horacio", "Julio", "Nico", "Diego", "Edwin"];

    const PERSONAL_EQUIPO = ["Nico", "Edwin", "Horacio", "Julio", "Juan", "Sra. Rosa", "Diego", "Bedanli", "Pedro", "Gabriel", "Carlos"];
    const MOTIVOS_BODEGA_INTERNA = [
      "Rotura accidental en pasillo",
      "Compra personal (Descuento sueldo)",
      "Consumo / Uso interno bodega",
      "Dañado de fábrica (Mal sellado)",
      "Pérdida o extravío interno"
    ];

    const CAUSAS_DANIO_RUTA = [

      "Rotura por manipulación (Chofer / Pioneta)"
    ];

    const ACCIONES_DISPONIBLES = [
      "Ajustar Inventario en Bodega",

      "Descuento en Factura / Cuenta Corriente",
      "Nota de Crédito (Tributaria)",
      "Chofer Retorna Producto a Bodega"
    ];

    const normalizarTexto = (str) => {
      if (str === null || str === undefined) return "";
      return String(str).trim().replace(/\s+/g, ' ').toUpperCase();
    };

    // Huella normalizada para detectar duplicados aunque cambie "DE", tildes o "100 GRAMOS" vs "100G"
    const huellaFlexible = (txt) =>
      normalizarTexto(txt)
        .replace(/^\[[^\]]+\]\s*/, "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\bDE\b/g, " ")
        .replace(/(\d+)\s*(GRAMOS|GRAMO|GRS|GR|G)\b/g, "$1G")
        .replace(/(\d+)\s*(KILOS|KILO|KGS|KG)\b/g, "$1KG")
        .replace(/(\d+)\s*(LITROS|LITRO|LTS|LT|L)\b/g, "$1L")
        .replace(/(\d+)\s*(UNIDADES|UNIDAD|UNDS|UND|UN)\b/g, "$1UN")
        .replace(/[^A-Z0-9]/g, "");

    const formatearOpcionCatalogo = (p) => {
      if (!p) return "";
      return p.codigo ? `[${p.codigo}] ${p.nombre}` : p.nombre;
    };

    const esIncidenciaVentas = (item) => {
      if (!item) return false;
      if (item.areaResponsable === "ventas") return true;
      return ["ErrorFacturacion", "RechazoNoPedido", "CruceVentas"].includes(item.motivo);
    };

    const obtenerLabelMotivo = (motivo) => {
      if (motivo === "AceptadoPorCliente") return "ACEPTADO X CLIENTE";
      if (motivo === "ErrorFacturacion") return "ERROR FACTURACIÓN";
      if (motivo === "RechazoNoPedido") return "RECHAZO PEDIDO NO REALIZADO";
      if (motivo === "CruceVentas") return "CRUCE DE PRODUCTO (VENTAS)";
      return (motivo || "").toUpperCase();
    };

    const resolverRolesRutaAlternativa = (seleccionados) => {
      if (!seleccionados || seleccionados.length === 0) return { chofer: "", pioneta: "", texto: "Ruta Alternativa" };
      const ordenados = [...seleccionados].sort((a, b) => {
        const idxA = JERARQUIA_CHOFERES.indexOf(a);
        const idxB = JERARQUIA_CHOFERES.indexOf(b);
        const rankA = idxA !== -1 ? idxA : 99;
        const rankB = idxB !== -1 ? idxB : 99;
        return rankA - rankB;
      });
      const chofer = ordenados[0];
      const pioneta = ordenados[1] || "";
      const texto = pioneta
        ? `Ruta Alternativa (Chofer: ${chofer} / Pioneta: ${pioneta})`
        : `Ruta Alternativa (Chofer: ${chofer})`;
      return { chofer, pioneta, texto };
    };

    function App() {
      const [incidencias, setIncidencias] = useState([]);
      const [incidentesBodega, setIncidentesBodega] = useState([]);
      const [cierres, setCierres] = useState([]);

      const [conteoPendiente, setConteoPendiente] = useState([]);
      const [seleccionadosInventario, setSeleccionadosInventario] = useState({});

      const [seleccionadosConteoDigital, setSeleccionadosConteoDigital] = useState({});

      const [modoImpresionReporte, setModoImpresionReporte] = useState(null);
      const [facturaImprimirIndividual, setFacturaImprimirIndividual] = useState(null);

      const [recibiendoRetornoId, setRecibiendoRetornoId] = useState(null);
      const [retornoFormState, setRetornoFormState] = useState({});

      const [prodBodega, setProdBodega] = useState("");
      const [cantBodega, setCantBodega] = useState(1);
      const [uniBodega, setUniBodega] = useState(UNIDADES[0]);
      const [motivoBodega, setMotivoBodega] = useState(MOTIVOS_BODEGA_INTERNA[0]);
      const [responsableBodega, setResponsableBodega] = useState(PERSONAL_EQUIPO[0]);
      const [notasBodega, setNotasBodega] = useState("");

      const [vista, setVista] = useState("dashboard");

      const [cierreExpandido, setCierreExpandido] = useState(null);
      const [tarjetasAbiertas, setTarjetasAbiertas] = useState({});

      const [busqueda, setBusqueda] = useState("");
      const [busquedaCatalogo, setBusquedaCatalogo] = useState("");
      const [importandoExcel, setImportandoExcel] = useState(false);
      const [filtroEstado, setFiltroEstado] = useState("todos");
      const [filtroArmador, setFiltroArmador] = useState("todos");
      const [filtroRuta, setFiltroRuta] = useState("todos");
      const [filtroFechaDesde, setFiltroFechaDesde] = useState("");
      const [filtroFechaHasta, setFiltroFechaHasta] = useState("");

      const hoy = new Date().toISOString().split("T")[0];
      const mesActualDefault = hoy.slice(0, 7);
      const [mesGrafico, setMesGrafico] = useState(mesActualDefault);
      const [vistaGrafico, setVistaGrafico] = useState("armadores");

      const [factura, setFactura] = useState("");
      const [cliente, setCliente] = useState("");
      const [fecha, setFecha] = useState(hoy);

      const [equipoAlternativo, setEquipoAlternativo] = useState(["Pedro"]);
      const [areaResponsable, setAreaResponsable] = useState("bodega");

      const [vendedor, setVendedor] = useState(VENDEDORES[0]);

      const [producto, setProducto] = useState("");

        } else {
          let nuevaLista = equipoAlternativo.length >= 2 ? [equipoAlternativo[0], nombre] : [...equipoAlternativo, nombre];

      const personalRutaActual = useMemo(() => {

      }, [rutaTipo, equipoAlternativo]);

      useEffect(() => {

      }, [rutaTipo, personalRutaActual]);

      useEffect(() => {
        let unsubs = [];

            setCierres(lista);
          }, (err) => { console.error("Error cierres:", err); });

          const unsubCat = db.collection("catalogo_productos").onSnapshot((snap) => {
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));

          }, (err) => { console.error("Error cat prod:", err); });

          const unsubCatClientes = db.collection("catalogo_clientes").onSnapshot((snap) => {
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            lista.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));
            setCatalogoClientes(lista);
          }, (err) => { console.error("Error cat cli:", err); });

          const unsubHistInv = db.collection("historial_inventario").onSnapshot((snap) => {
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            lista.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setHistorialInventario(lista);
          }, (err) => { console.error("Error historial:", err); });

          const unsubConteo = db.collection("conteo_pendiente").onSnapshot((snap) => {
            const lista = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setConteoPendiente(lista);
          }, (err) => { console.error("Error conteo:", err); });

          unsubs = [unsubInc, unsubIncBodega, unsubCierres, unsubCat, unsubCatClientes, unsubHistInv, unsubConteo];
        };

        auth.signInAnonymously()
          .then(() => {
            iniciarListeners();
          })
          .catch(() => {
            iniciarListeners();
          });

        return () => {
          unsubs.forEach(fn => { if (typeof fn === "function") fn(); });
        };
      }, []);

      useEffect(() => {
        if (!conectado || sincronizandoRef.current) return;

        const sincronizarPendientesFaltantes = async () => {
          sincronizandoRef.current = true;
          try {
            for (const inc of incidencias) {
              const requiereAjuste = (inc.acciones || []).includes("Ajustar Inventario en Bodega");
              const yaAjustado = inc.checksAcciones?.["Ajustar Inventario en Bodega"]?.completado;
              const motivoObj = MOTIVOS.find(m => m.id === inc.motivo);
              const esFisico = motivoObj ? motivoObj.fisico : true;

              if (requiereAjuste && !yaAjustado && esFisico && !["AceptadoPorCliente", "ErrorFacturacion", "RechazoNoPedido", "CruceVentas"].includes(inc.motivo)) {
                const prodNorm = normalizarTexto(inc.producto);
                const uniNorm = (inc.motivo === "Daño/Merma" && inc.detalleDanio) ? inc.detalleDanio.unidadDanada : inc.unidad;
                const cantNorm = (inc.motivo === "Daño/Merma" && inc.detalleDanio) ? Number(inc.detalleDanio.cantidadDanada) : Number(inc.cantidad);

                const yaEnConteo = conteoPendiente.some(cp =>
                  cp.producto === prodNorm &&
                  cp.unidad === uniNorm &&
                  cp.factura && cp.factura.includes(inc.factura)
                );

                if (!yaEnConteo) {
                  await registrarConteoPendiente(prodNorm, uniNorm, cantNorm, inc.factura);
                }

                if (inc.motivo === "Cruce" && inc.productoCruce) {
                  const prodCruceN = normalizarTexto(inc.productoCruce);
                  const yaEnConteoCruce = conteoPendiente.some(cp =>
                    cp.producto === prodCruceN &&
                    cp.unidad === inc.unidadCruce &&
                    cp.factura && cp.factura.includes(inc.factura)
                  );
                  if (!yaEnConteoCruce) {
                    await registrarConteoPendiente(prodCruceN, inc.unidadCruce, Number(inc.cantidadCruce), inc.factura);
                  }
                }
              }
            }
          } catch (e) {
            console.error(e);
          } finally {
            sincronizandoRef.current = false;
          }
        };

        const timer = setTimeout(sincronizarPendientesFaltantes, 800);
        return () => clearTimeout(timer);
      }, [incidencias, conteoPendiente, conectado]);

      const cambiarAreaResponsable = (nuevaArea) => {
        setAreaResponsable(nuevaArea);
        if (nuevaArea === "ventas") {
          seleccionarMotivo("ErrorFacturacion");
        } else {
          seleccionarMotivo("Faltante");
        }
      };

      const seleccionarMotivo = (nuevoMotivo) => {
        setMotivo(nuevoMotivo);
        if (nuevoMotivo === "ErrorFacturacion" || nuevoMotivo === "RechazoNoPedido") {
          setAccionesSeleccionadas(["Chofer Retorna Producto a Bodega", "Nota de Crédito (Tributaria)"]);
        } else if (nuevoMotivo === "CruceVentas") {
          setAccionesSeleccionadas(["Chofer Retorna Producto a Bodega", "Enviar / Reponer Producto al Cliente"]);
        } else if (!editandoId) {
          setAccionesSeleccionadas(["Ajustar Inventario en Bodega"]);
        }
      };

      const limpiarFormulario = () => {
        setFactura(""); setCliente(""); setProducto(""); setCantidad(1); setUnidad(UNIDADES[0]);
        setProductoCruce(""); setCantidadCruce(1); setUnidadCruce(UNIDADES[0]);
        setProductoMalFacturado(""); setCantidadMalFacturada(1); setUnidadMalFacturada(UNIDADES[0]);
        setNotas(""); setEditandoId(null);
        setRutaTipo("Ruta 1");
        setEquipoAlternativo(["Pedro"]);
        setAreaResponsable("bodega");
        setArmador(ARMADORES[0]);
        setVendedor(VENDEDORES[0]);
        setMotivo("Faltante");
        setAccionesSeleccionadas(["Ajustar Inventario en Bodega"]);
        setCausaDanio(CAUSAS_DANIO_RUTA[0]);
        setDanioTotalForm(true);
        setCantDanadaParcial(1);
      };

      const resolverProductoCatalogo = (textoEntrada) => {
        const norm = normalizarTexto(textoEntrada);
        if (!norm) return { display: "", codigo: "", nombre: "", proveedor: "", encontrado: null };

        const matchBracket = norm.match(/^\[([^\]]+)\]\s*(.+)$/);
        const codExtraido = matchBracket ? normalizarTexto(matchBracket[1]) : "";
        const nomExtraido = matchBracket ? normalizarTexto(matchBracket[2]) : norm;
        const huellaEntrada = huellaFlexible(nomExtraido);

        const encontrado = catalogoProductos.find((p) => {
          const pDisplay = normalizarTexto(formatearOpcionCatalogo(p));
          return (
            pDisplay === norm ||
            (codExtraido && normalizarTexto(p.codigo) === codExtraido) ||
            (p.codigo && normalizarTexto(p.codigo) === norm) ||
            normalizarTexto(p.nombre) === nomExtraido ||
            (huellaEntrada && huellaFlexible(p.nombre) === huellaEntrada)
          );
        });

        if (encontrado) {
          return {
            display: formatearOpcionCatalogo(encontrado),
            codigo: encontrado.codigo || "",
            nombre: encontrado.nombre || nomExtraido,
            proveedor: encontrado.proveedor || "",
            encontrado
          };
        }

        return {
          display: norm,
          codigo: codExtraido,
          nombre: nomExtraido,
          proveedor: "",
          encontrado: null
        };
      };

      const registrarProductoEnCatalogo = async (textoEntrada) => {
        const info = resolverProductoCatalogo(textoEntrada);
        if (!info.nombre) return info;
        if (!info.encontrado) {
          try {
            await db.collection("catalogo_productos").add({
              codigo: info.codigo || "",
              nombre: info.nombre,
              proveedor: ""
            });
          } catch (err) {}
        }
        return info;
      };

      const importarCatalogoExcel = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setImportandoExcel(true);

        try {
          const buffer = await file.arrayBuffer();
          const workbook = XLSX.read(buffer, { type: "array" });
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

          if (!rows || rows.length === 0) {
            alert("El archivo Excel está vacío.");
            setImportandoExcel(false);
            e.target.value = "";
            return;
          }

          const normalizarClave = (k) =>
            String(k || "")
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .trim();

          const existentesPorCodigo = new Set(
            catalogoProductos.filter((p) => p.codigo).map((p) => normalizarTexto(p.codigo))
          );
          const existentesPorNombre = new Set(
            catalogoProductos.filter((p) => p.nombre).map((p) => normalizarTexto(p.nombre))
          );
          const existentesPorHuella = new Set(
            catalogoProductos.filter((p) => p.nombre).map((p) => huellaFlexible(p.nombre))
          );

          const nuevos = [];
          const actualizables = [];
          const mapaActualizacion = [];

          rows.forEach((row) => {
            const keys = Object.keys(row);
            let codigoVal = "";
            let nombreVal = "";
            let proveedorVal = "";

            keys.forEach((k) => {
              const kn = normalizarClave(k);
              const val = row[k];
              if (!codigoVal && (kn.includes("cod") || kn.includes("sku") || kn === "id" || kn.includes("item"))) {
                codigoVal = normalizarTexto(val);
              } else if (
                !nombreVal &&
                (kn.includes("desc") || kn.includes("prod") || kn.includes("nomb") || kn.includes("art") || kn.includes("det"))
              ) {
                nombreVal = normalizarTexto(val);
              } else if (!proveedorVal && (kn.includes("prov") || kn.includes("marc") || kn.includes("fab"))) {
                proveedorVal = normalizarTexto(val);
              }
            });

            if (!nombreVal && keys.length >= 2) {
              codigoVal = normalizarTexto(row[keys[0]]);
              nombreVal = normalizarTexto(row[keys[1]]);
              if (keys.length >= 3) proveedorVal = normalizarTexto(row[keys[2]]);
            } else if (!nombreVal && keys.length === 1) {
              nombreVal = normalizarTexto(row[keys[0]]);
            }

            if (!nombreVal) return;
            const hVal = huellaFlexible(nombreVal);

            const yaExiste =
              (codigoVal && existentesPorCodigo.has(codigoVal)) ||
              existentesPorNombre.has(nombreVal) ||
              (hVal && existentesPorHuella.has(hVal));

            if (yaExiste) {
              const docExist = catalogoProductos.find(
                (p) =>
                  (codigoVal && normalizarTexto(p.codigo) === codigoVal) ||
                  normalizarTexto(p.nombre) === nombreVal ||
                  (hVal && huellaFlexible(p.nombre) === hVal)
              );
              if (docExist) {
                const codFinal = codigoVal || docExist.codigo || "";
                const provFinal = proveedorVal || docExist.proveedor || "";
                if (codFinal !== docExist.codigo || provFinal !== docExist.proveedor || nombreVal !== docExist.nombre) {
                  actualizables.push({
                    id: docExist.id,
                    codigo: codFinal,
                    nombre: nombreVal,
                    proveedor: provFinal
                  });
                }
                mapaActualizacion.push({
                  huella: hVal,
                  displayNuevo: codFinal ? `[${codFinal}] ${nombreVal}` : nombreVal,
                  codigo: codFinal,
                  proveedor: provFinal
                });
              }
              return;
            }

            if (codigoVal) existentesPorCodigo.add(codigoVal);
            existentesPorNombre.add(nombreVal);
            if (hVal) existentesPorHuella.add(hVal);

            nuevos.push({
              codigo: codigoVal,
              nombre: nombreVal,
              proveedor: proveedorVal
            });
            mapaActualizacion.push({
              huella: hVal,
              displayNuevo: codigoVal ? `[${codigoVal}] ${nombreVal}` : nombreVal,
              codigo: codigoVal,
              proveedor: provFinal
            });
          });

          const CHUNK_SIZE = 400;
          for (let i = 0; i < nuevos.length; i += CHUNK_SIZE) {
            const batch = db.batch();
            nuevos.slice(i, i + CHUNK_SIZE).forEach((item) => {
              const ref = db.collection("catalogo_productos").doc();
              batch.set(ref, item);
            });
            await batch.commit();
          }

          for (let i = 0; i < actualizables.length; i += CHUNK_SIZE) {
            const batch = db.batch();
            actualizables.slice(i, i + CHUNK_SIZE).forEach((item) => {
              const ref = db.collection("catalogo_productos").doc(item.id);
              batch.update(ref, {
                codigo: item.codigo,
                nombre: item.nombre,
                proveedor: item.proveedor
              });
            });
            await batch.commit();
          }

          // Sincronizar también incidencias abiertas, productos cruzados y conteos pendientes
          const batchSync = db.batch();
          let registrosSincronizados = 0;

          incidencias.forEach((inc) => {
            const hInc = huellaFlexible(inc.producto || "");
            const match = mapaActualizacion.find((m) => m.huella === hInc);
            const updates = {};

            if (match && (inc.producto !== match.displayNuevo || !inc.codigoProducto)) {
              updates.producto = match.displayNuevo;
              updates.codigoProducto = match.codigo;
              updates.proveedorProducto = match.proveedor;
            }

            if (inc.productoCruce) {
              const hCruce = huellaFlexible(inc.productoCruce);
              const matchCruce = mapaActualizacion.find((m) => m.huella === hCruce);
              if (matchCruce && (inc.productoCruce !== matchCruce.displayNuevo || !inc.codigoProductoCruce)) {
                updates.productoCruce = matchCruce.displayNuevo;
                updates.codigoProductoCruce = matchCruce.codigo;
                updates.proveedorProductoCruce = matchCruce.proveedor;
              }
            }

            if (Object.keys(updates).length > 0) {
              batchSync.update(db.collection("incidencias").doc(inc.id), updates);
              registrosSincronizados++;
            }
          });

          conteoPendiente.forEach((cp) => {
            const hCp = huellaFlexible(cp.producto || "");
            const match = mapaActualizacion.find((m) => m.huella === hCp);
            if (match && (cp.producto !== match.displayNuevo || !cp.codigoProducto)) {
              batchSync.update(db.collection("conteo_pendiente").doc(cp.id), {
                producto: match.displayNuevo,
                codigoProducto: match.codigo,
                proveedorProducto: match.proveedor
              });
              registrosSincronizados++;
            }
          });

          incidentesBodega.forEach((ib) => {
            const hIb = huellaFlexible(ib.producto || "");
            const match = mapaActualizacion.find((m) => m.huella === hIb);
            if (match && (ib.producto !== match.displayNuevo || !ib.codigoProducto)) {
              batchSync.update(db.collection("incidentes_bodega").doc(ib.id), {
                producto: match.displayNuevo,
                codigoProducto: match.codigo,
                proveedorProducto: match.proveedor
              });
              registrosSincronizados++;
            }
          });

          if (registrosSincronizados > 0) {
            await batchSync.commit();
          }

          alert(`✅ Catálogo sincronizado: ${nuevos.length} nuevos, ${actualizables.length} fusionados con su código original y ${registrosSincronizados} registros activos actualizados.`);
        } catch (err) {
          console.error(err);
          alert("Error al leer el archivo Excel: " + err.message);
        }

        setImportandoExcel(false);
        e.target.value = "";
      };

      const registrarClienteEnCatalogo = async (nombreCliente) => {

      const registrarConteoPendiente = async (prod, uni, cant, fact, metaProd = {}) => {

      const guardarIncidencia = async (e) => {

          if (!productoCruce.trim()) return alert("Indica qué producto y medida pidió realmente el cliente.");
        } else {

        let totalBodegaMes = 0;
        let totalVentasMes = 0;

        todosLosRegistros.forEach(item => {
          if (!item.fecha || !item.fecha.startsWith(mesGrafico)) return;

          if (esIncidenciaVentas(item)) {
            const vend = item.vendedor || "Ventas (Sin asignar)";

            totalVentasMes++;
          } else {

            if (arm) {

              totalBodegaMes++;
            }
          }
        });

        const totalGlobalMes = totalBodegaMes + totalVentasMes;
        const pctGlobalBodega = totalGlobalMes > 0 ? Math.round((totalBodegaMes / totalGlobalMes) * 1000) / 10 : 0;
        const pctGlobalVentas = totalGlobalMes > 0 ? Math.round((totalVentasMes / totalGlobalMes) * 1000) / 10 : 0;

          totalActivo = totalBodegaMes;
        } else if (vistaGrafico === "vendedores") {
          mapaActivo = conteoVendedores;
          totalActivo = totalVentasMes;
        } else {
          Object.entries(conteoArmadores).forEach(([k, v]) => {
            mapaActivo[k] = { errores: v, area: "Bodega" };
          });
          Object.entries(conteoVendedores).forEach(([k, v]) => {
            mapaActivo[k] = { errores: v, area: "Ventas" };
          });
          totalActivo = totalGlobalMes;
        }

        const lista = Object.entries(mapaActivo)
          .map(([nombre, val]) => {

            const area = typeof val === "object" ? val.area : (vistaGrafico === "vendedores" ? "Ventas" : "Bodega");

        return {
          lista,
          totalActivo,
          totalBodegaMes,
          totalVentasMes,

          pctGlobalBodega,
          pctGlobalVentas,

            item.armador?.toLowerCase().includes(busqueda.toLowerCase()) ||
            item.vendedor?.toLowerCase().includes(busqueda.toLowerCase()) ||

          const coincideEstado = filtroEstado === "todos" ? true : filtroEstado === "pendientes" ? !item.resuelto : item.resuelto;
          const coincideArmador = filtroArmador === "todos"
            ? true
            : filtroArmador === "__VENTAS__"
              ? esIncidenciaVentas(item)

          const coincideRuta = filtroRuta === "todos" ? true : (item.rutaTipo === filtroRuta || item.ruta?.startsWith(filtroRuta));

          if (filtroFechaDesde && item.fecha < filtroFechaDesde) coincideFecha = false;
          if (filtroFechaHasta && item.fecha > filtroFechaHasta) coincideFecha = false;

          return coincideTexto && coincideEstado && coincideArmador && coincideRuta && coincideFecha;
